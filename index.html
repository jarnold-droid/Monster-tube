  c.arc(px, py - ps * 0.2, ps * 0.42, Math.PI, 0);
  c.stroke();
  const lg = c.createLinearGradient(px - ps * 0.6, 0, px + ps * 0.6, 0);
  lg.addColorStop(0, "#7a6420");
  lg.addColorStop(0.5, "#d8b850");
  lg.addColorStop(1, "#7a6420");
  c.fillStyle = lg;
  c.fillRect(px - ps * 0.6, py - ps * 0.2, ps * 1.2, ps);
  c.fillStyle = "#222";
  c.beginPath();
  c.arc(px, py + ps * 0.2, ps * 0.12, 0, Math.PI * 2);
  c.fill();
  c.fillRect(px - ps * 0.04, py + ps * 0.2, ps * 0.08, ps * 0.3);
  // door knob
  const kx = dx + dw * 0.86, ky = dy + dh * 0.53;
  c.fillStyle = "#c8a24a";
  c.beginPath();
  c.arc(kx, ky, dw * 0.045, 0, Math.PI * 2);
  c.fill();
  // your hand reaching for the knob (first person)
  const reach = Math.min(1, t / 1.2);
  const hx = lerp(w * 0.95, kx + dw * 0.02, reach) + shake, hy = lerp(h * 1.05, ky + dw * 0.04, reach);
  c.fillStyle = S.player.skinColor;
  c.beginPath();
  c.ellipse(hx, hy, dw * 0.09, dw * 0.07, -0.5, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.moveTo(hx - dw * 0.05, hy + dw * 0.03);
  c.lineTo(hx + dw * 0.06, hy + dw * 0.05);
  c.lineTo(w + 40, h + 40);
  c.lineTo(w * 0.8, h + 40);
  c.closePath();
  c.fill();
  c.textAlign = "start";
}

// Scene 3: walking down a rainy street at night, looking straight ahead
function cutStreet(c, w, h, t, time) {
  c.save();
  c.translate(0, Math.abs(Math.sin(time * 5)) * 6);   // your view bobs as you walk
  const vx = w / 2, vy = h * 0.42, f = Math.min(w, h) * 0.9, eyeH = 1.7;
  const walked = t * S.cutscene.walkSpeed;
  // turn a 3D spot (side, height, distance ahead) into a spot on the screen
  const P = (X, Y, z) => [vx + (X / z) * f, vy + ((eyeH - Y) / z) * f];
  const poly = (pts, color) => {
    c.fillStyle = color;
    c.beginPath();
    pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
    c.closePath();
    c.fill();
  };
  const near = 0.8, far = 70, wrap = (z, range) => ((z % range) + range) % range;

  // sky
  const sky = c.createLinearGradient(0, 0, 0, vy);
  sky.addColorStop(0, "#04060c");
  sky.addColorStop(1, "#18202f");
  c.fillStyle = sky;
  c.fillRect(0, 0, w, h);
  // road, sidewalks and building walls on both sides
  poly([P(-4, 0, near), P(4, 0, near), P(4, 0, far), P(-4, 0, far)], "#16181e");
  for (const s of [-1, 1]) {
    poly([P(s * 4, 0, near), P(s * 6, 0, near), P(s * 6, 0, far), P(s * 4, 0, far)], "#23252b");
    poly([P(s * 6, 0, near), P(s * 6, 14, near), P(s * 6, 14, far), P(s * 6, 0, far)], "#0d1018");
  }
  // lit windows on the buildings (they slide past as you walk)
  for (let k = 0; k < 24; k++) {
    for (const s of [-1, 1]) {
      const z = near + 0.6 + wrap(k * 3 - walked, 72);
      for (let row = 0; row < 4; row++) {
        const lit = Math.sin(k * 12.9 + row * 7.7 + s * 3.3) > 0.2;
        if (!lit) continue;
        const y0 = 2.2 + row * 3;
        const fade = Math.max(0, 1 - z / far);
        poly([P(s * 6, y0, z), P(s * 6, y0 + 1.3, z), P(s * 6, y0 + 1.3, z + 1.2), P(s * 6, y0, z + 1.2)],
             `rgba(255,205,120,${0.8 * fade})`);
      }
    }
  }
  // dashed line down the middle of the road
  for (let k = 0; k < 20; k++) {
    const z = near + wrap(k * 4 - walked, 80);
    poly([P(-0.08, 0, z), P(0.08, 0, z), P(0.08, 0, z + 1.6), P(-0.08, 0, z + 1.6)], `rgba(200,180,90,${Math.max(0, 1 - z / far)})`);
  }
  // street lamps on both sides (far ones first)
  const lamps = [];
  for (let k = 0; k < 7; k++) for (const s of [-1, 1]) lamps.push({ s, z: near + 1 + wrap(k * 11 + (s > 0 ? 5 : 0) - walked, 77) });
  lamps.sort((a, b) => b.z - a.z);
  for (const L of lamps) {
    const [bx, by] = P(L.s * 4.6, 0, L.z), [tx, ty] = P(L.s * 4.6, 5.5, L.z), [hx] = P(L.s * 3.8, 5.5, L.z);
    const fade = Math.max(0, 1 - L.z / far);
    c.strokeStyle = `rgba(30,32,38,${fade})`;
    c.lineWidth = Math.max(1, (0.15 / L.z) * f);
    c.beginPath();
    c.moveTo(bx, by); c.lineTo(tx, ty); c.lineTo(hx, ty);
    c.stroke();
    const r = Math.max(4, (3 / L.z) * f);
    const glow = c.createRadialGradient(hx, ty, 1, hx, ty, r);
    glow.addColorStop(0, `rgba(255,215,150,${0.55 * fade})`);
    glow.addColorStop(1, "rgba(255,215,150,0)");
    c.fillStyle = glow;
    c.fillRect(hx - r, ty - r, r * 2, r * 2);
    // a pool of light on the wet road
    const [gx, gy] = P(L.s * 3.6, 0, L.z);
    c.fillStyle = `rgba(255,210,140,${0.12 * fade})`;
    c.beginPath();
    c.ellipse(gx, gy, r * 0.9, r * 0.25, 0, 0, Math.PI * 2);
    c.fill();
  }
  // rain falling in front of you
  c.strokeStyle = "rgba(190,205,230,0.35)";
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 0; i < 160; i++) {
    const rx = (i * 97.3 + time * 30) % w, ry = (i * 53.7 + time * 900) % h;
    c.moveTo(rx, ry);
    c.lineTo(rx - 2, ry + 18);
  }
  c.stroke();
  // splashes on the road
  c.fillStyle = "rgba(200,215,240,0.35)";
  for (let i = 0; i < 25; i++) {
    const sx = (i * 131.7 + Math.floor(time * 8) * 37) % w;
    const sy = vy + 20 + ((i * 71.3 + Math.floor(time * 8) * 13) % (h - vy - 20));
    c.fillRect(sx, sy, 3, 1);
  }
  // your hands at your sides (relaxed fists, bobbing a little as you walk)
  const hs = Math.min(w, h) * 0.16, bobble = Math.sin(time * 5) * hs * 0.08;
  drawCutFist(c, w * 0.1, h * 0.78 + bobble, hs, false);
  drawCutFist(c, w * 0.9, h * 0.78 - bobble, hs, true);
  c.restore();
}

// Scenes 4 and 5: looking at MonsterTube on your phone (and searching)
function cutPhone(c, w, h, t, time, searching) {
  c.fillStyle = "#07080c";
  c.fillRect(0, 0, w, h);
  const glow = c.createRadialGradient(w / 2, h * 0.42, 10, w / 2, h * 0.42, Math.max(w, h) * 0.6);
  glow.addColorStop(0, "rgba(90,110,160,0.25)");
  glow.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = glow;
  c.fillRect(0, 0, w, h);
  // hand + phone
  const pw = Math.min(w * 0.62, 280), ph = pw * 1.9, px = w / 2 - pw / 2, py = h * 0.42 - ph / 2;
  // your hands gripping the phone: the fingers are behind it, only the edges peek out
  for (const side of [-1, 1]) {
    const ex = side < 0 ? px - 14 : px + pw - 10;
    c.fillStyle = "#1c2230";                                     // sleeve
    c.fillRect(ex - (side < 0 ? 30 : 0), py + ph * 0.92, 54, h);
    c.fillStyle = S.player.skinColor;                                     // edge of the hand
    c.beginPath();
    c.roundRect(ex, py + ph * 0.62, 24, ph * 0.36, 12);
    c.fill();
    c.strokeStyle = "rgba(0,0,0,0.35)";
    c.lineWidth = 2;
    c.stroke();
  }
  c.fillStyle = "#151515";
  c.fillRect(px - 8, py - 8, pw + 16, ph + 16);
  c.fillStyle = "#f4f4f4";
  c.fillRect(px, py, pw, ph);
  // MonsterTube header
  c.fillStyle = "#d81f26";
  c.fillRect(px, py, pw, ph * 0.08);
  c.fillStyle = "#fff";
  c.font = `bold ${pw * 0.07}px sans-serif`;
  c.fillText("▶ MonsterTube", px + pw * 0.05, py + ph * 0.055);
  c.fillStyle = "#222";
  c.font = `${pw * 0.05}px sans-serif`;
  if (!searching) {
    const vids = S.text.cutVideos;
    vids.forEach((v, i) => {
      const vy = py + ph * (0.11 + i * 0.29);
      c.fillStyle = "#1a1d24";
      c.fillRect(px + pw * 0.05, vy, pw * 0.9, ph * 0.17);
      c.fillStyle = "rgba(220,235,245,0.6)";                // a ghost in the thumbnail
      c.beginPath();
      c.ellipse(px + pw * (0.3 + i * 0.2), vy + ph * 0.09, pw * 0.05, ph * 0.05, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = "#111";
      c.font = `bold ${pw * 0.05}px sans-serif`;
      c.fillText(v[0], px + pw * 0.05, vy + ph * 0.2);
      c.fillStyle = "#666";
      c.font = `${pw * 0.045}px sans-serif`;
      c.fillText(v[1], px + pw * 0.05, vy + ph * 0.235);
    });
  } else {
    // typing in the search bar
    const typed = S.text.cutSearch.slice(0, lettersTyped(t));
    c.strokeStyle = "#999";
    c.lineWidth = 2;
    c.strokeRect(px + pw * 0.05, py + ph * 0.11, pw * 0.9, ph * 0.06);
    c.fillStyle = "#111";
    c.font = `${pw * 0.055}px sans-serif`;
    c.fillText("🔍 " + typed + (Math.floor(time * 2) % 2 ? "|" : ""), px + pw * 0.08, py + ph * 0.152);
    if (typed.length >= S.text.cutSearch.length && t > 3) {
      S.text.cutResults.forEach((r, i) => {
        c.fillStyle = i === 0 ? "#b00" : "#333";
        c.font = `${i === 0 ? "bold " : ""}${pw * 0.05}px sans-serif`;
        c.fillText(r, px + pw * 0.06, py + ph * (0.24 + i * 0.07));
      });
    }
    // the keyboard, with your thumbs pressing each letter
    const n = typed.length, typing = n > 0 && n < S.text.cutSearch.length;
    const lastChar = typing ? typed[n - 1] : (n >= S.text.cutSearch.length && t < 3.1 ? typed[n - 1] : "");
    const keys = drawPhoneKeyboard(c, px, py, pw, ph, lastChar);
    const thumb = pw * 0.12;
    const restL = [px + pw * 0.2, py + ph * 0.95], restR = [px + pw * 0.8, py + ph * 0.95];
    let L = restL, R = restR;
    if (lastChar && keys[lastChar]) {
      const k = keys[lastChar];
      if (k[0] < px + pw / 2) L = k; else R = k;
    }
    drawThumb(c, px - pw * 0.05, py + ph * 1.02, L[0], L[1], thumb, L !== restL);
    drawThumb(c, px + pw * 1.05, py + ph * 1.02, R[0], R[1], thumb, R !== restR);
  }
  if (!searching) {
    // thumbs resting on the screen while you scroll
    const thumb = pw * 0.12, scroll = Math.sin(time * 2) * ph * 0.03;
    drawThumb(c, px - pw * 0.05, py + ph * 1.02, px + pw * 0.15, py + ph * 0.78 + scroll, thumb, false);
    drawThumb(c, px + pw * 1.05, py + ph * 1.02, px + pw * 0.8, py + ph * 0.7 + scroll, thumb, true);
  }
}

// Scene 6: the ghost and two mysterious people appear
function cutReveal(c, w, h, t, time) {
  const bg = c.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, "#03050a");
  bg.addColorStop(0.6, "#0e1420");
  bg.addColorStop(1, "#05060a");
  c.fillStyle = bg;
  c.fillRect(0, 0, w, h);
  for (const tr of cutTrees) {
    c.fillStyle = `rgb(${tr.dark},${tr.dark + 2},${tr.dark + 6})`;
    c.fillRect(tr.x * w, 0, tr.w * w + 4, h * 0.82);
  }
  const groundY = h * 0.8;
  const appear = Math.min(1, t / 2.5);                     // they fade in…
  const flick = Math.random() < 0.15 ? 0.3 : 1;
  // the ghost in the middle
  drawGhostWoman(c, w / 2, groundY, h * 0.42, appear * flick, time);
  // two hooded figures, one each side: tall, ragged, with glowing eyes and bony claws
  for (const side of [-1, 1]) {
    const fx = w / 2 + side * Math.min(w * 0.3, h * 0.3), fh = Math.min(h * 0.46, w * 0.62);
    drawHoodedFigure(c, fx, groundY, fh, side, appear, time);
  }
  // fog and static
  const fog = c.createLinearGradient(0, groundY - h * 0.15, 0, h);
  fog.addColorStop(0, "rgba(120,130,150,0)");
  fog.addColorStop(1, "rgba(120,130,150,0.25)");
  c.fillStyle = fog;
  c.fillRect(0, groundY - h * 0.15, w, h);
  drawStatic(c, w, h, 0.08 + (Math.random() < 0.1 ? 0.25 : 0));
  // (you're not here: they're talking about you…)

  // The ghost asks the figure on the left… and it answers
  const leftX = w / 2 - Math.min(w * 0.3, h * 0.3), leftHeadY = groundY - Math.min(h * 0.46, w * 0.62) * 0.95;
  const ghostHeadY = groundY - h * 0.42 * 0.88;
  if (t > S.cutscene.ghostAsksAt) {
    speechBubble(c, w / 2 - 10, ghostHeadY - 20, S.text.cutGhostLine, -1, "#e6eef5", "#3a0000");
  }
  if (t > S.cutscene.figureAnswersAt) {
    speechBubble(c, leftX + 10, leftHeadY - 20, S.text.cutFigureLine, 1, "#16161c", "#ff5050");
  }
}

// A scary hooded figure: ragged robe, black hood, glowing eyes, long bony claws
function drawHoodedFigure(c, fx, groundY, fh, side, alpha, time) {
  const sway = Math.sin(time * 0.9 + side) * fh * 0.015;
  const eyeColor = side < 0 ? "255,40,40" : "220,225,255";
  const topY = groundY - fh * 1.05;
  c.save();
  c.globalAlpha = alpha;
  // mist curling around the feet
  const mist = c.createRadialGradient(fx, groundY, 2, fx, groundY, fh * 0.45);
  mist.addColorStop(0, "rgba(150,160,180,0.25)");
  mist.addColorStop(1, "rgba(150,160,180,0)");
  c.fillStyle = mist;
  c.fillRect(fx - fh * 0.5, groundY - fh * 0.25, fh, fh * 0.4);
  // the robe, with a torn, ragged bottom
  c.fillStyle = "#08080c";
  c.strokeStyle = "rgba(150,160,185,0.4)";       // faint glow around the edges
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(fx - fh * 0.1 + sway, topY + fh * 0.22);                       // left of the hood
  c.quadraticCurveTo(fx - fh * 0.05 + sway, topY - fh * 0.02, fx + fh * 0.05 + sway, topY + fh * 0.02);  // pointed hood top
  c.quadraticCurveTo(fx + fh * 0.16 + sway, topY + fh * 0.1, fx + fh * 0.14 + sway, topY + fh * 0.3);
  c.quadraticCurveTo(fx + fh * 0.24, groundY - fh * 0.5, fx + fh * 0.3, groundY);   // right side flares out
  for (let i = 1; i <= 9; i++) {                                           // ragged hem
    const px = fx + fh * 0.3 - (fh * 0.6 * i) / 9;
    const py = groundY - (i % 2 ? fh * (0.04 + 0.05 * Math.abs(Math.sin(i * 3.3 + time * 1.5))) : 0);
    c.lineTo(px + Math.sin(time * 2 + i) * 2, py);
  }
  c.quadraticCurveTo(fx - fh * 0.24, groundY - fh * 0.5, fx - fh * 0.1 + sway, topY + fh * 0.22);
  c.closePath();
  c.fill();
  c.stroke();
  // torn strips hanging from the sleeves
  c.strokeStyle = "#08080c";
  c.lineWidth = Math.max(2, fh * 0.012);
  for (const k of [-1, 1]) {
    for (let j = 0; j < 3; j++) {
      const sx = fx + k * fh * (0.2 + j * 0.02), sy = groundY - fh * 0.48;
      c.beginPath();
      c.moveTo(sx, sy);
      c.quadraticCurveTo(sx + k * fh * 0.03, sy + fh * 0.1, sx + Math.sin(time * 2 + j) * 3, sy + fh * (0.15 + j * 0.04));
      c.stroke();
    }
  }
  // pitch-black face inside the hood
  const faceX = fx + fh * 0.02 + sway, faceY = topY + fh * 0.2;
  c.fillStyle = "#000";
  c.beginPath();
  c.ellipse(faceX, faceY, fh * 0.065, fh * 0.1, 0, 0, Math.PI * 2);
  c.fill();
  // glowing eyes that pulse and sometimes blink
  const blink = (Math.sin(time * 0.7 + side * 2) > 0.97) ? 0.15 : 1;
  const pulse = 0.65 + 0.35 * Math.sin(time * 3 + side);
  c.fillStyle = `rgba(${eyeColor},${pulse})`;
  c.shadowColor = `rgb(${eyeColor})`;
  c.shadowBlur = 16;
  for (const e of [-1, 1]) {
    c.beginPath();
    c.ellipse(faceX + e * fh * 0.028, faceY - fh * 0.01, fh * 0.014, fh * 0.008 * blink, e * 0.25, 0, Math.PI * 2);
    c.fill();
  }
  c.shadowBlur = 0;
  // long bony fingers with claws reaching out of the sleeves
  c.strokeStyle = "#b9b4a8";
  c.lineCap = "round";
  for (const k of [-1, 1]) {
    const hx = fx + k * fh * 0.21, hy = groundY - fh * 0.47;
    const reach = Math.sin(time * 1.3 + k + side) * fh * 0.01;
    for (let f = 0; f < 4; f++) {
      const ang = Math.PI / 2 + k * (0.15 + f * 0.13);
      const len = fh * (0.13 + (f === 1 || f === 2 ? 0.03 : 0));
      const mx = hx + Math.cos(ang - k * 0.3) * len * 0.5, my = hy + Math.sin(ang - k * 0.3) * len * 0.5;
      const ex = hx + Math.cos(ang) * len + reach * k, ey = hy + Math.sin(ang) * len;
      c.lineWidth = Math.max(1.5, fh * 0.011);
      c.beginPath();
      c.moveTo(hx, hy);
      c.lineTo(mx, my);                         // bony joint
      c.lineTo(ex, ey);
      c.stroke();
      c.strokeStyle = "#1a1612";                 // dark claw tip
      c.lineWidth = Math.max(1, fh * 0.008);
      c.beginPath();
      c.moveTo(ex, ey);
      c.lineTo(ex + k * fh * 0.01, ey + fh * 0.025);
      c.stroke();
      c.strokeStyle = "#b9b4a8";
    }
  }
  c.restore();
}

// A comic-style speech bubble. The tail points down and to one side (dir -1 = left, 1 = right).
function speechBubble(c, x, y, text, dir, bg, fg) {
  const size = Math.max(14, Math.min(20, innerWidth / 24));
  c.font = `bold ${size}px system-ui, sans-serif`;
  // long lines wrap onto more lines so the bubble always fits on the screen
  const maxW = innerWidth - 40, lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const test = line ? line + " " + word : word;
    if (line && c.measureText(test).width > maxW) { lines.push(line); line = word; } else line = test;
  }
  lines.push(line);
  const tw = Math.max(...lines.map((l) => c.measureText(l).width)), lh = size * 1.25;
  const pw = tw + 24, ph = lines.length * lh + 18 - (lh - size);
  const bx = clamp(x - pw / 2 + dir * pw * 0.25, 8, innerWidth - pw - 8), by = y - ph - 14;
  c.fillStyle = bg;
  c.strokeStyle = fg;
  c.lineWidth = 2;
  c.beginPath();
  c.roundRect(bx, by, pw, ph, 12);
  c.fill();
  c.stroke();
  c.beginPath();                                   // the tail
  c.moveTo(x - 8, by + ph - 1);
  c.lineTo(x + 8, by + ph - 1);
  c.lineTo(x, y);
  c.closePath();
  c.fill();
  c.fillStyle = fg;
  c.textAlign = "center";
  lines.forEach((l, i) => c.fillText(l, bx + pw / 2, by + 9 + size * 0.85 + i * lh));
  c.textAlign = "start";
}


// ==========================================================
//  THE FINALE: Dr. Voss's secret, the monster, the chase, the win
// ==========================================================
let finale = null;          // null, or "chase" during the final chase
let chaseSpikes = [], chaseChairs = [], chasePhone = null, spikeTimer = 0, chairTimer = 0, stillT = 0, filmT = 0;
let chaseTrail = [], chaseBehind = 0;   // the monster follows your footsteps (so it can't go through walls either)
const chaseLimit = () => S.chase.timeLimitByMode[mode];
let finT = 0, chaseT = 0, winT = 0, finEventsDone = 0, winSubsStart = 0, heliTimer = 0, gunTimer = 0;
let filmed = { grinner: 0, ghost: 0, spider: 0 };
let planeSound = false, planeSound2 = false;
const finCatch = { active: false, done: false, t: 0 };
const grinner = { kind: "grinner", x: 0, y: 0, fz: 0 };
const pIn = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

// --- recorded voices (the sound data is at the very bottom of the script) ---
function loadVoices() {
  for (const name in VOICE_DATA) {
    const bytes = Uint8Array.from(atob(VOICE_DATA[name]), (ch) => ch.charCodeAt(0));
    audio.ac.decodeAudioData(bytes.buffer, (buf) => { audio.voices[name] = buf; }, () => {});
  }
}
// "I see you…" — the ghost's voice when she starts chasing you (not too often)
let lastSeeYou = -999;
function ghostSeesYou() {
  if (!S.ghost.chaseVoice || finale) return;
  const now = performance.now() / 1000;
  if (now - lastSeeYou < S.ghost.chaseVoiceCooldown) return;
  lastSeeYou = now;
  playVoice("seeyou", S.ghost.chaseVoiceVolume);
}
function playVoice(name, vol, pan = 0) {   // pan: -1 = left ear, 1 = right ear
  if (!audio || !audio.voices[name]) return;
  const src = audio.ac.createBufferSource();
  src.buffer = audio.voices[name];
  const g = audio.ac.createGain();
  g.gain.value = vol;
  src.connect(g);
  if (pan && audio.ac.createStereoPanner) {
    const p = audio.ac.createStereoPanner();
    p.pan.value = pan;
    g.connect(p); p.connect(audio.master);
  } else {
    g.connect(audio.master);
  }
  src.start();
}

// --- little sound helpers ---
function sfxTone(wave, f0, f1, dur, vol) {
  if (!audio) return;
  const ac = audio.ac, t = ac.currentTime;
  const o = ac.createOscillator();
  o.type = wave;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.master);
  o.start(t);
  o.stop(t + dur + 0.02);
}
function sfxNoise(type, f0, f1, dur, vol) {
  if (!audio) return;
  const ac = audio.ac, t = ac.currentTime;
  const n = ac.createBufferSource();
  n.buffer = audio.noiseBuffer;
  const f = ac.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(f0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); g.connect(audio.master);
  n.start(t, Math.random());
  n.stop(t + dur + 0.02);
}

// Can the phone camera see this spot?
function cameraSees(x, y, maxDist) {
  if (!phoneUp || !recordingOn) return false;
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  const dx = x - player.x, dy = y - player.y;
  const z = dx * fx + dy * fy;
  if (z < 0.5 || z > maxDist) return false;
  const side = -dx * fy + dy * fx;
  return Math.abs(side / z) < Math.tan((S.look.cameraFov / 2) * DEG) * 0.85;
}

// The final chase: get your phone back before the monster gets you!
// It's always right behind you, getting closer. Spikes shoot up, it throws chairs, and you can't stop moving.
function updateChase(dt, walking) {
  chaseT += dt;
  const C = S.chase;
  ghost.x = player.x + 9999; ghost.y = player.y; ghost.hunting = false; ghost.rushLeft = 0; ghost.rushTimer = 0;   // no ghost…
  spider.x = player.x + 9999; spider.y = player.y;                                                                 // …and no spider
  danger = 0;
  const caught = () => { startScare("grinner"); };
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);

  // Spikes: the ground cracks in front of you… then they shoot up. Jump over them!
  spikeTimer -= dt;
  if (spikeTimer <= 0) {
    spikeTimer = C.spikeEvery * (0.7 + Math.random() * 0.6);
    const ang = Math.random() * Math.PI * 2, dist = C.spikeAround[0] + Math.random() * (C.spikeAround[1] - C.spikeAround[0]);
    chaseSpikes.push({ kind: "spike", x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist, fz: 0, t: 0 });
  }
  for (const sp of chaseSpikes) {
    const wasWarn = sp.t < C.spikeWarn;
    sp.t += dt;
    if (wasWarn && sp.t >= C.spikeWarn) sfxNoise("highpass", 3000, 1200, 0.25, 0.35);           // SHING!
    const up = sp.t >= C.spikeWarn && sp.t < C.spikeWarn + C.spikeUp;
    if (up && jumpZ < C.jumpClear && Math.hypot(player.x - sp.x, player.y - sp.y) < C.spikeRadius) { caught(); return; }
  }
  chaseSpikes = chaseSpikes.filter((sp) => sp.t < C.spikeWarn + C.spikeUp + 0.3);

  // Chairs: it throws one so it lands right in front of you. Dodge!
  chairTimer -= dt;
  if (chairTimer <= 0 && chaseT > C.headStart) {
    chairTimer = C.tableEvery * (0.75 + Math.random() * 0.5);
    const side = (Math.random() - 0.5) * 0.8;
    chaseChairs.push({ kind: "chair", sx: grinner.x, sy: grinner.y, tx: player.x + fx * C.tableAhead - fy * side, ty: player.y + fy * C.tableAhead + fx * side,
                       x: grinner.x, y: grinner.y, z: 2.4, fz: 0, t: 0, landed: false, spin: Math.random() * 6 });
    showToast(S.text.chaseChair, 1.5);
    sfxNoise("bandpass", 500, 200, 0.4, 0.3);                                                     // whoosh
  }
  for (const ch of chaseChairs) {
    ch.t += dt;
    const f = clamp(ch.t / C.tableFlight, 0, 1);
    ch.x = lerp(ch.sx, ch.tx, f); ch.y = lerp(ch.sy, ch.ty, f);
    ch.z = lerp(2.4, 0, f) + Math.sin(f * Math.PI) * 1.8;
    if (!ch.landed && f >= 1) {
      ch.landed = true;
      sfxNoise("lowpass", 900, 200, 0.3, 0.6); sfxTone("square", 160, 60, 0.15, 0.2);             // CRASH
      if (Math.hypot(player.x - ch.tx, player.y - ch.ty) < C.tableHitRadius) { caught(); return; }
    }
  }
  chaseChairs = chaseChairs.filter((ch) => ch.t < C.tableFlight + 1.5);

  // Grab your phone!
  if (chasePhone && Math.hypot(player.x - chasePhone.x, player.y - chasePhone.y) < C.pickupDistance) { startFilmCut(); return; }

  if (chaseT < C.headStart) return;                      // it roars first…
  // It follows your footsteps (so it comes through the door after you, never through walls),
  // and gets closer and closer until it catches you
  const runT = chaseT - C.headStart;
  grinner.run = true;
  const limit = chaseLimit();
  const frac = clamp(runT / limit, 0, 1);
  const want = C.startDistance * (1 - frac * frac * (1.6 - 0.6 * frac));
  chaseBehind = Math.max(want, chaseBehind - 9 * dt);    // how far behind you it is, along your path
  const last = chaseTrail[chaseTrail.length - 1];
  if (Math.hypot(player.x - last[0], player.y - last[1]) > 0.25) chaseTrail.push([player.x, player.y]);
  // walk back along your trail by chaseBehind steps
  let left = chaseBehind, px = player.x, py = player.y, i = chaseTrail.length - 1;
  while (i >= 0 && left > 0) {
    const [tx, ty] = chaseTrail[i], seg = Math.hypot(px - tx, py - ty);
    if (seg >= left) { px += (tx - px) * (left / seg); py += (ty - py) * (left / seg); left = 0; break; }
    left -= seg; px = tx; py = ty; i--;
  }
  grinner.x = px; grinner.y = py;
  if (chaseTrail.length > 400) chaseTrail.splice(0, chaseTrail.length - 400);
  grinner.step = (grinner.step || 0) - dt;
  if (grinner.step <= 0) { grinner.step = 0.22; sfxTone("sine", 90, 50, 0.1, 0.25); }   // heavy running footsteps
  if (runT >= limit) { caught(); return; }

  // Don't stand still!
  stillT = walking ? 0 : stillT + dt;
  if (stillT >= C.standStillSeconds) { caught(); return; }
}

// The monster's face: chalky white, empty eyes, a HUGE grin full of teeth
function drawGrinFace(c, cx, cy, s, skin, time, noNeck) {
  const qb = (p0, p1, p2, t) => [(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0],
                                 (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]];
  // neck
  if (!noNeck) {
  c.fillStyle = skin;
  c.beginPath();
  c.moveTo(cx - s * 0.16, cy + s * 0.3);
  c.lineTo(cx + s * 0.16, cy + s * 0.3);
  c.lineTo(cx + s * 0.22, cy + s * 1.0);
  c.lineTo(cx - s * 0.22, cy + s * 1.0);
  c.fill();
  c.strokeStyle = "rgba(0,0,0,0.25)";
  c.lineWidth = Math.max(1, s * 0.008);
  for (let k = 0; k < 6; k++) {
    c.beginPath();
    c.moveTo(cx - s * 0.17, cy + s * (0.42 + k * 0.1));
    c.lineTo(cx + s * 0.17, cy + s * (0.42 + k * 0.1));
    c.stroke();
  }
  }
  // head: a dome on top of a wide jaw
  const g = c.createRadialGradient(cx - s * 0.1, cy - s * 0.25, s * 0.05, cx, cy, s * 0.6);
  g.addColorStop(0, "#c4bfb2");
  g.addColorStop(0.6, skin);
  g.addColorStop(1, "#6a6a64");
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(cx, cy - s * 0.2, s * 0.36, s * 0.3, 0, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.ellipse(cx, cy + s * 0.08, s * 0.52, s * 0.32, 0, 0, Math.PI * 2);
  c.fill();
  // empty eye holes
  for (const k of [-1, 1]) {
    const eg = c.createRadialGradient(cx + k * s * 0.14, cy - s * 0.26, 0, cx + k * s * 0.14, cy - s * 0.26, s * 0.12);
    eg.addColorStop(0, "#000");
    eg.addColorStop(0.75, "#050505");
    eg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = eg;
    c.beginPath();
    c.ellipse(cx + k * s * 0.14, cy - s * 0.26, s * 0.12, s * 0.1, k * 0.1, 0, Math.PI * 2);
    c.fill();
  }
  // the grin
  const L = [cx - s * 0.46, cy - s * 0.02], Rt = [cx + s * 0.46, cy - s * 0.02];
  const up = [cx, cy + s * 0.1], down = [cx, cy + s * 0.62];
  c.fillStyle = "#020202";
  c.beginPath();
  c.moveTo(L[0], L[1]);
  c.quadraticCurveTo(up[0], up[1], Rt[0], Rt[1]);
  c.quadraticCurveTo(down[0], down[1], L[0], L[1]);
  c.fill();
  // rows of sharp teeth
  c.fillStyle = "#cbbf8e";                                     // yellowed teeth
  const N = 18;
  for (let i = 1; i < N; i++) {
    const t = i / N, [x, y] = qb(L, up, Rt, t), len = s * (0.06 + 0.04 * Math.abs(Math.sin(i * 2.3)));
    c.beginPath();
    c.moveTo(x - s * 0.018, y);
    c.lineTo(x + s * 0.018, y);
    c.lineTo(x, y + len);
    c.fill();
  }
  for (let i = 2; i < N - 1; i++) {
    const t = i / N, [x, y] = qb(L, down, Rt, t), len = s * (0.06 + 0.04 * Math.abs(Math.sin(i * 3.1)));
    c.beginPath();
    c.moveTo(x - s * 0.018, y);
    c.lineTo(x + s * 0.018, y);
    c.lineTo(x, y - len);
    c.fill();
  }
  // red gums along the teeth
  c.strokeStyle = "rgba(120,20,25,0.9)";
  c.lineWidth = s * 0.02;
  c.beginPath(); c.moveTo(L[0], L[1]); c.quadraticCurveTo(up[0], up[1] + s * 0.012, Rt[0], Rt[1]); c.stroke();
  c.beginPath(); c.moveTo(L[0], L[1]); c.quadraticCurveTo(down[0], down[1] - s * 0.02, Rt[0], Rt[1]); c.stroke();
  // thick lips around the grin
  c.strokeStyle = skin;
  c.lineWidth = s * 0.035;
  c.beginPath();
  c.moveTo(L[0], L[1]);
  c.quadraticCurveTo(up[0], up[1] - s * 0.01, Rt[0], Rt[1]);
  c.quadraticCurveTo(down[0], down[1] + s * 0.02, L[0], L[1]);
  c.stroke();
  // blood dripping from the corners of its mouth
  c.fillStyle = "rgba(100,5,5,0.9)";
  for (const [px2, len] of [[L[0] + s * 0.03, 0.16], [Rt[0] - s * 0.04, 0.22], [cx + s * 0.1, 0.12]]) {
    const py2 = px2 === cx + s * 0.1 ? cy + s * 0.5 : L[1] + s * 0.02;
    c.fillRect(px2 - s * 0.008, py2, s * 0.016, s * len);
    c.beginPath(); c.arc(px2, py2 + s * len, s * 0.014, 0, Math.PI * 2); c.fill();
  }
  // veins on its head
  c.strokeStyle = "rgba(60,40,60,0.45)";
  c.lineWidth = Math.max(1, s * 0.006);
  for (let v = 0; v < 5; v++) {
    let vx = cx + (v - 2) * s * 0.08, vy = cy - s * 0.46;
    c.beginPath(); c.moveTo(vx, vy);
    for (let k = 0; k < 4; k++) { vx += Math.sin(v * 2 + k * 1.7) * s * 0.03; vy += s * 0.04; c.lineTo(vx, vy); }
    c.stroke();
  }
  // dirty speckles
  c.fillStyle = "rgba(40,34,26,0.3)";
  for (let i = 0; i < 70; i++) {
    const a = i * 2.39996, r = s * 0.5 * Math.sqrt((i % 37) / 37);
    const x = cx + Math.cos(a) * r, y = cy - s * 0.05 + Math.sin(a) * r * 0.7;
    c.fillRect(x, y, Math.max(1, s * 0.006), Math.max(1, s * 0.006));
  }
}

// The monster's whole body: long, thin, pale limbs
function drawGrinnerBody(c, x, footY, H, skin, time, running) {
  const hipY = footY - H * 0.42, shY = footY - H * 0.68, sway = Math.sin(time * 1.5) * H * 0.01;
  const stride = running ? Math.sin(time * 11) : 0;        // legs and arms swing when it runs
  c.strokeStyle = "rgba(0,0,0,0.6)";
  c.lineCap = "round";
  const limb = (pts, wdt) => {
    for (const [col, ww] of [["rgba(0,0,0,0.6)", wdt * 1.4], [skin, wdt]]) {
      c.strokeStyle = col;
      c.lineWidth = Math.max(1.5, ww);
      c.beginPath();
      pts.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py)));
      c.stroke();
    }
  };
  const lw = H * 0.035;
  // a sharp spike from (ax, ay) to the point (bx, by), wdt wide at the base
  const spike = (ax, ay, bx, by, wdt) => {
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, nx = -dy / len * wdt, ny = dx / len * wdt;
    c.fillStyle = "rgba(0,0,0,0.6)";
    c.beginPath(); c.moveTo(ax + nx * 1.4, ay + ny * 1.4); c.lineTo(bx + dx / len * wdt * 0.6, by + dy / len * wdt * 0.6); c.lineTo(ax - nx * 1.4, ay - ny * 1.4); c.fill();
    c.fillStyle = skin;
    c.beginPath(); c.moveTo(ax + nx, ay + ny); c.lineTo(bx, by); c.lineTo(ax - nx, ay - ny); c.fill();
    c.fillStyle = "#1a1612";                                     // dark tip
    c.beginPath(); c.moveTo(ax + dx * 0.75 + nx * 0.3, ay + dy * 0.75 + ny * 0.3); c.lineTo(bx, by); c.lineTo(ax + dx * 0.75 - nx * 0.3, ay + dy * 0.75 - ny * 0.3); c.fill();
  };
  for (const k of [-1, 1]) {
    const sw = stride * k;
    const lift = Math.max(0, sw) * H * 0.08;
    limb([[x + k * H * 0.04, hipY], [x + k * H * 0.14 + sw * H * 0.06, footY - H * 0.2 - lift], [x + k * H * 0.1 + sw * H * 0.08, footY - lift]], lw);   // legs
    limb([[x + k * H * 0.08 + sway, shY], [x + k * H * 0.2 - sw * H * 0.08, footY - H * 0.42 - Math.abs(sw) * H * 0.05], [x + k * H * 0.18 - sw * H * 0.12, footY - H * 0.12 - Math.abs(sw) * H * 0.1]], lw * 0.8);  // arms
    // long, pointy fingers (sharp spikes)
    const hx = x + k * H * 0.18 - sw * H * 0.12, hy = footY - H * 0.12 - Math.abs(sw) * H * 0.1;
    for (let f = -2; f <= 2; f++) spike(hx, hy, hx + k * H * 0.012 + f * H * 0.022, hy + H * (0.11 - Math.abs(f) * 0.015), H * 0.012);
    // spiky claw toes on each foot
    const fx = x + k * H * 0.1 + sw * H * 0.08, fy = footY - lift;
    for (let f = 0; f < 4; f++) spike(fx - k * H * 0.02, fy - H * 0.01, fx + k * H * (0.05 + f * 0.035), fy + H * (0.005 - f * 0.012) - (f === 3 ? H * 0.03 : 0), H * 0.014);
    spike(fx, fy - H * 0.01, fx - k * H * 0.06, fy - H * 0.005, H * 0.012);                    // a claw sticking out the back
  }
  limb([[x, hipY], [x + sway, shY]], lw * 2.2);                                                                    // body
  drawGrinFace(c, x + sway, footY - H * 0.86, H * 0.3, skin, time);
}

// A simple spider shape for cutscenes
function drawSpiderSil(c, x, y, s, alpha) {
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = "#140e0c";
  c.fillStyle = "#140e0c";
  c.lineWidth = Math.max(2, s * 0.06);
  for (const k of [-1, 1]) for (let i = 0; i < 4; i++) {
    c.beginPath();
    c.moveTo(x, y - s * 0.4);
    c.lineTo(x + k * s * (0.5 + i * 0.2), y - s * (0.8 + (i % 2) * 0.1));
    c.lineTo(x + k * s * (0.7 + i * 0.3), y);
    c.stroke();
  }
  c.beginPath();
  c.ellipse(x, y - s * 0.55, s * 0.4, s * 0.3, 0, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = "#ff2a1a";
  for (const k of [-1, 1]) { c.beginPath(); c.arc(x + k * s * 0.08, y - s * 0.4, Math.max(1.5, s * 0.03), 0, Math.PI * 2); c.fill(); }
  c.restore();
}

// Dr. Voss's head (a real person: skin, grey hair, glasses). smile = his creepy grin
function finVossHead(c, x, y, r, smile) {
  const skin = S.finale.vossSkin;                     // same darker face as in the game
  c.fillStyle = skin;                                                      // ears
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * r * 0.95, y + r * 0.05, r * 0.16, r * 0.25, 0, 0, Math.PI * 2); c.fill(); }
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r * 1.2);
  g.addColorStop(0, S.finale.vossSkin); g.addColorStop(1, S.finale.vossSkinDark);
  c.fillStyle = g;                                                         // face
  c.beginPath(); c.ellipse(x, y, r * 0.9, r * 1.1, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#6a6a6c";                                                 // messy grey hair
  c.beginPath();
  c.ellipse(x, y - r * 0.75, r * 0.95, r * 0.45, 0, Math.PI, 0);
  for (let i = 0; i <= 6; i++) c.lineTo(x + r * 0.95 - (i / 6) * r * 1.9, y - r * (0.75 + (i % 2) * 0.22));
  c.fill();
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * r * 0.88, y - r * 0.35, r * 0.18, r * 0.35, 0, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = "rgba(60,40,60,0.45)";                                    // dark circles under his eyes
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * r * 0.33, y + r * 0.02, r * 0.22, r * 0.16, 0, 0, Math.PI * 2); c.fill(); }
  // eyes (wide and staring when he smiles)
  for (const k of [-1, 1]) {
    c.fillStyle = "#fff";
    c.beginPath(); c.ellipse(x + k * r * 0.33, y - r * 0.12, r * 0.17, smile ? r * 0.15 : r * 0.1, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = smile ? "#111" : "#3a2a20";
    c.beginPath(); c.arc(x + k * r * 0.33, y - r * 0.12, smile ? r * 0.05 : r * 0.07, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = "#222"; c.lineWidth = Math.max(1, r * 0.06);           // glasses
  for (const k of [-1, 1]) { c.beginPath(); c.arc(x + k * r * 0.33, y - r * 0.12, r * 0.24, 0, Math.PI * 2); c.stroke(); }
  c.beginPath(); c.moveTo(x - r * 0.09, y - r * 0.12); c.lineTo(x + r * 0.09, y - r * 0.12); c.stroke();
  c.strokeStyle = "rgba(120,70,50,0.6)"; c.lineWidth = Math.max(1, r * 0.05);   // nose
  c.beginPath(); c.moveTo(x, y - r * 0.02); c.lineTo(x - r * 0.08, y + r * 0.28); c.lineTo(x + r * 0.05, y + r * 0.3); c.stroke();
  if (smile) {
    // a HUGE smile, ear to ear, full of teeth
    c.fillStyle = "#3a0606";
    c.beginPath();
    c.moveTo(x - r * 0.75, y + r * 0.35);
    c.quadraticCurveTo(x, y + r * 0.5, x + r * 0.75, y + r * 0.35);
    c.quadraticCurveTo(x, y + r * 1.15, x - r * 0.75, y + r * 0.35);
    c.fill();
    c.fillStyle = "#f2efe2";
    for (let i = 1; i < 10; i++) {
      const tx = x - r * 0.68 + (i / 10) * r * 1.36;
      c.beginPath(); c.moveTo(tx - r * 0.06, y + r * 0.43); c.lineTo(tx + r * 0.06, y + r * 0.43); c.lineTo(tx, y + r * 0.58); c.fill();
      c.beginPath(); c.moveTo(tx - r * 0.06, y + r * 0.86 - Math.abs(i - 5) * r * 0.05); c.lineTo(tx + r * 0.06, y + r * 0.86 - Math.abs(i - 5) * r * 0.05); c.lineTo(tx, y + r * 0.72 - Math.abs(i - 5) * r * 0.05); c.fill();
    }
    c.strokeStyle = "#a34a4a"; c.lineWidth = Math.max(1, r * 0.06);
    c.beginPath();
    c.moveTo(x - r * 0.75, y + r * 0.35);
    c.quadraticCurveTo(x, y + r * 0.5, x + r * 0.75, y + r * 0.35);
    c.quadraticCurveTo(x, y + r * 1.15, x - r * 0.75, y + r * 0.35);
    c.stroke();
  } else {
    c.strokeStyle = "#8a4a40"; c.lineWidth = Math.max(1, r * 0.06);
    c.beginPath(); c.moveTo(x - r * 0.25, y + r * 0.55); c.lineTo(x + r * 0.25, y + r * 0.55); c.stroke();
  }
}

// Dave: a friendly guy in a green hoodie and jeans, waving (his mouth moves when he talks)
function drawDave(c, x, footY, H, time, talking) {
  const D = S.daveRoom, r = H * 0.085;
  const hipY = footY - H * 0.45, shY = footY - H * 0.78, headY = shY - r * 1.25;
  c.lineCap = "round"; c.lineJoin = "round";
  c.strokeStyle = "#2b3f6a"; c.lineWidth = H * 0.075;                    // jeans
  for (const k of [-1, 1]) { c.beginPath(); c.moveTo(x + k * H * 0.05, hipY); c.lineTo(x + k * H * 0.065, footY - H * 0.04); c.stroke(); }
  c.fillStyle = "#eee";                                                    // sneakers
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * H * 0.075, footY - H * 0.02, H * 0.055, H * 0.025, 0, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = D.hoodie;                                                  // hoodie body
  c.beginPath();
  c.moveTo(x - H * 0.13, shY); c.lineTo(x + H * 0.13, shY); c.lineTo(x + H * 0.12, hipY + H * 0.04); c.lineTo(x - H * 0.12, hipY + H * 0.04); c.closePath(); c.fill();
  c.fillStyle = "rgba(0,0,0,0.2)"; c.fillRect(x - H * 0.06, hipY - H * 0.1, H * 0.12, H * 0.06);   // hoodie pocket
  // arms: left arm down, right arm waving
  c.strokeStyle = D.hoodie; c.lineWidth = H * 0.055;
  c.beginPath(); c.moveTo(x - H * 0.12, shY + H * 0.03); c.lineTo(x - H * 0.17, hipY); c.stroke();
  const wave = Math.sin(time * 7) * 0.35;
  const ex = x + H * 0.2, ey = shY - H * 0.02, hx = ex + Math.sin(wave) * H * 0.1, hy = ey - Math.cos(wave) * H * 0.15;
  c.beginPath(); c.moveTo(x + H * 0.12, shY + H * 0.03); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
  c.fillStyle = D.skin;
  c.beginPath(); c.arc(x - H * 0.17, hipY + H * 0.01, H * 0.03, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(hx, hy - H * 0.01, H * 0.035, 0, Math.PI * 2); c.fill();          // waving hand
  // neck and head
  c.fillRect(x - r * 0.3, shY - r * 0.5, r * 0.6, r * 0.6);
  c.beginPath(); c.ellipse(x, headY, r * 0.9, r * 1.05, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = D.hair;                                                    // short messy hair
  c.beginPath(); c.ellipse(x, headY - r * 0.55, r * 0.95, r * 0.55, 0, Math.PI, 0);
  for (let i = 0; i <= 6; i++) c.lineTo(x + r * 0.95 - (i / 6) * r * 1.9, headY - r * (0.55 - (i % 2) * 0.2));
  c.fill();
  const blink = (time % 3.2) < 0.12;                                       // eyes (he blinks)
  for (const k of [-1, 1]) {
    if (blink) { c.strokeStyle = "#222"; c.lineWidth = Math.max(1, r * 0.06); c.beginPath(); c.moveTo(x + k * r * 0.33 - r * 0.1, headY - r * 0.1); c.lineTo(x + k * r * 0.33 + r * 0.1, headY - r * 0.1); c.stroke(); }
    else { c.fillStyle = "#fff"; c.beginPath(); c.ellipse(x + k * r * 0.33, headY - r * 0.1, r * 0.14, r * 0.11, 0, 0, Math.PI * 2); c.fill();
           c.fillStyle = "#3a2a1a"; c.beginPath(); c.arc(x + k * r * 0.33, headY - r * 0.09, r * 0.07, 0, Math.PI * 2); c.fill(); }
  }
  c.fillStyle = "rgba(255,120,110,0.25)";                                 // cheeks
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * r * 0.5, headY + r * 0.25, r * 0.15, r * 0.09, 0, 0, Math.PI * 2); c.fill(); }
  const open = talking ? Math.abs(Math.sin(time * 14)) : 0;                // mouth: a big smile, opening when he talks
  c.fillStyle = "#5a1a1a";
  c.beginPath(); c.ellipse(x, headY + r * 0.48, r * 0.3, r * (0.08 + open * 0.18), 0, 0, Math.PI); c.fill();
  c.strokeStyle = "#5a1a1a"; c.lineWidth = Math.max(1, r * 0.06);
  c.beginPath(); c.arc(x, headY + r * 0.35, r * 0.32, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
  return { headY, r };
}

// 🎬 You got your phone back: turn around, hold it up and FILM the monster. Then it goes viral!
function drawFilmCut(time) {
  const c = cutCtx, w = innerWidth, h = innerHeight, t = filmT, s0 = Math.min(w, h);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = c.createLinearGradient(0, 0, 0, h);         // the dark forest behind your phone
  sky.addColorStop(0, "#05070c"); sky.addColorStop(1, "#14110d");
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  c.fillStyle = "#07080a";
  for (let i = 0; i < 9; i++) c.fillRect((i / 9) * w + Math.sin(i * 3) * 20, 0, 14 + (i % 3) * 10, h);
  // the phone, held up in both hands
  const pw = Math.min(w * 0.62, h * 0.36), ph = pw * 1.9, px = w / 2 - pw / 2, py = h * 0.47 - ph / 2;
  const hs = pw * 0.32, gy = py + ph * 0.72;
  drawPaperGripBehind(c, px - 8, gy, hs, false);           // fingers behind the phone (like the opening cutscene)
  drawPaperGripBehind(c, px + pw + 8, gy, hs, true);
  c.fillStyle = "#0c0c10";
  c.fillRect(px - 8, py - 8, pw + 16, ph + 16);
  c.save();
  c.beginPath(); c.rect(px, py, pw, ph); c.clip();
  const cam = c.createLinearGradient(0, py, 0, py + ph);   // the camera view: night-vision green
  cam.addColorStop(0, "#0f1a12"); cam.addColorStop(1, "#22301f");
  c.fillStyle = cam; c.fillRect(px, py, pw, ph);
  // the monster running at the camera, bigger and bigger
  const run = pIn(t, 0.6, 3.2);
  if (t >= 0.6 && t < 3.6) drawGrinnerBody(c, w / 2, py + ph * (0.7 + run * 0.5), ph * (0.35 + run * 1.3), S.finale.grinnerSkin, time, true);
  if (t >= 3.2 && t < 3.6) { c.fillStyle = "rgba(255,255,255,0.85)"; c.fillRect(px, py, pw, ph); }   // FLASH
  // REC
  const fs = Math.max(12, pw * 0.07);
  c.font = `bold ${fs}px system-ui, sans-serif`; c.textAlign = "left";
  if (Math.floor(time * 2) % 2 === 0) { c.fillStyle = "#ff2a2a"; c.beginPath(); c.arc(px + fs, py + fs * 1.2, fs * 0.35, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = "#fff";
  c.fillText("REC 00:0" + Math.min(9, Math.floor(t)), px + fs * 1.6, py + fs * 1.5);
  c.textAlign = "center";
  const T = S.text;
  if (t < 3.6) {
    const line = T.filmCutLines[Math.min(T.filmCutLines.length - 1, Math.floor(t / 1.2))];
    c.fillStyle = "rgba(0,0,0,0.6)"; c.fillRect(px, py + ph - fs * 2.6, pw, fs * 2);
    c.fillStyle = "#fff"; c.fillText(line, w / 2, py + ph - fs * 1.2);
  } else {
    c.fillStyle = "rgba(0,0,0,0.75)"; c.fillRect(px, py, pw, ph);
    c.fillStyle = "#7dff9a"; c.font = `bold ${fs * 1.2}px system-ui, sans-serif`;
    c.fillText(T.filmCutSaved, w / 2, py + ph * 0.3);
    const up = pIn(t, 3.8, 5.0);
    c.fillStyle = "#fff"; c.font = `bold ${fs}px system-ui, sans-serif`;
    c.fillText(T.filmCutUploading + Math.floor(up * 100) + "%", w / 2, py + ph * 0.42);
    c.fillStyle = "#333"; c.fillRect(px + pw * 0.15, py + ph * 0.46, pw * 0.7, fs * 0.6);
    c.fillStyle = "#e33"; c.fillRect(px + pw * 0.15, py + ph * 0.46, pw * 0.7 * up, fs * 0.6);
    if (t >= 5.0) {
      const v = pIn(t, 5.0, S.chase.filmCutSeconds);
      c.fillStyle = "#ffd84a"; c.font = `bold ${fs * 1.2}px system-ui, sans-serif`;
      c.fillText(T.filmCutViral, w / 2, py + ph * 0.62);
      c.fillStyle = "#fff"; c.font = `bold ${fs * 1.1}px system-ui, sans-serif`;
      c.fillText("👥 " + Math.floor(subscribers + v * v * 50000000).toLocaleString(), w / 2, py + ph * 0.72);
    }
  }
  c.restore();
  drawPaperGripFront(c, px - 8, gy, hs, false);            // thumbs on the front
  drawPaperGripFront(c, px + pw + 8, gy, hs, true);
}

// Dr. Voss in the finale (t = time in the cutscene): a real person… until he isn't
function finVoss(c, x, footY, H, t, s0) {
  const grow = pIn(t, 14.5, 16.5), Hh = H * (1 + grow * 0.45);
  const hipY = footY - Hh * 0.45, hemY = footY - Hh * 0.3, shY = footY - Hh * 0.8, r = H * 0.075;
  const headY = shY - r * 1.35;
  c.lineCap = "round";
  c.lineJoin = "round";
  // trousers and shoes
  c.strokeStyle = "#2b2c33";
  c.lineWidth = H * 0.07;
  for (const k of [-1, 1]) { c.beginPath(); c.moveTo(x + k * H * 0.045, hipY); c.lineTo(x + k * H * (0.055 + grow * 0.04), footY - H * 0.03); c.stroke(); }
  c.fillStyle = "#121214";
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * H * (0.065 + grow * 0.04), footY - H * 0.015, H * 0.06, H * 0.025, 0, 0, Math.PI * 2); c.fill(); }
  // lab coat with rounded shoulders, collar, shirt and tie
  c.fillStyle = "#e3e6e0";
  c.beginPath();
  c.moveTo(x - H * 0.08, shY - H * 0.02);
  c.quadraticCurveTo(x - H * 0.16, shY - H * 0.01, x - H * 0.16, shY + H * 0.05);
  c.lineTo(x - H * 0.17, hemY);
  c.lineTo(x + H * 0.17, hemY);
  c.lineTo(x + H * 0.16, shY + H * 0.05);
  c.quadraticCurveTo(x + H * 0.16, shY - H * 0.01, x + H * 0.08, shY - H * 0.02);
  c.closePath();
  c.fill();
  c.fillStyle = "#9db4cc";                                                 // shirt
  c.beginPath(); c.moveTo(x - H * 0.05, shY - H * 0.02); c.lineTo(x + H * 0.05, shY - H * 0.02); c.lineTo(x, shY + H * 0.16); c.fill();
  c.fillStyle = "#7a1c1c";                                                 // tie
  c.beginPath(); c.moveTo(x - H * 0.012, shY); c.lineTo(x + H * 0.012, shY); c.lineTo(x + H * 0.02, shY + H * 0.13); c.lineTo(x, shY + H * 0.15); c.lineTo(x - H * 0.02, shY + H * 0.13); c.fill();
  c.strokeStyle = "#b8bcb5"; c.lineWidth = Math.max(1, H * 0.008);        // lapels and buttons
  c.beginPath(); c.moveTo(x - H * 0.06, shY - H * 0.02); c.lineTo(x - H * 0.015, shY + H * 0.2); c.lineTo(x - H * 0.015, hemY); c.stroke();
  c.beginPath(); c.moveTo(x + H * 0.06, shY - H * 0.02); c.lineTo(x + H * 0.015, shY + H * 0.2); c.stroke();
  c.fillStyle = "#b8bcb5";
  for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(x + H * 0.03, shY + H * (0.24 + k * 0.07), H * 0.008, 0, Math.PI * 2); c.fill(); }
  c.fillRect(x - H * 0.13, shY + H * 0.08, H * 0.05, H * 0.006);          // pocket + pen
  c.fillStyle = "#2050a0"; c.fillRect(x - H * 0.11, shY + H * 0.055, H * 0.008, H * 0.03);
  // sleeves (they stretch longer and longer…) and hands
  const armLen = H * 0.34 * (1 + grow * 1.3);
  const throwing = t >= 16.5 && t < 17.6;
  const handL = [x - H * 0.18 - grow * H * 0.08, shY + H * 0.04 + armLen];
  const handR = throwing ? [x + H * 0.24, shY - H * 0.16 - grow * H * 0.2] : [x + H * 0.18 + grow * H * 0.08, shY + H * 0.04 + armLen];
  c.strokeStyle = "#d9dcd6";
  c.lineWidth = H * 0.06;
  c.beginPath(); c.moveTo(x - H * 0.14, shY + H * 0.03); c.quadraticCurveTo(x - H * 0.19, shY + armLen * 0.5, handL[0], handL[1] - H * 0.03); c.stroke();
  c.beginPath(); c.moveTo(x + H * 0.14, shY + H * 0.03); c.quadraticCurveTo(x + H * 0.2, (shY + handR[1]) / 2, handR[0], handR[1] + (throwing ? H * 0.03 : -H * 0.03)); c.stroke();
  for (const hp of [handL, handR]) {
    c.fillStyle = S.player.skinColor;
    c.beginPath(); c.ellipse(hp[0], hp[1], H * 0.028, H * 0.034, 0, 0, Math.PI * 2); c.fill();
    if (grow > 0) {                                                        // long, creepy fingers
      c.strokeStyle = S.finale.grinnerSkin; c.lineWidth = Math.max(1, H * 0.009);
      for (let f = -1; f <= 1; f++) { c.beginPath(); c.moveTo(hp[0] + f * H * 0.012, hp[1]); c.lineTo(hp[0] + f * H * 0.02, hp[1] + H * 0.08 * grow); c.stroke(); }
    }
  }
  if (throwing) finKnife(c, handR[0], handR[1] - H * 0.06, H * 0.14, -0.4);
  // neck and head (until the knife takes it off)
  if (t < 20.3) {
    c.fillStyle = t >= 13 ? "#c8c4b8" : S.finale.vossSkinDark;              // neck
    c.fillRect(x - r * 0.35, shY - r * 0.6, r * 0.7, r * 0.7);
    // His face is a MASK: it falls off in one piece… he isn't human
    const fall = pIn(t, 13, 14.5);
    if (t >= 13) drawGrinFace(c, x, headY + r * 0.05, r * 2.3, S.finale.grinnerSkin, t, true);   // what's underneath
    if (fall < 1) {
      c.save();
      // first it slips forward a little, then it drops to the floor, tipping over
      const slip = Math.min(1, fall * 4), drop = Math.max(0, fall - 0.25) / 0.75;
      c.translate(x + slip * r * 0.25 + drop * H * 0.12, headY + slip * r * 0.15 + drop * drop * (footY - headY - r * 0.4));
      c.rotate(slip * 0.15 + drop * 1.9);
      finVossHead(c, 0, 0, r, false);
      if (t >= 13) {                                       // the inside edge of the mask
        c.strokeStyle = "rgba(90,20,20,0.7)";
        c.lineWidth = Math.max(1, r * 0.08);
        c.beginPath(); c.ellipse(0, 0, r * 0.9, r * 1.1, 0, 0, Math.PI * 2); c.stroke();
      }
      c.restore();
    }
  } else {
    c.fillStyle = "#5a0808";                                                // neck stump
    c.beginPath(); c.ellipse(x, shY - H * 0.01, H * 0.035, H * 0.018, 0, 0, Math.PI * 2); c.fill();
  }
  return { headY, r };
}

function finKnife(c, x, y, size, ang) {
  c.save();
  c.translate(x, y);
  c.rotate(ang);
  c.fillStyle = "#3a2414";
  c.fillRect(-size * 0.06, size * 0.1, size * 0.12, size * 0.4);            // handle
  c.fillStyle = "#888";
  c.fillRect(-size * 0.12, size * 0.06, size * 0.24, size * 0.05);          // guard
  const g = c.createLinearGradient(-size * 0.08, 0, size * 0.08, 0);
  g.addColorStop(0, "#9aa0a8"); g.addColorStop(0.5, "#eef2f6"); g.addColorStop(1, "#8a9098");
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(-size * 0.07, size * 0.06); c.lineTo(size * 0.07, size * 0.06); c.lineTo(size * 0.02, -size * 0.5); c.lineTo(-size * 0.07, -size * 0.4);
  c.fill();
  c.restore();
}

// The finale cutscene (first person, in the 2nd-floor lab)
function drawFinale(time) {
  const c = cutCtx, w = innerWidth, h = innerHeight, t = finT;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (finCatch.failed && finCatch.failT > 0.15) { c.fillStyle = "#000"; c.fillRect(0, 0, w, h); return; }   // black
  const s0 = Math.min(w, h * 0.65);
  let shake = 0;
  if ((t > 20.3 && t < 20.7) || (t > 24 && t < 24.6)) shake = 14;
  if (t > 22 && t < 24) shake = 3;
  c.save();
  c.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // the lab
  const floorY = h * 0.8;
  const wall = c.createLinearGradient(0, 0, 0, floorY);
  wall.addColorStop(0, "#0b100e"); wall.addColorStop(1, "#1d2a24");
  c.fillStyle = wall; c.fillRect(-20, -20, w + 40, floorY + 20);
  c.fillStyle = "#151a19"; c.fillRect(-20, floorY, w + 40, h);
  c.strokeStyle = "rgba(0,0,0,0.4)"; c.lineWidth = 1;
  for (let i = -6; i <= 6; i++) { c.beginPath(); c.moveTo(w / 2 + i * w * 0.08, floorY); c.lineTo(w / 2 + i * w * 0.35, h); c.stroke(); }
  // the tube
  const tx = w * 0.66, tr = s0 * 0.14, th = h * 0.5, top = floorY - th;
  const broken = t >= 24;
  // glow
  const glow = c.createRadialGradient(tx, floorY - th / 2, 10, tx, floorY - th / 2, s0 * 0.7);
  glow.addColorStop(0, `rgba(80,255,140,${broken ? 0.12 : 0.3})`); glow.addColorStop(1, "rgba(80,255,140,0)");
  c.fillStyle = glow; c.fillRect(0, 0, w, h);
  if (!broken) {
    c.fillStyle = "rgba(90,230,140,0.75)";
    c.fillRect(tx - tr, top, tr * 2, th);
    // inside: only the legs at first… then the arms float in, then the body slides in
    c.fillStyle = "rgba(8,30,16,0.85)";
    c.strokeStyle = "rgba(8,30,16,0.85)"; c.lineWidth = tr * 0.16;
    for (const k of [-1, 1]) { c.beginPath(); c.moveTo(tx + k * tr * 0.15, top + th * 0.62); c.lineTo(tx + k * tr * 0.25, top + th * 0.92); c.stroke(); }
    const armsIn = pIn(t, 0.5, 2.8);                                        // the arms float in
    for (const k of [-1, 1]) {
      c.beginPath();
      c.moveTo(tx + k * tr * 0.3, top + th * (0.42 - (1 - armsIn) * 0.5));
      c.quadraticCurveTo(tx + k * tr * 0.7, top + th * (0.5 - (1 - armsIn) * 0.5), tx + k * tr * 0.55, top + th * (0.66 - (1 - armsIn) * 0.5));
      c.stroke();
      const up = (1 - armsIn) * 0.5;                                        // bulging muscles on the arms
      c.beginPath(); c.ellipse(tx + k * tr * 0.5, top + th * (0.46 - up), tr * 0.13, tr * 0.2, k * 0.5, 0, Math.PI * 2); c.fill();   // biceps
      c.beginPath(); c.ellipse(tx + k * tr * 0.6, top + th * (0.58 - up), tr * 0.1, tr * 0.17, k * -0.2, 0, Math.PI * 2); c.fill(); // forearm
    }
    if (t >= 3) {                                                            // the stranger's body slides in
      const b = pIn(t, 3, 5.3);
      c.save(); c.beginPath(); c.rect(tx - tr, top, tr * 2, th); c.clip();
      // a big, dark, bloody body
      const by = lerp(top - th * 0.7, top + th * 0.08, b);
      const bw = tr * 0.85, bh = th * 0.5;
      c.fillStyle = "rgba(48,40,38,0.95)";
      // NO HEAD: just a short neck stump (Dr. Voss still needs a head… yours!)
      c.fillRect(tx - tr * 0.14, by + tr * 0.12, tr * 0.28, tr * 0.3);                               // neck
      c.beginPath();                                                                                // big torso
      c.moveTo(tx - bw * 0.5, by + tr * 0.35);
      c.quadraticCurveTo(tx - bw * 0.62, by + bh * 0.5, tx - bw * 0.42, by + bh);
      c.lineTo(tx + bw * 0.42, by + bh);
      c.quadraticCurveTo(tx + bw * 0.62, by + bh * 0.5, tx + bw * 0.5, by + tr * 0.35);
      c.closePath();
      c.fill();
      c.fillStyle = "rgba(120,8,8,0.9)";                                                            // blood smears
      for (const [ox, oy, rx, ry] of [[-0.15, 0.25, 0.18, 0.08], [0.12, 0.45, 0.14, 0.12], [-0.05, 0.7, 0.2, 0.07], [0.18, 0.15, 0.08, 0.1]]) {
        c.beginPath(); c.ellipse(tx + ox * bw, by + oy * bh, rx * bw, ry * bh, 0.3, 0, Math.PI * 2); c.fill();
      }
      c.beginPath(); c.ellipse(tx, by + tr * 0.13, tr * 0.15, tr * 0.06, 0, 0, Math.PI * 2); c.fill();   // the bloody cut neck
      c.fillStyle = "rgba(200,40,40,0.9)";
      c.beginPath(); c.ellipse(tx, by + tr * 0.13, tr * 0.08, tr * 0.03, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "rgba(120,8,8,0.9)";                                                            // drips down the neck
      for (const k of [-0.08, 0.05]) c.fillRect(tx + k * tr, by + tr * 0.15, tr * 0.03, tr * (0.12 + Math.abs(k)));
      c.strokeStyle = "rgba(150,10,10,0.85)";                                                       // stitches
      c.lineWidth = Math.max(1, tr * 0.03);
      c.beginPath(); c.moveTo(tx, by + tr * 0.4); c.lineTo(tx, by + bh * 0.9);
      for (let k = 1; k < 7; k++) { const sy = by + tr * 0.4 + k * (bh * 0.8 / 7); c.moveTo(tx - tr * 0.06, sy); c.lineTo(tx + tr * 0.06, sy); }
      c.stroke();
      c.fillStyle = "rgba(140,10,10,0.35)";                                                         // blood drifting in the liquid
      for (let k = 0; k < 9; k++) {
        const dx2 = Math.sin(k * 2.7 + time) * tr * 0.7, dy2 = by + bh * (0.2 + (k % 5) * 0.18) - ((time * 0.2 + k * 0.11) % 1) * th * 0.2;
        c.beginPath(); c.ellipse(tx + dx2, dy2, tr * 0.12, tr * 0.06, k, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }
    for (let i = 0; i < 8; i++) {                                            // bubbles
      c.strokeStyle = "rgba(210,255,225,0.6)"; c.lineWidth = 1;
      c.beginPath(); c.arc(tx + Math.sin(i * 3 + time) * tr * 0.6, floorY - ((time * 0.4 + i * 0.13) % 1) * th, 3, 0, Math.PI * 2); c.stroke();
    }
    if (t >= 22) {                                                           // cracks
      c.strokeStyle = "rgba(255,255,255,0.8)"; c.lineWidth = 1.5;
      const n = Math.floor(pIn(t, 22, 24) * 9) + 1;
      for (let i = 0; i < n; i++) {
        let cx2 = tx + Math.sin(i * 7.7) * tr * 0.8, cy2 = top + th * (0.2 + (i * 0.37) % 0.7);
        c.beginPath(); c.moveTo(cx2, cy2);
        for (let k = 0; k < 4; k++) { cx2 += Math.sin(i + k * 2.1) * tr * 0.3; cy2 += Math.cos(i * 3 + k) * th * 0.06; c.lineTo(cx2, cy2); }
        c.stroke();
      }
    }
    c.fillStyle = "rgba(255,255,255,0.12)"; c.fillRect(tx - tr * 0.7, top, tr * 0.15, th);
  } else {
    // shattered! green liquid everywhere, glass flying
    const sp = pIn(t, 24, 25.5);
    c.fillStyle = "rgba(60,200,110,0.5)";
    c.beginPath(); c.ellipse(tx, floorY + 6, tr * (1.5 + sp * 4), tr * (0.3 + sp * 0.6), 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(220,255,235,0.8)";
    for (let i = 0; i < 16; i++) {
      const a = i * 0.39 + 0.2, d = sp * s0 * (0.4 + (i % 4) * 0.25);
      const gx = tx + Math.cos(a * 4) * d, gy = top + th * 0.4 + Math.sin(a * 4) * d * 0.6 + sp * sp * h * 0.3;
      c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx + 8, gy + 3); c.lineTo(gx + 3, gy + 12); c.fill();
    }
  }
  // metal base and lid
  c.fillStyle = "#4a4e52";
  c.fillRect(tx - tr * 1.2, floorY - 10, tr * 2.4, 14);
  if (!broken) c.fillRect(tx - tr * 1.2, top - 10, tr * 2.4, 12);
  // Dr. Voss
  const vx = w * 0.3, H = h * 0.42;
  // (once the monster is out, it grabs Dr. Voss and eats him: he's drawn on top of the monster, below)
  const v = t < 24.6 ? finVoss(c, vx, floorY, H, t, s0) : { headY: floorY - H, r: H * 0.075 };
  // the flying head (into the tube)
  if (t >= 20.3 && t < 23) {
    const q = pIn(t, 20.3, 21.5), q2 = pIn(t, 21.5, 22);
    const hx = lerp(vx, tx, q), hy = lerp(v.headY, top - 20, q) - Math.sin(q * Math.PI) * h * 0.15 + q2 * th * 0.3;
    drawGrinFace(c, hx, hy, v.r * 2.3, S.finale.grinnerSkin, time, true);
  }
  // the knife flying at you, being caught, and flying back
  if (t >= 17.5 && t < 18.5) {
    const q = pIn(t, 17.5, 18.5);
    finKnife(c, lerp(vx + H * 0.22, w / 2, q), lerp(floorY - H * 1.0, h * 0.5, q), lerp(H * 0.14, s0 * 0.9, q * q), q * 9);
  }
  if (t >= 18.5 && t < 19.5) {
    drawCutHand(c, w / 2, h * 0.78, s0 * 0.3, 0, false);
    finKnife(c, w / 2 + s0 * 0.02, h * 0.62, s0 * 0.55, 0);
  }
  if (t >= 19.5 && t < 20.3) {
    const q = pIn(t, 19.5, 20.3);
    finKnife(c, lerp(w / 2, vx, q), lerp(h * 0.6, v.headY + v.r * 1.5, q), lerp(s0 * 0.55, H * 0.12, q), Math.PI / 2 + q * 8);
  }
  // THE MONSTER rises out of the broken tube and comes at you
  if (broken) {
    const g = pIn(t, 24.3, 28);
    const mx = tx - g * (tx - w / 2), mfoot = floorY + g * h * 0.25, mH = h * (0.55 + g * 0.9);
    drawGrinnerBody(c, mx, mfoot, mH, S.finale.grinnerSkin, time);
    // 🍖 IT EATS DR. VOSS: its arm grabs his headless body, lifts him up to its mouth… CHOMP CHOMP CHOMP
    const mouthX = mx, mouthY = mfoot - mH * 0.86 + mH * 0.3 * 0.18;
    const shX2 = mx + mH * 0.12, shY2 = mfoot - mH * 0.68;
    const reach = pIn(t, 24.6, 25.1), lift = pIn(t, 25.1, 25.9), gulp = pIn(t, 25.9, 26.45);
    if (t >= 24.6 && gulp < 1) {
      const waistX = vx, waistY = floorY - H * 0.5;
      const bx = lerp(waistX, mouthX, lift), by = lerp(waistY, mouthY + H * 0.1, lift) - Math.sin(lift * Math.PI) * h * 0.08;
      const sc2 = lerp(1, 0.55, lift) * (1 - gulp);
      c.save();
      c.translate(bx, by);
      c.rotate(lift * -0.9 + gulp * 0.5);
      c.scale(sc2, sc2);
      finVoss(c, 0, H * 0.5, H, 21, s0);                               // his headless body (from just after the knife)
      c.restore();
      if (lift < 1) drawMonsterArm(c, shX2, shY2, lerp(shX2, bx, reach), lerp(shY2, by, reach), s0, reach >= 1);
    }
    if (t >= 25.9 && t < 27.2) {                                         // blood splattering from its mouth
      const sp = pIn(t, 25.9, 27.2);
      c.fillStyle = `rgba(150,8,8,${0.9 * (1 - sp)})`;
      for (let i = 0; i < 14; i++) {
        const a = i * 2.4, d = sp * s0 * (0.08 + (i % 4) * 0.05);
        c.beginPath(); c.arc(mouthX + Math.cos(a) * d, mouthY + Math.sin(a) * d * 0.7 + sp * sp * h * 0.15, s0 * (0.012 + (i % 3) * 0.006), 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = "rgba(120,0,0,0.85)";                                 // dripping down its chin
      for (const k of [-1, 0.3, 1]) c.fillRect(mouthX + k * mH * 0.05, mouthY, mH * 0.012, mH * 0.06 * Math.min(1, sp * 3));
    }
  }
  // …its huge hand reaches down, GRABS your phone out of your hand, pulls back… and THROWS it into the forest
  if (t >= 26.6) {
    const C2 = { reach: pIn(t, 27.0, 27.7), grip: pIn(t, 27.7, 28.0), lift: pIn(t, 28.0, 28.5), fly: pIn(t, 28.5, 30) };
    const ps = s0 * 0.2, homeX = w * 0.5, homeY = h * 0.8;          // where you hold your phone
    const shX = w * 0.68, shY = h * 0.18;                             // the monster's shoulder
    // where its hand is: reaching down to your phone, then pulling up and back, then swinging forward (the throw)
    let hx = lerp(w * 0.85, homeX, C2.reach), hy = lerp(-h * 0.1, homeY - ps * 0.2, C2.reach);
    if (C2.lift > 0) { hx = lerp(homeX, w * 0.9, C2.lift); hy = lerp(homeY - ps * 0.2, h * 0.3, C2.lift); }
    if (C2.fly > 0) { const sw = pIn(t, 28.5, 28.8); hx = lerp(w * 0.9, w * 0.35, sw); hy = lerp(h * 0.3, h * 0.25, sw); }
    const holding = C2.grip >= 1 && C2.fly <= 0;
    // your hand: holding the phone up… then empty, dropping away
    if (C2.grip < 1) {
      drawCutHand(c, homeX, h * 0.95, s0 * 0.3, 0, false);
      drawCutPhone(c, homeX, homeY, ps, 0);
    } else {
      drawCutHand(c, homeX, h * 0.95 + pIn(t, 28.0, 28.6) * h * 0.25, s0 * 0.3, 0, false);
    }
    if (holding) drawCutPhone(c, hx, hy + ps * 0.1, ps, lerp(0, -0.8, C2.lift));
    if (t >= 27.0 && t < 29.6) drawMonsterArm(c, shX, shY, hx, hy, s0, C2.grip > 0.5 && C2.fly <= 0);
    if (C2.fly > 0) {                                                   // the phone flies off into the forest, spinning
      const px = lerp(w * 0.4, -w * 0.15, C2.fly), py = lerp(h * 0.25, h * 0.05, C2.fly) - Math.sin(C2.fly * Math.PI) * h * 0.12;
      drawCutPhone(c, px, py, ps * (1 - C2.fly * 0.8), C2.fly * 18);
    }
  }
  c.restore();
  // speech bubbles and captions
  for (const [a, b, who, text] of S.text.finaleLines) {
    if (t < a || t >= b) continue;
    if ((who === "narr" || who === "run") && !S.bottomTextByMode[mode]) continue;   // no narration on Normal/Hard
    if (who === "voss") speechBubble(c, vx, v.headY - v.r * 2, text, 1, "#e6eef5", "#3a0000");
    else {
      c.font = `600 ${Math.max(15, Math.min(22, w / 22))}px system-ui, sans-serif`;
      c.textAlign = "center";
      const bw = Math.min(w - 32, c.measureText(text).width + 40);
      c.fillStyle = "rgba(0,0,0,0.7)";
      c.fillRect(w / 2 - bw / 2, h - 140, bw, 44);
      c.fillStyle = who === "run" ? "#ff4a4a" : "#f2f2f2";
      c.fillText(text, w / 2, h - 111);
      c.textAlign = "start";
    }
  }
  const fade = Math.max(0, 1 - t / 0.6);
  if (fade > 0) { c.fillStyle = `rgba(0,0,0,${fade})`; c.fillRect(0, 0, w, h); }
}

// The monster's jump scare: the grin rushes at your face
function drawGrinnerScare(time) {
  const c = scareCtx, w = innerWidth, h = innerHeight, t = scare.t, T = S.grinScare.seconds;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = "#000";
  c.fillRect(0, 0, w, h);
  const q = clamp(t / T, 0, 1), k = S.scare.shakeAmount;
  c.save();
  c.translate((Math.random() - 0.5) * k * q * 2, (Math.random() - 0.5) * k * q * 2);
  drawGrinFace(c, w / 2, h * 0.42, Math.min(w, h) * (0.35 + q * q * 1.6), S.finale.grinnerSkin, time);
  c.restore();
  drawStatic(c, w, h, 0.12 + q * 0.15);
  if (t < 0.08) { c.fillStyle = "rgba(255,255,255,0.6)"; c.fillRect(0, 0, w, h); }
}

// Helicopter
function drawHeli(c, x, y, s, time) {
  c.fillStyle = "#0a0c10";
  c.beginPath(); c.ellipse(x, y, s * 0.5, s * 0.22, 0, 0, Math.PI * 2); c.fill();          // body
  c.fillRect(x - s * 1.2, y - s * 0.05, s * 0.8, s * 0.1);                                  // tail
  c.fillRect(x - s * 1.25, y - s * 0.2, s * 0.06, s * 0.3);                                 // tail fin
  c.strokeStyle = "#0a0c10"; c.lineWidth = Math.max(1, s * 0.04);
  c.beginPath(); c.moveTo(x - s * 0.4, y + s * 0.35); c.lineTo(x + s * 0.4, y + s * 0.35); c.stroke();   // skids
  c.beginPath(); c.moveTo(x - s * 0.2, y + s * 0.2); c.lineTo(x - s * 0.25, y + s * 0.35); c.moveTo(x + s * 0.2, y + s * 0.2); c.lineTo(x + s * 0.25, y + s * 0.35); c.stroke();
  const blade = s * 1.1 * Math.abs(Math.cos(time * 40));                                   // spinning rotor
  c.beginPath(); c.moveTo(x - blade, y - s * 0.3); c.lineTo(x + blade, y - s * 0.3); c.stroke();
  c.fillStyle = "#ff3030"; c.fillRect(x - s * 1.22, y - s * 0.22, 3, 3);                   // blinking light
  c.fillStyle = "rgba(150,200,255,0.35)"; c.beginPath(); c.ellipse(x + s * 0.25, y - s * 0.02, s * 0.15, s * 0.1, 0, 0, Math.PI * 2); c.fill();
}

// The airplane at the end: it lands, you climb aboard, and fly away
function drawPlane(c, w, h, t, time) {
  const s = Math.min(w, h);
  if (t < 4) {
    // 1) The plane lands on the field, then you walk up to the door
    const walk = pIn(t, 2.5, 4);                     // walking toward it
    const zoom = 1 + walk * walk * 5;
    const sky = c.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#04060c"); sky.addColorStop(1, "#1a2232");
    c.fillStyle = sky; c.fillRect(0, 0, w, h);
    const groundY = h * 0.72;
    c.fillStyle = "#0e100c"; c.fillRect(0, groundY, w, h);
    for (const tr of cutTrees) { c.fillStyle = `rgb(${tr.dark},${tr.dark + 2},${tr.dark + 6})`; c.fillRect(tr.x * w * 0.4, groundY - h * 0.35, tr.w * w * 0.5 + 2, h * 0.35); }
    const doorX = w * 0.58 - s * 0.75 * 0.4 + s * 0.015;       // zoom in on the plane's door
    c.save();
    c.translate(doorX, groundY);
    c.scale(zoom, zoom);
    c.translate(-doorX, -groundY);
    const land = pIn(t, 0, 2);
    const px = lerp(w * 1.4, w * 0.58, 1 - Math.pow(1 - land, 2)), py = lerp(groundY - h * 0.35, groundY - s * 0.09, land);
    const L = s * 0.75;
    // body
    c.fillStyle = "#d8dce2";
    c.beginPath(); c.ellipse(px, py, L * 0.5, s * 0.06, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(px + L * 0.38, py - s * 0.03); c.lineTo(px + L * 0.55, py - s * 0.17); c.lineTo(px + L * 0.5, py); c.fill();   // tail
    c.fillStyle = "#b8bec8";
    c.beginPath(); c.moveTo(px - L * 0.05, py); c.lineTo(px + L * 0.2, py); c.lineTo(px + L * 0.05, py + s * 0.12); c.lineTo(px - L * 0.12, py + s * 0.12); c.fill();   // wing
    c.fillStyle = "#c0262a"; c.fillRect(px - L * 0.45, py - s * 0.005, L * 0.85, s * 0.012);   // red stripe
    c.fillStyle = "#1b2a3c";
    for (let i = 0; i < 9; i++) c.fillRect(px - L * 0.32 + i * L * 0.07, py - s * 0.028, s * 0.016, s * 0.014);   // windows
    // open door with light, and stairs
    c.fillStyle = "#ffe9b0"; c.fillRect(px - L * 0.4, py - s * 0.04, s * 0.03, s * 0.055);
    if (land >= 1) {
      c.strokeStyle = "#8a8f96"; c.lineWidth = Math.max(1, s * 0.006);
      c.beginPath(); c.moveTo(px - L * 0.385, py + s * 0.015); c.lineTo(px - L * 0.47, groundY); c.stroke();
      c.beginPath(); c.moveTo(px - L * 0.36, py + s * 0.015); c.lineTo(px - L * 0.44, groundY); c.stroke();
      for (let k = 1; k < 6; k++) {
        const q = k / 6;
        c.beginPath(); c.moveTo(lerp(px - L * 0.385, px - L * 0.47, q), lerp(py + s * 0.015, groundY, q));
        c.lineTo(lerp(px - L * 0.36, px - L * 0.44, q), lerp(py + s * 0.015, groundY, q)); c.stroke();
      }
    }
    // blinking lights
    if (Math.sin(time * 6) > 0) { c.fillStyle = "#ff3030"; c.beginPath(); c.arc(px + L * 0.54, py - s * 0.165, 3, 0, Math.PI * 2); c.fill(); }
    c.restore();
    if (walk > 0.7) { c.fillStyle = `rgba(0,0,0,${(walk - 0.7) / 0.3})`; c.fillRect(0, 0, w, h); }
    planeCaption(c, w, h, S.text.planeWaiting);
  } else {
    // 2) Looking out the airplane window as you fly away
    const q = pIn(t, 4, 7.5);
    c.fillStyle = "#2a2d33"; c.fillRect(0, 0, w, h);                        // cabin wall
    const ww = Math.min(w * 0.7, h * 0.45), wh = ww * 1.3, wx = w / 2 - ww / 2, wy = h * 0.38 - wh / 2;
    c.save();
    c.beginPath(); c.roundRect(wx, wy, ww, wh, ww * 0.35); c.clip();
    const sky = c.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, "#0a1020"); sky.addColorStop(1, "#24304a");
    c.fillStyle = sky; c.fillRect(wx, wy, ww, wh);
    c.fillStyle = "#d4dae6"; c.beginPath(); c.arc(wx + ww * 0.75, wy + wh * 0.2, ww * 0.07, 0, Math.PI * 2); c.fill();   // moon
    // the forest far below, shrinking away
    const gy = wy + wh * lerp(0.55, 1.1, q);
    c.fillStyle = "#0b120c"; c.fillRect(wx, gy, ww, wh);
    for (let i = 0; i < 40; i++) {
      const tx = wx + ((i * 37.7) % 100) / 100 * ww, ts = ww * 0.03 * (1 - q * 0.6);
      c.fillStyle = "#07100a"; c.beginPath(); c.moveTo(tx, gy - ts * 2); c.lineTo(tx - ts, gy + ts); c.lineTo(tx + ts, gy + ts); c.fill();
    }
    if (Math.random() > 0.1) {                                               // the hospital's red cross, tiny
      c.fillStyle = "#ff3020";
      const cx = wx + ww * 0.4, cs = ww * 0.03 * (1 - q * 0.7);
      c.fillRect(cx - cs / 6, gy - cs, cs / 3, cs); c.fillRect(cx - cs / 2, gy - cs * 0.66, cs, cs / 3);
    }
    // clouds rushing past
    c.fillStyle = "rgba(200,210,225,0.25)";
    for (let i = 0; i < 6; i++) {
      const cx = wx + ww * (1.3 - ((time * 0.35 + i * 0.27) % 1.6)), cy = wy + wh * (0.35 + (i % 3) * 0.15 + q * 0.1);
      c.beginPath(); c.ellipse(cx, cy, ww * 0.25, ww * 0.06, 0, 0, Math.PI * 2); c.fill();
    }
    c.restore();
    c.strokeStyle = "#555a62"; c.lineWidth = ww * 0.06;                      // window frame
    c.beginPath(); c.roundRect(wx, wy, ww, wh, ww * 0.35); c.stroke();
    const fade = Math.max(0, 1 - (t - 4) / 0.6);
    if (fade > 0) { c.fillStyle = `rgba(0,0,0,${fade})`; c.fillRect(0, 0, w, h); }
    planeCaption(c, w, h, S.text.planeFlying);
  }
}
function planeCaption(c, w, h, text) {
  if (!S.bottomTextByMode[mode]) return;              // no narration on Normal/Hard
  c.font = `600 ${Math.max(15, Math.min(22, w / 22))}px system-ui, sans-serif`;
  c.textAlign = "center";
  const lines = text.split("\n"), lh = 28;
  c.fillStyle = "rgba(0,0,0,0.65)";
  c.fillRect(16, h - 150, w - 32, lines.length * lh + 16);
  c.fillStyle = "#f2f2f2";
  lines.forEach((ln, i) => c.fillText(ln, w / 2, h - 150 + 30 + i * lh));
  c.textAlign = "start";
}

// The win: helicopters shoot all the monsters, 8.3 billion subscribers
function drawWin(time) {
  const c = cutCtx, w = innerWidth, h = innerHeight, t = winT;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (t >= S.finale.planeAt) { drawPlane(c, w, h, t - S.finale.planeAt, time); return; }
  const sky = c.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#03050a"); sky.addColorStop(0.7, "#121a28"); sky.addColorStop(1, "#06070a");
  c.fillStyle = sky; c.fillRect(0, 0, w, h);
  for (const tr of cutTrees) { c.fillStyle = `rgb(${tr.dark},${tr.dark + 2},${tr.dark + 6})`; c.fillRect(tr.x * w, h * 0.25, tr.w * w + 4, h * 0.55); }
  const groundY = h * 0.8;
  c.fillStyle = "#0c0d0a"; c.fillRect(0, groundY, w, h);
  const heli = [[0.2, 0.13], [0.5, 0.09], [0.8, 0.15]].map(([px, py], i) => [lerp(-0.3 - i * 0.2, px, pIn(t, 0, 2 + i * 0.3)) * w, (py + Math.sin(time * 2 + i) * 0.01) * h]);
  const targets = [[w * 0.22, groundY - h * 0.15], [w * 0.5, groundY - h * 0.2], [w * 0.8, groundY - h * 0.08]];
  // searchlights
  heli.forEach(([hx, hy], i) => {
    const [gx] = targets[i];
    c.fillStyle = "rgba(255,250,210,0.08)";
    c.beginPath(); c.moveTo(hx, hy); c.lineTo(gx - w * 0.1, groundY); c.lineTo(gx + w * 0.1, groundY); c.fill();
  });
  // the monsters (they fall when they're shot)
  const fall = pIn(t, 4.5, 5.5), alive = 1 - fall;
  if (alive > 0) {
    c.save(); c.globalAlpha = alive;
    drawGhostWoman(c, targets[0][0], groundY + fall * 20, h * 0.3, 0.9, time);
    drawGrinnerBody(c, targets[1][0], groundY + fall * 30, h * 0.4, S.finale.grinnerSkin, time);
    c.restore();
    drawSpiderSil(c, targets[2][0], groundY, h * 0.12, alive);
  }
  // gunfire!
  if (t >= 2 && t < 4.6) {
    heli.forEach(([hx, hy], i) => {
      const [gx, gy] = targets[i];
      c.strokeStyle = "rgba(255,220,90,0.9)"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(hx + 10, hy + 8);
      c.lineTo(gx + (Math.random() - 0.5) * 40, gy + (Math.random() - 0.5) * 60); c.stroke();
      c.fillStyle = "rgba(255,240,180,0.9)"; c.beginPath(); c.arc(hx + 12, hy + 8, 4 + Math.random() * 5, 0, Math.PI * 2); c.fill();
      if (Math.random() < 0.5) { c.fillStyle = "rgba(255,255,255,0.7)"; c.beginPath(); c.arc(gx + (Math.random() - 0.5) * 50, gy + (Math.random() - 0.5) * 60, 6 + Math.random() * 10, 0, Math.PI * 2); c.fill(); }
    });
  }
  heli.forEach(([hx, hy]) => drawHeli(c, hx, hy, Math.min(w, h) * 0.09, time));
  // the subscriber counter shoots up
  const subs = Math.round(lerp(winSubsStart, S.finale.winSubscribers, 1 - Math.pow(1 - pIn(t, 2, 6), 3)));
  c.textAlign = "center";
  c.fillStyle = "#fff";
  c.font = `bold ${Math.max(18, Math.min(34, w / 16))}px system-ui, sans-serif`;
  c.fillText("👥 " + subs.toLocaleString(), w / 2, h * 0.3);
  if (t > 5.5) {
    c.fillStyle = "#ffd84a";
    c.font = `900 ${Math.max(20, Math.min(44, w / 12))}px system-ui, sans-serif`;
    c.fillText(S.text.winBig, w / 2, h * 0.37);
  }
  c.textAlign = "start";
}

//  CUTSCENE: climbing down into the basement… and dropping the key

let hatchT = 0, hatchSoundsDone = 0;
const hatchEvents = [
  [0.1, () => playCreak()],
  [0.9, () => playStep()], [1.4, () => playStep()], [1.9, () => playStep()], [2.4, () => playStep()],
  [2.9, () => sfxTone("triangle", 2400, 1800, 0.12, 0.25)],              // the key slips…
  [3.4, () => sfxTone("triangle", 2200, 2000, 0.08, 0.2)],              // clink
  [3.7, () => sfxTone("triangle", 2000, 1900, 0.06, 0.15)],             // clink
  [3.9, () => sfxTone("triangle", 1900, 1850, 0.05, 0.1)]               // clink…
];

function startHatchCutscene() {
  state = "hatchCut";
  hatchT = 0;
  hatchSoundsDone = 0;
  phoneUp = false;
  flashlightOn = false;
  flashPower = 0;
  recordingOn = false;
  held.fwd = held.back = held.left = held.right = held.sprint = false;
  $("phone").classList.add("down");
  cutCv.classList.remove("hidden");
  $("btnSkip").classList.remove("hidden");
}

// After the cutscene: you're in the cave, and your key is somewhere in the dark
function endHatchCutscene() {
  if (state !== "hatchCut") return;
  cutCv.classList.add("hidden");
  $("btnSkip").classList.add("hidden");
  state = "playing";
  enterBasement();
  dropKey();
  atHatch = true;                  // you're standing on the ladder: don't trigger it right away
  showToast(S.text.keyDropped, 5);
  // "Welcome…" — something in the dark greets you (only this first time down)
  if (S.spider.welcomeVoice) setTimeout(() => { if (player.level === 0) playVoice("welcome", S.spider.welcomeVolume); }, 700);
  spiderVoiceTimer = 6;            // and give it a moment before the spider sounds start
}

function enterBasement() {
  player.level = 0;
  player.floorZ = -S.hospital.ceilingHeight;
  hospital.hatchOpen = true;
  reachCheckpoint(2);
  flashlightOn = false;            // it dies down here
}

// The key falls somewhere in the cave (not right next to the ladder)
function dropKey() {
  hasKey = false;
  keyHeld = false;
  hospital.keyDropped = true;
  $("btnKey").classList.add("hidden");
  const bb = hospital.bb, h = hospital.hatch;
  let kx = h.x, ky = h.y;
  for (let tries = 0; tries < 30; tries++) {
    const a = Math.random() * Math.PI * 2, d = S.hospital.keyDropMin + Math.random() * (S.hospital.keyDropMax - S.hospital.keyDropMin);
    kx = clamp(h.x + Math.cos(a) * d, bb.x0 + 2, bb.x1 - 2);
    ky = clamp(h.y + Math.sin(a) * d, bb.y0 + 2, bb.y1 - 2);
    if (Math.hypot(kx - h.x, ky - h.y) > S.hospital.keyDropMin * 0.8) break;
  }
  hospital.lostKey = { kind: "lostKey", x: kx, y: ky, fz: -S.hospital.ceilingHeight };
}

function drawHatchCutscene(time) {
  const c = cutCtx, w = innerWidth, h = innerHeight, t = hatchT;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min(w, h);
  if (t < 0.9) {
    // looking down at the bloody hatch as it creaks open
    c.fillStyle = "#1a1c1b"; c.fillRect(0, 0, w, h);
    const open = pIn(t, 0, 0.8);
    const hw = s * 0.6, hx = w / 2 - hw / 2, hy = h * 0.35;
    c.fillStyle = "#000"; c.fillRect(hx, hy, hw, hw);
    c.save();
    c.translate(hx, hy + hw);
    c.scale(1, 1 - open * 0.92);
    c.fillStyle = "#3a3c3e"; c.fillRect(0, -hw, hw, hw);
    c.fillStyle = "#5c0909";
    c.beginPath(); c.ellipse(hw * 0.4, -hw * 0.5, hw * 0.25, hw * 0.14, 0.4, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(hw * 0.7, -hw * 0.3, hw * 0.1, hw * 0.08, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  } else {
    // climbing down: rungs slide up past you, it gets darker and darker
    const down = pIn(t, 0.9, 2.8);
    c.fillStyle = "#050505"; c.fillRect(0, 0, w, h);
    const lx = w / 2;
    c.fillStyle = "#3a3d40";
    c.fillRect(lx - s * 0.32, 0, s * 0.05, h);
    c.fillRect(lx + s * 0.27, 0, s * 0.05, h);
    const spacing = h * 0.22, off = (t * h * 0.35) % spacing;
    for (let y = -spacing + off; y < h + spacing; y += spacing) c.fillRect(lx - s * 0.3, y, s * 0.6, s * 0.035);
    // light from the hatch above fades away
    const lightA = 0.35 * (1 - down);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, `rgba(200,220,210,${lightA})`); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // your hands on the ladder (one holding the key)
    // climbing hand over hand: one hand moves down the rail while the other holds on
    const climb = Math.sin(t * 4.2) * h * 0.08;
    const railL = lx - s * 0.295, railR = lx + s * 0.295;
    drawRailGrip(c, railL, h * 0.58 + climb, s * 0.3, false);
    if (t < 2.9) {
      drawRailGrip(c, railR, h * 0.58 - climb, s * 0.3, true);
      finKeyIcon(c, railR + s * 0.12, h * 0.58 - climb + s * 0.02, s * 0.15, -0.3);   // the key, pinched against the rail
    } else {
      // the key slips out of your hand and falls into the dark…
      const q = pIn(t, 2.9, 3.6);
      drawRailGrip(c, railR, h * 0.6, s * 0.3, true);
      if (q < 1) finKeyIcon(c, railR + s * 0.12 + q * s * 0.1, h * 0.6 + q * q * h * 0.5, s * 0.15 * (1 - q * 0.6), -0.3 + q * 6);
    }
    if (t > 3.6) { c.fillStyle = `rgba(0,0,0,${pIn(t, 3.6, 4.4)})`; c.fillRect(0, 0, w, h); }
  }
  // captions
  const text = t < 2.9 ? S.text.hatchCut1 : S.text.hatchCut2;
  if (!S.bottomTextByMode[mode]) return;              // no narration on Normal/Hard
  c.font = `600 ${Math.max(15, Math.min(22, w / 22))}px system-ui, sans-serif`;
  c.textAlign = "center";
  const bw = Math.min(w - 32, c.measureText(text).width + 40);
  c.fillStyle = "rgba(0,0,0,0.7)";
  c.fillRect(w / 2 - bw / 2, h - 140, bw, 44);
  c.fillStyle = t < 2.9 ? "#f2f2f2" : "#ff5a4a";
  c.fillText(text, w / 2, h - 111);
  c.textAlign = "start";
}

// a small gold "Da key" for cutscenes
function finKeyIcon(c, x, y, s, ang) {
  c.save();
  c.translate(x, y);
  c.rotate(ang);
  c.fillStyle = "#d8b450";
  c.strokeStyle = "#3a2a08";
  c.lineWidth = Math.max(1, s * 0.03);
  c.beginPath();
  c.ellipse(-s * 0.55, 0, s * 0.22, s * 0.27, 0, 0, Math.PI * 2);
  c.ellipse(-s * 0.55, 0, s * 0.1, s * 0.15, 0, 0, Math.PI * 2, true);
  c.fill("evenodd"); c.stroke();
  c.fillRect(-s * 0.35, -s * 0.08, s * 1.0, s * 0.16);
  c.fillRect(s * 0.35, s * 0.08, s * 0.12, s * 0.16);
  c.fillRect(s * 0.1, s * 0.08, s * 0.12, s * 0.18);
  c.restore();
}

}

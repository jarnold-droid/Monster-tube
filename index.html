const keyMap = { shift: "sprint", w: "fwd", arrowup: "fwd", s: "back", arrowdown: "back", a: "left", arrowleft: "left", d: "right", arrowright: "right" };
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (keyMap[k]) { held[keyMap[k]] = true; e.preventDefault(); }
  if (k === " ") e.preventDefault();
  if (e.repeat) return;
  if (state === "intro" && (k === "enter" || k === " ")) { startCutscene(); return; }
  if (state === "finale" && finCatch.active && (k === " " || k === "enter")) { catchKnife(); return; }
  if (state === "cutscene" && (k === "escape" || k === "enter" || k === " ")) { endCutscene(); return; }
  if (k === "escape") { if (state === "playing") pauseGame(); else resumeGame(); }
  if (k === "k") toggleKey();
  if (k === "c") toggleCrouch();
  if (k === " ") doJump();
  if (k === "p") togglePhone();
  if (k === "f") toggleFlashlight();
  if (k === "r") toggleRecording();
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  if (keyMap[k]) held[keyMap[k]] = false;
});
window.addEventListener("blur", () => { held.fwd = held.back = held.left = held.right = held.sprint = false; });

// ==========================================================
//  UI — update the HUD and the phone's top bar
// ==========================================================
const signalBars = document.querySelectorAll("#signal i");

function updateUI() {
  $("subs").textContent = S.text.subsIcon + subscribers.toLocaleString() + S.text.subsLabel;
  if (pendingClips > 0) {
    $("upload").textContent = signal >= S.upload.barsNeeded
      ? S.text.uploading + Math.floor((uploadTimer / S.upload.secondsPerClip) * 100) + "%"
      : S.text.waitingForSignal;
  } else {
    $("upload").textContent = "";
  }

  const inHospital = inHospitalNow();
  $("areaName").textContent = !inHospital ? S.text.areaName
    : player.level === 0 ? S.text.hospitalArea0
    : player.level === 2 && !onStairs ? S.text.hospitalArea2 : S.text.hospitalArea;
  // Legs: how many you have, and (on Easy) where the nearest one is
  let legText = S.text.legsLabel + legsFound + "/" + legs.length;
  const hint = S.legHintsByMode[mode];
  if (hint !== "none" && legsFound < legs.length) {
    let best = null, bestD = Infinity;
    for (const leg of legs) {
      const dd = Math.hypot(leg.x - player.x, leg.y - player.y);
      if (!leg.got && dd < bestD) { best = leg; bestD = dd; }
    }
    legText += S.text.legNearest + Math.round(bestD) + S.text.hospitalSteps + (hint === "highlight" ? arrowTo(best.x, best.y) : "");
  }
  if (hospital && hospital.legsGiven) legText = S.text.legsGivenLabel;
  if (hasKey) legText += S.text.keyLabel;
  if (boots) legText += S.text.bootsLabel;
  if (hospital && hospital.lostKey) {
    legText += S.text.lostKeyLabel;
    const kh = S.legHintsByMode[mode];
    if (player.level === 0 && kh !== "none") {
      const lk = hospital.lostKey;
      legText += " " + Math.round(Math.hypot(lk.x - player.x, lk.y - player.y)) + S.text.hospitalSteps + (kh === "highlight" ? arrowTo(lk.x, lk.y) : "");
    }
  }
  if (hospital && (player.level === 0 || armsFound > 0)) {
    legText += S.text.armsLabel + armsFound + "/" + hospital.arms.length;
    const ah = S.legHintsByMode[mode];
    if (player.level === 0 && ah !== "none" && armsFound < hospital.arms.length) {
      let best = null, bestD = Infinity;
      for (const a of hospital.arms) {
        const dd = Math.hypot(a.x - player.x, a.y - player.y);
        if (!a.got && dd < bestD) { best = a; bestD = dd; }
      }
      legText += S.text.legNearest + Math.round(bestD) + S.text.hospitalSteps + (ah === "highlight" ? arrowTo(best.x, best.y) : "");
    }
  }
  $("btnCrouch").classList.toggle("on", crouching);
  $("btnKey").classList.toggle("on", keyHeld);
  if (finale === "chase") {
    const mark = (v) => (v >= S.finale.filmSeconds ? "✅" : Math.floor((v / S.finale.filmSeconds) * 100) + "%");
    legText = S.text.filmLabel + "👹 " + mark(filmed.grinner) + " · 👻 " + mark(filmed.ghost) + " · 🕷 " + mark(filmed.spider);
  }
  $("legsInfo").textContent = state === "start" || !hospital ? "" : legText;

  if (hospital && !inHospital && finale !== "chase") {
    const dx = hospital.doorX - player.x, dy = hospital.doorY - player.y;
    const rel = angleDiff(Math.atan2(dy, dx) / DEG, player.angle);
    const arrow = ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"][Math.round(((rel + 360) % 360) / 45) % 8];
    $("hospitalMarker").textContent = S.text.hospitalMarker + Math.round(Math.hypot(dx, dy)) + S.text.hospitalSteps + arrow;
  } else {
    $("hospitalMarker").textContent = "";
  }

  $("battery").textContent = S.text.batteryIcon + Math.ceil(battery) + "%";
  $("battery").classList.toggle("low", battery < 20);
  signalBars.forEach((bar, i) => bar.classList.toggle("on", i < signal));
  $("recDot").classList.toggle("on", recordingOn);

  $("dangerFill").style.height = danger + "%";
  $("dangerFill").style.background = `hsl(${120 - danger * 1.2}, 85%, 50%)`;
  $("dangerMeter").classList.toggle("warn", state === "playing" && danger >= S.danger.warningAt);

  $("btnPhone").classList.toggle("on", phoneUp);
  $("btnSprint").classList.toggle("on", sprinting);
  $("sprintFill").style.width = stamina + "%";
  $("sprintBox").classList.toggle("tired", tired);
  $("sprintLabel").textContent = tired ? S.text.tiredLabel : S.text.sprintLabel;
  $("btnLight").classList.toggle("on", flashlightOn);
  $("btnRec").classList.toggle("on", recordingOn);

  $("caption").textContent = state === "playing" && S.bottomTextByMode[mode] ? captionText : "";

  $("clipBox").classList.toggle("hidden", !(state === "playing" && clipTimer > 0));
  $("clipFill").style.width = (clipTimer / S.clip.secondsNeeded) * 100 + "%";
}

// ==========================================================
//  DRAWING THE 3D FOREST
//  (each tree is a flat picture that gets smaller when far away)
// ==========================================================

// Mix a color with the fog. base = [r,g,b], light = brightness, fogAmt = 0..1
function shade(base, light, fogAmt, fog) {
  const r = lerp(base[0] * light, fog[0], fogAmt);
  const g = lerp(base[1] * light, fog[1], fogAmt);
  const b = lerp(base[2] * light, fog[2], fogAmt);
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

function renderScene(c, w, h, o) {
  const horizon = h * 0.5 + (o.bob || 0);
  const focal = (w / 2) / Math.tan((o.fov / 2) * DEG);
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  let fog = o.fog;
  const fogCss = `rgb(${fog[0]},${fog[1]},${fog[2]})`;

  // Are you inside the hospital?
  const inside = inHospitalNow();
  // Which floor are we drawing? base = height of that floor. eye = your eyes above it.
  const upstairs = inside && player.floorZ >= S.hospital.ceilingHeight / 2;
  const basement = inside && player.level === 0;
  const base = basement ? -S.hospital.ceilingHeight : upstairs ? S.hospital.ceilingHeight : 0;
  if (basement) fog = S.hospital.caveFogColor;       // dark brown cave air
  const eye = eyeH() + player.floorZ - base;
  if (inside) {
    // Ceiling above, dirty tiled floor below (or rock and dirt in the cave)
    const L = S.hospital, amb = o.ambient * L.insideLight * 2;
    const ceilColor = basement ? L.caveCeilingColor : L.ceilingColor, floorColor = basement ? L.caveFloorColor : L.floorColor;
    c.fillStyle = shade(ceilColor, amb, 0, fog);
    c.fillRect(0, 0, w, horizon);
    const floor = c.createLinearGradient(0, horizon, 0, h);
    floor.addColorStop(0, shade(floorColor, amb * 0.3, 0, fog));
    floor.addColorStop(1, shade(floorColor, amb * 1.2, 0, fog));
    c.fillStyle = floor;
    c.fillRect(0, horizon, w, h - horizon);
  } else {
    // Sky: black at the top, misty at the horizon
    const sky = c.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, "#020308");
    sky.addColorStop(0.65, "#080c15");
    sky.addColorStop(1, fogCss);
    c.fillStyle = sky;
    c.fillRect(0, 0, w, horizon);

    // Stars
    for (const st of stars) {
      const rel = angleDiff(st.a, player.angle);
      if (Math.abs(rel) > o.fov / 2) continue;
      const twinkle = 0.6 + 0.4 * Math.sin(o.time * 2 + st.a);
      c.fillStyle = `rgba(220,228,255,${st.b * 0.55 * twinkle})`;
      c.fillRect(w / 2 + Math.tan(rel * DEG) * focal, horizon * (1 - st.e) * 0.9, 1.2, 1.2);
    }

    // Moon with a hazy glow
    const moonRel = angleDiff(S.forest.moonAngle, player.angle);
    if (Math.abs(moonRel) < o.fov / 2 + 15) {
      const mx = w / 2 + Math.tan(moonRel * DEG) * focal, my = horizon * 0.3;
      const mr = Math.max(8, w * 0.03);
      const halo = c.createRadialGradient(mx, my, mr, mx, my, mr * 8);
      halo.addColorStop(0, "rgba(170,185,215,0.25)");
      halo.addColorStop(1, "rgba(170,185,215,0)");
      c.fillStyle = halo;
      c.fillRect(mx - mr * 8, my - mr * 8, mr * 16, mr * 16);
      c.fillStyle = "#d4dae6";
      c.beginPath();
      c.arc(mx, my, mr, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = "rgba(120,130,150,0.35)";
      c.beginPath(); c.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.25, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(mx + mr * 0.35, my + mr * 0.3, mr * 0.18, 0, Math.PI * 2); c.fill();
    }

    // Ground: misty far away, dark dirt up close
    const gl = o.ambient * 1.6;
    const ground = c.createLinearGradient(0, horizon, 0, h);
    ground.addColorStop(0, fogCss);
    ground.addColorStop(0.12, `rgb(${Math.round(14 * gl)},${Math.round(15 * gl)},${Math.round(13 * gl)})`);
    ground.addColorStop(1, `rgb(${Math.round(34 * gl)},${Math.round(30 * gl)},${Math.round(24 * gl)})`);
    c.fillStyle = ground;
    c.fillRect(0, horizon, w, h - horizon);
  }
  if (flashPower > 0) {
    c.globalAlpha = flashPower;
    const fl = c.createRadialGradient(w / 2, h * 0.82, 10, w / 2, h * 0.82, w * 0.55);
    fl.addColorStop(0, "rgba(255,228,180,0.28)");
    fl.addColorStop(1, "rgba(255,228,180,0)");
    c.fillStyle = fl;
    c.fillRect(0, horizon, w, h - horizon);
    c.globalAlpha = 1;
  }

  // How bright something is: moonlight + flashlight
  function lightAt(sx, z) {
    let light = inside ? o.ambient * (basement ? S.hospital.basementLight : S.hospital.insideLight + S.hospital.workingLightBoost) : o.ambient;
    if (flashPower > 0) {
      const cone = Math.max(0, 1 - Math.abs(sx - w / 2) / (w * 0.5));
      light += S.look.flashlightStrength * flashPower * cone * cone / (1 + z * z * 0.012);
    }
    return light;
  }
  const fogAt = (z) => Math.pow(clamp(z / o.fogDist, 0, 1), 0.7);
  // ----- Drawing the hospital's walls in 3D -----
  function toCam(x, y, hgt) {
    const dx = x - player.x, dy = y - player.y;
    return { s: -dx * fy + dy * fx, z: dx * fx + dy * fy, h: hgt - base };
  }
  // Draw a flat 4-sided shape in 3D (cut off the part behind you)
  function quad(pts, color) {
    const near = 0.2, out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      if (p.z >= near) out.push(p);
      if ((p.z >= near) !== (q.z >= near)) {
        const t = (near - p.z) / (q.z - p.z);
        out.push({ s: p.s + (q.s - p.s) * t, z: near, h: p.h + (q.h - p.h) * t });
      }
    }
    if (out.length < 3) return false;
    c.fillStyle = color;
    c.beginPath();
    out.forEach((p, i) => {
      const X = w / 2 + (p.s / p.z) * focal;
      const Y = horizon + ((eye - p.h) * focal) / p.z;
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    });
    c.closePath();
    c.fill();
    return true;
  }
  // A rectangle on a wall piece: u = left/right (0 to 1), h = height
  function wallRect(seg, u0, u1, h0, h1, out) {
    const ox = seg.nx * out, oy = seg.ny * out;
    const ax = lerp(seg.ax, seg.bx, u0) + ox, ay = lerp(seg.ay, seg.by, u0) + oy;
    const bx = lerp(seg.ax, seg.bx, u1) + ox, by = lerp(seg.ay, seg.by, u1) + oy;
    return [toCam(ax, ay, h0), toCam(bx, by, h0), toCam(bx, by, h1), toCam(ax, ay, h1)];
  }
  function drawWall(seg) {
    const L = S.hospital;
    if (seg.cave) {
      // a rocky cave wall with lumps and a jagged top
      const mc2 = toCam(seg.mx, seg.my, 0), zc2 = Math.max(0.3, mc2.z);
      const light2 = lightAt(clamp(w / 2 + (mc2.s / zc2) * focal, 0, w), zc2) * seg.shade * seg.tone, fa2 = fogAt(zc2);
      const top2 = base + L.ceilingHeight;
      const pts = [wallRect(seg, 0, 0, base, base, -0.01)[0], wallRect(seg, 1, 1, base, base, -0.01)[0]];
      for (let k = 4; k >= 0; k--) pts.push(wallRect(seg, k / 4, k / 4, top2 - seg.jag[k], top2 - seg.jag[k], -0.01)[0]);
      quad(pts, shade(L.caveRockColor, light2, fa2, fog));
      for (const lp of seg.lumps) {
        const lu = lp.r / seg.len, lh = base + lp.h;
        quad([wallRect(seg, lp.u - lu, lp.u - lu, lh, lh, -0.03)[0], wallRect(seg, lp.u, lp.u, lh - lp.r * 0.8, lh - lp.r * 0.8, -0.03)[0],
              wallRect(seg, lp.u + lu, lp.u + lu, lh, lh, -0.03)[0], wallRect(seg, lp.u, lp.u, lh + lp.r * 0.7, lh + lp.r * 0.7, -0.03)[0]],
             shade(L.caveRockColor, light2 * lp.tone, fa2, fog));
      }
      return;
    }
    const side = inside ? -1 : 1;                       // details go on the side you're looking at
    const bottom = base, top = inside ? base + L.ceilingHeight : L.height;
    const color = inside ? L.insideWallColor : L.wallColor;
    const mc = toCam(seg.mx, seg.my, 0), zc = Math.max(0.3, mc.z);
    const sxc = clamp(w / 2 + (mc.s / zc) * focal, 0, w);
    const light = lightAt(sxc, zc) * seg.shade, fa = fogAt(zc);
    const dw = L.doorWidth / seg.len / 2;
    const doorway = seg.hasDoor && inside && base === 0;   // the door is on the ground floor

    if (doorway) {
      // Wall around the open doorway, so you can see outside
      quad(wallRect(seg, 0, 0.5 - dw, bottom, top, 0), shade(color, light, fa, fog));
      quad(wallRect(seg, 0.5 + dw, 1, bottom, top, 0), shade(color, light, fa, fog));
      quad(wallRect(seg, 0.5 - dw, 0.5 + dw, L.doorHeight, top, 0), shade(color, light, fa, fog));
      // The dark night outside the doorway
      quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0.9, L.doorHeight, 0), "#0c111b");
      quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, 0.9, 0), "#090a08");
    } else {
      quad(wallRect(seg, 0, 1, bottom, top, 0), shade(color, light, fa, fog));
      if (inside) quad(wallRect(seg, 0, 1, bottom, bottom + 1.2, side * 0.01), shade([88, 104, 96], light, fa, fog));  // tiles
      else quad(wallRect(seg, 0, 1, 0, 0.7, 0.01), shade([40, 42, 36], light, fa, fog));                             // dirt
    }

    // Windows (inside you only see the ones on your floor)
    for (const [h0, h1] of L.windowFloors) {
      if (seg.hasDoor && !(inside && base > 0)) continue;
      if (h0 < bottom || h1 > top) continue;
      const glow = !inside && seg.glow && h0 > 3 && Math.random() > 0.03;
      quad(wallRect(seg, 0.28, 0.72, h0, h1, side * 0.02), glow ? shade([150, 160, 110], 1, fa * 0.6, fog) : shade([9, 11, 13], 1, fa, fog));
      quad(wallRect(seg, 0.49, 0.51, h0, h1, side * 0.03), shade(color, light * 0.7, fa, fog));
    }

    if (seg.hasDoor && !inside) {
      if (hospital.doorOpen) {
        quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, L.doorHeight, 0.02), "#020203");   // dark doorway
      } else {
        quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, L.doorHeight, 0.02), shade([34, 36, 38], light, fa, fog));
        quad(wallRect(seg, 0.5 - 0.01, 0.5 + 0.01, 0, L.doorHeight, 0.03), shade([12, 12, 12], 1, fa, fog));
      }
      if (Math.sin(o.time * 4) > 0) {   // blinking red light
        c.save();
        c.shadowColor = "#ff0000";
        c.shadowBlur = 14;
        quad(wallRect(seg, 0.46, 0.54, L.doorHeight + 0.3, L.doorHeight + 0.6, 0.03), "#ff2a1a");
        c.restore();
      }
      // Sign with the hospital's name
      const signLow = L.doorHeight + 0.9, signHigh = L.doorHeight + 1.8;
      quad(wallRect(seg, 0.05, 0.95, signLow, signHigh, 0.02), shade([190, 190, 178], light, fa, fog));
      // Flickering red cross near the roof
      if (Math.random() > 0.08) {
        const crossTop = L.height - 0.5, crossBottom = signHigh + 0.8, mid = (crossTop + crossBottom) / 2, arm = (crossTop - crossBottom) / 6;
        const crossW = (crossTop - crossBottom) / 6 / seg.len;
        c.save();
        c.shadowColor = "#ff0000";
        c.shadowBlur = 18;
        const red = shade([230, 30, 25], 1, fa * 0.5, fog);
        quad(wallRect(seg, 0.5 - crossW, 0.5 + crossW, crossBottom, crossTop, 0.03), red);
        quad(wallRect(seg, 0.5 - crossW * 3, 0.5 + crossW * 3, mid - arm, mid + arm, 0.03), red);
        c.restore();
      }
      const sc = toCam(seg.mx + seg.nx * 0.03, seg.my + seg.ny * 0.03, (signLow + signHigh) / 2);
      if (sc.z > 1) {
        const px = focal / sc.z;
        const size = Math.min(0.55 * px, (seg.len * 0.8 * px) / (S.text.hospitalName.length * 0.62));
        c.fillStyle = shade([25, 30, 40], 1, fa, fog);
        c.font = `bold ${Math.max(1, size)}px sans-serif`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText(S.text.hospitalName, w / 2 + (sc.s / sc.z) * focal, horizon + (eye - sc.h) * px);
        c.textAlign = "start";
        c.textBaseline = "alphabetic";
      }
    }
  }

  // ----- The stairs -----
  // A point on the stairs: along = up the stairs, across = away from the wall, hgt = height
  function stairPt(along, across, hgt) {
    const st = hospital.stairs;
    return toCam(st.x0 + st.ux * along + st.ix * across, st.y0 + st.uy * along + st.iy * across, hgt);
  }
  function drawStairs(withSide) {
    const st = hospital.stairs, L = S.hospital, H = L.ceilingHeight, N = L.stairSteps;
    const steps = [];
    for (let k = 0; k < N; k++) {
      const a0 = (st.len * k) / N, a1 = (st.len * (k + 1)) / N;
      const mid = stairPt((a0 + a1) / 2, st.wid / 2, 0);
      steps.push({ a0, a1, top: (H * (k + 1)) / N, z: mid.z, s: mid.s });
    }
    steps.sort((p, q) => Math.hypot(q.z, q.s) - Math.hypot(p.z, p.s));   // far steps first
    for (const sp of steps) {
      const zc = Math.max(0.3, sp.z), light = lightAt(clamp(w / 2 + (sp.s / zc) * focal, 0, w), zc);
      // front of the step
      quad([stairPt(sp.a0, 0, sp.top - H / N), stairPt(sp.a0, st.wid, sp.top - H / N),
            stairPt(sp.a0, st.wid, sp.top), stairPt(sp.a0, 0, sp.top)], shade(L.stairColor, light * 0.6, 0, fog));
      // top of the step
      quad([stairPt(sp.a0, 0, sp.top), stairPt(sp.a0, st.wid, sp.top),
            stairPt(sp.a1, st.wid, sp.top), stairPt(sp.a1, 0, sp.top)], shade(L.stairColor, light, 0, fog));
    }
    if (withSide) {
      // The solid side of the stairs (with the step shape on top)
      const pts = [stairPt(0, st.wid, 0)];
      for (let k = 0; k < N; k++) {
        pts.push(stairPt((st.len * k) / N, st.wid, (H * (k + 1)) / N));
        pts.push(stairPt((st.len * (k + 1)) / N, st.wid, (H * (k + 1)) / N));
      }
      pts.push(stairPt(st.len, st.wid, 0));
      const mid = stairPt(st.len / 2, st.wid, 0), zc = Math.max(0.3, mid.z);
      quad(pts, shade(L.insideWallColor, lightAt(clamp(w / 2 + (mid.s / zc) * focal, 0, w), zc) * 0.8, 0, fog));
    }
  }
  // Metal railing around the hole upstairs (from point A to B, both "along/across")
  function drawRail(r) {
    const H = S.hospital.ceilingHeight;
    const mid = stairPt((r.a0 + r.a1) / 2, (r.c0 + r.c1) / 2, H), zc = Math.max(0.3, mid.z);
    const color = shade([70, 74, 78], lightAt(clamp(w / 2 + (mid.s / zc) * focal, 0, w), zc), 0, fog);
    quad([stairPt(r.a0, r.c0, H + 0.95), stairPt(r.a1, r.c1, H + 0.95), stairPt(r.a1, r.c1, H + 1.05), stairPt(r.a0, r.c0, H + 1.05)], color);
    const posts = Math.max(2, Math.round(Math.hypot(r.a1 - r.a0, r.c1 - r.c0) / 0.6));
    for (let i = 0; i <= posts; i++) {
      const t = i / posts, a = lerp(r.a0, r.a1, t), cc = lerp(r.c0, r.c1, t);
      const dA = (r.a1 - r.a0) === 0 ? 0.03 : 0, dC = (r.c1 - r.c0) === 0 ? 0.03 : 0;
      quad([stairPt(a - dC, cc - dA, H), stairPt(a + dC, cc + dA, H), stairPt(a + dC, cc + dA, H + 1), stairPt(a - dC, cc - dA, H + 1)], color);
    }
  }

  // A line on the floor in 3D (cut off the part behind you)
  function line3(p, q) {
    const near = 0.2;
    if (p.z < near && q.z < near) return;
    const cut = (a, b) => { const t = (near - a.z) / (b.z - a.z); return { s: a.s + (b.s - a.s) * t, z: near, h: a.h + (b.h - a.h) * t }; };
    if (p.z < near) p = cut(p, q);
    else if (q.z < near) q = cut(q, p);
    c.beginPath();
    c.moveTo(w / 2 + (p.s / p.z) * focal, horizon + ((eye - p.h) * focal) / p.z);
    c.lineTo(w / 2 + (q.s / q.z) * focal, horizon + ((eye - q.h) * focal) / q.z);
    c.stroke();
  }

  // A long, skinny monster leg with a clawed foot (a body piece!)
  function drawLeg(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, d = it.obj.dir;     // d = which way the toes point
    const glowing = S.legHintsByMode[mode] === "highlight";       // Easy: the legs are highlighted
    const skin = glowing ? shade([200, 190, 90], 1, fa * 0.3, fog) : shade([84, 96, 84], light + 0.05, fa, fog);
    if (glowing) {                                                 // pulsing ring on the ground
      const pulse = 0.5 + 0.5 * Math.sin(o.time * 4);
      c.save();
      c.strokeStyle = `rgba(255,230,90,${0.4 + 0.4 * pulse})`;
      c.lineWidth = Math.max(1.5, 0.04 * sc);
      c.shadowColor = "rgba(255,220,80,0.9)";
      c.shadowBlur = 12;
      c.beginPath();
      c.ellipse(x, groundY, (0.5 + 0.15 * pulse) * sc, (0.12 + 0.04 * pulse) * sc, 0, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
    const topY = groundY - 1.15 * sc, kneeY = groundY - 0.65 * sc, ankleY = groundY - 0.14 * sc;
    const kx = x - d * 0.06 * sc;                     // the knee bends a little
    c.save();
    c.shadowColor = glowing ? "rgba(255,230,90,0.95)" : "rgba(120,255,160,0.25)";   // bright on Easy, faint otherwise
    c.shadowBlur = glowing ? Math.max(14, 0.5 * sc) : Math.max(3, 0.2 * sc);
    c.fillStyle = skin;
    // thick leg: thigh -> knee -> ankle
    c.beginPath();
    c.moveTo(x - 0.12 * sc, topY);
    c.lineTo(x + 0.12 * sc, topY);
    c.lineTo(kx + 0.09 * sc, kneeY);
    c.lineTo(x + 0.06 * sc, ankleY);
    c.lineTo(x - 0.06 * sc, ankleY);
    c.lineTo(kx - 0.09 * sc, kneeY);
    c.closePath();
    c.fill();
    // muscles: a bulging thigh and calf, with lines
    c.beginPath();
    c.ellipse(x + d * 0.03 * sc, lerp(topY, kneeY, 0.45), 0.15 * sc, 0.26 * sc, d * 0.08, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.ellipse(kx - d * 0.06 * sc, lerp(kneeY, ankleY, 0.3), 0.11 * sc, 0.2 * sc, -d * 0.1, 0, Math.PI * 2);
    c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = "rgba(0,0,0,0.35)";
    c.lineWidth = Math.max(1, 0.012 * sc);
    for (const k of [-0.07, 0, 0.07]) {
      c.beginPath();
      c.moveTo(x + (k + d * 0.02) * sc, topY + 0.08 * sc);
      c.quadraticCurveTo(x + (k * 1.6 + d * 0.06) * sc, lerp(topY, kneeY, 0.45), kx + k * 0.6 * sc, kneeY - 0.04 * sc);
      c.stroke();
    }
    for (const k of [-0.04, 0.04]) {
      c.beginPath();
      c.moveTo(kx + k * sc, kneeY + 0.05 * sc);
      c.quadraticCurveTo(kx - d * 0.08 * sc + k * 1.5 * sc, lerp(kneeY, ankleY, 0.3), x + k * 0.5 * sc, ankleY - 0.06 * sc);
      c.stroke();
    }
    c.strokeStyle = "rgba(255,255,255,0.14)";                       // shine on the muscles
    c.beginPath();
    c.moveTo(x - 0.08 * sc, lerp(topY, kneeY, 0.25));
    c.quadraticCurveTo(x - 0.13 * sc, lerp(topY, kneeY, 0.5), x - 0.07 * sc, lerp(topY, kneeY, 0.8));
    c.stroke();
    // knobby ankle
    c.beginPath();
    c.arc(x, ankleY, 0.08 * sc, 0, Math.PI * 2);
    c.fill();
    // foot pointing to one side
    c.beginPath();
    c.moveTo(x - d * 0.08 * sc, ankleY - 0.03 * sc);
    c.quadraticCurveTo(x + d * 0.14 * sc, ankleY - 0.05 * sc, x + d * 0.22 * sc, groundY - 0.08 * sc);
    c.lineTo(x + d * 0.22 * sc, groundY);
    c.lineTo(x - d * 0.09 * sc, groundY);
    c.closePath();
    c.fill();
    c.restore();
    // long claw toes
    c.lineCap = "round";
    for (let k = 0; k < 4; k++) {
      const ty = groundY - (0.015 + k * 0.035) * sc;
      const tx0 = x + d * 0.18 * sc, tx1 = x + d * (0.36 + (k % 2) * 0.04) * sc;
      c.strokeStyle = skin;
      c.lineWidth = Math.max(1, 0.036 * sc);
      c.beginPath();
      c.moveTo(tx0, ty);
      c.quadraticCurveTo((tx0 + tx1) / 2, ty - 0.03 * sc, tx1, ty + 0.01 * sc);
      c.stroke();
      c.strokeStyle = "rgba(20,20,20,0.9)";          // dark claw tip
      c.lineWidth = Math.max(1, 0.015 * sc);
      c.beginPath();
      c.moveTo(tx1, ty + 0.01 * sc);
      c.lineTo(tx1 + d * 0.05 * sc, ty + 0.025 * sc);
      c.stroke();
    }
    // stitches where it was cut off
    c.strokeStyle = "rgba(60,20,20,0.85)";
    c.lineWidth = Math.max(1, 0.012 * sc);
    c.beginPath();
    for (let k = -1; k <= 1; k++) {
      c.moveTo(x + k * 0.07 * sc, topY - 0.02 * sc);
      c.lineTo(x + k * 0.07 * sc + 0.02 * sc, topY + 0.07 * sc);
    }
    c.stroke();
  }

  // The big glowing tube with a half-made monster inside
  function drawTube(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, L = S.hospital;
    const r = L.tubeRadius * sc, hgt = L.tubeHeight * sc, top = groundY - hgt, cap = 0.3 * sc;
    // cables up to the ceiling
    c.strokeStyle = shade([30, 32, 34], light, fa, fog);
    c.lineWidth = Math.max(1, 0.05 * sc);
    for (const k of [-0.6, 0, 0.6]) {
      c.beginPath();
      c.moveTo(x + k * r, top);
      c.quadraticCurveTo(x + k * r * 1.6, top - 0.2 * sc, x + k * r * 1.3, top - 1 * sc);
      c.stroke();
    }
    // glowing green liquid
    c.save();
    c.shadowColor = "rgba(80,255,140,0.8)";
    c.shadowBlur = 30;
    const g = c.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, "rgba(30,120,65,0.9)");
    g.addColorStop(0.4, "rgba(120,255,170,0.92)");
    g.addColorStop(1, "rgba(25,100,55,0.9)");
    c.fillStyle = g;
    c.fillRect(x - r, top + cap, r * 2, hgt - cap * 2);
    c.restore();
    // the tube starts EMPTY. After you give Dr. Voss the legs, they float in it.
    const bob = Math.sin(o.time * 0.8) * 0.05 * sc;
    if (hospital.legsGiven) {
      c.strokeStyle = "rgba(8,30,16,0.8)";
      c.lineCap = "round";
      c.lineWidth = Math.max(1, r * 0.2);
      for (const k of [-1, 1]) {
        c.beginPath();
        c.moveTo(x + k * r * 0.18, top + hgt * 0.5 + bob);
        c.quadraticCurveTo(x + k * r * 0.3, top + hgt * 0.68 + bob, x + k * r * 0.2, top + hgt * 0.84 + bob);
        c.lineTo(x + k * r * 0.45, top + hgt * 0.86 + bob);                                 // clawed foot
        c.stroke();
      }
    }
    // bubbles
    c.strokeStyle = "rgba(210,255,225,0.6)";
    c.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const by = groundY - cap - ((o.time * 0.5 + i * 0.37) % 1) * (hgt - cap * 2);
      const bx = x + Math.sin(i * 3.1 + o.time) * r * 0.65;
      c.beginPath();
      c.arc(bx, by, Math.max(1, 0.04 * sc), 0, Math.PI * 2);
      c.stroke();
    }
    // glass shine
    c.fillStyle = "rgba(255,255,255,0.12)";
    c.fillRect(x - r * 0.7, top + cap, r * 0.15, hgt - cap * 2);
    // metal base and lid
    c.fillStyle = shade([74, 78, 82], light, fa, fog);
    c.fillRect(x - r * 1.15, groundY - cap, r * 2.3, cap);
    c.fillRect(x - r * 1.15, top, r * 2.3, cap);
  }

  // The scientist in his lab coat
  function drawScientist(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx + Math.sin(o.time * 1.2) * 0.01 * sc;
    const L2 = light + 0.35;               // the tube's green glow lights him up
    const H = 1.75 * sc, headY = groundY - H + 0.13 * sc;
    // legs and shoes
    c.fillStyle = shade([35, 35, 42], L2, fa, fog);
    c.fillRect(x - 0.16 * sc, groundY - 0.5 * sc, 0.12 * sc, 0.5 * sc);
    c.fillRect(x + 0.04 * sc, groundY - 0.5 * sc, 0.12 * sc, 0.5 * sc);
    c.fillStyle = shade([20, 18, 16], L2, fa, fog);
    c.fillRect(x - 0.19 * sc, groundY - 0.06 * sc, 0.17 * sc, 0.06 * sc);
    c.fillRect(x + 0.03 * sc, groundY - 0.06 * sc, 0.17 * sc, 0.06 * sc);
    // white lab coat
    c.fillStyle = shade([205, 210, 204], L2, fa, fog);
    c.beginPath();
    c.moveTo(x - 0.22 * sc, groundY - H + 0.3 * sc);
    c.lineTo(x + 0.22 * sc, groundY - H + 0.3 * sc);
    c.lineTo(x + 0.3 * sc, groundY - 0.42 * sc);
    c.lineTo(x - 0.3 * sc, groundY - 0.42 * sc);
    c.closePath();
    c.fill();
    c.strokeStyle = shade([120, 124, 120], L2, fa, fog);
    c.lineWidth = Math.max(1, 0.015 * sc);
    c.beginPath();
    c.moveTo(x, groundY - H + 0.32 * sc);
    c.lineTo(x, groundY - 0.42 * sc);
    c.stroke();
    // sleeves and hands
    c.fillStyle = shade([195, 200, 194], L2, fa, fog);
    c.fillRect(x - 0.32 * sc, groundY - H + 0.32 * sc, 0.1 * sc, 0.62 * sc);
    c.fillRect(x + 0.22 * sc, groundY - H + 0.32 * sc, 0.1 * sc, 0.62 * sc);
    c.fillStyle = shade([240, 205, 180], L2, fa, fog);
    c.fillRect(x - 0.31 * sc, groundY - H + 0.94 * sc, 0.08 * sc, 0.1 * sc);
    c.fillRect(x + 0.23 * sc, groundY - H + 0.94 * sc, 0.08 * sc, 0.1 * sc);
    // head, messy grey hair, glasses (after he takes the legs he looks sick and grey, with dark eyes…)
    c.fillStyle = shade(it.obj.dark ? [205, 200, 195] : [240, 205, 180], L2, fa, fog);
    c.beginPath();
    c.arc(x, headY, 0.12 * sc, 0, Math.PI * 2);
    c.fill();
    if (it.obj.dark) {                       // dark circles under his eyes
      c.fillStyle = "rgba(60,40,60,0.55)";
      for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * 0.05 * sc, headY + 0.02 * sc, 0.04 * sc, 0.03 * sc, 0, 0, Math.PI * 2); c.fill(); }
    }
    c.fillStyle = shade(it.obj.dark ? [110, 110, 112] : [150, 150, 150], L2, fa, fog);
    c.beginPath();
    c.ellipse(x, headY - 0.08 * sc, 0.14 * sc, 0.07 * sc, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "#111";
    c.lineWidth = Math.max(1, 0.012 * sc);
    for (const k of [-1, 1]) {
      c.beginPath();
      c.arc(x + k * 0.05 * sc, headY, 0.035 * sc, 0, Math.PI * 2);
      c.stroke();
    }
    c.fillStyle = "rgba(160,255,190,0.8)";   // green glint in his glasses
    c.fillRect(x - 0.06 * sc, headY - 0.015 * sc, 0.02 * sc, 0.01 * sc);
  }

  // The huge cave spider. look = "glow" (Easy), "hidden" (Normal), "dark" (Hard)
  function drawSpider(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, S2 = S.spider.size * sc;
    const look = finale === "chase" ? (mode === "easy" ? "glow" : "dark") : S.spiderLookByMode[mode];
    const t = o.time, walkAnim = spider.moving ? t * 14 : 0;
    const body = look === "glow" ? shade([46, 24, 20], 1.1, fa * 0.4, fog)
               : look === "dark" ? shade([22, 18, 16], light * 0.5, fa, fog) : "rgba(4,3,3,0.92)";
    c.save();
    if (look === "glow") { c.shadowColor = "rgba(255,60,40,0.85)"; c.shadowBlur = Math.max(12, S2 * 0.15); }
    c.strokeStyle = body;
    c.fillStyle = body;
    c.lineCap = "round";
    // 8 legs: up to a high knee, then down to the floor
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const lift = Math.max(0, Math.sin(walkAnim + i * 1.6 + (side > 0 ? 0.8 : 0))) * S2 * 0.12;
        const hipX = x + side * S2 * 0.25, hipY = groundY - S2 * 0.55;
        const kneeX = x + side * S2 * (0.7 + i * 0.22), kneeY = groundY - S2 * (1.05 + (i === 1 || i === 2 ? 0.1 : 0)) - lift;
        const footX = x + side * S2 * (0.9 + i * 0.38), footY = groundY - lift * 0.4;
        c.lineWidth = Math.max(2, S2 * 0.07);
        c.beginPath();
        c.moveTo(hipX, hipY);
        c.lineTo(kneeX, kneeY);
        c.lineTo(footX, footY);
        c.stroke();
        c.lineWidth = Math.max(1, S2 * 0.01);            // lots of hairs on both parts of the leg
        const nH = S.spider.legHairs;
        for (let k = 1; k < nH; k++) {
          const f = k / nH, upper = f < 0.4, ff = upper ? f / 0.4 : (f - 0.4) / 0.6;
          const hx = upper ? lerp(hipX, kneeX, ff) : lerp(kneeX, footX, ff);
          const hy = upper ? lerp(hipY, kneeY, ff) : lerp(kneeY, footY, ff);
          const len = S2 * (0.035 + ((k * 7 + i * 3) % 5) * 0.008);
          for (const up of [-1, 1]) {
            c.beginPath();
            c.moveTo(hx, hy);
            c.lineTo(hx + side * len * 0.8, hy + up * len);
            c.stroke();
          }
        }
      }
    }
    // big hairy abdomen behind, head in front
    c.beginPath();
    c.ellipse(x, groundY - S2 * 0.95, S2 * 0.62, S2 * 0.5, 0, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.ellipse(x, groundY - S2 * 0.5, S2 * 0.36, S2 * 0.3, 0, 0, Math.PI * 2);
    c.fill();
    c.shadowBlur = 0;
    if (look !== "hidden") {
      // shaggy hair all over its body: a thick fringe round the edge, and tufts all over
      c.strokeStyle = look === "glow" ? "rgba(110,62,48,0.9)" : "rgba(48,38,32,0.9)";
      c.lineWidth = Math.max(1, S2 * 0.009);
      const nHair = S.spider.hairs;
      for (const [cy2, rx2, ry2, n] of [[S2 * 0.95, S2 * 0.62, S2 * 0.5, nHair], [S2 * 0.5, S2 * 0.36, S2 * 0.3, nHair * 0.4]]) {
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + Math.sin(i * 12.9) * 0.05;
          const len = S2 * (0.05 + (Math.sin(i * 7.7) * 0.5 + 0.5) * 0.07);
          const bx2 = x + Math.cos(a) * rx2 * 0.92, by2 = groundY - cy2 + Math.sin(a) * ry2 * 0.92;
          c.beginPath(); c.moveTo(bx2, by2);
          c.quadraticCurveTo(bx2 + Math.cos(a) * len * 0.6, by2 + Math.sin(a) * len * 0.6 - len * 0.2, bx2 + Math.cos(a + 0.3) * len, by2 + Math.sin(a + 0.3) * len);
          c.stroke();
        }
      }
      for (let i = 0; i < nHair * 0.8; i++) {                     // tufts on its back
        const rr = Math.sqrt((Math.sin(i * 3.1) * 0.5 + 0.5)) * 0.85, a = i * 2.39996;
        const bx2 = x + Math.cos(a) * S2 * 0.62 * rr, by2 = groundY - S2 * 0.95 + Math.sin(a) * S2 * 0.5 * rr;
        const len = S2 * 0.04;
        c.beginPath(); c.moveTo(bx2, by2); c.lineTo(bx2 + Math.cos(a) * len * 0.5, by2 - len); c.stroke();
      }
      // a pale skull marking on its back
      c.fillStyle = look === "glow" ? "rgba(210,190,160,0.55)" : "rgba(120,110,95,0.4)";
      const kx = x, ky = groundY - S2 * 1.05;
      c.beginPath(); c.ellipse(kx, ky, S2 * 0.14, S2 * 0.12, 0, 0, Math.PI * 2); c.fill();
      c.fillRect(kx - S2 * 0.07, ky + S2 * 0.08, S2 * 0.14, S2 * 0.06);
      c.fillStyle = body;
      for (const k of [-1, 1]) { c.beginPath(); c.arc(kx + k * S2 * 0.05, ky, S2 * 0.035, 0, Math.PI * 2); c.fill(); }
    }
    // fangs
    c.fillStyle = look === "hidden" ? "rgba(10,8,8,0.95)" : shade([30, 24, 20], light, fa, fog);
    for (const k of [-1, 1]) {
      c.beginPath();
      c.moveTo(x + k * S2 * 0.06, groundY - S2 * 0.32);
      c.quadraticCurveTo(x + k * S2 * 0.14, groundY - S2 * 0.18, x + k * S2 * 0.04, groundY - S2 * 0.1);
      c.lineTo(x + k * S2 * 0.12, groundY - S2 * 0.3);
      c.fill();
      if (look !== "hidden") {                                    // venom dripping from the fangs
        const drip = ((o.time * 0.8 + (k > 0 ? 0.5 : 0)) % 1);
        c.fillStyle = "rgba(150,170,60,0.8)";
        c.beginPath(); c.ellipse(x + k * S2 * 0.04, groundY - S2 * 0.1 + drip * S2 * 0.12, S2 * 0.012, S2 * 0.02, 0, 0, Math.PI * 2); c.fill();
      }
    }
    // 8 eyes (they glow on Easy and Hard; on Normal you can't see it at all)
    if (look !== "hidden") {
      c.fillStyle = look === "glow" ? "#ff3a2a" : "rgba(200,30,20,0.7)";
      c.shadowColor = "#ff2010";
      c.shadowBlur = look === "glow" ? 14 : 6;
      // …lots of eyes: 2 big ones, and a cluster of smaller ones all over its head
      const eyes = [[-0.12, -0.6, 0.05], [0.12, -0.6, 0.05], [-0.05, -0.64, 0.035], [0.05, -0.64, 0.035],
                    [-0.2, -0.55, 0.028], [0.2, -0.55, 0.028], [-0.16, -0.66, 0.022], [0.16, -0.66, 0.022],
                    [0, -0.69, 0.025], [-0.09, -0.7, 0.018], [0.09, -0.7, 0.018], [-0.24, -0.62, 0.018], [0.24, -0.62, 0.018],
                    [-0.26, -0.5, 0.016], [0.26, -0.5, 0.016], [-0.2, -0.7, 0.014], [0.2, -0.7, 0.014], [0, -0.58, 0.02]];
      for (const [ex, ey, er] of eyes) {
        c.beginPath();
        c.arc(x + ex * S2, groundY + ey * S2, Math.max(1, er * S2), 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();
  }

  // A long, thin, curved monster arm with a clawed hand (a body piece!)
  function drawArm(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, d = it.obj.dir;     // d = which way it curves
    const glowing = S.legHintsByMode[mode] === "highlight";
    const skin = glowing ? shade([200, 190, 90], 1, fa * 0.3, fog) : shade([84, 96, 84], light + 0.05, fa, fog);
    if (glowing) {                                    // Easy: pulsing ring
      const pulse = 0.5 + 0.5 * Math.sin(o.time * 4);
      c.save();
      c.strokeStyle = `rgba(255,230,90,${0.4 + 0.4 * pulse})`;
      c.lineWidth = Math.max(1.5, 0.04 * sc);
      c.shadowColor = "rgba(255,220,80,0.9)";
      c.shadowBlur = 12;
      c.beginPath();
      c.ellipse(x, groundY, (0.5 + 0.15 * pulse) * sc, (0.12 + 0.04 * pulse) * sc, 0, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
    // the arm: a long curve like a hook, from the cut end on the ground up to the hand
    const bx = x + d * 0.25 * sc, by = groundY;                     // cut end
    const cx1 = x - d * 0.45 * sc, cy1 = groundY - 0.25 * sc;       // bend
    const wx = x - d * 0.12 * sc, wy = groundY - 1.0 * sc;          // wrist
    c.save();
    c.lineCap = "round";
    c.shadowColor = glowing ? "rgba(255,230,90,0.95)" : "rgba(120,255,160,0.25)";
    c.shadowBlur = glowing ? Math.max(14, 0.5 * sc) : Math.max(3, 0.2 * sc);
    c.strokeStyle = "rgba(0,0,0,0.55)";              // dark outline (like a pencil line)
    c.lineWidth = Math.max(2, 0.09 * sc);
    c.beginPath();
    c.moveTo(bx, by);
    c.quadraticCurveTo(cx1, cy1, wx, wy);
    c.stroke();
    c.shadowBlur = 0;
    c.strokeStyle = skin;
    c.lineWidth = Math.max(1.5, 0.065 * sc);
    c.beginPath();
    c.moveTo(bx, by);
    c.quadraticCurveTo(cx1, cy1, wx, wy);
    c.stroke();
    // a skinny hand with long thin fingers spread out at the top
    for (let f = 0; f < 5; f++) {
      const ang = -Math.PI / 2 + (f - 2) * 0.32 + d * 0.15;
      const len = (f === 0 || f === 4 ? 0.2 : 0.28) * sc;
      const fx2 = wx + Math.cos(ang) * len, fy2 = wy + Math.sin(ang) * len;
      c.strokeStyle = "rgba(0,0,0,0.55)";
      c.lineWidth = Math.max(1.5, 0.035 * sc);
      c.beginPath();
      c.moveTo(wx, wy);
      c.lineTo(fx2, fy2);
      c.stroke();
      c.strokeStyle = skin;
      c.lineWidth = Math.max(1, 0.022 * sc);
      c.beginPath();
      c.moveTo(wx, wy);
      c.lineTo(fx2, fy2);
      c.stroke();
      c.strokeStyle = "rgba(20,20,20,0.9)";          // claw tip
      c.lineWidth = Math.max(1, 0.014 * sc);
      c.beginPath();
      c.moveTo(fx2, fy2);
      c.lineTo(fx2 + Math.cos(ang) * 0.06 * sc, fy2 + Math.sin(ang) * 0.06 * sc);
      c.stroke();
    }
    c.restore();
    // stitches at the cut end
    c.strokeStyle = "rgba(60,20,20,0.85)";
    c.lineWidth = Math.max(1, 0.012 * sc);
    c.beginPath();
    for (let k = -1; k <= 1; k++) {
      c.moveTo(bx + k * 0.03 * sc, by - 0.05 * sc);
      c.lineTo(bx + k * 0.03 * sc + 0.02 * sc, by + 0.02 * sc);
    }
    c.stroke();
  }

  // Your subscriber (a fan in a purple hoodie) with a phone light, bringing the silent boots
  function drawFan(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, H = 1.7 * sc;
    // the glow from their phone light (so you can see them in the dark)
    const gl = c.createRadialGradient(x, groundY - H * 0.6, 2, x, groundY - H * 0.6, H * 0.9);
    gl.addColorStop(0, "rgba(255,240,200,0.35)"); gl.addColorStop(1, "rgba(255,240,200,0)");
    c.fillStyle = gl; c.fillRect(x - H, groundY - H * 1.5, H * 2, H * 1.6);
    const L = 0.9;
    c.fillStyle = shade([40, 40, 60], L, fa, fog);                                     // jeans
    c.fillRect(x - H * 0.1, groundY - H * 0.45, H * 0.08, H * 0.45);
    c.fillRect(x + H * 0.02, groundY - H * 0.45, H * 0.08, H * 0.45);
    c.fillStyle = shade([110, 60, 160], L, fa, fog);                                   // purple hoodie
    c.beginPath(); c.roundRect(x - H * 0.15, groundY - H * 0.82, H * 0.3, H * 0.42, H * 0.06); c.fill();
    c.fillStyle = shade([240, 205, 180], L, fa, fog);                                  // face
    c.beginPath(); c.arc(x, groundY - H * 0.9, H * 0.08, 0, Math.PI * 2); c.fill();
    c.fillStyle = shade([110, 60, 160], L, fa, fog);                                   // hood
    c.beginPath(); c.arc(x, groundY - H * 0.92, H * 0.1, Math.PI * 1.05, Math.PI * 1.95); c.fill();
    c.fillStyle = "#111";
    for (const k of [-1, 1]) c.fillRect(x + k * H * 0.03 - 1, groundY - H * 0.92, 2, 2);
    c.fillStyle = "#fff8d8";                                                           // phone light
    c.beginPath(); c.arc(x + H * 0.17, groundY - H * 0.62, Math.max(2, H * 0.025), 0, Math.PI * 2); c.fill();
    if (fan.mode === "coming") {                                                       // the boots
      c.fillStyle = shade([30, 30, 34], 1, fa, fog);
      c.fillRect(x - H * 0.22, groundY - H * 0.62, H * 0.1, H * 0.12);
      c.fillRect(x - H * 0.26, groundY - H * 0.52, H * 0.14, H * 0.04);
    }
  }

  // Easter egg: a little stuffed alligator toy, lying on the cave floor
  function drawGator(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, d = it.obj.dir, L = Math.max(light, 0.35);
    const green = shade([70, 140, 60], L, fa, fog), dark = shade([45, 95, 40], L, fa, fog);
    const y = groundY - 0.08 * sc;
    c.fillStyle = dark;                                          // tail
    c.beginPath(); c.moveTo(x - d * 0.18 * sc, y - 0.04 * sc); c.quadraticCurveTo(x - d * 0.36 * sc, y - 0.02 * sc, x - d * 0.42 * sc, y + 0.03 * sc);
    c.quadraticCurveTo(x - d * 0.3 * sc, y + 0.06 * sc, x - d * 0.16 * sc, y + 0.05 * sc); c.fill();
    for (const lx of [-0.1, 0.1]) {                              // stubby legs
      c.beginPath(); c.ellipse(x + d * lx * sc, y + 0.06 * sc, 0.035 * sc, 0.025 * sc, 0, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = green;                                         // body
    c.beginPath(); c.ellipse(x, y, 0.2 * sc, 0.07 * sc, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + d * 0.24 * sc, y - 0.01 * sc, 0.12 * sc, 0.045 * sc, 0, 0, Math.PI * 2); c.fill();   // snout
    c.fillStyle = dark;                                          // bumps on its back
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(x + i * 0.06 * sc, y - 0.06 * sc, 0.018 * sc, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = shade([240, 240, 230], L, fa, fog);            // soft felt teeth
    for (let i = 0; i < 4; i++) {
      const tx = x + d * (0.16 + i * 0.045) * sc;
      c.beginPath(); c.moveTo(tx - 0.012 * sc, y + 0.01 * sc); c.lineTo(tx + 0.012 * sc, y + 0.01 * sc); c.lineTo(tx, y + 0.035 * sc); c.fill();
    }
    for (const k of [-0.025, 0.025]) {                           // button eyes
      c.fillStyle = shade([245, 245, 240], L, fa, fog);
      c.beginPath(); c.arc(x + d * 0.17 * sc + k * sc, y - 0.06 * sc, 0.022 * sc, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#111";
      c.beginPath(); c.arc(x + d * 0.17 * sc + k * sc, y - 0.06 * sc, 0.011 * sc, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = shade([30, 60, 25], L, fa, fog);             // stitches down its belly
    c.lineWidth = Math.max(1, 0.006 * sc);
    c.beginPath();
    for (let i = -3; i <= 3; i++) { c.moveTo(x + i * 0.04 * sc, y + 0.03 * sc); c.lineTo(x + i * 0.04 * sc + 0.015 * sc, y + 0.05 * sc); }
    c.stroke();
  }

  // 🐘 A cream knitted elephant toy sitting on the cave floor
  function drawElephant(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, L = Math.max(light, 0.35), col = S.hospital.elephantColor;

    c.fillStyle = main;                                          // body
    c.beginPath(); c.ellipse(x, by, 0.11 * sc, 0.1 * sc, 0, 0, Math.PI * 2); c.fill();

      c.fillStyle = main;
      c.beginPath(); c.ellipse(x + k * 0.07 * sc, groundY - 0.03 * sc, 0.04 * sc, 0.035 * sc, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = toe;
      c.beginPath(); c.ellipse(x + k * 0.08 * sc, groundY - 0.025 * sc, 0.025 * sc, 0.025 * sc, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = dark;                                        // arms
      c.beginPath(); c.ellipse(x + k * 0.1 * sc, by + 0.01 * sc, 0.03 * sc, 0.055 * sc, k * -0.4, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = main;                                          // head
    c.beginPath(); c.ellipse(x, hy, 0.085 * sc, 0.075 * sc, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = main; c.lineCap = "round"; c.lineWidth = Math.max(1, 0.04 * sc);   // trunk curling down
    c.beginPath(); c.moveTo(x, hy + 0.02 * sc); c.quadraticCurveTo(x + 0.01 * sc, hy + 0.1 * sc, x + 0.04 * sc, hy + 0.12 * sc); c.stroke();
    c.fillStyle = shade([70, 110, 200], L, fa, fog);             // little blue stitched eyes
    for (const k of [-1, 1]) { c.beginPath(); c.arc(x + k * 0.035 * sc, hy - 0.015 * sc, Math.max(0.6, 0.009 * sc), 0, Math.PI * 2); c.fill(); }
    if (sc > 120) {                                              // knitted stitch lines up close
      c.strokeStyle = "rgba(0,0,0,0.08)"; c.lineWidth = 1;
      c.beginPath();
      for (let i = -4; i <= 4; i++) { c.moveTo(x + i * 0.022 * sc, by - 0.08 * sc); c.lineTo(x + i * 0.022 * sc, by + 0.08 * sc); }
      c.stroke();
    }
  }

  // 🦄 A white plush unicorn toy with a gold horn and shiny gold hooves
  function drawUnicorn(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, L = Math.max(light, 0.35), H = S.hospital;
    const white = shade(H.unicornColor, L, fa, fog), shadow = shade(H.unicornColor, L * 0.82, fa, fog);
    const gold = shade(H.unicornGold, L, fa, fog), shine = shade([255, 240, 200], L, fa, fog), pink = shade(H.unicornMane, L, fa, fog);
    const by = groundY - 0.1 * sc, hy = groundY - 0.27 * sc;
    c.fillStyle = white;                                         // body
    c.beginPath(); c.ellipse(x, by, 0.1 * sc, 0.1 * sc, 0, 0, Math.PI * 2); c.fill();
    for (const k of [-1, 1]) {                                   // arms with gold hooves
      c.fillStyle = shadow;
      c.beginPath(); c.ellipse(x + k * 0.09 * sc, by + 0.01 * sc, 0.03 * sc, 0.06 * sc, k * -0.3, 0, Math.PI * 2); c.fill();
      c.fillStyle = gold;
      c.beginPath(); c.ellipse(x + k * 0.1 * sc, by + 0.06 * sc, 0.03 * sc, 0.028 * sc, 0, 0, Math.PI * 2); c.fill();
    }
    for (const k of [-1, 1]) {                                   // legs with big shiny gold hooves
      c.fillStyle = white;
      c.beginPath(); c.ellipse(x + k * 0.065 * sc, groundY - 0.035 * sc, 0.04 * sc, 0.04 * sc, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = gold;
      c.beginPath(); c.ellipse(x + k * 0.08 * sc, groundY - 0.03 * sc, 0.032 * sc, 0.032 * sc, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = shine;
      c.beginPath(); c.ellipse(x + k * 0.072 * sc, groundY - 0.04 * sc, 0.01 * sc, 0.007 * sc, -0.5, 0, Math.PI * 2); c.fill();
    }
    for (const k of [-1, 1]) {                                   // ears, gold inside
      c.fillStyle = white;
      c.beginPath(); c.ellipse(x + k * 0.06 * sc, hy - 0.06 * sc, 0.025 * sc, 0.03 * sc, k * 0.4, 0, Math.PI * 2); c.fill();
      c.fillStyle = gold;
      c.beginPath(); c.ellipse(x + k * 0.06 * sc, hy - 0.06 * sc, 0.013 * sc, 0.018 * sc, k * 0.4, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = white;                                         // head and muzzle
    c.beginPath(); c.ellipse(x, hy, 0.075 * sc, 0.07 * sc, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = shadow;
    c.beginPath(); c.ellipse(x, hy + 0.03 * sc, 0.045 * sc, 0.032 * sc, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = pink;                                          // fluffy pink mane on top of the head
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(x + i * 0.013 * sc, hy - 0.058 * sc + Math.abs(i) * 0.006 * sc, 0.017 * sc, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = gold;                                          // golden horn
    c.beginPath(); c.moveTo(x - 0.016 * sc, hy - 0.06 * sc); c.lineTo(x + 0.016 * sc, hy - 0.06 * sc); c.lineTo(x + 0.004 * sc, hy - 0.14 * sc); c.closePath(); c.fill();
    c.strokeStyle = shine; c.lineWidth = Math.max(0.5, 0.004 * sc);
    c.beginPath(); for (let i = 1; i <= 3; i++) { const yy = hy - 0.06 * sc - i * 0.02 * sc; c.moveTo(x - 0.012 * sc * (1 - i * 0.25), yy + 0.004 * sc); c.lineTo(x + 0.012 * sc * (1 - i * 0.25), yy - 0.004 * sc); } c.stroke();
    c.strokeStyle = "#222"; c.lineWidth = Math.max(0.6, 0.006 * sc);   // sleepy stitched eyes
    for (const k of [-1, 1]) { c.beginPath(); c.arc(x + k * 0.03 * sc, hy - 0.012 * sc, 0.011 * sc, 0.2, Math.PI - 0.2); c.stroke(); }
  }

  // ----- The cave (under the hospital) -----
  // A pointy rock hanging from the ceiling
  function drawStalactite(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, ceilY = groundY - S.hospital.ceilingHeight * sc;
    const r = it.obj.w * sc, len = it.obj.len * sc;
    const g = c.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, shade(S.hospital.caveRockColor, light * 0.5, fa, fog));
    g.addColorStop(0.5, shade(S.hospital.caveRockColor, light * 1.1, fa, fog));
    g.addColorStop(1, shade(S.hospital.caveRockColor, light * 0.4, fa, fog));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - r, ceilY - 2);
    c.lineTo(x + r, ceilY - 2);
    c.lineTo(x + r * 0.2, ceilY + len * 0.8);
    c.lineTo(x, ceilY + len);
    c.lineTo(x - r * 0.25, ceilY + len * 0.75);
    c.closePath();
    c.fill();
  }
  // A pointy rock growing up from the floor
  function drawStalagmite(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, r = it.obj.w * sc, hgt = it.obj.len * sc;
    const g = c.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, shade(S.hospital.caveRockColor, light * 0.45, fa, fog));
    g.addColorStop(0.45, shade(S.hospital.caveRockColor, light * 1.1, fa, fog));
    g.addColorStop(1, shade(S.hospital.caveRockColor, light * 0.35, fa, fog));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - r, groundY);
    c.quadraticCurveTo(x - r * 0.5, groundY - hgt * 0.5, x - r * 0.1, groundY - hgt);
    c.lineTo(x + r * 0.15, groundY - hgt * 0.95);
    c.quadraticCurveTo(x + r * 0.55, groundY - hgt * 0.45, x + r, groundY);
    c.closePath();
    c.fill();
  }
  // A dusty cobweb near the ceiling
  function drawCobweb(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, ceilY = groundY - S.hospital.ceilingHeight * sc;
    const cy = ceilY + it.obj.drop * sc, R = it.obj.size * sc;
    const a = Math.min(0.7, 0.25 + light * 0.6) * (1 - fa);
    c.strokeStyle = `rgba(220,220,215,${a})`;
    c.lineWidth = Math.max(0.6, sc * 0.008);
    const spokes = 8, pts = [];
    c.beginPath();
    for (let k = 0; k < spokes; k++) {               // threads out from the middle
      const ang = (k / spokes) * Math.PI * 2 + it.obj.spin;
      const len = R * (0.8 + 0.3 * Math.sin(k * 5.1 + it.obj.spin));
      pts.push([Math.cos(ang), Math.sin(ang), len]);
      c.moveTo(x, cy);
      c.lineTo(x + Math.cos(ang) * len, cy + Math.sin(ang) * len);
    }
    for (let ring = 1; ring <= 4; ring++) {           // rings, sagging a little
      const f = ring / 4.4;
      pts.forEach(([dx, dy, len], k) => {
        const [ndx, ndy, nlen] = pts[(k + 1) % spokes];
        const x1 = x + dx * len * f, y1 = cy + dy * len * f;
        const x2 = x + ndx * nlen * f, y2 = cy + ndy * nlen * f;
        c.moveTo(x1, y1);
        c.quadraticCurveTo((x1 + x2) / 2 * 0.98 + x * 0.02, (y1 + y2) / 2 * 0.98 + cy * 0.02 + R * 0.04, x2, y2);
      });
    }
    // threads up to the ceiling
    c.moveTo(x - R * 0.6, cy - R * 0.5); c.lineTo(x - R * 0.9, ceilY);
    c.moveTo(x + R * 0.6, cy - R * 0.5); c.lineTo(x + R * 0.8, ceilY);
    c.stroke();
  }

  // A wooden crate (in the basement)
  function drawCrate(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, s2 = 0.45 * sc;
    c.fillStyle = shade([92, 72, 46], light, fa, fog);
    c.fillRect(x - s2, groundY - s2 * 2, s2 * 2, s2 * 2);
    c.strokeStyle = shade([50, 38, 24], light, fa, fog);
    c.lineWidth = Math.max(1, 0.04 * sc);
    c.strokeRect(x - s2, groundY - s2 * 2, s2 * 2, s2 * 2);
    c.beginPath();
    c.moveTo(x - s2, groundY - s2 * 2);
    c.lineTo(x + s2, groundY);
    c.moveTo(x + s2, groundY - s2 * 2);
    c.lineTo(x - s2, groundY);
    c.stroke();
  }

  // The ladder up to the hatch (in the basement)
  function drawLadder(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, topY = groundY - S.hospital.ceilingHeight * sc;
    c.fillStyle = shade([80, 84, 88], light, fa, fog);
    c.fillRect(x - 0.27 * sc, topY, 0.05 * sc, groundY - topY);
    c.fillRect(x + 0.22 * sc, topY, 0.05 * sc, groundY - topY);
    for (let k = 0.3; k < S.hospital.ceilingHeight; k += 0.35) {
      c.fillRect(x - 0.25 * sc, groundY - k * sc, 0.5 * sc, Math.max(1, 0.04 * sc));
    }
  }

  // Your car (park it, and drive away at the end!)
  function drawCar(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, L = 4 * sc;
    const body = shade([88, 26, 28], light + 0.05, fa, fog);
    c.fillStyle = body;
    c.beginPath();                                   // cabin
    c.moveTo(x - L * 0.3, groundY - 0.95 * sc);
    c.lineTo(x - L * 0.17, groundY - 1.45 * sc);
    c.lineTo(x + L * 0.14, groundY - 1.45 * sc);
    c.lineTo(x + L * 0.3, groundY - 0.95 * sc);
    c.fill();
    c.fillRect(x - L / 2, groundY - 0.98 * sc, L, 0.62 * sc);   // body
    c.fillStyle = shade([20, 28, 40], light, fa, fog);          // windows
    c.beginPath();
    c.moveTo(x - L * 0.26, groundY - 1.0 * sc);
    c.lineTo(x - L * 0.155, groundY - 1.38 * sc);
    c.lineTo(x - L * 0.01, groundY - 1.38 * sc);
    c.lineTo(x - L * 0.01, groundY - 1.0 * sc);
    c.moveTo(x + L * 0.02, groundY - 1.0 * sc);
    c.lineTo(x + L * 0.02, groundY - 1.38 * sc);
    c.lineTo(x + L * 0.13, groundY - 1.38 * sc);
    c.lineTo(x + L * 0.26, groundY - 1.0 * sc);
    c.fill();
    for (const k of [-0.3, 0.3]) {                              // wheels
      c.fillStyle = "#0a0a0a";
      c.beginPath();
      c.arc(x + k * L, groundY - 0.32 * sc, 0.32 * sc, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = shade([90, 90, 95], light, fa, fog);
      c.beginPath();
      c.arc(x + k * L, groundY - 0.32 * sc, 0.12 * sc, 0, Math.PI * 2);
      c.fill();
    }
    c.save();                                                   // headlight and taillight
    c.shadowBlur = 12;
    c.shadowColor = "#ffe9a0";
    c.fillStyle = "#ffe9a0";
    c.fillRect(x + L / 2 - 0.12 * sc, groundY - 0.85 * sc, 0.12 * sc, 0.12 * sc);
    c.shadowColor = "#ff2020";
    c.fillStyle = "#c01818";
    c.fillRect(x - L / 2, groundY - 0.85 * sc, 0.1 * sc, 0.14 * sc);
    c.restore();
  }

  // An old hospital bed
  function drawBed(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, len = 1.9 * sc;
    c.fillStyle = shade([90, 95, 100], light, fa, fog);
    for (const k of [-0.46, 0.46]) c.fillRect(x + k * len - 0.02 * sc, groundY - 0.5 * sc, 0.04 * sc, 0.5 * sc);
    c.fillRect(x - len * 0.5 - 0.03 * sc, groundY - 1.05 * sc, 0.05 * sc, 1.05 * sc);   // headboard post
    c.fillRect(x - len * 0.5 - 0.03 * sc, groundY - 1.05 * sc, 0.3 * sc, 0.05 * sc);
    c.fillStyle = shade([172, 168, 156], light, fa, fog);                               // mattress
    c.fillRect(x - len / 2, groundY - 0.72 * sc, len, 0.2 * sc);
    c.fillStyle = shade([146, 142, 130], light, fa, fog);                               // sheet hanging off
    c.beginPath();
    c.moveTo(x - len * 0.2, groundY - 0.52 * sc);
    c.lineTo(x + len * 0.5, groundY - 0.52 * sc);
    c.lineTo(x + len * 0.46, groundY - 0.28 * sc);
    c.quadraticCurveTo(x + len * 0.1, groundY - 0.2 * sc, x - len * 0.25, groundY - 0.34 * sc);
    c.fill();
    c.fillStyle = shade([190, 186, 176], light, fa, fog);                               // pillow
    c.beginPath();
    c.ellipse(x - len * 0.36, groundY - 0.78 * sc, 0.22 * sc, 0.07 * sc, 0, 0, Math.PI * 2);
    c.fill();
  }
  function drawStack(it, groundY, light, fa) {
    const st = it.obj, sc = it.sc, x = it.sx, half = st.r * sc;
    const topY = horizon - (st.h - eyeH()) * sc;
    const g = c.createLinearGradient(x - half, 0, x + half, 0);
    g.addColorStop(0, shade(S.hospital.wallColor, light * 0.35, fa, fog));
    g.addColorStop(0.4, shade(S.hospital.wallColor, light, fa, fog));
    g.addColorStop(1, shade(S.hospital.wallColor, light * 0.3, fa, fog));
    c.fillStyle = g;
    c.fillRect(x - half, topY, half * 2, groundY - topY);
    c.fillStyle = shade([30, 30, 30], light, fa, fog);
    for (let k = 3; k < st.h; k += 3) {
      const y = horizon - (k - eyeH()) * sc;
      c.fillRect(x - half, y, half * 2, Math.max(1, 0.2 * sc));
    }
    if (Math.sin(o.time * 2.5) > 0.3) {
      c.save();
      c.shadowColor = "#ff0000";
      c.shadowBlur = 10;
      c.fillStyle = "#ff3020";
      c.beginPath();
      c.arc(x, topY, Math.max(1.5, 0.25 * sc), 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
  }


  // Get the trees and grass from the patches around you
  const nearThings = [], nearBits = [];
  forEachNearbyChunk(o.fogDist, (ch) => nearThings.push(...ch.things));
  forEachNearbyChunk(12, (ch) => nearBits.push(...ch.groundBits));

  // Grass and leaves on the ground (only close up)
  for (const gb of nearBits) {
    if (inside || insideHospital(gb.x, gb.y, 0)) continue;   // no grass on the hospital floor
    const dx = gb.x - player.x, dy = gb.y - player.y;
    const z = dx * fx + dy * fy;
    if (z < 0.4 || z > 12) continue;
    const sx = w / 2 + ((-dx * fy + dy * fx) / z) * focal;
    if (sx < -20 || sx > w + 20) continue;
    const sc = focal / z, gy = horizon + eyeH() * sc;
    const light = lightAt(sx, z) * gb.tone, fa = fogAt(z);
    if (gb.kind === "grass") {
      c.strokeStyle = shade([46, 58, 36], light, fa, fog);
      c.lineWidth = Math.max(1, 0.015 * sc);
      c.beginPath();
      for (let k = -1; k <= 1; k++) {
        c.moveTo(sx + k * 0.03 * sc, gy);
        c.lineTo(sx + (k * 0.07 + gb.tilt * 0.04) * sc, gy - (0.14 + 0.05 * Math.abs(k - gb.tilt)) * sc);
      }
      c.stroke();
    } else {
      c.fillStyle = shade([70, 48, 30], light, fa, fog);
      c.beginPath();
      c.ellipse(sx, gy, 0.07 * sc, 0.022 * sc, gb.tilt * 0.4, 0, Math.PI * 2);
      c.fill();
    }
  }

  // Inside: floor tiles and flickering ceiling lights
  if (inside) {
    const L = S.hospital;
    c.strokeStyle = shade([36, 38, 36], 1, 0, fog);
    c.lineWidth = 1;
    if (!basement) {                                 // tiles (the cave has a dirt floor)
      for (let x = hospital.x0; x <= hospital.x1 + 0.01; x += L.floorTileSize) line3(toCam(x, hospital.y0, base), toCam(x, hospital.y1, base));
      for (let y = hospital.y0; y <= hospital.y1 + 0.01; y += L.floorTileSize) line3(toCam(hospital.x0, y, base), toCam(hospital.x1, y, base));
    }
    const st = hospital.stairs, H = L.ceilingHeight;
    const hole = [stairPt(0, 0, H), stairPt(0, st.wid, H), stairPt(st.len, st.wid, H), stairPt(st.len, 0, H)];
    const hx = hospital.hatch.x, hy = hospital.hatch.y;
    const hs = L.hatchSize;
    const hatchSquare = (hgt) => [toCam(hx - hs, hy - hs, hgt), toCam(hx + hs, hy - hs, hgt), toCam(hx + hs, hy + hs, hgt), toCam(hx - hs, hy + hs, hgt)];
    if (basement) {
      quad(hatchSquare(0), "#0a0b0b");                       // the hatch hole in the ceiling
    } else if (!upstairs) {
      // the basement hatch in the floor
      quad(hatchSquare(0.01), hospital.hatchOpen ? "#030303" : shade([58, 60, 62], 1, 0, fog));
      if (!hospital.hatchOpen) {
        quad([toCam(hx - 0.3, hy - 0.06, 0.02), toCam(hx + 0.3, hy - 0.06, 0.02), toCam(hx + 0.3, hy + 0.06, 0.02), toCam(hx - 0.3, hy + 0.06, 0.02)], "#1a1a1a");
        for (const k of [-0.6, 0.6]) quad([toCam(hx - hs, hy + k * hs - 0.03, 0.02), toCam(hx + hs, hy + k * hs - 0.03, 0.02), toCam(hx + hs, hy + k * hs + 0.03, 0.02), toCam(hx - hs, hy + k * hs + 0.03, 0.02)], "#2c2e30");
      }
      // blood splats
      for (const b of hospital.blood) {
        const pts = b.pts.map((r, k) => {
          const a = (k / b.pts.length) * Math.PI * 2;
          return toCam(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r, 0.03);
        });
        quad(pts, b.dark ? "#3a0505" : "#5c0909");
      }
    }
    if (basement) {
      // (no stairs down here)
    } else if (upstairs) {
      // A hole in the floor with the stairs going down
      if (quad(hole, "#050606")) {
        c.save();
        c.clip();              // only draw the stairs inside the hole
        drawStairs(false);
        c.restore();
      }
    } else {
      quad(hole, "#070808");   // the stairwell in the ceiling
    }
    const ch = base + L.ceilingHeight - 0.02;
    for (const lt of (basement ? hospital.basementLights : hospital.lights)) {
      const on = basement ? false : lt.working;                 // the cave is pitch black; one light works on each floor
      if (on && !basement) {                                    // a pool of light on the floor under it
        const fl = toCam(lt.x, lt.y, base);
        if (fl.z > 0.3) {
          const fx2 = w / 2 + (fl.s / fl.z) * focal, fy2 = horizon + ((eye - fl.h) * focal) / fl.z, rr = (4 * focal) / fl.z;
          const pool = c.createRadialGradient(fx2, fy2, 1, fx2, fy2, rr);
          pool.addColorStop(0, "rgba(220,240,225,0.22)"); pool.addColorStop(1, "rgba(220,240,225,0)");
          c.fillStyle = pool;
          c.fillRect(fx2 - rr, fy2 - rr * 0.5, rr * 2, rr);
        }
      }
      c.save();
      if (basement) {
        // an old bulb dangling on a wire in the cave
        const top = toCam(lt.x, lt.y, ch), bulb = toCam(lt.x, lt.y, ch - 0.7);
        if (bulb.z > 0.3 && top.z > 0.3) {
          c.strokeStyle = "#111";
          c.lineWidth = 1;
          line3(top, bulb);
          const bx2 = w / 2 + (bulb.s / bulb.z) * focal, by2 = horizon + ((eye - bulb.h) * focal) / bulb.z;
          const br = Math.max(2, (0.09 * focal) / bulb.z);
          if (on) {
            const glow = c.createRadialGradient(bx2, by2, 0, bx2, by2, br * 10);
            glow.addColorStop(0, "rgba(255,200,120,0.35)");
            glow.addColorStop(1, "rgba(255,200,120,0)");
            c.fillStyle = glow;
            c.fillRect(bx2 - br * 10, by2 - br * 10, br * 20, br * 20);
          }
          c.fillStyle = on ? "#ffe2a0" : "#3a332a";
          c.beginPath();
          c.arc(bx2, by2, br, 0, Math.PI * 2);
          c.fill();
        }
      } else {
        if (on) { c.shadowColor = "#cfeedd"; c.shadowBlur = 20; }
        quad([toCam(lt.x - 0.8, lt.y - 0.25, ch), toCam(lt.x + 0.8, lt.y - 0.25, ch),
              toCam(lt.x + 0.8, lt.y + 0.25, ch), toCam(lt.x - 0.8, lt.y + 0.25, ch)], on ? "#cfe8d8" : "#2a2d2b");
      }
      c.restore();
    }
  }

  // Work out where every tree, bush, rock (and maybe the ghost) is on screen
  const list = [];
  function place(obj) {
    const dx = obj.x - player.x, dy = obj.y - player.y;
    const z = dx * fx + dy * fy;              // how far in front
    if (z < 0.3 || z > o.fogDist) return;
    const side = -dx * fy + dy * fx;          // how far to the side
    const sx = w / 2 + (side / z) * focal;
    const sc = focal / z;                     // pixels per step at that distance
    const reach = obj.kind === "pine" ? obj.spread + 0.5 : obj.kind === "spider" ? 7 : obj.kind === "grinner" ? 2 : 4;
    if (sx + reach * sc < 0 || sx - reach * sc > w) return;
    list.push({ obj, z, sx, sc });
  }
  if (!inside) for (const t of nearThings) place(t);   // inside, the walls hide the forest
  if (!inside) for (const leg of legs) if (!leg.got) place(leg);
  if (o.showGhost || finale === "chase") place(ghost);   // in the final chase you can see her without the phone
  if (hospital) {
    for (const seg of (basement ? hospital.basementSegs : hospital.segments)) {
      // only the side of the wall facing you (outside or inside)
      const facing = (player.x - seg.mx) * seg.nx + (player.y - seg.my) * seg.ny;
      if (inside ? facing >= 0 : facing <= 0) continue;
      const z = (seg.mx - player.x) * fx + (seg.my - player.y) * fy;
      if (z < -seg.len || z > o.fogDist + 10) continue;
      list.push({ obj: seg, z: Math.max(z, 0.3), sx: w / 2, sc: 0 });
    }
    if (S.hospital.stackHeight > 0 && !inside) place(hospital.stack);
    if (inside) for (const bed of hospital.beds) if (bed.fz === base) place(bed);
    if (inside) for (const pr of hospital.props) if (pr.fz === base) place(pr);
    if (finale === "chase" && !inside) { place(grinner); place(spider); }
    if (basement && (fan.mode === "coming" || fan.mode === "leaving")) place(fan);
    if (basement && hospital.lostKey) place(hospital.lostKey);
    if (basement) {
      place(spider);
      for (const a of hospital.arms) if (!a.got) place(a);
    }
    if (inside && !basement) {
      const st = hospital.stairs, mid = stairPt(st.len / 2, st.wid / 2, 0);
      if (!upstairs) {
        list.push({ obj: { kind: "stairs" }, z: Math.max(0.3, mid.z), sx: w / 2, sc: 0 });
      } else {
        // railings around the hole: the open side and the bottom end
        for (const r of [{ a0: 0, c0: st.wid, a1: st.len, c1: st.wid }, { a0: 0, c0: 0, a1: 0, c1: st.wid }]) {
          const m = stairPt((r.a0 + r.a1) / 2, (r.c0 + r.c1) / 2, 0);
          list.push({ obj: { kind: "rail", r }, z: Math.max(0.3, m.z), sx: w / 2, sc: 0 });
        }
      }
    }
  }
  list.sort((p, q) => q.z - p.z);            // far things first

  for (const it of list) {
    const groundY = horizon + (eye - ((it.obj.fz || 0) - base)) * it.sc;
    const light = lightAt(it.sx, it.z), fa = fogAt(it.z);
    const kind = it.obj.kind;
    if (it.obj === ghost) {
      let alpha = clamp(1 - it.z / S.ghost.visibleDistance, 0, 1) * (0.7 + Math.random() * 0.3);
      if (finale === "chase") alpha = Math.max(alpha, 0.85);                 // bright in the final chase
      const jitter = ghost.stunLeft > 0 ? (Math.random() - 0.5) * it.sc * 0.2 : 0;
      if (Math.random() > 0.04) drawGhostWoman(c, it.sx + jitter, groundY, S.ghost.height * it.sc * (finale === "chase" ? S.finale.ghostScale : 1), alpha, o.time);
    } else if (kind === "wall") {
      drawWall(it.obj);
    } else if (kind === "stack") {
      drawStack(it, groundY, light, fa);
    } else if (kind === "bed") {
      drawBed(it, groundY, light, fa);
    } else if (kind === "leg") {
      drawLeg(it, groundY, light, fa);
    } else if (kind === "car") {
      drawCar(it, groundY, light, fa);
    } else if (kind === "crate") {
      drawCrate(it, groundY, light, fa);
    } else if (kind === "lostKey") {
      // your key on the cave floor: it glints in the dark (and glows on Easy)
      const glint = 0.5 + 0.5 * Math.sin(o.time * 3);
      if (S.legHintsByMode[mode] === "highlight") {
        c.save(); c.strokeStyle = `rgba(255,230,90,${0.4 + 0.4 * glint})`; c.lineWidth = Math.max(1.5, 0.04 * it.sc);
        c.shadowColor = "rgba(255,220,80,0.9)"; c.shadowBlur = 12;
        c.beginPath(); c.ellipse(it.sx, groundY, 0.45 * it.sc, 0.1 * it.sc, 0, 0, Math.PI * 2); c.stroke(); c.restore();
      }
      c.save(); c.shadowColor = "rgba(255,220,120,0.9)"; c.shadowBlur = 6 + glint * 10;
      finKeyIcon(c, it.sx, groundY - 0.04 * it.sc, 0.3 * it.sc, 0.1);
      c.restore();
    } else if (kind === "fan") {
      drawFan(it, groundY, light, fa);
    } else if (kind === "grinner") {
      drawGrinnerBody(c, it.sx, groundY, S.finale.grinnerHeight * it.sc, shade([168, 162, 150], Math.max(light, 0.85), fa, fog), o.time, grinner.run);
    } else if (kind === "spider") {
      drawSpider(it, groundY, light, fa);
    } else if (kind === "arm") {
      drawArm(it, groundY, light, fa);
    } else if (kind === "gator") {
      drawGator(it, groundY, light, fa);
    } else if (kind === "elephant") {
      drawElephant(it, groundY, light, fa);
    } else if (kind === "bear") {
      drawBear(it, groundY, light, fa);
    } else if (kind === "unicorn") {
      drawUnicorn(it, groundY, light, fa);
    } else if (kind === "stalactite") {
      drawStalactite(it, groundY, light, fa);
    } else if (kind === "stalagmite") {
      drawStalagmite(it, groundY, light, fa);
    } else if (kind === "cobweb") {
      drawCobweb(it, groundY, light, fa);
    } else if (kind === "ladder") {
      drawLadder(it, groundY, light, fa);
    } else if (kind === "tube") {
      drawTube(it, groundY, light, fa);
    } else if (kind === "scientist") {
      drawScientist(it, groundY, light, fa);
    } else if (kind === "stairs") {
      const st = hospital.stairs;
      const rx = player.x - st.x0, ry = player.y - st.y0;
      drawStairs(rx * st.ix + ry * st.iy > st.wid);   // show the side if you're beside them
    } else if (kind === "rail") {
      drawRail(it.obj.r);
    } else if (kind === "tree") {
      drawTree(c, it, horizon, groundY, light, fa, fog);
      if (it.obj.poster) drawPoster(c, it, groundY, light, fa, fog);
    } else if (kind === "pine") {
      drawPine(c, it, horizon, groundY, light, fa, fog);
    } else if (kind === "bush") {
      const b = it.obj, sc = it.sc;
      for (let k = -1; k <= 1; k++) {
        c.fillStyle = shade([26, 36, 24], light * b.shade * (1 - Math.abs(k) * 0.2), fa, fog);
        c.beginPath();
        c.ellipse(it.sx + k * b.r * 0.55 * sc, groundY - b.h * sc * (0.45 - Math.abs(k) * 0.1),
                  b.r * 0.65 * sc, b.h * sc * 0.55, 0, 0, Math.PI * 2);
        c.fill();
      }
    } else if (kind === "rock") {
      const r = it.obj, sc = it.sc;
      const rg = c.createLinearGradient(0, groundY - r.h * sc, 0, groundY);
      rg.addColorStop(0, shade([78, 80, 84], light * r.shade, fa, fog));
      rg.addColorStop(1, shade([30, 31, 33], light * r.shade, fa, fog));
      c.fillStyle = rg;
      c.beginPath();
      c.ellipse(it.sx, groundY - r.h * sc * 0.35, r.r * sc, r.h * sc * 0.7, 0, Math.PI, 0);
      c.lineTo(it.sx + r.r * sc, groundY);
      c.lineTo(it.sx - r.r * sc, groundY);
      c.fill();
    }
  }

  // Flashlight beam glowing in the mist, with floating dust
  if (flashPower > 0) {
    c.save();
    c.globalAlpha = flashPower;
    c.globalCompositeOperation = "lighter";
    const beam = c.createRadialGradient(w / 2, h * 0.52, 0, w / 2, h * 0.52, w * 0.5);
    beam.addColorStop(0, "rgba(255,230,190,0.10)");
    beam.addColorStop(1, "rgba(255,230,190,0)");
    c.fillStyle = beam;
    c.fillRect(0, 0, w, h);
    for (let i = 0; i < 24; i++) {
      const px = w / 2 + Math.sin(i * 12.9 + o.time * 0.3) * w * 0.3;
      const py = h * 0.52 + Math.cos(i * 7.3 + o.time * 0.2) * h * 0.2;
      c.fillStyle = `rgba(255,240,210,${0.12 + 0.1 * Math.sin(o.time + i)})`;
      c.fillRect(px, py, 1.5, 1.5);
    }
    c.restore();
  }

  // Dark edges
  const vig = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.8)");
  c.fillStyle = vig;
  c.fillRect(0, 0, w, h);
}

// A bare, dead tree with a round trunk and bark
function drawTree(c, it, horizon, groundY, light, fa, fog) {
  const t = it.obj, sc = it.sc, x = it.sx;
  const base = [64, 60, 58], L = light * t.shade;
  const half = Math.max(0.5, t.r * sc);
  const topY = horizon - (t.h - eyeH()) * sc;

  // Trunk, lit from one side so it looks round
  if (half > 2) {
    const g = c.createLinearGradient(x - half, 0, x + half, 0);
    g.addColorStop(0, shade(base, L * 0.35, fa, fog));
    g.addColorStop(0.4, shade(base, L, fa, fog));
    g.addColorStop(0.75, shade(base, L * 0.6, fa, fog));
    g.addColorStop(1, shade(base, L * 0.25, fa, fog));
    c.fillStyle = g;
  } else {
    c.fillStyle = shade(base, L * 0.7, fa, fog);
  }
  c.beginPath();
  c.moveTo(x - half * 0.55, topY);
  c.lineTo(x + half * 0.55, topY);
  c.lineTo(x + half, groundY - half * 1.5);
  c.quadraticCurveTo(x + half * 1.05, groundY, x + half * 1.6, groundY);   // roots
  c.lineTo(x - half * 1.6, groundY);
  c.quadraticCurveTo(x - half * 1.05, groundY, x - half, groundY - half * 1.5);
  c.closePath();
  c.fill();

  // Bark cracks on close trees
  if (half > 6) {
    c.strokeStyle = "rgba(0,0,0,0.3)";
    c.lineWidth = Math.max(1, half * 0.06);
    for (const bl of t.barkLines) {
      const y1 = groundY - (groundY - topY) * bl.start;
      const y2 = y1 - (groundY - topY) * bl.len;
      c.beginPath();
      c.moveTo(x + bl.off * half * 0.6, y1);
      c.quadraticCurveTo(x + bl.off * half * 0.6 + half * 0.1, (y1 + y2) / 2, x + bl.off * half * 0.6, y2);
      c.stroke();
    }
  }

  // Branches (some split in two)
  c.strokeStyle = shade(base, L * 0.5, fa, fog);
  c.lineCap = "round";
  for (const b of t.branches) {
    const y = groundY - (groundY - topY) * b.h;
    const x0 = x + b.side * half * 0.5;
    const x1 = x + b.side * (half * 0.5 + b.len * sc), y1 = y - b.rise * sc;
    c.lineWidth = Math.max(1, half * 0.4);
    c.beginPath();
    c.moveTo(x0, y);
    c.quadraticCurveTo((x0 + x1) / 2, y - b.rise * sc * 0.2, x1, y1);
    c.stroke();
    if (b.fork) {
      c.lineWidth = Math.max(1, half * 0.2);
      c.beginPath();
      c.moveTo((x0 + x1) / 2, y - b.rise * sc * 0.35);
      c.lineTo((x0 + x1) / 2 + b.side * b.len * sc * 0.3, y1 - b.rise * sc * 0.8);
      c.stroke();
    }
  }
}

// A paper poster nailed to a tree: WANTED (Dr. Voss) or MISSING (Zev)
function drawPoster(c, it, groundY, light, fa, fog) {
  const P = S.posters, info = P[it.obj.poster.type], sc = it.sc;
  const pw = P.width * sc, ph = P.tall * sc;
  if (pw < 3) return;                                   // too far away to see
  const cx = it.sx, cy = groundY - P.height * sc;
  const L = clamp(light * 1.3, 0, 1);
  c.save();
  c.translate(cx, cy); c.rotate(it.obj.poster.tilt);
  // old yellowed paper with a dark edge
  c.fillStyle = shade([214, 200, 160], L, fa, fog);
  c.fillRect(-pw / 2, -ph / 2, pw, ph);
  c.strokeStyle = shade([120, 100, 70], L, fa, fog); c.lineWidth = Math.max(1, pw * 0.02);
  c.strokeRect(-pw / 2, -ph / 2, pw, ph);
  // torn corner
  c.fillStyle = shade([64, 60, 58], light, fa, fog);
  c.beginPath(); c.moveTo(pw / 2, ph / 2); c.lineTo(pw / 2 - pw * 0.15, ph / 2); c.lineTo(pw / 2, ph / 2 - ph * 0.1); c.fill();
  // nail at the top
  c.fillStyle = shade([60, 60, 60], L, fa, fog);
  c.beginPath(); c.arc(0, -ph * 0.45, Math.max(1, pw * 0.025), 0, Math.PI * 2); c.fill();
  // the photo box
  const bx = -pw * 0.32, by = -ph * 0.3, bw = pw * 0.64, bh = ph * 0.42;
  c.fillStyle = shade([90, 88, 84], L, fa, fog);
  c.fillRect(bx, by, bw, bh);
  c.save();
  c.beginPath(); c.rect(bx, by, bw, bh); c.clip();
  const r = bw * 0.28, hx = 0, hy = by + bh * 0.48;
  if (it.obj.poster.type === "wanted") {
    c.fillStyle = "#eeeeea";                            // white lab coat shoulders
    c.beginPath(); c.ellipse(hx, by + bh, bw * 0.45, bh * 0.28, 0, Math.PI, 0); c.fill();
    finVossHead(c, hx, hy, r, false);
  } else {
    c.fillStyle = "#3a5a7a";                            // Zev's blue hoodie
    c.beginPath(); c.ellipse(hx, by + bh, bw * 0.45, bh * 0.28, 0, Math.PI, 0); c.fill();
    c.fillStyle = P.zevSkin;
    c.beginPath(); c.ellipse(hx, hy, r * 0.85, r * 1.05, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(255,255,255,0.35)";             // shiny bald head
    c.beginPath(); c.ellipse(hx - r * 0.3, hy - r * 0.65, r * 0.25, r * 0.12, -0.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = P.zevBeard;                           // short, neat white beard along his jaw (a young guy)
    c.beginPath();
    c.moveTo(hx - r * 0.82, hy + r * 0.2);
    c.quadraticCurveTo(hx - r * 0.75, hy + r * 1.05, hx, hy + r * 1.12);
    c.quadraticCurveTo(hx + r * 0.75, hy + r * 1.05, hx + r * 0.82, hy + r * 0.2);
    c.quadraticCurveTo(hx + r * 0.6, hy + r * 0.6, hx + r * 0.28, hy + r * 0.52);
    c.quadraticCurveTo(hx, hy + r * 0.44, hx - r * 0.28, hy + r * 0.52);
    c.quadraticCurveTo(hx - r * 0.6, hy + r * 0.6, hx - r * 0.82, hy + r * 0.2);
    c.fill();
    c.fillStyle = "rgba(255,120,110,0.25)";             // rosy young cheeks
    for (const k of [-1, 1]) { c.beginPath(); c.ellipse(hx + k * r * 0.48, hy + r * 0.22, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.fill(); }
    c.strokeStyle = "#3a2618"; c.lineWidth = Math.max(0.5, r * 0.07);   // dark eyebrows
    for (const k of [-1, 1]) { c.beginPath(); c.moveTo(hx + k * r * 0.18, hy - r * 0.26); c.quadraticCurveTo(hx + k * r * 0.32, hy - r * 0.32, hx + k * r * 0.46, hy - r * 0.25); c.stroke(); }
    for (const k of [-1, 1]) {                          // big bright eyes
      c.fillStyle = "#fff";
      c.beginPath(); c.ellipse(hx + k * r * 0.32, hy - r * 0.07, r * 0.13, r * 0.1, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#4a3020";
      c.beginPath(); c.arc(hx + k * r * 0.32, hy - r * 0.06, Math.max(0.5, r * 0.075), 0, Math.PI * 2); c.fill();
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(hx + k * r * 0.3, hy - r * 0.09, Math.max(0.3, r * 0.025), 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = "#8a4a40"; c.lineWidth = Math.max(0.5, r * 0.06);   // small smile
    c.beginPath(); c.arc(hx, hy + r * 0.56, r * 0.15, Math.PI * 0.2, Math.PI * 0.8); c.stroke();
  }
  c.restore();
  // make the photo grey like an old printout, and dark in the shadows
  c.fillStyle = `rgba(0,0,0,${(1 - L) * 0.85})`;
  c.fillRect(bx, by, bw, bh);
  // the words (only when close enough to read)
  if (pw > 18) {
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillStyle = shade(it.obj.poster.type === "wanted" ? [120, 20, 16] : [20, 20, 20], L, fa, fog);
    c.font = `bold ${Math.round(ph * 0.12)}px Georgia, serif`;
    c.fillText(info.title, 0, -ph * 0.39);
    c.fillStyle = shade([30, 26, 20], L, fa, fog);
    c.font = `bold ${Math.round(ph * 0.08)}px Georgia, serif`;
    c.fillText(info.name, 0, ph * 0.2);
    c.font = `${Math.round(ph * 0.05)}px Georgia, serif`;
    c.fillText(info.line, 0, ph * 0.31);
    c.fillText(info.line2, 0, ph * 0.39);
  }
  c.restore();
}

// A dark pine tree with layers of needles
function drawPine(c, it, horizon, groundY, light, fa, fog) {
  const t = it.obj, sc = it.sc, x = it.sx;
  const L = light * t.shade;
  const topY = horizon - (t.h - eyeH()) * sc;
  const height = groundY - topY;
  const half = Math.max(0.5, t.r * sc);
  c.fillStyle = shade([50, 42, 36], L * 0.6, fa, fog);
  c.fillRect(x - half, topY + height * 0.1, half * 2, height * 0.9);

  const lowest = groundY - height * 0.22;
  for (let k = 0; k < t.layers; k++) {
    const f = k / (t.layers - 1);
    const yBase = lerp(lowest, topY + height * 0.12, f);
    const width = t.spread * sc * (1 - f * 0.8);
    const layerH = height * 0.24;
    c.fillStyle = shade([20, 32, 24], L * (0.75 + 0.35 * f), fa, fog);
    c.beginPath();
    c.moveTo(x - width, yBase);
    for (let j = 1; j <= 5; j++) {   // ragged left edge
      const p = j / 6;
      c.lineTo(x - width * (1 - p) - (j % 2) * width * 0.12, yBase - layerH * p + (j % 2) * layerH * 0.06);
    }
    c.lineTo(x, yBase - layerH);
    for (let j = 5; j >= 1; j--) {   // ragged right edge
      const p = j / 6;
      c.lineTo(x + width * (1 - p) + (j % 2) * width * 0.12, yBase - layerH * p + (j % 2) * layerH * 0.06);
    }
    c.lineTo(x + width, yBase);
    c.quadraticCurveTo(x, yBase + layerH * 0.12, x - width, yBase);
    c.fill();
  }
}

// ==========================================================
//  THE GHOST: a pale woman, long black hair, one red eye
// ==========================================================
function drawGhostWoman(c, x, footY, hp, alpha, time) {
  if (hp < 4) return;
  const headR = hp * 0.085;
  const headY = footY - hp + headR * 1.1;
  const shoulderY = headY + headR * 1.9;
  const sw = hp * 0.12;
  const sway = Math.sin(time * 1.3) * hp * 0.008;
  c.save();
  c.globalAlpha = alpha;

  // Hair behind her
  c.fillStyle = "#030405";
  c.beginPath();

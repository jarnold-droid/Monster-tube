}

// ==========================================================
//  UPDATE — the game rules (runs about 60 times a second)
// ==========================================================
function update(dt) {
  if (state === "intro") return;     // waiting for "Tap to begin"
  if (state === "filmCut") {
    filmT += dt;
    if (filmT >= S.chase.filmCutSeconds) startWin();
    return;
  }
  if (state === "hatchCut") {
    hatchT += dt;
    while (hatchSoundsDone < hatchEvents.length && hatchT >= hatchEvents[hatchSoundsDone][0]) hatchEvents[hatchSoundsDone++][1]();
    if (hatchT >= S.hospital.hatchCutSeconds) endHatchCutscene();
    return;
  }
  if (state === "finale") {
    // the knife: press CATCH within 3 seconds!
    if (finT >= S.finale.catchAt && !finCatch.done) {
      if (!finCatch.active) {
        finCatch.active = true;
        finCatch.t = 0;
        $("btnCatch").classList.remove("hidden");
        // it pops up in a RANDOM spot on the screen (not too close to the edges)
        $("btnCatch").style.left = (S.finale.catchArea.left + Math.random() * (S.finale.catchArea.right - S.finale.catchArea.left)) + "%";
        $("btnCatch").style.top = (S.finale.catchArea.top + Math.random() * (S.finale.catchArea.bottom - S.finale.catchArea.top)) + "%";
      }
      finCatch.t += dt;
      finT = S.finale.catchAt + finCatch.t * 0.3;        // the knife creeps toward your face…
      $("btnCatch").textContent = S.text.catchButton + " " + Math.max(1, Math.ceil(S.finale.catchSecondsByMode[mode] - finCatch.t));
      if (finCatch.t >= S.finale.catchSecondsByMode[mode]) {         // too slow: the knife gets you…
        finCatch.done = true;
        finCatch.failed = true;
        finCatch.failT = 0;
        $("btnCatch").classList.add("hidden");
        $("btnSkip").classList.add("hidden");
        sfxNoise("lowpass", 800, 100, 0.6, 0.5);
      }
      return;
    }
    if (finCatch.failed) {                                 // …the screen goes black, back to the menu
      finCatch.failT += dt;
      if (finCatch.failT >= S.finale.blackoutSeconds) {
        finCatch.failed = false;
        cutCv.classList.add("hidden");
        gameOver("knife");
      }
      return;
    }
    finT += dt;
    while (finEventsDone < finaleEvents.length && finT >= finaleEvents[finEventsDone][0]) finaleEvents[finEventsDone++][1]();
    if (finT >= S.finale.cutsceneSeconds) startChase();
    return;
  }
  if (state === "win") {
    winT += dt;
    heliTimer -= dt;
    if (heliTimer <= 0 && winT < S.finale.planeAt) { heliTimer = 0.11; sfxTone("sine", 70, 40, 0.09, 0.22); }      // chop-chop-chop
    if (winT >= S.finale.planeAt && !planeSound) { planeSound = true; sfxNoise("lowpass", 400, 900, 2.2, 0.35); }   // plane landing
    if (winT >= S.finale.planeAt + 4 && !planeSound2) { planeSound2 = true; sfxNoise("lowpass", 1200, 300, 3.5, 0.45); sfxTone("sawtooth", 90, 140, 3.5, 0.08); }  // take off!
    if (winT >= 2 && winT < 4.6) { gunTimer -= dt; if (gunTimer <= 0) { gunTimer = 0.06; sfxNoise("bandpass", 1600, 700, 0.05, 0.3); } }
    if (winT >= S.finale.winSeconds) endWin();
    return;
  }
  if (state === "cutscene") {
    cutT += dt;
    cutsceneSounds();
    if (cutT >= cutTotal()) endCutscene();
    return;
  }
  if (state === "playing") {
    updatePlaying(dt);
  } else if (state === "scare" && scare.kind === "grinner") {
    scare.t += dt;
    if (scare.t >= S.grinScare.seconds) gameOver("grinner");
  } else if (state === "scare" && scare.kind === "spider") {
    scare.t += dt;
    const SS = S.spiderScare;
    if (!scare.shrieked && scare.t >= SS.grabSeconds + SS.liftSeconds + SS.mouthSeconds * 0.5) {
      scare.shrieked = true;
      playChomp();
    }
    if (scare.t >= SS.grabSeconds + SS.liftSeconds + SS.mouthSeconds) gameOver("spider");
  } else if (state === "scare") {
    scare.t += dt;
    if (!scare.shrieked && scare.t >= S.scare.flickerSeconds) {
      scare.shrieked = true;
      if (S.scare.ghostScream) playShriek();             // (off: the ghost is just static)
    }
    if (scare.t >= S.scare.flickerSeconds + S.scare.faceSeconds) gameOver("ghost");
  }
  updateUI();
}

function updatePlaying(dt) {
  // 1. Walk and turn
  const jt = joy.x * Math.abs(joy.x) * S.joystick.turnStrength;      // joystick turning (gentle in the middle, fast at the edge)
  const turn = clamp((held.right ? 1 : 0) - (held.left ? 1 : 0) + jt, -1, 1);
  player.angle += turn * S.player.turnSpeed * dt;
  const walk = clamp((held.fwd ? 1 : 0) - (held.back ? 1 : 0) + joy.y, -1, 1);   // keyboard or joystick
  // Sprinting (depends on the mode). With the bar, sprinting uses it up and it refills when you stop.
  const sprintRule = S.sprintByMode[mode];
  sprinting = held.sprint && walk !== 0 && sprintRule !== "none" && !crouching &&
              (sprintRule === "unlimited" || (!tired && stamina > 0));
  if (sprintRule !== "bar") {
    stamina = 100;
    tired = false;
  } else if (sprinting) {
    stamina -= S.player.staminaDrain * dt;
    if (stamina <= 0) { stamina = 0; tired = true; }
  } else {
    stamina = Math.min(100, stamina + S.player.staminaRefill * dt);
    if (tired && stamina >= S.player.tiredUntil) tired = false;
  }
  if (walk !== 0) {
    const a = player.angle * DEG;
    const speed = S.player.moveSpeed * (sprinting ? S.player.sprintMultiplier : 1) * (crouching ? S.crouch.speed : 1);
    movePlayer(Math.cos(a) * walk * speed * dt, Math.sin(a) * walk * speed * dt);
    updateStairs();
    const before = Math.floor(bobPhase / Math.PI);
    bobPhase += dt * S.player.stepsPerSecond * (sprinting ? S.player.sprintMultiplier : 1) * Math.PI;
    if (Math.floor(bobPhase / Math.PI) !== before) playStep();
    bob = Math.abs(Math.sin(bobPhase)) * S.player.bobAmount;
  } else {
    bob *= 0.85;
  }

  // 1b. Jumping
  landedNoise = false;
  if (jumpZ > 0) {
    jumpZ += jumpV * dt;
    jumpV -= S.jump.gravity * dt;
    if (jumpZ <= 0) { jumpZ = 0; jumpV = 0; landedNoise = true; playStep(); playStep(); }
  }

  // 2. Battery
  let drain = S.battery.drainIdle;
  if (phoneUp) drain += S.battery.drainPhoneUp;
  if (flashlightOn) drain += S.battery.drainFlashlight;
  if (recordingOn) drain += S.battery.drainRecording;
  if (!S.battery.neverDies) {
    battery -= drain * dt;
    if (battery <= 0) { battery = 0; gameOver("battery"); return; }
  }

  // 3. Danger meter
  if (phoneUp) danger += S.danger.phoneUpPerSecond * dt;
  if (flashlightOn) danger += S.danger.flashlightPerSecond * dt;
  if (recordingOn) danger += S.danger.recordingPerSecond * dt;
  if (!phoneUp && !flashlightOn) danger -= S.danger.cooldownPerSecond * dt;
  danger = clamp(danger, 0, 100);
  if (player.level === 0) danger = 0;   // no ghost in the basement, so no danger from her down there

  // Full danger = she starts chasing you. Calm down and she gives up.
  // Inside the hospital she stops chasing (and rushing) until you go back out.
  const playerInside = inHospitalNow();
  const safeFromGhost = playerInside;   // inside the hospital AND in the basement, the ghost can't get you
  ghost.fz = 0;                        // (she never goes down into the basement)
  if (safeFromGhost) {
    if (ghost.hunting || ghost.rushLeft > 0) showToast(S.text.chaseStopped, 3);
    ghost.hunting = false;
    ghost.rushLeft = 0;
    ghost.rushTimer = 0;
  }
  if (danger >= 100 && !ghost.hunting && !safeFromGhost) { ghost.hunting = true; ghostSeesYou(); }
  if (ghost.hunting && danger < S.ghost.huntStopsAt && finale !== "chase") {
    ghost.hunting = false;
    showToast(S.text.huntOver, 2.5);
  }

  // 3b. The flashlight flickers sometimes (a lot when she's close)
  if (flashlightOn) {
    let chance = S.flashlight.flickerPerSecond;
    if (ghost.dist < S.signal.weakDistance) chance += S.flashlight.flickerNearGhost;
    if (flickerLeft <= 0 && Math.random() < chance * dt) {
      flickerLeft = lerp(S.flashlight.flickerMinSeconds, S.flashlight.flickerMaxSeconds, Math.random());
    }
    if (flickerLeft > 0) {
      flickerLeft -= dt;
      flashPower = Math.random() < 0.5 ? 0 : 0.3 + Math.random() * 0.7;
    } else {
      flashPower = 1;
    }
  } else {
    flashPower = 0;
    flickerLeft = 0;
  }

  // 3c. Shine your light right at her and she's stunned
  if (ghost.stunCooldown > 0) ghost.stunCooldown -= dt;
  if (ghost.stunLeft > 0) {
    ghost.stunLeft -= dt;
    if (ghost.stunLeft <= 0) ghost.stunCooldown = S.ghost.stunCooldownSeconds;
  }
  const aimingAtHer = flashPower > 0.5 && flashlightHitsGhost();
  const stunBlocked = danger >= S.ghost.stunBlockedAt;
  lightBlocked = aimingAtHer && stunBlocked && ghost.stunLeft <= 0;
  if (ghost.stunLeft <= 0 && ghost.stunCooldown <= 0 && aimingAtHer && !stunBlocked) {
    ghost.stunLeft = S.ghost.stunSeconds;
    ghost.rushLeft = 0;
    showToast(S.text.stunned, 2.5);
  }

  // 4. The ghost circles you and comes closer as danger rises.
  //    When she's hunting, she walks straight at you.
  //    Sometimes (half the time) she suddenly RUNS at you.
  if (ghost.stunLeft <= 0 && !(finale === "chase" && chaseT < S.finale.headStart)) {   // frozen while stunned (or at the start of the chase)
    if (!ghost.hunting && ghost.rushLeft <= 0 && !safeFromGhost) {
      ghost.rushTimer += dt;
      if (ghost.rushTimer >= S.ghost.rushEverySeconds) {
        ghost.rushTimer = 0;
        if (Math.random() < S.ghost.rushChance) { ghost.rushLeft = S.ghost.rushSeconds; ghostSeesYou(); }
      }
    }
    if (ghost.rushLeft > 0 && !ghost.hunting) {
      const rx = player.x - ghost.x, ry = player.y - ghost.y, rd = Math.hypot(rx, ry);
      if (rd > 0.001) {
        ghost.x += (rx / rd) * S.ghost.rushSpeed * monsterSpeed * dt;
        ghost.y += (ry / rd) * S.ghost.rushSpeed * monsterSpeed * dt;
      }
      ghost.rushLeft -= dt;
      if (ghost.rushLeft <= 0) placeGhostAway();   // she vanishes
    } else if (ghost.hunting) {
      const hx = player.x - ghost.x, hy = player.y - ghost.y, hd = Math.hypot(hx, hy);
      if (hd > 0.001) {
        const hs = finale === "chase" ? S.finale.ghostSpeed : S.ghost.huntSpeed;
        ghost.x += (hx / hd) * hs * monsterSpeed * dt;
        ghost.y += (hy / hd) * hs * monsterSpeed * dt;
      }
    } else {
      if (Math.random() < S.ghost.turnChancePerSecond * dt) ghost.orbitDir = -ghost.orbitDir;
      let ang = Math.atan2(ghost.y - player.y, ghost.x - player.x);
      ang += ghost.orbitDir * S.ghost.orbitSpeed * monsterSpeed * DEG * dt;
      const want = lerp(S.ghost.farDistance, S.ghost.nearDistance, danger / 100);
      const tx = player.x + Math.cos(ang) * want, ty = player.y + Math.sin(ang) * want;
      const gdx = tx - ghost.x, gdy = ty - ghost.y, gd = Math.hypot(gdx, gdy);
      const step = Math.min(gd, S.ghost.moveSpeed * monsterSpeed * dt);
      if (gd > 0.001) { ghost.x += (gdx / gd) * step; ghost.y += (gdy / gd) * step; }
    }
  }
  ghost.dist = Math.hypot(ghost.x - player.x, ghost.y - player.y);

  // She can't get into the hospital
  keepGhostOutsideHospital();
  ghost.dist = Math.hypot(ghost.x - player.x, ghost.y - player.y);

  // If she touches you: JUMP SCARE (but you're safe inside the hospital)
  const safeInside = inHospitalNow();   // (the basement counts too: no ghost down there)
  if (ghost.dist < S.ghost.touchDistance && !safeInside) { startScare(finale === "chase" ? "grinner" : "ghost"); return; }

  // 5. She kills your signal when she's close
  signal = S.signal.maxBars;
  if (ghost.dist < S.signal.deadDistance) signal = 0;
  else if (ghost.dist < S.signal.weakDistance) signal = Math.max(0, signal - 1);

  // 6. Filming her
  if (recordingOn) recordSeconds += dt;
  // (she only counts if she's stunned)
  const herOnCamera = recordingOn && ghostInCamera();
  if (herOnCamera && ghost.stunLeft > 0) {
    clipTimer += dt;
    if (clipTimer >= S.clip.secondsNeeded) saveClip();
  }

  // 7. Uploading clips (needs signal)
  if (pendingClips > 0 && signal >= S.upload.barsNeeded) {
    uploadTimer += dt;
    if (uploadTimer >= S.upload.secondsPerClip) {
      uploadTimer = 0;
      pendingClips--;
      subscribers += S.clip.subscribers;
      showToast(S.text.uploaded + S.clip.subscribers + S.text.subsLabel, 2.5);
      if (!hospital && subscribers >= S.hospital.spawnAtSubscribers[mode]) spawnHospital();
      playBeep(660, 0.1);
      setTimeout(() => playBeep(990, 0.15), 110);
    }
  }

  // 7b. The hospital door
  if (hospital) {
    const dd = Math.hypot(player.x - hospital.doorX, player.y - hospital.doorY);
    if (!hospital.doorOpen && dd < S.hospital.doorDistance) {
      hospital.doorOpen = true;
      showToast(S.text.doorOpens, 3);
      playCreak();
    }
  }

  // 7c. Pick up legs
  for (const leg of legs) {
    if (leg.got || player.level !== 1) continue;
    if (Math.hypot(player.x - leg.x, player.y - leg.y) < S.legs.pickupDistance) {
      leg.got = true;
      legsFound++;
      showToast(legsFound >= legs.length ? S.text.legsAll : S.text.legFound + " (" + legsFound + "/" + legs.length + ")", 3);
      playBeep(784, 0.1);
      setTimeout(() => playBeep(1046, 0.15), 110);
    }
  }

  // 7d. Talk to the scientist upstairs (and give him the legs)
  if (hospital) {
    const sci = hospital.props.find((pr) => pr.kind === "scientist");
    const near = Math.hypot(player.x - sci.x, player.y - sci.y) < S.hospital.talkDistance;
    const canTalk = near && player.level === 2 && !onStairs && playerInside;
    if (canTalk && !hospital.legsGiven && legs.length > 0 && legsFound >= legs.length) {
      hospital.legsGiven = true;      // the legs go into the tube
      hasKey = true;                  // he gives you the key
      sci.dark = true;                // and he starts looking sick and grey…
      showToast(S.text.legsGiven, 6);
      $("btnKey").classList.remove("hidden");
    }
    // Bring him both arms too… and the finale begins
    if (canTalk && hospital.legsGiven && hospital.saidThanks && armsFound >= hospital.arms.length) { startFinale(); return; }
    if (!canTalk && hospital.legsGiven) hospital.saidThanks = true;
    const vossText = !hospital.legsGiven ? S.text.scientistLine
      : hospital.saidThanks ? S.text.scientistAfter : S.text.scientistThanks;
    if (player.level !== 3) {
      if (canTalk) $("dialogName").textContent = S.text.scientistName;
      if ($("dialogText").textContent !== vossText) {
        $("dialogText").textContent = vossText;
        if (talking) vossLine(vossText);           // (his line changed while you're talking: e.g. you just gave him the legs)
      }
      setTalking(canTalk);
    }
  }
  // 🎮 In the Dave Room: walk up to Dave and he talks to you; walk into the glowing door to leave
  if (hospital && player.level === 3) {
    const cn = hospital.dave.coin;                      // 🪙 the secret coin hiding in the corner
    if (!progress.coins.normal && Math.hypot(player.x - cn.x, player.y - cn.y) < 1.2) {
      progress.coins.normal = true;
      saveProgress();
      refreshModeButtons();
      showToast(S.text.coinFoundNormal, 4);
      playBeep(1046, 0.1); setTimeout(() => playBeep(1318, 0.1), 110); setTimeout(() => playBeep(1568, 0.18), 220);
    }
    const R = hospital.dave, nearDave = Math.hypot(player.x - R.daveProp.x, player.y - R.daveProp.y) < S.daveRoom.talkDistance;
    if (nearDave) { $("dialogName").textContent = S.text.daveName; $("dialogText").textContent = S.text.daveLine; }
    setTalking(nearDave);
    if (Math.hypot(player.x - R.exit.x, player.y - R.exit.y) < 1.0) { leaveDaveRoom(); return; }
  }

  // 7e. The basement hatch (ground floor) and the ladder back up (basement)
  if (hospital) {
    const hd = Math.hypot(player.x - hospital.hatch.x, player.y - hospital.hatch.y);
    const atNow = playerInside && !onStairs && player.level <= 1 && hd < S.hospital.hatchDistance;
    if (atNow && !atHatch) {
      if (finale === "chase") {
        showToast(S.text.chaseHatchLocked, 2);   // no hiding in the cave during the final chase!
      } else if (player.level === 1 && !hasKey) {
        showToast(S.text.hatchLocked, 3);
      } else if (player.level === 1 && !keyHeld) {
        showToast(S.text.holdKeyFirst, 3);
      } else if (player.level === 1 && !hospital.keyDropped) {
        startHatchCutscene();          // the first time: the cutscene (and you drop the key…)
        return;
      } else if (player.level === 1) {
        enterBasement();
        showToast(S.text.goDown, 2.5);
        playCreak();
      } else if (!hasKey) {
        showToast(S.text.needKeyUp, 3);   // you need your key to get out
      } else {
        player.level = 1;
        player.floorZ = 0;
        showToast(S.text.goUp, 2.5);
      }
    }
    atHatch = atNow;               // you have to step off and back on to use it again
  }

  // 7e2. THE DAVE ROOM: touch the back wall of the second floor… and you're teleported into a secret room!
  if (hospital && S.daveRoom.on && mode === "easy" && !finale && player.level === 2 && !onStairs && inHospitalNow()) {   // (Easy only!)
    const seg = hospital.segments.find((sg) => sg.hasDoor);
    if (hospital.backDepth === undefined) {                  // how far the back wall is from the front door
      hospital.backDepth = Math.max(...hospital.wallLines.flatMap((l) => [(l[0] - hospital.doorX) * -seg.nx + (l[1] - hospital.doorY) * -seg.ny, (l[2] - hospital.doorX) * -seg.nx + (l[3] - hospital.doorY) * -seg.ny]));
    }
    const back = (player.x - hospital.doorX) * -seg.nx + (player.y - hospital.doorY) * -seg.ny;
    if (back > hospital.backDepth - S.player.radius - 0.25) { hospital.daveReturn = { x: player.x, y: player.y }; enterDaveRoom(); return; }
  }

  // 7f2. The spider in the cave (it hears you walking) and the arms
  // 7f2b. Find the key you dropped in the cave
  if (hospital && hospital.lostKey && player.level === 0 &&
      Math.hypot(player.x - hospital.lostKey.x, player.y - hospital.lostKey.y) < S.hospital.keyPickupDistance) {
    hospital.lostKey = null;
    hasKey = true;
    $("btnKey").classList.remove("hidden");
    showToast(S.text.keyFound, 3);
    playBeep(1046, 0.1); setTimeout(() => playBeep(1568, 0.15), 110);
  }


  if (finale === "chase") updateChase(dt, walk !== 0);
  else updateSpider(dt, walk !== 0);
  if (state !== "playing") return;
  if (hospital) {
    for (const arm of hospital.arms) {
      if (arm.got || player.level !== 0) continue;
      if (Math.hypot(player.x - arm.x, player.y - arm.y) < S.arms.pickupDistance) {
        arm.got = true;
        armsFound++;
        showToast(armsFound >= hospital.arms.length ? S.text.armsAll : S.text.armFound + " (" + armsFound + "/" + hospital.arms.length + ")", 3);
        playBeep(784, 0.1);
        setTimeout(() => playBeep(1046, 0.15), 110);
      }
    }
  }

  // 7f. (The ending isn't finished yet, so there's no car for now.
  //      drawCar() and driveAway() are kept for later.)

  // 7g. Live comments on your phone (once you have enough subscribers)
  if (phoneUp && subscribers >= S.comments.showAtSubscribers) {
    commentTimer += dt;
    if (commentTimer >= S.comments.everySeconds) {
      commentTimer = 0;
      addComment();
    }
  }

  // 8. Caption
  if (finale === "chase") {
    const left = Math.ceil(S.chase.headStart + chaseLimit() - chaseT);
    const warnSpike = chaseSpikes.some((sp) => sp.t < S.chase.spikeWarn + S.chase.spikeUp);
    captionText = (warnSpike ? S.text.chaseSpikes + "\n" : "") + S.text.chaseCaption + "  ⏱ " + Math.min(chaseLimit(), left) + "s";
  }
  else if (player.level === 0 && spider.mode === "waiting") captionText = S.text.spiderWaiting + Math.ceil(spider.timer);
  else if (player.level === 0 && spider.mode === "charge") captionText = mode === "hard" ? S.text.spiderCaptionHard : S.text.spiderCaption;
  else if (ghost.stunLeft > 0) captionText = S.text.stunnedCaption + Math.ceil(ghost.stunLeft) + "s";
  else if (safeInside && player.level !== 0 && player.level !== 3) captionText = S.text.safeInside;   // (not in the basement or the Dave Room)
  else if (lightBlocked) captionText = S.text.cantStun;
  else if (ghost.hunting) captionText = S.text.hunting;
  else if (ghost.rushLeft > 0) captionText = S.text.rushing;
  else if (herOnCamera) captionText = S.text.needStun;
  else if (danger >= S.danger.warningAt) captionText = S.text.dangerWarning;
  else if (signal === 0) captionText = S.text.noSignalClose;
  else captionText = "";
}

// Walk, but don't walk through trees
function movePlayer(dx, dy) {
  player.x += dx;
  player.y += dy;
  const near = [];
  forEachNearbyChunk(2, (ch) => near.push(...ch.things));
  for (const t of near) {
    if (player.level === 3) break;                      // (no trees in the Dave Room)
    if (t.kind !== "tree" && t.kind !== "pine") continue;
    const ox = player.x - t.x, oy = player.y - t.y;
    const d = Math.hypot(ox, oy), min = t.r + S.player.radius;
    if (d < min && d > 0.0001) {
      player.x += (ox / d) * (min - d);
      player.y += (oy / d) * (min - d);
    }
  }
  // Don't walk through the hospital walls (only through the open door)
  if (hospital) {
    if (player.level === 3) {
      for (const ln of hospital.dave.lines) pushOutOfLine(ln);        // the Dave Room's walls
    } else if (player.level === 0) {
      for (const ln of hospital.basementLines) pushOutOfLine(ln);     // the bigger basement walls
    } else {
      for (const ln of hospital.wallLines) pushOutOfLine(ln);
      if (!hospital.doorOpen || player.level !== 1) pushOutOfLine(hospital.doorLine);   // the door is only on the ground floor
    }
    const st = hospital.stairs;
    if (player.level === 1 || player.level === 2) {
      pushOutOfLine(st.railLine);
      if (stairAt(st, player.x, player.y, 0) === null) {
        if (player.level === 2) pushOutOfLine(st.bottomLine);   // don't fall down the hole
        else pushOutOfLine(st.topLine);                         // can't walk under the top of the stairs
      }
    }
    const myFloor = player.level === 2 ? S.hospital.ceilingHeight : player.level === 0 ? -S.hospital.ceilingHeight : 0;
    for (const pr of hospital.props) {
      if (pr.fz !== myFloor || pr.r === 0) continue;
      const ox = player.x - pr.x, oy = player.y - pr.y;
      const d = Math.hypot(ox, oy), min = pr.r + S.player.radius;
      if (d < min && d > 0.0001) {
        player.x += (ox / d) * (min - d);
        player.y += (oy / d) * (min - d);
      }
    }
    for (const bed of hospital.beds) {
      if (bed.fz !== (player.level === 2 ? S.hospital.ceilingHeight : 0)) continue;
      const ox = player.x - bed.x, oy = player.y - bed.y;
      const d = Math.hypot(ox, oy), min = 0.7 + S.player.radius;
      if (d < min && d > 0.0001) {
        player.x += (ox / d) * (min - d);
        player.y += (oy / d) * (min - d);
      }
    }
  }
}

// If the ghost is in (or touching) the hospital, push her back outside
function keepGhostOutsideHospital() {
  const m = S.hospital.ghostKeepAway;
  if (!insideHospital(ghost.x, ghost.y, m)) return;
  const h = hospital;
  const left = ghost.x - (h.x0 - m), right = h.x1 + m - ghost.x;
  const up = ghost.y - (h.y0 - m), down = h.y1 + m - ghost.y;
  const least = Math.min(left, right, up, down);
  if (least === left) ghost.x = h.x0 - m;
  else if (least === right) ghost.x = h.x1 + m;
  else if (least === up) ghost.y = h.y0 - m;
  else ghost.y = h.y1 + m;
}

// Where are you on the stairs? 0 = bottom, 1 = top, null = not on them
function stairAt(st, x, y, margin) {
  const rx = x - st.x0, ry = y - st.y0;
  const along = rx * st.ux + ry * st.uy, across = rx * st.ix + ry * st.iy;
  if (along < -margin || along > st.len + margin || across < -margin || across > st.wid + margin) return null;
  return clamp(along / st.len, 0, 1);
}

// Walking up and down the stairs changes how high you are
function updateStairs() {
  if (!hospital) { player.floorZ = 0; player.level = 1; return; }
  const H = S.hospital.ceilingHeight;
  if (player.level === 0) { player.floorZ = -H; onStairs = false; return; }   // in the basement
  if (player.level === 3) { player.floorZ = 0; onStairs = false; return; }    // in the Dave Room
  const t = stairAt(hospital.stairs, player.x, player.y, 0);
  if (t !== null) {
    onStairs = true;
    player.floorZ = t * H;
  } else {
    if (onStairs) player.level = player.floorZ > H / 2 ? 2 : 1;   // which end did you leave from?
    onStairs = false;
    player.floorZ = player.level === 2 ? H : 0;
  }
}

// Don't walk through your car
function pushOutOfCar() {
  if (player.level !== 1 || inHospitalNow()) return;
  const ox = player.x - car.x, oy = player.y - car.y, d = Math.hypot(ox, oy), min = 1.6 + S.player.radius;
  if (d < min && d > 0.0001) {
    player.x += (ox / d) * (min - d);
    player.y += (oy / d) * (min - d);
  }
}

// Push you out of a wall line [ax, ay, bx, by]
function pushOutOfLine([ax, ay, bx, by]) {
  const vx = bx - ax, vy = by - ay;
  const t = clamp(((player.x - ax) * vx + (player.y - ay) * vy) / (vx * vx + vy * vy), 0, 1);
  const ox = player.x - (ax + vx * t), oy = player.y - (ay + vy * t);
  const d = Math.hypot(ox, oy), r = S.player.radius;
  if (d < r && d > 0.0001) {
    player.x += (ox / d) * (r - d);
    player.y += (oy / d) * (r - d);
  }
}

// Is your flashlight pointing right at her?
function flashlightHitsGhost() {
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  const dx = ghost.x - player.x, dy = ghost.y - player.y;
  const z = dx * fx + dy * fy;
  if (z < 0.3 || z > S.ghost.stunRange) return false;
  const side = -dx * fy + dy * fx;
  return Math.abs(Math.atan2(side, z)) < S.ghost.stunAngle * DEG;
}

// Is the ghost inside the phone camera's picture?
function ghostInCamera() {
  if (!phoneUp) return false;
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  const dx = ghost.x - player.x, dy = ghost.y - player.y;
  const z = dx * fx + dy * fy;
  if (z < 0.5 || z > S.clip.maxDistance) return false;
  const side = -dx * fy + dy * fx;
  return Math.abs(side / z) < Math.tan((S.look.cameraFov / 2) * DEG) * 0.8;
}

}

// 🕹 The joystick: put your thumb on it and drag. Up = walk forward, down = back, left/right = turn.
// The further you push, the faster you go (joy.x and joy.y are from -1 to 1).
const joy = { x: 0, y: 0, id: null };
{
  const pad = $("joystick"), knob = $("joyKnob");
  const moveKnob = (e) => {
    const r = pad.getBoundingClientRect(), R = r.width / 2 - knob.offsetWidth / 2 + 4;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }                       // keep the knob inside the circle
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / R, ny = -dy / R, dead = S.joystick.deadZone;    // (a tiny push does nothing)
    joy.x = Math.abs(nx) < dead ? 0 : nx;
    joy.y = Math.abs(ny) < dead ? 0 : ny;
  };
  const release = () => { joy.x = 0; joy.y = 0; joy.id = null; knob.style.transform = ""; pad.classList.remove("active"); };
  pad.addEventListener("pointerdown", (e) => {
    joy.id = e.pointerId; pad.classList.add("active");
    if (pad.setPointerCapture) pad.setPointerCapture(e.pointerId);
    moveKnob(e); e.preventDefault();
  });
  pad.addEventListener("pointermove", (e) => { if (e.pointerId === joy.id) moveKnob(e); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) pad.addEventListener(ev, (e) => { if (e.pointerId === joy.id) release(); });
}

// Save a checkpoint (1 = hospital, 2 = cave, 3 = the monster) for the mode you're playing
function reachCheckpoint(n) {
  if (!progress.cp) progress.cp = { easy: 0, normal: 0, hard: 0 };
  if ((progress.cp[mode] || 0) >= n) return;
  progress.cp[mode] = n;
  saveProgress();
  setTimeout(() => showToast(S.text.checkpointSaved + S.text.checkpoints[n - 1], 2.5), 1500);
}

// Tap a mode: if you have checkpoints there, pick where to start
let pickedMode = "easy";
function chooseStart(m) {
  if ((m === "normal" && !progress.easy) || (m === "hard" && !progress.normal)) return;
  const reached = (progress.cp && progress.cp[m]) || 0;
  if (reached === 0) { startGame(m); return; }
  pickedMode = m;
  $("cpTitle").textContent = S.text.checkpointTitle + S.text[m + "Button"];
  const box = $("cpButtons");
  box.innerHTML = "";
  const options = [S.text.fromBeginning, ...S.text.checkpoints];
  options.forEach((label, n) => {
    const btn = document.createElement("button");
    const open = n <= reached;
    btn.textContent = (open ? "" : S.text.lockIcon) + label;
    btn.disabled = !open;
    btn.addEventListener("click", () => {
      $("checkpointScreen").classList.add("hidden");
      startFromCheckpoint(pickedMode, n);
    });
    box.appendChild(btn);
  });
  $("checkpointScreen").classList.remove("hidden");
}

// Start a game and jump ahead to a checkpoint
function startFromCheckpoint(m, n) {
  startGame(m);
  if (state !== "playing" || n === 0) return;
  // 1: the hospital is here
  subscribers = Math.max(subscribers, S.hospital.spawnAtSubscribers[mode]);
  spawnHospital();
  hospital.doorOpen = true;
  if (n >= 2) {
    // 2: you gave Dr. Voss the legs, have the key, and you're in the cave
    for (const leg of legs) leg.got = true;
    legsFound = legs.length;
    hospital.legsGiven = true;
    hospital.saidThanks = true;
    hospital.hatchOpen = true;
    hospital.props.find((pr) => pr.kind === "scientist").dark = true;
    hasKey = true;
    $("btnKey").classList.remove("hidden");
    player.level = 0;
    player.floorZ = -S.hospital.ceilingHeight;
    player.x = hospital.hatch.x;
    player.y = hospital.hatch.y;
    atHatch = true;                  // so you don't climb straight back up
    onStairs = false;
    flashlightOn = false;
    if (n === 2) dropKey();          // your key is somewhere in the dark…
  }
  if (n >= 3) {
    // 3: you brought him the arms… Dr. Voss turns into a monster
    for (const a of hospital.arms) a.got = true;
    armsFound = hospital.arms.length;
    player.level = 2;
    player.floorZ = S.hospital.ceilingHeight;
    startFinale();
    return;
  }
  showToast(S.text.startingAt + S.text.checkpoints[n - 1], 3);
}

  }

    const ah = S.legHintsByMode[mode];
    if (player.level === 0 && ah !== "none" && armsFound < hospital.arms.length) {

  if (finale === "chase") {
    legText = "";
    const hint = S.legHintsByMode[mode];                 // Easy: distance + arrow, Normal: distance, Hard: nothing
    if (chasePhone && hint !== "none") {
      const pdx = chasePhone.x - player.x, pdy = chasePhone.y - player.y;
      const rel = angleDiff(Math.atan2(pdy, pdx) / DEG, player.angle);
      const arrow = ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"][Math.round(((rel + 360) % 360) / 45) % 8];
      legText = S.text.chasePhoneLabel + Math.round(Math.hypot(pdx, pdy)) + S.text.hospitalSteps + (hint === "highlight" ? arrow : "");
    }
  }
  $("legsInfo").textContent = state === "start" || !hospital || player.level === 3 ? "" : legText;   // (nothing to find in the Dave Room)

  if (hospital && !inHospital && finale !== "chase") {
    const dx = hospital.doorX - player.x, dy = hospital.doorY - player.y;
    const rel = angleDiff(Math.atan2(dy, dx) / DEG, player.angle);
    const arrow = ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"][Math.round(((rel + 360) % 360) / 45) % 8];
    $("hospitalMarker").textContent = S.text.hospitalMarker + Math.round(Math.hypot(dx, dy)) + S.text.hospitalSteps + arrow;
  } else {
    $("hospitalMarker").textContent = "";
  }

  $("battery").textContent = S.text.batteryIcon + Math.ceil(battery) + "%";
  $("battery").classList.toggle("low", battery < 20);
  signalBars.forEach((bar, i) => bar.classList.toggle("on", i < signal));
  $("recDot").classList.toggle("on", recordingOn);

  $("dangerFill").style.height = danger + "%";
  $("dangerFill").style.background = `hsl(${120 - danger * 1.2}, 85%, 50%)`;
  $("dangerMeter").classList.toggle("warn", state === "playing" && danger >= S.danger.warningAt);

  $("btnPhone").classList.toggle("on", phoneUp);
  $("btnSprint").classList.toggle("on", sprinting);
  $("sprintFill").style.width = stamina + "%";
  $("sprintBox").classList.toggle("tired", tired);
  $("sprintLabel").textContent = tired ? S.text.tiredLabel : S.text.sprintLabel;
  $("btnLight").classList.toggle("on", flashlightOn);
  $("btnRec").classList.toggle("on", recordingOn);

  $("caption").textContent = state === "playing" && S.bottomTextByMode[mode] ? captionText : "";

  $("clipBox").classList.toggle("hidden", !(state === "playing" && clipTimer > 0));
  $("clipFill").style.width = (clipTimer / S.clip.secondsNeeded) * 100 + "%";
}

// ==========================================================
//  DRAWING THE 3D FOREST
//  (each tree is a flat picture that gets smaller when far away)
// ==========================================================

// Mix a color with the fog. base = [r,g,b], light = brightness, fogAmt = 0..1
function shade(base, light, fogAmt, fog) {
  const r = lerp(base[0] * light, fog[0], fogAmt);
  const g = lerp(base[1] * light, fog[1], fogAmt);
  const b = lerp(base[2] * light, fog[2], fogAmt);
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

// 🪟 See-through windows: the outside world is drawn into this hidden canvas, then shown through the windows
const winCv = document.createElement("canvas"), winCtx = winCv.getContext("2d");
function renderScene(c, w, h, o) {
  const horizon = h * 0.5 + (o.bob || 0);
  const focal = (w / 2) / Math.tan((o.fov / 2) * DEG);
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  let fog = o.fog;
  const fogCss = `rgb(${fog[0]},${fog[1]},${fog[2]})`;

  // Are you inside the hospital? (forceOutside = draw the outside world, for looking out of the windows)
  const inside = o.forceOutside ? false : inHospitalNow();
  let outsideReady = false;
  const outsideView = () => {                     // draw what's outside (once per frame), only when a window needs it
    if (!outsideReady) {
      const k = (c.getTransform ? c.getTransform().a : 1) * S.hospital.windowViewQuality;
      const cw2 = Math.max(1, Math.round(w * k)), ch2 = Math.max(1, Math.round(h * k));
      if (winCv.width !== cw2 || winCv.height !== ch2) { winCv.width = cw2; winCv.height = ch2; }
      winCtx.setTransform(k, 0, 0, k, 0, 0);
      renderScene(winCtx, w, h, Object.assign({}, o, { forceOutside: true, ambient: o.ambient * 1.4 }));
      outsideReady = true;
    }
    return winCv;
  };
  // fill the shape just drawn with quad() with the view of the outside
  const seeOutside = (pts) => {
    if (!quad(pts, "#0c111b")) return;
    c.save(); c.clip();
    const img = outsideView();
    c.drawImage(img, 0, 0, w, h);
    c.globalCompositeOperation = "lighter";                       // brighten the moonlit view a little
    c.globalAlpha = clamp(S.hospital.windowBrightness - 1, 0, 1);
    c.drawImage(img, 0, 0, w, h);
    c.restore();
  };
  // Which floor are we drawing? base = height of that floor. eye = your eyes above it.
  const upstairs = inside && player.floorZ >= S.hospital.ceilingHeight / 2;
  const basement = inside && player.level === 0;
  const daveRoom = inside && player.level === 3;
  const base = basement ? -S.hospital.ceilingHeight : upstairs ? S.hospital.ceilingHeight : 0;
  if (basement) fog = S.hospital.caveFogColor;       // dark brown cave air
  const eye = eyeH() + player.floorZ - base;
  if (inside) {
    // Ceiling above, dirty tiled floor below (or rock and dirt in the cave)
    const L = S.hospital, amb = o.ambient * L.insideLight * 2;
    const ceilColor = daveRoom ? S.daveRoom.ceilingColor : basement ? L.caveCeilingColor : L.ceilingColor;
    const floorColor = daveRoom ? S.daveRoom.floorColor : basement ? L.caveFloorColor : L.floorColor;
    c.fillStyle = shade(ceilColor, amb, 0, fog);
    c.fillRect(0, 0, w, horizon);
    const floor = c.createLinearGradient(0, horizon, 0, h);
    floor.addColorStop(0, shade(floorColor, amb * 0.3, 0, fog));
    floor.addColorStop(1, shade(floorColor, amb * 1.2, 0, fog));
    c.fillStyle = floor;
    c.fillRect(0, horizon, w, h - horizon);
  } else {
    // Sky: black at the top, misty at the horizon
    const sky = c.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, "#020308");
    sky.addColorStop(0.65, "#080c15");
    sky.addColorStop(1, fogCss);
    c.fillStyle = sky;
    c.fillRect(0, 0, w, horizon);

    // Stars
    for (const st of stars) {
      const rel = angleDiff(st.a, player.angle);
      if (Math.abs(rel) > o.fov / 2) continue;
      const twinkle = 0.6 + 0.4 * Math.sin(o.time * 2 + st.a);
      c.fillStyle = `rgba(220,228,255,${st.b * 0.55 * twinkle})`;
      c.fillRect(w / 2 + Math.tan(rel * DEG) * focal, horizon * (1 - st.e) * 0.9, 1.2, 1.2);
    }

    // Moon with a hazy glow
    const moonRel = angleDiff(S.forest.moonAngle, player.angle);
    if (Math.abs(moonRel) < o.fov / 2 + 15) {
      const mx = w / 2 + Math.tan(moonRel * DEG) * focal, my = horizon * 0.3;
      const mr = Math.max(8, w * 0.03);
      const halo = c.createRadialGradient(mx, my, mr, mx, my, mr * 8);
      halo.addColorStop(0, "rgba(170,185,215,0.25)");
      halo.addColorStop(1, "rgba(170,185,215,0)");
      c.fillStyle = halo;
      c.fillRect(mx - mr * 8, my - mr * 8, mr * 16, mr * 16);
      c.fillStyle = "#d4dae6";
      c.beginPath();
      c.arc(mx, my, mr, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = "rgba(120,130,150,0.35)";
      c.beginPath(); c.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.25, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(mx + mr * 0.35, my + mr * 0.3, mr * 0.18, 0, Math.PI * 2); c.fill();
    }

    // Ground: misty far away, dark dirt up close
    const gl = o.ambient * 1.6;
    const ground = c.createLinearGradient(0, horizon, 0, h);
    ground.addColorStop(0, fogCss);
    ground.addColorStop(0.12, `rgb(${Math.round(14 * gl)},${Math.round(15 * gl)},${Math.round(13 * gl)})`);
    ground.addColorStop(1, `rgb(${Math.round(34 * gl)},${Math.round(30 * gl)},${Math.round(24 * gl)})`);
    c.fillStyle = ground;
    c.fillRect(0, horizon, w, h - horizon);
  }
  if (flashPower > 0) {
    c.globalAlpha = flashPower;
    const fl = c.createRadialGradient(w / 2, h * 0.82, 10, w / 2, h * 0.82, w * 0.55);
    fl.addColorStop(0, "rgba(255,228,180,0.28)");
    fl.addColorStop(1, "rgba(255,228,180,0)");
    c.fillStyle = fl;
    c.fillRect(0, horizon, w, h - horizon);
    c.globalAlpha = 1;
  }

  // How bright something is: moonlight + flashlight
  function lightAt(sx, z) {
    let light = daveRoom ? S.daveRoom.light : inside ? o.ambient * (basement ? S.hospital.basementLight : S.hospital.insideLight + S.hospital.workingLightBoost) : o.ambient;
    if (flashPower > 0) {
      const cone = Math.max(0, 1 - Math.abs(sx - w / 2) / (w * 0.5));
      light += S.look.flashlightStrength * flashPower * cone * cone / (1 + z * z * 0.012);
    }
    return light;
  }
  const fogAt = (z) => Math.pow(clamp(z / o.fogDist, 0, 1), 0.7);
  // ----- Drawing the hospital's walls in 3D -----
  function toCam(x, y, hgt) {
    const dx = x - player.x, dy = y - player.y;
    return { s: -dx * fy + dy * fx, z: dx * fx + dy * fy, h: hgt - base };
  }
  // Draw a flat 4-sided shape in 3D (cut off the part behind you)
  function quad(pts, color) {
    const near = 0.2, out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      if (p.z >= near) out.push(p);
      if ((p.z >= near) !== (q.z >= near)) {
        const t = (near - p.z) / (q.z - p.z);
        out.push({ s: p.s + (q.s - p.s) * t, z: near, h: p.h + (q.h - p.h) * t });
      }
    }
    if (out.length < 3) return false;
    c.fillStyle = color;
    c.beginPath();
    out.forEach((p, i) => {
      const X = w / 2 + (p.s / p.z) * focal;
      const Y = horizon + ((eye - p.h) * focal) / p.z;
      if (i === 0) c.moveTo(X, Y); else c.lineTo(X, Y);
    });
    c.closePath();
    c.fill();
    return true;
  }
  // A rectangle on a wall piece: u = left/right (0 to 1), h = height
  function wallRect(seg, u0, u1, h0, h1, out) {
    const ox = seg.nx * out, oy = seg.ny * out;
    const ax = lerp(seg.ax, seg.bx, u0) + ox, ay = lerp(seg.ay, seg.by, u0) + oy;
    const bx = lerp(seg.ax, seg.bx, u1) + ox, by = lerp(seg.ay, seg.by, u1) + oy;
    return [toCam(ax, ay, h0), toCam(bx, by, h0), toCam(bx, by, h1), toCam(ax, ay, h1)];
  }
  function drawWall(seg) {
    const L = S.hospital;
    if (seg.dave) { drawDaveWall(seg); return; }
    if (seg.cave) {
      // a rocky cave wall with lumps and a jagged top
      const mc2 = toCam(seg.mx, seg.my, 0), zc2 = Math.max(0.3, mc2.z);
      const light2 = lightAt(clamp(w / 2 + (mc2.s / zc2) * focal, 0, w), zc2) * seg.shade * seg.tone, fa2 = fogAt(zc2);
      const top2 = base + L.ceilingHeight;
      const pts = [wallRect(seg, 0, 0, base, base, -0.01)[0], wallRect(seg, 1, 1, base, base, -0.01)[0]];
      for (let k = 4; k >= 0; k--) pts.push(wallRect(seg, k / 4, k / 4, top2 - seg.jag[k], top2 - seg.jag[k], -0.01)[0]);
      quad(pts, shade(L.caveRockColor, light2, fa2, fog));
      for (const lp of seg.lumps) {
        const lu = lp.r / seg.len, lh = base + lp.h;
        quad([wallRect(seg, lp.u - lu, lp.u - lu, lh, lh, -0.03)[0], wallRect(seg, lp.u, lp.u, lh - lp.r * 0.8, lh - lp.r * 0.8, -0.03)[0],
              wallRect(seg, lp.u + lu, lp.u + lu, lh, lh, -0.03)[0], wallRect(seg, lp.u, lp.u, lh + lp.r * 0.7, lh + lp.r * 0.7, -0.03)[0]],
             shade(L.caveRockColor, light2 * lp.tone, fa2, fog));
      }
      return;
    }
    const side = inside ? -1 : 1;                       // details go on the side you're looking at
    const bottom = base, top = inside ? base + L.ceilingHeight : L.height;
    const color = inside ? L.insideWallColor : L.wallColor;
    const mc = toCam(seg.mx, seg.my, 0), zc = Math.max(0.3, mc.z);
    const sxc = clamp(w / 2 + (mc.s / zc) * focal, 0, w);
    const light = lightAt(sxc, zc) * seg.shade, fa = fogAt(zc);
    const dw = L.doorWidth / seg.len / 2;
    const doorway = seg.hasDoor && inside && base === 0;   // the door is on the ground floor

    if (doorway) {
      // Wall around the open doorway, so you can see outside
      quad(wallRect(seg, 0, 0.5 - dw, bottom, top, 0), shade(color, light, fa, fog));
      quad(wallRect(seg, 0.5 + dw, 1, bottom, top, 0), shade(color, light, fa, fog));
      quad(wallRect(seg, 0.5 - dw, 0.5 + dw, L.doorHeight, top, 0), shade(color, light, fa, fog));
      // Through the open doorway you can see outside (the forest at night)
      if (S.hospital.seeThroughWindows) seeOutside(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, L.doorHeight, 0));
      else { quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0.9, L.doorHeight, 0), "#0c111b"); quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, 0.9, 0), "#090a08"); }
    } else {
      quad(wallRect(seg, 0, 1, bottom, top, 0), shade(color, light, fa, fog));
      if (inside) quad(wallRect(seg, 0, 1, bottom, bottom + 1.2, side * 0.01), shade([88, 104, 96], light, fa, fog));  // tiles
      else quad(wallRect(seg, 0, 1, 0, 0.7, 0.01), shade([40, 42, 36], light, fa, fog));                             // dirt
    }

    // Windows (inside you only see the ones on your floor)
    for (const [h0, h1] of L.windowFloors) {
      if (seg.hasDoor && !(inside && base > 0)) continue;
      if (h0 < bottom || h1 > top) continue;
      const glow = !inside && seg.glow && h0 > 3 && Math.random() > 0.03;
      if (inside && S.hospital.seeThroughWindows) {
        seeOutside(wallRect(seg, 0.28, 0.72, h0, h1, side * 0.02));                       // 🪟 look out at the forest
        quad(wallRect(seg, 0.28, 0.72, h0, h0 + 0.06, side * 0.025), shade(color, light * 0.8, fa, fog));   // window sill
        quad(wallRect(seg, 0.28, 0.72, (h0 + h1) / 2 - 0.02, (h0 + h1) / 2 + 0.02, side * 0.025), shade(color, light * 0.7, fa, fog));   // cross bar
      } else
      quad(wallRect(seg, 0.28, 0.72, h0, h1, side * 0.02), glow ? shade([150, 160, 110], 1, fa * 0.6, fog) : shade([9, 11, 13], 1, fa, fog));
      quad(wallRect(seg, 0.49, 0.51, h0, h1, side * 0.03), shade(color, light * 0.7, fa, fog));
    }

    if (seg.hasDoor && !inside) {
      if (hospital.doorOpen) {
        quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, L.doorHeight, 0.02), "#020203");   // dark doorway
      } else {
        quad(wallRect(seg, 0.5 - dw, 0.5 + dw, 0, L.doorHeight, 0.02), shade([34, 36, 38], light, fa, fog));
        quad(wallRect(seg, 0.5 - 0.01, 0.5 + 0.01, 0, L.doorHeight, 0.03), shade([12, 12, 12], 1, fa, fog));
      }
      if (Math.sin(o.time * 4) > 0) {   // blinking red light
        c.save();
        c.shadowColor = "#ff0000";
        c.shadowBlur = 14;
        quad(wallRect(seg, 0.46, 0.54, L.doorHeight + 0.3, L.doorHeight + 0.6, 0.03), "#ff2a1a");
        c.restore();
      }
      // Sign with the hospital's name
      const signLow = L.doorHeight + 0.9, signHigh = L.doorHeight + 1.8;
      quad(wallRect(seg, 0.05, 0.95, signLow, signHigh, 0.02), shade([190, 190, 178], light, fa, fog));
      // Flickering red cross near the roof
      if (Math.random() > 0.08) {
        const crossTop = L.height - 0.5, crossBottom = signHigh + 0.8, mid = (crossTop + crossBottom) / 2, arm = (crossTop - crossBottom) / 6;
        const crossW = (crossTop - crossBottom) / 6 / seg.len;
        c.save();
        c.shadowColor = "#ff0000";
        c.shadowBlur = 18;
        const red = shade([230, 30, 25], 1, fa * 0.5, fog);
        quad(wallRect(seg, 0.5 - crossW, 0.5 + crossW, crossBottom, crossTop, 0.03), red);
        quad(wallRect(seg, 0.5 - crossW * 3, 0.5 + crossW * 3, mid - arm, mid + arm, 0.03), red);
        c.restore();
      }
      const sc = toCam(seg.mx + seg.nx * 0.03, seg.my + seg.ny * 0.03, (signLow + signHigh) / 2);
      if (sc.z > 1) {
        const px = focal / sc.z;
        const size = Math.min(0.55 * px, (seg.len * 0.8 * px) / (S.text.hospitalName.length * 0.62));
        c.fillStyle = shade([25, 30, 40], 1, fa, fog);
        c.font = `bold ${Math.max(1, size)}px sans-serif`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText(S.text.hospitalName, w / 2 + (sc.s / sc.z) * focal, horizon + (eye - sc.h) * px);
        c.textAlign = "start";
        c.textBaseline = "alphabetic";
      }
    }
  }

  // ----- The stairs -----
  // A point on the stairs: along = up the stairs, across = away from the wall, hgt = height
  function stairPt(along, across, hgt) {
    const st = hospital.stairs;
    return toCam(st.x0 + st.ux * along + st.ix * across, st.y0 + st.uy * along + st.iy * across, hgt);
  }
  function drawStairs(withSide) {
    const st = hospital.stairs, L = S.hospital, H = L.ceilingHeight, N = L.stairSteps;
    const steps = [];
    for (let k = 0; k < N; k++) {
      const a0 = (st.len * k) / N, a1 = (st.len * (k + 1)) / N;
      const mid = stairPt((a0 + a1) / 2, st.wid / 2, 0);
      steps.push({ a0, a1, top: (H * (k + 1)) / N, z: mid.z, s: mid.s });
    }
    steps.sort((p, q) => Math.hypot(q.z, q.s) - Math.hypot(p.z, p.s));   // far steps first
    for (const sp of steps) {
      const zc = Math.max(0.3, sp.z), light = lightAt(clamp(w / 2 + (sp.s / zc) * focal, 0, w), zc);
      // front of the step
      quad([stairPt(sp.a0, 0, sp.top - H / N), stairPt(sp.a0, st.wid, sp.top - H / N),
            stairPt(sp.a0, st.wid, sp.top), stairPt(sp.a0, 0, sp.top)], shade(L.stairColor, light * 0.6, 0, fog));
      // top of the step
      quad([stairPt(sp.a0, 0, sp.top), stairPt(sp.a0, st.wid, sp.top),
            stairPt(sp.a1, st.wid, sp.top), stairPt(sp.a1, 0, sp.top)], shade(L.stairColor, light, 0, fog));
    }
    if (withSide) {
      // The solid side of the stairs (with the step shape on top)
      const pts = [stairPt(0, st.wid, 0)];
      for (let k = 0; k < N; k++) {
        pts.push(stairPt((st.len * k) / N, st.wid, (H * (k + 1)) / N));
        pts.push(stairPt((st.len * (k + 1)) / N, st.wid, (H * (k + 1)) / N));
      }
      pts.push(stairPt(st.len, st.wid, 0));
      const mid = stairPt(st.len / 2, st.wid, 0), zc = Math.max(0.3, mid.z);
      quad(pts, shade(L.insideWallColor, lightAt(clamp(w / 2 + (mid.s / zc) * focal, 0, w), zc) * 0.8, 0, fog));
    }
  }
  // Metal railing around the hole upstairs (from point A to B, both "along/across")
  function drawRail(r) {
    const H = S.hospital.ceilingHeight;
    const mid = stairPt((r.a0 + r.a1) / 2, (r.c0 + r.c1) / 2, H), zc = Math.max(0.3, mid.z);
    const color = shade([70, 74, 78], lightAt(clamp(w / 2 + (mid.s / zc) * focal, 0, w), zc), 0, fog);
    quad([stairPt(r.a0, r.c0, H + 0.95), stairPt(r.a1, r.c1, H + 0.95), stairPt(r.a1, r.c1, H + 1.05), stairPt(r.a0, r.c0, H + 1.05)], color);
    const posts = Math.max(2, Math.round(Math.hypot(r.a1 - r.a0, r.c1 - r.c0) / 0.6));
    for (let i = 0; i <= posts; i++) {
      const t = i / posts, a = lerp(r.a0, r.a1, t), cc = lerp(r.c0, r.c1, t);
      const dA = (r.a1 - r.a0) === 0 ? 0.03 : 0, dC = (r.c1 - r.c0) === 0 ? 0.03 : 0;
      quad([stairPt(a - dC, cc - dA, H), stairPt(a + dC, cc + dA, H), stairPt(a + dC, cc + dA, H + 1), stairPt(a - dC, cc - dA, H + 1)], color);
    }
  }

  // A line on the floor in 3D (cut off the part behind you)
  function line3(p, q) {
    const near = 0.2;
    if (p.z < near && q.z < near) return;
    const cut = (a, b) => { const t = (near - a.z) / (b.z - a.z); return { s: a.s + (b.s - a.s) * t, z: near, h: a.h + (b.h - a.h) * t }; };
    if (p.z < near) p = cut(p, q);
    else if (q.z < near) q = cut(q, p);
    c.beginPath();
    c.moveTo(w / 2 + (p.s / p.z) * focal, horizon + ((eye - p.h) * focal) / p.z);
    c.lineTo(w / 2 + (q.s / q.z) * focal, horizon + ((eye - q.h) * focal) / q.z);
    c.stroke();
  }

  // A long, skinny monster leg with a clawed foot (a body piece!)
  function drawLeg(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, d = it.obj.dir;     // d = which way the toes point
    const glowing = S.legHintsByMode[mode] === "highlight";       // Easy: the legs are highlighted
    const skin = glowing ? shade([200, 190, 90], 1, fa * 0.3, fog) : shade([84, 96, 84], light + 0.05, fa, fog);
    if (glowing) {                                                 // pulsing ring on the ground
      const pulse = 0.5 + 0.5 * Math.sin(o.time * 4);
      c.save();
      c.strokeStyle = `rgba(255,230,90,${0.4 + 0.4 * pulse})`;
      c.lineWidth = Math.max(1.5, 0.04 * sc);
      c.shadowColor = "rgba(255,220,80,0.9)";
      c.shadowBlur = 12;
      c.beginPath();
      c.ellipse(x, groundY, (0.5 + 0.15 * pulse) * sc, (0.12 + 0.04 * pulse) * sc, 0, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
    const topY = groundY - 1.15 * sc, kneeY = groundY - 0.65 * sc, ankleY = groundY - 0.14 * sc;
    const kx = x - d * 0.06 * sc;                     // the knee bends a little
    c.save();
    c.shadowColor = glowing ? "rgba(255,230,90,0.95)" : "rgba(120,255,160,0.25)";   // bright on Easy, faint otherwise
    c.shadowBlur = glowing ? Math.max(14, 0.5 * sc) : Math.max(3, 0.2 * sc);
    c.fillStyle = skin;
    // thick leg: thigh -> knee -> ankle
    c.beginPath();
    c.moveTo(x - 0.12 * sc, topY);
    c.lineTo(x + 0.12 * sc, topY);
    c.lineTo(kx + 0.09 * sc, kneeY);
    c.lineTo(x + 0.06 * sc, ankleY);
    c.lineTo(x - 0.06 * sc, ankleY);
    c.lineTo(kx - 0.09 * sc, kneeY);
    c.closePath();
    c.fill();
    // muscles: a bulging thigh and calf, with lines
    c.beginPath();
    c.ellipse(x + d * 0.03 * sc, lerp(topY, kneeY, 0.45), 0.15 * sc, 0.26 * sc, d * 0.08, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.ellipse(kx - d * 0.06 * sc, lerp(kneeY, ankleY, 0.3), 0.11 * sc, 0.2 * sc, -d * 0.1, 0, Math.PI * 2);
    c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = "rgba(0,0,0,0.35)";
    c.lineWidth = Math.max(1, 0.012 * sc);
    for (const k of [-0.07, 0, 0.07]) {
      c.beginPath();
      c.moveTo(x + (k + d * 0.02) * sc, topY + 0.08 * sc);
      c.quadraticCurveTo(x + (k * 1.6 + d * 0.06) * sc, lerp(topY, kneeY, 0.45), kx + k * 0.6 * sc, kneeY - 0.04 * sc);
      c.stroke();
    }
    for (const k of [-0.04, 0.04]) {
      c.beginPath();
      c.moveTo(kx + k * sc, kneeY + 0.05 * sc);
      c.quadraticCurveTo(kx - d * 0.08 * sc + k * 1.5 * sc, lerp(kneeY, ankleY, 0.3), x + k * 0.5 * sc, ankleY - 0.06 * sc);
      c.stroke();
    }
    c.strokeStyle = "rgba(255,255,255,0.14)";                       // shine on the muscles
    c.beginPath();
    c.moveTo(x - 0.08 * sc, lerp(topY, kneeY, 0.25));
    c.quadraticCurveTo(x - 0.13 * sc, lerp(topY, kneeY, 0.5), x - 0.07 * sc, lerp(topY, kneeY, 0.8));
    c.stroke();
    // knobby ankle
    c.beginPath();
    c.arc(x, ankleY, 0.08 * sc, 0, Math.PI * 2);
    c.fill();
    // foot pointing to one side
    c.beginPath();
    c.moveTo(x - d * 0.08 * sc, ankleY - 0.03 * sc);
    c.quadraticCurveTo(x + d * 0.14 * sc, ankleY - 0.05 * sc, x + d * 0.22 * sc, groundY - 0.08 * sc);
    c.lineTo(x + d * 0.22 * sc, groundY);
    c.lineTo(x - d * 0.09 * sc, groundY);
    c.closePath();
    c.fill();
    c.restore();
    // long claw toes
    c.lineCap = "round";
    for (let k = 0; k < 4; k++) {
      const ty = groundY - (0.015 + k * 0.035) * sc;
      const tx0 = x + d * 0.18 * sc, tx1 = x + d * (0.36 + (k % 2) * 0.04) * sc;
      c.strokeStyle = skin;
      c.lineWidth = Math.max(1, 0.036 * sc);
      c.beginPath();
      c.moveTo(tx0, ty);
      c.quadraticCurveTo((tx0 + tx1) / 2, ty - 0.03 * sc, tx1, ty + 0.01 * sc);
      c.stroke();
      c.strokeStyle = "rgba(20,20,20,0.9)";          // dark claw tip
      c.lineWidth = Math.max(1, 0.015 * sc);
      c.beginPath();
      c.moveTo(tx1, ty + 0.01 * sc);
      c.lineTo(tx1 + d * 0.05 * sc, ty + 0.025 * sc);
      c.stroke();
    }
    // stitches where it was cut off
    c.strokeStyle = "rgba(60,20,20,0.85)";
    c.lineWidth = Math.max(1, 0.012 * sc);
    c.beginPath();
    for (let k = -1; k <= 1; k++) {
      c.moveTo(x + k * 0.07 * sc, topY - 0.02 * sc);
      c.lineTo(x + k * 0.07 * sc + 0.02 * sc, topY + 0.07 * sc);
    }
    c.stroke();
  }

  // The big glowing tube with a half-made monster inside
  function drawTube(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, L = S.hospital;
    const r = L.tubeRadius * sc, hgt = L.tubeHeight * sc, top = groundY - hgt, cap = 0.3 * sc;
    // cables up to the ceiling
    c.strokeStyle = shade([30, 32, 34], light, fa, fog);
    c.lineWidth = Math.max(1, 0.05 * sc);
    for (const k of [-0.6, 0, 0.6]) {
      c.beginPath();
      c.moveTo(x + k * r, top);
      c.quadraticCurveTo(x + k * r * 1.6, top - 0.2 * sc, x + k * r * 1.3, top - 1 * sc);
      c.stroke();
    }
    // glowing green liquid
    c.save();
    c.shadowColor = "rgba(80,255,140,0.8)";
    c.shadowBlur = 30;
    const g = c.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, "rgba(30,120,65,0.9)");
    g.addColorStop(0.4, "rgba(120,255,170,0.92)");
    g.addColorStop(1, "rgba(25,100,55,0.9)");
    c.fillStyle = g;
    c.fillRect(x - r, top + cap, r * 2, hgt - cap * 2);
    c.restore();
    // the tube starts EMPTY. After you give Dr. Voss the legs, they float in it.
    const bob = Math.sin(o.time * 0.8) * 0.05 * sc;
    if (hospital.legsGiven) {
      c.strokeStyle = "rgba(8,30,16,0.8)";
      c.lineCap = "round";
      c.lineWidth = Math.max(1, r * 0.2);
      for (const k of [-1, 1]) {
        c.beginPath();
        c.moveTo(x + k * r * 0.18, top + hgt * 0.5 + bob);
        c.quadraticCurveTo(x + k * r * 0.3, top + hgt * 0.68 + bob, x + k * r * 0.2, top + hgt * 0.84 + bob);
        c.lineTo(x + k * r * 0.45, top + hgt * 0.86 + bob);                                 // clawed foot
        c.stroke();
      }
    }
    // bubbles
    c.strokeStyle = "rgba(210,255,225,0.6)";
    c.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const by = groundY - cap - ((o.time * 0.5 + i * 0.37) % 1) * (hgt - cap * 2);
      const bx = x + Math.sin(i * 3.1 + o.time) * r * 0.65;
      c.beginPath();
      c.arc(bx, by, Math.max(1, 0.04 * sc), 0, Math.PI * 2);
      c.stroke();
    }
    // glass shine
    c.fillStyle = "rgba(255,255,255,0.12)";
    c.fillRect(x - r * 0.7, top + cap, r * 0.15, hgt - cap * 2);
    // metal base and lid
    c.fillStyle = shade([74, 78, 82], light, fa, fog);
    c.fillRect(x - r * 1.15, groundY - cap, r * 2.3, cap);
    c.fillRect(x - r * 1.15, top, r * 2.3, cap);
  }

  // The scientist in his lab coat
  function drawScientist(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx + Math.sin(o.time * 1.2) * 0.01 * sc;
    const L2 = light + 0.35;               // the tube's green glow lights him up
    const H = 1.75 * sc, headY = groundY - H + 0.13 * sc;
    // legs and shoes
    c.fillStyle = shade([35, 35, 42], L2, fa, fog);
    c.fillRect(x - 0.16 * sc, groundY - 0.5 * sc, 0.12 * sc, 0.5 * sc);
    c.fillRect(x + 0.04 * sc, groundY - 0.5 * sc, 0.12 * sc, 0.5 * sc);
    c.fillStyle = shade([20, 18, 16], L2, fa, fog);
    c.fillRect(x - 0.19 * sc, groundY - 0.06 * sc, 0.17 * sc, 0.06 * sc);
    c.fillRect(x + 0.03 * sc, groundY - 0.06 * sc, 0.17 * sc, 0.06 * sc);
    // white lab coat
    c.fillStyle = shade([205, 210, 204], L2, fa, fog);
    c.beginPath();
    c.moveTo(x - 0.22 * sc, groundY - H + 0.3 * sc);
    c.lineTo(x + 0.22 * sc, groundY - H + 0.3 * sc);
    c.lineTo(x + 0.3 * sc, groundY - 0.42 * sc);
    c.lineTo(x - 0.3 * sc, groundY - 0.42 * sc);
    c.closePath();
    c.fill();
    c.strokeStyle = shade([120, 124, 120], L2, fa, fog);
    c.lineWidth = Math.max(1, 0.015 * sc);
    c.beginPath();
    c.moveTo(x, groundY - H + 0.32 * sc);
    c.lineTo(x, groundY - 0.42 * sc);
    c.stroke();
    // sleeves and hands
    c.fillStyle = shade([195, 200, 194], L2, fa, fog);
    c.fillRect(x - 0.32 * sc, groundY - H + 0.32 * sc, 0.1 * sc, 0.62 * sc);
    c.fillRect(x + 0.22 * sc, groundY - H + 0.32 * sc, 0.1 * sc, 0.62 * sc);
    c.fillStyle = shade([240, 205, 180], L2, fa, fog);
    c.fillRect(x - 0.31 * sc, groundY - H + 0.94 * sc, 0.08 * sc, 0.1 * sc);
    c.fillRect(x + 0.23 * sc, groundY - H + 0.94 * sc, 0.08 * sc, 0.1 * sc);
    // head, messy grey hair, glasses (after he takes the legs he looks sick and grey, with dark eyes…)
    c.fillStyle = shade(it.obj.dark ? [205, 200, 195] : [240, 205, 180], L2, fa, fog);
    c.beginPath();
    c.arc(x, headY, 0.12 * sc, 0, Math.PI * 2);
    c.fill();
    if (it.obj.dark) {                       // dark circles under his eyes
      c.fillStyle = "rgba(60,40,60,0.55)";
      for (const k of [-1, 1]) { c.beginPath(); c.ellipse(x + k * 0.05 * sc, headY + 0.02 * sc, 0.04 * sc, 0.03 * sc, 0, 0, Math.PI * 2); c.fill(); }
    }
    c.fillStyle = shade(it.obj.dark ? [110, 110, 112] : [150, 150, 150], L2, fa, fog);
    c.beginPath();
    c.ellipse(x, headY - 0.08 * sc, 0.14 * sc, 0.07 * sc, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "#111";
    c.lineWidth = Math.max(1, 0.012 * sc);
    for (const k of [-1, 1]) {
      c.beginPath();
      c.arc(x + k * 0.05 * sc, headY, 0.035 * sc, 0, Math.PI * 2);
      c.stroke();
    }
    c.fillStyle = "rgba(160,255,190,0.8)";   // green glint in his glasses
    c.fillRect(x - 0.06 * sc, headY - 0.015 * sc, 0.02 * sc, 0.01 * sc);
  }

  // The huge cave spider. look = "glow" (Easy), "hidden" (Normal), "dark" (Hard)
  function drawSpider(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, S2 = S.spider.size * sc;
    const look = finale === "chase" ? (mode === "easy" ? "glow" : "dark") : S.spiderLookByMode[mode];
    const t = o.time, walkAnim = spider.moving ? t * 14 : 0;
    const body = look === "glow" ? shade([46, 24, 20], 1.1, fa * 0.4, fog)
               : look === "dark" ? shade([22, 18, 16], light * 0.5, fa, fog) : "rgba(4,3,3,0.92)";
    c.save();
    if (look === "glow") { c.shadowColor = "rgba(255,60,40,0.85)"; c.shadowBlur = Math.max(12, S2 * 0.15); }
    c.strokeStyle = body;
    c.fillStyle = body;
    c.lineCap = "round";
    // 8 legs: up to a high knee, then down to the floor
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const lift = Math.max(0, Math.sin(walkAnim + i * 1.6 + (side > 0 ? 0.8 : 0))) * S2 * 0.12;
        const hipX = x + side * S2 * 0.25, hipY = groundY - S2 * 0.55;
        const kneeX = x + side * S2 * (0.7 + i * 0.22), kneeY = groundY - S2 * (1.05 + (i === 1 || i === 2 ? 0.1 : 0)) - lift;
        const footX = x + side * S2 * (0.9 + i * 0.38), footY = groundY - lift * 0.4;
        c.lineWidth = Math.max(2, S2 * 0.07);
        c.beginPath();
        c.moveTo(hipX, hipY);
        c.lineTo(kneeX, kneeY);
        c.lineTo(footX, footY);
        c.stroke();
        c.lineWidth = Math.max(1, S2 * 0.01);            // lots of hairs on both parts of the leg
        const nH = S.spider.legHairs;
        for (let k = 1; k < nH; k++) {
          const f = k / nH, upper = f < 0.4, ff = upper ? f / 0.4 : (f - 0.4) / 0.6;
          const hx = upper ? lerp(hipX, kneeX, ff) : lerp(kneeX, footX, ff);
          const hy = upper ? lerp(hipY, kneeY, ff) : lerp(kneeY, footY, ff);
          const len = S2 * (0.035 + ((k * 7 + i * 3) % 5) * 0.008);
          for (const up of [-1, 1]) {
            c.beginPath();
            c.moveTo(hx, hy);
            c.lineTo(hx + side * len * 0.8, hy + up * len);
            c.stroke();
          }
        }
      }
    }
    // big hairy abdomen behind, head in front
    c.beginPath();
    c.ellipse(x, groundY - S2 * 0.95, S2 * 0.62, S2 * 0.5, 0, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.ellipse(x, groundY - S2 * 0.5, S2 * 0.36, S2 * 0.3, 0, 0, Math.PI * 2);
    c.fill();
    c.shadowBlur = 0;
    if (look !== "hidden") {
      // shaggy hair all over its body: a thick fringe round the edge, and tufts all over
      c.strokeStyle = look === "glow" ? "rgba(110,62,48,0.9)" : "rgba(48,38,32,0.9)";
      c.lineWidth = Math.max(1, S2 * 0.009);
      const nHair = S.spider.hairs;
      for (const [cy2, rx2, ry2, n] of [[S2 * 0.95, S2 * 0.62, S2 * 0.5, nHair], [S2 * 0.5, S2 * 0.36, S2 * 0.3, nHair * 0.4]]) {
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + Math.sin(i * 12.9) * 0.05;
          const len = S2 * (0.05 + (Math.sin(i * 7.7) * 0.5 + 0.5) * 0.07);
          const bx2 = x + Math.cos(a) * rx2 * 0.92, by2 = groundY - cy2 + Math.sin(a) * ry2 * 0.92;
          c.beginPath(); c.moveTo(bx2, by2);
          c.quadraticCurveTo(bx2 + Math.cos(a) * len * 0.6, by2 + Math.sin(a) * len * 0.6 - len * 0.2, bx2 + Math.cos(a + 0.3) * len, by2 + Math.sin(a + 0.3) * len);
          c.stroke();
        }
      }
      for (let i = 0; i < nHair * 0.8; i++) {                     // tufts on its back
        const rr = Math.sqrt((Math.sin(i * 3.1) * 0.5 + 0.5)) * 0.85, a = i * 2.39996;
        const bx2 = x + Math.cos(a) * S2 * 0.62 * rr, by2 = groundY - S2 * 0.95 + Math.sin(a) * S2 * 0.5 * rr;
        const len = S2 * 0.04;
        c.beginPath(); c.moveTo(bx2, by2); c.lineTo(bx2 + Math.cos(a) * len * 0.5, by2 - len); c.stroke();
      }
      // a pale skull marking on its back
      c.fillStyle = look === "glow" ? "rgba(210,190,160,0.55)" : "rgba(120,110,95,0.4)";
      const kx = x, ky = groundY - S2 * 1.05;
      c.beginPath(); c.ellipse(kx, ky, S2 * 0.14, S2 * 0.12, 0, 0, Math.PI * 2); c.fill();
      c.fillRect(kx - S2 * 0.07, ky + S2 * 0.08, S2 * 0.14, S2 * 0.06);
      c.fillStyle = body;
      for (const k of [-1, 1]) { c.beginPath(); c.arc(kx + k * S2 * 0.05, ky, S2 * 0.035, 0, Math.PI * 2); c.fill(); }
    }
    // fangs
    c.fillStyle = look === "hidden" ? "rgba(10,8,8,0.95)" : shade([30, 24, 20], light, fa, fog);
    for (const k of [-1, 1]) {
      c.beginPath();
      c.moveTo(x + k * S2 * 0.06, groundY - S2 * 0.32);
      c.quadraticCurveTo(x + k * S2 * 0.14, groundY - S2 * 0.18, x + k * S2 * 0.04, groundY - S2 * 0.1);
      c.lineTo(x + k * S2 * 0.12, groundY - S2 * 0.3);
      c.fill();
      if (look !== "hidden") {                                    // venom dripping from the fangs
        const drip = ((o.time * 0.8 + (k > 0 ? 0.5 : 0)) % 1);
        c.fillStyle = "rgba(150,170,60,0.8)";
        c.beginPath(); c.ellipse(x + k * S2 * 0.04, groundY - S2 * 0.1 + drip * S2 * 0.12, S2 * 0.012, S2 * 0.02, 0, 0, Math.PI * 2); c.fill();
      }
    }
    // 8 eyes (they glow on Easy and Hard; on Normal you can't see it at all)
    if (look !== "hidden") {
      c.fillStyle = look === "glow" ? "#ff3a2a" : "rgba(200,30,20,0.7)";
      c.shadowColor = "#ff2010";
      c.shadowBlur = look === "glow" ? 14 : 6;
      // …lots of eyes: 2 big ones, and a cluster of smaller ones all over its head
      const eyes = [[-0.12, -0.6, 0.05], [0.12, -0.6, 0.05], [-0.05, -0.64, 0.035], [0.05, -0.64, 0.035],
                    [-0.2, -0.55, 0.028], [0.2, -0.55, 0.028], [-0.16, -0.66, 0.022], [0.16, -0.66, 0.022],
                    [0, -0.69, 0.025], [-0.09, -0.7, 0.018], [0.09, -0.7, 0.018], [-0.24, -0.62, 0.018], [0.24, -0.62, 0.018],
                    [-0.26, -0.5, 0.016], [0.26, -0.5, 0.016], [-0.2, -0.7, 0.014], [0.2, -0.7, 0.014], [0, -0.58, 0.02]];
      for (const [ex, ey, er] of eyes) {
        c.beginPath();
        c.arc(x + ex * S2, groundY + ey * S2, Math.max(1, er * S2), 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();
  }

  // A long, thin, curved monster arm with a clawed hand (a body piece!)
  function drawArm(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, d = it.obj.dir;     // d = which way it curves
    const glowing = S.legHintsByMode[mode] === "highlight";
    const skin = glowing ? shade([200, 190, 90], 1, fa * 0.3, fog) : shade([84, 96, 84], light + 0.05, fa, fog);
    if (glowing) {                                    // Easy: pulsing ring
      const pulse = 0.5 + 0.5 * Math.sin(o.time * 4);
      c.save();
      c.strokeStyle = `rgba(255,230,90,${0.4 + 0.4 * pulse})`;
      c.lineWidth = Math.max(1.5, 0.04 * sc);
      c.shadowColor = "rgba(255,220,80,0.9)";
      c.shadowBlur = 12;
      c.beginPath();
      c.ellipse(x, groundY, (0.5 + 0.15 * pulse) * sc, (0.12 + 0.04 * pulse) * sc, 0, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }
    // the arm: a long curve like a hook, from the cut end on the ground up to the hand
    const bx = x + d * 0.25 * sc, by = groundY;                     // cut end
    const cx1 = x - d * 0.45 * sc, cy1 = groundY - 0.25 * sc;       // bend
    const wx = x - d * 0.12 * sc, wy = groundY - 1.0 * sc;          // wrist
    c.save();
    c.lineCap = "round";
    c.shadowColor = glowing ? "rgba(255,230,90,0.95)" : "rgba(120,255,160,0.25)";
    c.shadowBlur = glowing ? Math.max(14, 0.5 * sc) : Math.max(3, 0.2 * sc);
    c.strokeStyle = "rgba(0,0,0,0.55)";              // dark outline (like a pencil line)
    c.lineWidth = Math.max(2, 0.09 * sc);
    c.beginPath();
    c.moveTo(bx, by);
    c.quadraticCurveTo(cx1, cy1, wx, wy);
    c.stroke();
    c.shadowBlur = 0;
    // big bulging muscles along the arm: a biceps near the cut end and a forearm muscle near the wrist
    const onArm = (t) => {                                          // a point on the arm's curve, and which way it points
      const u = 1 - t;
      const px = u * u * bx + 2 * u * t * cx1 + t * t * wx, py = u * u * by + 2 * u * t * cy1 + t * t * wy;
      const tx2 = 2 * u * (cx1 - bx) + 2 * t * (wx - cx1), ty2 = 2 * u * (cy1 - by) + 2 * t * (wy - cy1);
      return [px, py, Math.atan2(ty2, tx2)];
    };
    const muscles = [[0.28, 0.2, 0.075], [0.66, 0.17, 0.06]];
    c.fillStyle = "rgba(0,0,0,0.55)";                              // muscle outlines first, so they blend into the arm
    for (const [t, len, fat] of muscles) {
      const [mx, my, ang] = onArm(t);
      c.beginPath(); c.ellipse(mx, my, len * sc + 1.5, fat * sc + 1.5, ang, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = skin;
    c.lineWidth = Math.max(1.5, 0.065 * sc);
    c.beginPath();
    c.moveTo(bx, by);
    c.quadraticCurveTo(cx1, cy1, wx, wy);
    c.stroke();
    for (const [t, len, fat] of muscles) {
      const [mx, my, ang] = onArm(t);
      c.fillStyle = skin;
      c.beginPath(); c.ellipse(mx, my, len * sc, fat * sc, ang, 0, Math.PI * 2); c.fill();
      if (sc > 30) {                                               // shine and muscle lines up close
        c.fillStyle = "rgba(255,255,255,0.12)";
        c.beginPath(); c.ellipse(mx - Math.sin(ang) * fat * sc * 0.35, my + Math.cos(ang) * -fat * sc * 0.35, len * sc * 0.6, fat * sc * 0.3, ang, 0, Math.PI * 2); c.fill();
        c.strokeStyle = "rgba(0,0,0,0.3)"; c.lineWidth = Math.max(1, 0.008 * sc);

          c.ellipse(mx - Math.sin(ang) * fat * sc * k, my + Math.cos(ang) * fat * sc * k, len * sc * 0.75, fat * sc * 0.25, ang, Math.PI * 0.15, Math.PI * 0.85);
          c.stroke();
        }

    }
    // a skinny hand with long thin fingers spread out at the top
    for (let f = 0; f < 5; f++) {
      const ang = -Math.PI / 2 + (f - 2) * 0.32 + d * 0.15;
      const len = (f === 0 || f === 4 ? 0.2 : 0.28) * sc;
      const fx2 = wx + Math.cos(ang) * len, fy2 = wy + Math.sin(ang) * len;
      c.strokeStyle = "rgba(0,0,0,0.55)";

      c.moveTo(wx, wy);
      c.lineTo(fx2, fy2);
      c.stroke();
      c.strokeStyle = skin;
      c.lineWidth = Math.max(1, 0.022 * sc);
      c.beginPath();
      c.moveTo(wx, wy);

      c.lineTo(fx2 + Math.cos(ang) * 0.06 * sc, fy2 + Math.sin(ang) * 0.06 * sc);

             quad(wallRect(seg, 0.47, 0.49, 1.95, 1.99, -0.035), "#f33"); quad(wallRect(seg, 0.51, 0.53, 1.95, 1.99, -0.035), "#f33"); }
    } else if (seg.decor === "exit") {

  function drawCoin(it, groundY) {                     // 🪙 a spinning, glowing gold coin floating above the floor

  function drawPoolTable(it, groundY, light, fa) {

    c.beginPath(); c.moveTo(x - tw * 0.42, ty2 - td); c.lineTo(x + tw * 0.42, ty2 - td); c.lineTo(x + tw * 0.52, ty2 + td * 0.12); c.lineTo(x - tw * 0.52, ty2 + td * 0.12); c.fill();
    c.fillStyle = shade([31, 122, 58], L, fa, fog);                                          // green felt
    c.beginPath(); c.moveTo(x - tw * 0.38, ty2 - td * 0.86); c.lineTo(x + tw * 0.38, ty2 - td * 0.86); c.lineTo(x + tw * 0.46, ty2 - td * 0.02); c.lineTo(x - tw * 0.46, ty2 - td * 0.02); c.fill();
    c.fillStyle = "#0a0a0a";                                                                  // pockets
    for (const [px2, py2] of [[-0.38, -0.86], [0, -0.88], [0.38, -0.86], [-0.46, -0.02], [0, -0.01], [0.46, -0.02]]) { c.beginPath(); c.ellipse(x + px2 * tw, ty2 + py2 * td, tw * 0.022, td * 0.07, 0, 0, Math.PI * 2); c.fill(); }
    for (const [col, bx, by] of [["#fff", -0.22, -0.45], ["#e8c020", 0.12, -0.5], ["#c02020", 0.17, -0.38], ["#2040c0", 0.17, -0.62], ["#111", 0.23, -0.5], ["#e07020", 0.28, -0.4], ["#208040", 0.28, -0.6]]) {
      c.fillStyle = col; c.beginPath(); c.arc(x + bx * tw, ty2 + by * td, tw * 0.018, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = "#c8a070"; c.lineWidth = Math.max(1.5, tw * 0.008); c.lineCap = "round";  // the cue
    c.beginPath(); c.moveTo(x - tw * 0.26, ty2 - td * 0.43); c.lineTo(x - tw * 0.62, ty2 - td * 0.05); c.stroke();
  }
  function drawWineFridge(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, fw = 0.7 * sc, fh = 1.5 * sc, fy = groundY - fh;

    c.fillStyle = "#111"; c.fillRect(x - 1.0 * u, groundY - 0.18 * u, 0.1 * u, 0.18 * u); c.fillRect(x + 0.9 * u, groundY - 0.18 * u, 0.1 * u, 0.18 * u);

  // ⚠ Spikes in the final chase: red cracks first, then metal spikes shoot up
  function drawSpikes(it, groundY, light, fa) {
    const C = S.chase, sc = it.sc, x = it.sx, t = it.obj.t, R = C.spikeRadius * sc;
    if (t < C.spikeWarn) {
      const pulse = 0.5 + 0.5 * Math.sin(o.time * 18);
      c.fillStyle = `rgba(200,20,10,${0.25 + 0.35 * pulse})`;
      c.beginPath(); c.ellipse(x, groundY, R, R * 0.25, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = "rgba(20,0,0,0.8)"; c.lineWidth = Math.max(1, 0.02 * sc);
      c.beginPath();
      for (let i = 0; i < 6; i++) { const ang = i * 1.05; c.moveTo(x, groundY); c.lineTo(x + Math.cos(ang) * R * 0.9, groundY + Math.sin(ang) * R * 0.22); }
      c.stroke();
      return;
    }
    const rise = clamp((t - C.spikeWarn) / 0.12, 0, 1), sink = clamp((C.spikeWarn + C.spikeUp - t) / 0.25, 0, 1);
    const hgt = C.spikeHeight * sc * rise * sink;
    for (let i = 0; i < 9; i++) {
      const ox = (((i * 37) % 9) / 8 - 0.5) * R * 1.7, oy = (((i * 53) % 5) / 4 - 0.5) * R * 0.3, hh = hgt * (0.7 + ((i * 29) % 7) / 20);
      const bw = 0.06 * sc;
      const g = c.createLinearGradient(x + ox - bw, 0, x + ox + bw, 0);
      g.addColorStop(0, shade([60, 60, 66], light + 0.3, fa, fog)); g.addColorStop(0.5, shade([200, 200, 210], light + 0.3, fa, fog)); g.addColorStop(1, shade([50, 50, 56], light + 0.3, fa, fog));
      c.fillStyle = g;
      c.beginPath(); c.moveTo(x + ox - bw, groundY + oy); c.lineTo(x + ox, groundY + oy - hh); c.lineTo(x + ox + bw, groundY + oy); c.fill();
      c.fillStyle = "rgba(140,10,10,0.8)";                 // bloody tips
      c.beginPath(); c.moveTo(x + ox - bw * 0.25, groundY + oy - hh * 0.8); c.lineTo(x + ox, groundY + oy - hh); c.lineTo(x + ox + bw * 0.25, groundY + oy - hh * 0.8); c.fill();
    }
  }

      c.beginPath(); c.ellipse(x + k * 0.1 * sc, by + 0.01 * sc, 0.03 * sc, 0.055 * sc, k * -0.4, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = main;                                          // head
    c.beginPath(); c.ellipse(x, hy, 0.085 * sc, 0.075 * sc, 0, 0, Math.PI * 2); c.fill();

    c.beginPath(); c.moveTo(x, hy + 0.02 * sc); c.quadraticCurveTo(x + 0.01 * sc, hy + 0.1 * sc, x + 0.04 * sc, hy + 0.12 * sc); c.stroke();

      c.fillStyle = gold;

    }
    for (const k of [-1, 1]) {                                   // legs with big shiny gold hooves

      c.fillStyle = gold;
      c.beginPath(); c.ellipse(x + k * 0.08 * sc, groundY - 0.03 * sc, 0.032 * sc, 0.032 * sc, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = shine;
      c.beginPath(); c.ellipse(x + k * 0.072 * sc, groundY - 0.04 * sc, 0.01 * sc, 0.007 * sc, -0.5, 0, Math.PI * 2); c.fill();
    }
    for (const k of [-1, 1]) {                                   // ears, gold inside
      c.fillStyle = white;
      c.beginPath(); c.ellipse(x + k * 0.06 * sc, hy - 0.06 * sc, 0.025 * sc, 0.03 * sc, k * 0.4, 0, Math.PI * 2); c.fill();
      c.fillStyle = gold;
      c.beginPath(); c.ellipse(x + k * 0.06 * sc, hy - 0.06 * sc, 0.013 * sc, 0.018 * sc, k * 0.4, 0, Math.PI * 2); c.fill();
    }
    c.fillStyle = white;                                         // head and muzzle
    c.beginPath(); c.ellipse(x, hy, 0.075 * sc, 0.07 * sc, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = shadow;
    c.beginPath(); c.ellipse(x, hy + 0.03 * sc, 0.045 * sc, 0.032 * sc, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = pink;                                          // fluffy pink mane on top of the head
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(x + i * 0.013 * sc, hy - 0.058 * sc + Math.abs(i) * 0.006 * sc, 0.017 * sc, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = gold;                                          // golden horn
    c.beginPath(); c.moveTo(x - 0.016 * sc, hy - 0.06 * sc); c.lineTo(x + 0.016 * sc, hy - 0.06 * sc); c.lineTo(x + 0.004 * sc, hy - 0.14 * sc); c.closePath(); c.fill();
    c.strokeStyle = shine; c.lineWidth = Math.max(0.5, 0.004 * sc);
    c.beginPath(); for (let i = 1; i <= 3; i++) { const yy = hy - 0.06 * sc - i * 0.02 * sc; c.moveTo(x - 0.012 * sc * (1 - i * 0.25), yy + 0.004 * sc); c.lineTo(x + 0.012 * sc * (1 - i * 0.25), yy - 0.004 * sc); } c.stroke();
    c.strokeStyle = "#222"; c.lineWidth = Math.max(0.6, 0.006 * sc);   // sleepy stitched eyes

  // ----- The cave (under the hospital) -----
  // A pointy rock hanging from the ceiling
  function drawStalactite(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, ceilY = groundY - S.hospital.ceilingHeight * sc;
    const r = it.obj.w * sc, len = it.obj.len * sc;
    const g = c.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, shade(S.hospital.caveRockColor, light * 0.5, fa, fog));
    g.addColorStop(0.5, shade(S.hospital.caveRockColor, light * 1.1, fa, fog));
    g.addColorStop(1, shade(S.hospital.caveRockColor, light * 0.4, fa, fog));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - r, ceilY - 2);
    c.lineTo(x + r, ceilY - 2);
    c.lineTo(x + r * 0.2, ceilY + len * 0.8);
    c.lineTo(x, ceilY + len);
    c.lineTo(x - r * 0.25, ceilY + len * 0.75);
    c.closePath();
    c.fill();
  }
  // A pointy rock growing up from the floor
  function drawStalagmite(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, r = it.obj.w * sc, hgt = it.obj.len * sc;
    const g = c.createLinearGradient(x - r, 0, x + r, 0);
    g.addColorStop(0, shade(S.hospital.caveRockColor, light * 0.45, fa, fog));
    g.addColorStop(0.45, shade(S.hospital.caveRockColor, light * 1.1, fa, fog));
    g.addColorStop(1, shade(S.hospital.caveRockColor, light * 0.35, fa, fog));
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - r, groundY);
    c.quadraticCurveTo(x - r * 0.5, groundY - hgt * 0.5, x - r * 0.1, groundY - hgt);
    c.lineTo(x + r * 0.15, groundY - hgt * 0.95);
    c.quadraticCurveTo(x + r * 0.55, groundY - hgt * 0.45, x + r, groundY);
    c.closePath();
    c.fill();
  }
  // A dusty cobweb near the ceiling
  function drawCobweb(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, ceilY = groundY - S.hospital.ceilingHeight * sc;
    const cy = ceilY + it.obj.drop * sc, R = it.obj.size * sc;
    const a = Math.min(0.7, 0.25 + light * 0.6) * (1 - fa);
    c.strokeStyle = `rgba(220,220,215,${a})`;
    c.lineWidth = Math.max(0.6, sc * 0.008);
    const spokes = 8, pts = [];
    c.beginPath();
    for (let k = 0; k < spokes; k++) {               // threads out from the middle
      const ang = (k / spokes) * Math.PI * 2 + it.obj.spin;
      const len = R * (0.8 + 0.3 * Math.sin(k * 5.1 + it.obj.spin));
      pts.push([Math.cos(ang), Math.sin(ang), len]);
      c.moveTo(x, cy);
      c.lineTo(x + Math.cos(ang) * len, cy + Math.sin(ang) * len);
    }
    for (let ring = 1; ring <= 4; ring++) {           // rings, sagging a little
      const f = ring / 4.4;
      pts.forEach(([dx, dy, len], k) => {
        const [ndx, ndy, nlen] = pts[(k + 1) % spokes];
        const x1 = x + dx * len * f, y1 = cy + dy * len * f;
        const x2 = x + ndx * nlen * f, y2 = cy + ndy * nlen * f;
        c.moveTo(x1, y1);
        c.quadraticCurveTo((x1 + x2) / 2 * 0.98 + x * 0.02, (y1 + y2) / 2 * 0.98 + cy * 0.02 + R * 0.04, x2, y2);
      });
    }
    // threads up to the ceiling
    c.moveTo(x - R * 0.6, cy - R * 0.5); c.lineTo(x - R * 0.9, ceilY);
    c.moveTo(x + R * 0.6, cy - R * 0.5); c.lineTo(x + R * 0.8, ceilY);
    c.stroke();
  }

  // A wooden crate (in the basement)
  function drawCrate(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, s2 = 0.45 * sc;
    c.fillStyle = shade([92, 72, 46], light, fa, fog);
    c.fillRect(x - s2, groundY - s2 * 2, s2 * 2, s2 * 2);
    c.strokeStyle = shade([50, 38, 24], light, fa, fog);
    c.lineWidth = Math.max(1, 0.04 * sc);
    c.strokeRect(x - s2, groundY - s2 * 2, s2 * 2, s2 * 2);
    c.beginPath();
    c.moveTo(x - s2, groundY - s2 * 2);
    c.lineTo(x + s2, groundY);
    c.moveTo(x + s2, groundY - s2 * 2);
    c.lineTo(x - s2, groundY);
    c.stroke();
  }

  // The ladder up to the hatch (in the basement)
  function drawLadder(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, topY = groundY - S.hospital.ceilingHeight * sc;
    const glow = S.hospital.ladderGlow, pulse = 0.5 + 0.5 * Math.sin(o.time * 3);
    c.save();
    if (glow) {                                                  // a soft light from the hatch above, and a glowing ring on the floor
      const g = c.createLinearGradient(0, topY, 0, groundY);
      g.addColorStop(0, `rgba(255,225,140,${0.35 + 0.15 * pulse})`); g.addColorStop(1, "rgba(255,225,140,0)");
      c.fillStyle = g;

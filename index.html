<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonsterTube</title>
<style>
  /* ===== PAGE ===== */
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas { display: block; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* ===== CUTSCENE ===== */
  #cut { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45; background: #000; }
  #btnSkip {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding: 10px 18px;
    border-radius: 20px;
    border: 2px solid #aaa;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    z-index: 46;
  }
  #btnCatch {
    position: fixed;
    left: 50%; top: 66%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 16px 30px;
    border-radius: 40px;
    border: 3px solid #fff;
    background: #c01010;
    color: #fff;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    z-index: 48;
    animation: catchPulse 0.4s ease-in-out infinite alternate;
  }
  @keyframes catchPulse { to { transform: translateX(-50%) scale(1.12); box-shadow: 0 0 30px #ff3030; } }
  @media (prefers-reduced-motion: reduce) { #btnCatch { animation: none; } }
  #tapStart {
    position: fixed;
    inset: 0;
    z-index: 47;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #000;
    color: #ccc;
    text-align: center;
    padding: 0 16px;
  }
  #tapStart button {
    padding: 16px 34px;
    border-radius: 30px;
    border: 2px solid #ff3b3b;
    background: #200;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  #creditsRoll { animation: creditsUp 2.5s ease-out; }
  @keyframes creditsUp { from { transform: translateY(60vh); opacity: 0; } to { transform: none; opacity: 1; } }
  #creditsList { display: grid; gap: 14px; margin: 18px 0; }
  #creditsList small { display: block; font-size: 13px; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; }
  #creditsList b { font-size: 28px; color: #ffd84a; }
  @media (prefers-reduced-motion: reduce) { #creditsRoll { animation: none; } }
  #checkpointScreen { background: #000; }
  #cpTitle { font-size: 24px; }
  #cpButtons { display: grid; gap: 10px; width: min(300px, 100%); }
  #cpButtons button { margin-top: 0; }
  #cpButtons button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
  .overlay button#btnCpBack { border-color: #777; background: transparent; font-size: 14px; padding: 8px 18px; }
  #btnKey.on { background: #e2c060; border-color: #fff0b0; box-shadow: 0 0 14px #e2c060; }

  /* ===== MODE BUTTONS + MENU ===== */
  #modeButtons, .buttonRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  .overlay button.mode {
    margin-top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 110px;
    padding: 12px 14px;
    border-radius: 16px;
  }
  .overlay button.mode small { font-size: 11px; opacity: 0.8; white-space: pre-line; }
  .controlsBox {
    display: grid;
    gap: 5px;
    margin: 6px 0 4px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 13px;
    text-align: left;
    max-width: 360px;
  }
  .controlsBox b { text-align: center; margin-bottom: 2px; }
  .controlsBox div { display: flex; gap: 10px; justify-content: space-between; }
  .controlsBox .keys { font-weight: 700; color: #ffd27a; white-space: nowrap; }
  .overlay button#btnCredits { margin-top: 8px; padding: 8px 18px; font-size: 14px; border-color: #b9952e; background: rgba(120, 90, 0, 0.2); }
  .overlay button#btnStartOver { margin-top: 10px; padding: 8px 18px; font-size: 14px; border-color: #a33; background: rgba(120, 0, 0, 0.25); }
  .overlay button#btnStartOver.sure { border-color: #ff5050; background: #500; }
  .overlay button#btnInfo { margin-top: 8px; padding: 8px 18px; font-size: 14px; border-color: #4a8ad0; background: rgba(40, 90, 160, 0.2); }
  /* the menu scrolls up and down when the Info or Controls box makes it too tall for the screen */
  #startScreen { justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  #startScreen > * { flex-shrink: 0; touch-action: pan-y; }
  #startScreen > :first-child { margin-top: auto; }
  #startScreen > :last-child { margin-bottom: auto; }
  #startScreen .controlsBox * { touch-action: pan-y; }
  .infoBox div { flex-direction: column; gap: 1px !important; flex-shrink: 0; }
  .infoBox .keys { white-space: normal; }
  .overlay button#btnControls { margin-top: 14px; padding: 8px 18px; font-size: 14px; border-color: #888; background: rgba(255, 255, 255, 0.06); }
  .overlay button.mode:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
  .overlay button.easy { border-color: #4caf50; background: #0d2410; }
  .overlay button.normal { border-color: #e0b030; background: #261d05; }
  .overlay button.hard { border-color: #ff3b3b; background: #2a0606; }
  /* 🩸 blood stains on the Hard button: splats, a smear and drips running off the bottom */
  .overlay button.hard { position: relative; overflow: visible; text-shadow: 0 1px 2px #000;
    background:
      radial-gradient(circle at 14% 22%, rgba(150,0,0,0.95) 0 7px, rgba(120,0,0,0.6) 8px, transparent 11px),
      radial-gradient(circle at 20% 34%, rgba(140,0,0,0.9) 0 2px, transparent 3px),
      radial-gradient(circle at 8% 12%, rgba(140,0,0,0.9) 0 2px, transparent 3px),
      radial-gradient(ellipse 22px 9px at 84% 74%, rgba(130,0,0,0.9), rgba(110,0,0,0.5) 70%, transparent),
      radial-gradient(circle at 76% 62%, rgba(150,0,0,0.9) 0 2px, transparent 3px),
      radial-gradient(circle at 92% 20%, rgba(120,0,0,0.85) 0 4px, transparent 6px),
      linear-gradient(115deg, transparent 55%, rgba(110,0,0,0.45) 58%, rgba(90,0,0,0.25) 66%, transparent 70%),
      #2a0606; }
  .overlay button.hard::before, .overlay button.hard::after {
    content: ""; position: absolute; top: calc(100% - 2px); width: 5px; border-radius: 0 0 3px 3px;
    background: linear-gradient(#a00000, #6a0000); pointer-events: none; }
  .overlay button.hard::before { left: 24%; height: 14px; }
  .overlay button.hard::after { left: 70%; height: 9px; width: 4px; }
  .buttonRow button { margin-top: 10px !important; }

  /* ===== TALKING (the scientist) ===== */
  #dialog {
    position: fixed;
    left: 50%;
    bottom: calc(195px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(340px, calc(100vw - 32px));
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(5, 20, 10, 0.92);
    border: 1px solid #5fdc8e;
    box-shadow: 0 0 18px rgba(80, 255, 140, 0.35);
    font-size: 15px;
    line-height: 1.4;
    z-index: 21;
  }
  #dialog b { display: block; color: #8ff0b0; font-size: 13px; margin-bottom: 4px; }
  body.scaring #dialog { visibility: hidden; }

  /* ===== HUD (on your screen, not the phone) ===== */
  #hudTop {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 16px; right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 0 4px #000;
    z-index: 5;
  }
  #upload { font-size: 12px; opacity: 0.9; }

  /* Pause button (top right) */
  #btnPause {
    position: fixed;
    top: calc(6px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid #555;
    background: rgba(25, 25, 25, 0.8);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    z-index: 9;
  }
  #btnPause:focus-visible { outline: 2px solid #9cf; }

  /* Sprint bar (above the walk buttons) */
  #sprintBox {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(132px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    text-shadow: 0 0 4px #000;
    z-index: 8;
  }
  #sprintBar {
    width: 120px; height: 8px;
    border: 1px solid #666;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  #sprintFill { height: 100%; width: 100%; background: #ffb347; }
  #sprintBox.tired #sprintFill { background: #e04040; }
  body[data-sprint="unlimited"] #sprintBox,
  body[data-sprint="none"] #sprintBox,
  body[data-sprint="none"] #btnSprint { display: none; }
  body.scaring #btnPause, body.scaring #sprintBox { visibility: hidden; }
  #hint {
    position: fixed;
    top: calc(34px + env(safe-area-inset-top, 0px));
    left: 16px; right: 64px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 11px;
    opacity: 0.45;
    z-index: 5;
  }
  @media (pointer: coarse) { #hint { display: none; } }
  #hospitalMarker {
    position: fixed;
    top: calc(52px + env(safe-area-inset-top, 0px));
    left: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #9fe6b4;
    text-shadow: 0 0 4px #000;
    z-index: 5;
  }
  body.scaring #hospitalMarker { visibility: hidden; }
  #legsInfo {
    position: fixed;
    top: calc(70px + env(safe-area-inset-top, 0px));
    left: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #c9f0d2;
    text-shadow: 0 0 4px #000;
    z-index: 5;
  }
  body.scaring #legsInfo { visibility: hidden; }

  #dangerMeter {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right, 0px));
    top: 90px; bottom: 260px;
    width: 14px;
    border: 1px solid #666;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.5);
    z-index: 5;
  }
  #dangerFill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 0%;
    border-radius: 7px;
    background: hsl(120, 85%, 50%);
  }
  #dangerLabel {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #f66;
  }
  #dangerMeter.warn { animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 14px 3px rgba(255, 0, 0, 0.8); border-color: #f33; } }

  #caption {
    position: fixed;
    bottom: calc(160px + env(safe-area-inset-bottom, 0px));
    left: 16px; right: 40px;
    text-align: center;
    font-size: 15px;
    font-style: italic;
    color: #cfe0ff;
    text-shadow: 0 0 6px #000, 0 0 2px #000;
    z-index: 6;
  }
  #toast {
    position: fixed;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(300px, calc(100vw - 32px));
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 14px;
    text-align: center;
    white-space: pre-line;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
  }
  #toast.show { opacity: 1; }

  /* ===== THE PHONE (raise it to see through the camera) ===== */
  #phone {
    position: fixed;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    padding: 8px;
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 30px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    transition: transform 0.35s ease;
    z-index: 4;
  }
  #phone.down { transform: translate(-50%, 85vh) rotate(6deg); }
  #screen {
    position: relative;
    width: min(280px, calc(100vw - 110px), calc((100vh - 240px) * 0.5625));
    width: min(280px, calc(100vw - 110px), calc((100dvh - 240px) * 0.5625));
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 22px;
    background: #000;
  }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; }
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 12px;
    font-size: 11px;
    font-weight: 600;
    background: linear-gradient(rgba(0, 0, 0, 0.7), transparent);
  }
  #recDot { color: #ff2b2b; opacity: 0.25; }
  #recDot.on { opacity: 1; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #rightIcons { display: flex; align-items: center; gap: 6px; }
  #signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  #signal i { width: 3px; background: #555; border-radius: 1px; }
  #signal i:nth-child(1) { height: 3px; }
  #signal i:nth-child(2) { height: 6px; }
  #signal i:nth-child(3) { height: 8px; }
  #signal i:nth-child(4) { height: 11px; }
  #signal i.on { background: #fff; }
  #battery.low { color: #ff4040; }
  #areaName {
    position: absolute;
    top: 26px; left: 12px;
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #clipBox {
    position: absolute;
    top: 44px; left: 50%;
    transform: translateX(-50%);
    width: 150px;
    text-align: center;
    font-size: 11px;
  }
  /* Live comments (left side of the phone screen) */
  #comments {
    position: absolute;
    left: 6px; top: 64px; bottom: 34px;
    width: 60%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    overflow: hidden;
    pointer-events: none;
  }
  .comment {
    font-size: 10.5px;
    line-height: 1.25;
    padding: 4px 7px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.6);
    border-left: 3px solid #888;
    animation: commentIn 0.25s ease-out;
  }
  .comment b { display: block; font-size: 9.5px; opacity: 0.75; }
  .comment.kind { border-left-color: #5fdc8e; }
  .comment.mean { border-left-color: #ff5050; }
  .comment.fake { border-left-color: #f0c040; }
  @keyframes commentIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .comment { animation: none; } }
  #clipBar { margin-top: 3px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
  #clipFill { height: 100%; width: 0%; background: #ff3b3b; }

  /* ===== BUTTONS ===== */
  #controls {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 8;
    pointer-events: none;
  }
  #movePad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 6px;
  }
  #btnFwd { grid-column: 2; grid-row: 1; }
  #btnCrouch { grid-column: 1; grid-row: 1; }
  #btnCrouch.on { border-color: #9cf; box-shadow: 0 0 12px rgba(150, 200, 255, 0.6); }
  body[data-crouch="no"] #btnCrouch { display: none; }
  #btnLeft { grid-column: 1; grid-row: 2; }
  #btnBack { grid-column: 2; grid-row: 2; }
  #btnRight { grid-column: 3; grid-row: 2; }
  #btnSprint { grid-column: 3; grid-row: 1; }
  #btnSprint.on { border-color: #ffb347; box-shadow: 0 0 12px rgba(255, 180, 70, 0.6); }
  #actionPad { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px; max-width: 166px; }
  #controls button {
    pointer-events: auto;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid #555;
    background: rgba(25, 25, 25, 0.8);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    padding: 0;
  }
  #controls button:active { transform: scale(0.93); }
  #controls button:focus-visible { outline: 2px solid #9cf; }
  #btnPhone.on { border-color: #9cf; box-shadow: 0 0 12px rgba(150, 200, 255, 0.6); }
  #btnLight.on { background: #ffe9a8; border-color: #fff3c4; box-shadow: 0 0 18px #ffe9a8; }
  .recIcon { width: 20px; height: 20px; border-radius: 50%; background: #ff2b2b; transition: border-radius 0.2s; }
  #btnRec.on { border-color: #ff4a4a; }
  #btnRec.on .recIcon { border-radius: 4px; width: 16px; height: 16px; }
  @media (max-width: 380px) {
    #movePad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); }
    #controls button { width: 44px; height: 44px; font-size: 18px; }
    #actionPad { flex-direction: column; }
  }

  /* ===== JUMP SCARE (whole screen) ===== */
  #scare { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; }
  body.scaring #phone,
  body.scaring #controls,
  body.scaring #hudTop,
  body.scaring #hint,
  body.scaring #dangerMeter,
  body.scaring #caption,
  body.scaring #toast { visibility: hidden; }

  /* ===== START + CAUGHT SCREENS ===== */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
    text-align: center;
    background: rgba(0, 0, 0, 0.9);
    z-index: 40;
  }
  /* The big title on the start screen */
  .overlay h1#startTitle {
    font-size: clamp(36px, 12.5vw, 130px);
    letter-spacing: 0;
    line-height: 1;
    margin-bottom: 28px;
    color: #ff2b2b;
    text-shadow: 0 0 24px rgba(255, 0, 0, 0.75), 0 0 4px #000;
    animation: titleFlicker 4s steps(1) infinite;
  }
  @keyframes titleFlicker { 0%, 100% { opacity: 1; } 92% { opacity: 0.35; } 94% { opacity: 1; } 96% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) { .overlay h1#startTitle { animation: none; } }
  .overlay h1 {
    margin: 0 0 8px;
    font-family: "Courier New", monospace;
    font-size: 34px;
    letter-spacing: 3px;
    color: #ff3b3b;
    text-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
  }
  .overlay p { margin: 6px 0; max-width: 420px; font-size: 15px; line-height: 1.45; white-space: pre-line; }
  .overlay .small { font-size: 12px; opacity: 0.75; }
  .overlay button {
    margin-top: 18px;
    padding: 12px 28px;
    border: 2px solid #ff3b3b;
    border-radius: 24px;
    background: #200;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
  }
</style>
</head>
<body>

<canvas id="world"></canvas>

<button id="btnPause" aria-label="Pause">⏸</button>
<div id="sprintBox"><span id="sprintLabel"></span><div id="sprintBar"><div id="sprintFill"></div></div></div>
<div id="hudTop">
  <span id="subs"></span>
  <span id="upload"></span>
</div>
<div id="hint"></div>
<div id="hospitalMarker"></div>
<div id="legsInfo"></div>
<div id="dangerMeter"><div id="dangerFill"></div><span id="dangerLabel"></span></div>
<div id="caption"></div>
<div id="toast"></div>

<div id="phone" class="down">
  <div id="screen">
    <canvas id="cam"></canvas>
    <div id="topbar">
      <span id="clock"></span>
      <span id="recDot"></span>
      <span id="rightIcons">
        <span id="signal"><i></i><i></i><i></i><i></i></span>
        <span id="battery"></span>
      </span>
    </div>
    <div id="areaName"></div>
    <div id="comments"></div>
    <div id="clipBox" class="hidden">
      <div id="clipLabel"></div>
      <div id="clipBar"><div id="clipFill"></div></div>
    </div>
  </div>
</div>

<div id="controls">
  <div id="movePad">
    <button id="btnCrouch" aria-label="Crouch">🧎</button>
    <button id="btnFwd" aria-label="Walk forward">▲</button>
    <button id="btnLeft" aria-label="Turn left">◀</button>
    <button id="btnBack" aria-label="Walk back">▼</button>
    <button id="btnRight" aria-label="Turn right">▶</button>
    <button id="btnSprint" aria-label="Sprint (hold)">🏃</button>
  </div>
  <div id="actionPad">
    <button id="btnJump" aria-label="Jump">⤒</button>

// Hide the legs at random spots around the hospital
function placeLegs(cx, cy) {
  legs = [];
  legsFound = 0;
  for (let i = 0; i < S.legs.count; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = lerp(S.legs.minDistance, S.legs.maxDistance, Math.random());
    legs.push({
      kind: "leg",
      x: cx + Math.cos(a) * dist,
      y: cy + Math.sin(a) * dist,
      dir: Math.random() < 0.5 ? -1 : 1,
      got: false
    });
  }
}

// An arrow (↑ ↗ → …) pointing from you to a spot
function arrowTo(x, y) {
  const rel = angleDiff(Math.atan2(y - player.y, x - player.x) / DEG, player.angle);
  return ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"][Math.round(((rel + 360) % 360) / 45) % 8];
}

// Put the ghost far away, somewhere in front of you
function placeGhostAway() {
  const a = (player.angle + (Math.random() - 0.5) * 140) * DEG;
  ghost.x = player.x + Math.cos(a) * S.ghost.farDistance;
  ghost.y = player.y + Math.sin(a) * S.ghost.farDistance;
}

// ==========================================================
//  THE OLD HOSPITAL (appears at 1,000 subscribers)
// ==========================================================
function inHospitalNow() {
  return hospital !== null && (player.level === 0 || insideHospital(player.x, player.y, 0));
}

function insideHospital(x, y, margin) {
  return hospital !== null && x > hospital.x0 - margin && x < hospital.x1 + margin && y > hospital.y0 - margin && y < hospital.y1 + margin;
}

function spawnHospital() {
  const a = player.angle * DEG, d = S.hospital.spawnDistance;
  const cx = player.x + Math.cos(a) * d, cy = player.y + Math.sin(a) * d;
  const W = S.hospital.width, D = S.hospital.depth;
  const x0 = cx - W / 2, x1 = cx + W / 2, y0 = cy - D / 2, y1 = cy + D / 2;

  // The front (with the door) faces you
  const toX = player.x - cx, toY = player.y - cy;
  let front;
  if (Math.abs(toX) / W > Math.abs(toY) / D) front = toX > 0 ? "east" : "west";
  else front = toY > 0 ? "south" : "north";

  // The 4 walls. n = which way the wall faces (outwards).
  const faces = [
    { name: "north", ax: x1, ay: y0, bx: x0, by: y0, nx: 0, ny: -1, shade: 0.8 },
    { name: "west",  ax: x0, ay: y0, bx: x0, by: y1, nx: -1, ny: 0, shade: 0.9 },
    { name: "south", ax: x0, ay: y1, bx: x1, by: y1, nx: 0, ny: 1, shade: 0.7 },
    { name: "east",  ax: x1, ay: y1, bx: x1, by: y0, nx: 1, ny: 0, shade: 1.0 }
  ];
  // Cut each wall into pieces so trees in front/behind draw in the right order
  const segments = [];
  let doorX = cx, doorY = cy;
  for (const f of faces) {
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay);
    let n = Math.ceil(len / S.hospital.segmentLength);
    if (f.name === front && n % 2 === 0) n++;   // so the door is in the middle piece
    for (let i = 0; i < n; i++) {
      const seg = {
        kind: "wall",
        ax: lerp(f.ax, f.bx, i / n), ay: lerp(f.ay, f.by, i / n),
        bx: lerp(f.ax, f.bx, (i + 1) / n), by: lerp(f.ay, f.by, (i + 1) / n),
        nx: f.nx, ny: f.ny, shade: f.shade, len: len / n,
        hasDoor: f.name === front && i === (n - 1) / 2,
        glow: (i * 7 + f.name.length) % 5 === 0
      };
      seg.mx = (seg.ax + seg.bx) / 2;
      seg.my = (seg.ay + seg.by) / 2;
      if (seg.hasDoor) { doorX = seg.mx + seg.nx; doorY = seg.my + seg.ny; }
      segments.push(seg);
    }
  }
  // Smokestack in a back corner
  const sx = front === "east" ? x0 + 2.5 : x1 - 2.5;
  const sy = front === "south" ? y0 + 2.5 : y1 - 2.5;
  // Lines you bump into, with a gap for the door
  const wallLines = [];
  let doorLine = null;
  for (const f of faces) {
    if (f.name !== front) { wallLines.push([f.ax, f.ay, f.bx, f.by]); continue; }
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay), ux = (f.bx - f.ax) / len, uy = (f.by - f.ay) / len;
    const mx = (f.ax + f.bx) / 2, my = (f.ay + f.by) / 2, half = S.hospital.doorWidth / 2;
    wallLines.push([f.ax, f.ay, mx - ux * half, my - uy * half]);
    wallLines.push([mx + ux * half, my + uy * half, f.bx, f.by]);
    doorLine = [mx - ux * half, my - uy * half, mx + ux * half, my + uy * half];
  }
  // Stairs along the back wall (the wall opposite the door)
  const backName = { north: "south", south: "north", east: "west", west: "east" }[front];
  const bf = faces.find((f) => f.name === backName);
  const blen = Math.hypot(bf.bx - bf.ax, bf.by - bf.ay);
  const ux = (bf.bx - bf.ax) / blen, uy = (bf.by - bf.ay) / blen;
  const stairs = {
    x0: bf.ax + ux * 1.5, y0: bf.ay + uy * 1.5,   // bottom step, by the wall
    ux, uy, ix: -bf.nx, iy: -bf.ny,               // up the stairs / away from the wall
    len: S.hospital.stairLength, wid: S.hospital.stairWidth
  };
  const sx0 = stairs.x0 + stairs.ix * stairs.wid, sy0 = stairs.y0 + stairs.iy * stairs.wid;
  stairs.railLine = [sx0, sy0, sx0 + ux * stairs.len, sy0 + uy * stairs.len];   // railing side
  stairs.bottomLine = [stairs.x0, stairs.y0, sx0, sy0];
  stairs.topLine = [stairs.x0 + ux * stairs.len, stairs.y0 + uy * stairs.len, sx0 + ux * stairs.len, sy0 + uy * stairs.len];

  // Beds along the long walls (not by the door or stairs), lights down the middle
  const beds = [], lights = [];
  const nb = Math.max(2, Math.ceil(S.hospital.bedCount / 2));
  for (let i = 0; i < nb; i++) {
    const bx = lerp(x0 + 3, x1 - 3, i / (nb - 1));
    for (const by of [y0 + 1.6, y1 - 1.6]) {
      const nearStairs = stairAt(stairs, bx, by, 1.5) !== null;
      if (!nearStairs && Math.hypot(bx - doorX, by - doorY) > 4) beds.push({ kind: "bed", x: bx, y: by, fz: 0 });
      if (!nearStairs) beds.push({ kind: "bed", x: bx, y: by, fz: S.hospital.ceilingHeight });
    }
  }
  for (let i = 0; i < S.hospital.ceilingLights; i++) {
    lights.push({ x: lerp(x0 + 3, x1 - 3, i / Math.max(1, S.hospital.ceilingLights - 1)), y: cy, working: i === Math.floor(S.hospital.ceilingLights / 2) });
  }
  // The big tube and the scientist, in the middle of the 2nd floor
  const H2 = S.hospital.ceilingHeight;
  const props = [
    { kind: "tube", x: cx, y: cy, fz: H2, r: S.hospital.tubeRadius },
    { kind: "scientist", x: cx + (W > D ? 1.8 : 0), y: cy + (W > D ? 0 : 1.8), fz: H2, r: 0.35 }
  ];
  // The locked hatch down to the basement (ground floor, near a front corner)
  const ff = faces.find((f) => f.name === front);
  const hatch = { x: lerp(ff.ax, ff.bx, 0.82) - ff.nx * 2.2, y: lerp(ff.ay, ff.by, 0.82) - ff.ny * 2.2 };
  for (let i = beds.length - 1; i >= 0; i--) {
    if (beds[i].fz === 0 && Math.hypot(beds[i].x - hatch.x, beds[i].y - hatch.y) < S.hospital.hatchSize + 2) beds.splice(i, 1);
  }
  // In the basement: the ladder back up, and some crates
  const HB = -S.hospital.ceilingHeight;
  props.push({ kind: "ladder", x: hatch.x, y: hatch.y, fz: HB, r: 0 });
  // The basement is bigger than the hospital (it goes under the forest)
  const E = S.hospital.basementExtra;
  const bb = { x0: x0 - E, x1: x1 + E, y0: y0 - E, y1: y1 + E };
  const basementSegs = [], basementLines = [];
  const bfaces = [
    { ax: bb.x1, ay: bb.y0, bx: bb.x0, by: bb.y0, nx: 0, ny: -1, shade: 0.8 },
    { ax: bb.x0, ay: bb.y0, bx: bb.x0, by: bb.y1, nx: -1, ny: 0, shade: 0.9 },
    { ax: bb.x0, ay: bb.y1, bx: bb.x1, by: bb.y1, nx: 0, ny: 1, shade: 0.7 },
    { ax: bb.x1, ay: bb.y1, bx: bb.x1, by: bb.y0, nx: 1, ny: 0, shade: 1.0 }
  ];
  for (const f of bfaces) {
    basementLines.push([f.ax, f.ay, f.bx, f.by]);
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay), n = Math.ceil(len / S.hospital.segmentLength);
    for (let i = 0; i < n; i++) {
      const seg = { kind: "wall", ax: lerp(f.ax, f.bx, i / n), ay: lerp(f.ay, f.by, i / n),
        bx: lerp(f.ax, f.bx, (i + 1) / n), by: lerp(f.ay, f.by, (i + 1) / n),
        nx: f.nx, ny: f.ny, shade: f.shade, len: len / n, hasDoor: false, glow: false };
      seg.mx = (seg.ax + seg.bx) / 2;
      seg.my = (seg.ay + seg.by) / 2;
      seg.cave = true;                       // rocky cave wall
      seg.tone = 0.75 + Math.random() * 0.5;
      seg.lumps = [];
      for (let k = 0; k < 4; k++) seg.lumps.push({ u: Math.random(), h: Math.random() * 3, r: 0.4 + Math.random() * 0.7, tone: 0.6 + Math.random() * 0.7 });
      seg.jag = [];                          // jagged top edge
      for (let k = 0; k <= 4; k++) seg.jag.push(Math.random() * 0.6);
      basementSegs.push(seg);
    }
  }
  // Flickery lights all over the basement ceiling
  const basementLights = [];
  const sp = S.hospital.basementLightSpacing;
  for (let lx = bb.x0 + sp / 2; lx < bb.x1; lx += sp) {
    for (let ly = bb.y0 + sp / 2; ly < bb.y1; ly += sp) basementLights.push({ x: lx, y: ly, flicker: 0.3 + Math.random() * 0.5 });
  }
  // Cave stuff: stalactites, stalagmites, boulders and cobwebs (not on the ladder)
  const caveSpot = (margin) => {
    for (let tries = 0; tries < 20; tries++) {
      const cx2 = lerp(bb.x0 + margin, bb.x1 - margin, Math.random()), cy2 = lerp(bb.y0 + margin, bb.y1 - margin, Math.random());
      if (Math.hypot(cx2 - hatch.x, cy2 - hatch.y) > 3) return [cx2, cy2];
    }
    return [bb.x0 + margin, bb.y0 + margin];
  };
  for (let i = 0; i < S.hospital.stalactiteCount; i++) {
    const [sx2, sy2] = caveSpot(1);
    props.push({ kind: "stalactite", x: sx2, y: sy2, fz: HB, r: 0, w: 0.15 + Math.random() * 0.25, len: 0.4 + Math.random() * 1.1 });
  }
  for (let i = 0; i < S.hospital.stalagmiteCount; i++) {
    const [sx2, sy2] = caveSpot(1.5);
    const wd = 0.25 + Math.random() * 0.35;
    props.push({ kind: "stalagmite", x: sx2, y: sy2, fz: HB, r: wd, w: wd, len: 0.6 + Math.random() * 1.4 });
  }
  for (let i = 0; i < S.hospital.caveRockCount; i++) {
    const [sx2, sy2] = caveSpot(2);
    const rr = 0.4 + Math.random() * 0.7;
    props.push({ kind: "rock", x: sx2, y: sy2, fz: HB, r: rr, h: 0.3 + Math.random() * 0.5, shade: 0.7 + Math.random() * 0.4 });
  }
  for (let i = 0; i < S.hospital.cobwebCount; i++) {
    // mostly near the walls and corners
    const t2 = Math.random(), side = Math.floor(Math.random() * 4), m = 0.6;
    const wx = side < 2 ? lerp(bb.x0 + 1, bb.x1 - 1, t2) : (side === 2 ? bb.x0 + m : bb.x1 - m);
    const wy = side < 2 ? (side === 0 ? bb.y0 + m : bb.y1 - m) : lerp(bb.y0 + 1, bb.y1 - 1, t2);
    props.push({ kind: "cobweb", x: wx, y: wy, fz: HB, r: 0, size: 0.5 + Math.random() * 0.6, drop: 0.5 + Math.random() * 0.6, spin: Math.random() * 6 });
  }
  // The arms (body pieces) hidden in the cave
  const arms = [];
  for (let i = 0; i < S.arms.count; i++) {
    const [ax2, ay2] = caveSpot(3);
    arms.push({ kind: "arm", x: ax2, y: ay2, fz: HB, dir: Math.random() < 0.5 ? -1 : 1, got: false });
  }
  // Easter egg: a little stuffed alligator toy somewhere in the cave
  if (S.hospital.stuffedGator) {
    const [gx, gy] = caveSpot(3);
    props.push({ kind: "gator", x: gx, y: gy, fz: HB, r: 0, dir: Math.random() < 0.5 ? -1 : 1 });
  }
  if (S.hospital.stuffedElephant) {
    const [ex, ey] = caveSpot(3);
    props.push({ kind: "elephant", x: ex, y: ey, fz: HB, r: 0 });
  }
  if (S.hospital.stuffedBear) {
    const [tx, ty] = caveSpot(3);
    props.push({ kind: "bear", x: tx, y: ty, fz: HB, r: 0 });
  }
  if (S.hospital.stuffedUnicorn) {
    const [ux, uy] = caveSpot(3);
    props.push({ kind: "unicorn", x: ux, y: uy, fz: HB, r: 0 });
  }
  // Blood splats on and around the hatch
  const blood = [];
  for (let i = 0; i < 9; i++) {
    const r = 0.15 + Math.random() * 0.45, a = Math.random() * Math.PI * 2, dd = Math.random() * S.hospital.hatchSize * 1.4;
    const pts = [];
    for (let k = 0; k < 9; k++) pts.push(r * (0.55 + Math.random() * 0.6));
    blood.push({ x: hatch.x + Math.cos(a) * dd, y: hatch.y + Math.sin(a) * dd, pts, dark: Math.random() < 0.5 });
  }
  hospital = { x0, x1, y0, y1, segments, doorX, doorY, wallLines, doorLine, beds, lights, stairs, props, hatch,
          bb, basementSegs, basementLines, basementLights, blood, arms,
          doorOpen: false, legsGiven: false, saidThanks: false,
          stack: { kind: "stack", x: sx, y: sy, r: S.hospital.stackRadius, h: S.hospital.stackHeight } };

  placeLegs(cx, cy);
  resetSpider();
  // Clear the trees where the hospital stands
  for (const ch of chunks.values()) ch.things = ch.things.filter((t) => !insideHospital(t.x, t.y, 2));
  showToast("📍 " + S.hospital.spawnAtSubscribers[mode].toLocaleString() + S.text.hospitalAppeared, 4);
  reachCheckpoint(1);
  playBeep(523, 0.15);
  setTimeout(() => playBeep(392, 0.3), 160);
}

// ==========================================================
//  THE SPIDER (lives in the cave, hunts by sound)
// ==========================================================
const spider = { kind: "spider", x: 0, y: 0, fz: 0, tx: 0, ty: 0, mode: "wander", timer: 0, skitter: 0, moving: false };

function resetSpider() {
  if (!hospital) return;
  const bb = hospital.bb;
  spider.x = lerp(bb.x0 + 4, bb.x1 - 4, 0.8);
  spider.y = lerp(bb.y0 + 4, bb.y1 - 4, 0.8);
  spider.fz = -S.hospital.ceilingHeight;   // it lives on the cave floor
  spider.mode = "wander";
  spider.timer = 0;
  pickSpiderTarget();
}

function pickSpiderTarget() {
  const bb = hospital.bb;
  spider.tx = lerp(bb.x0 + 3, bb.x1 - 3, Math.random());
  spider.ty = lerp(bb.y0 + 3, bb.y1 - 3, Math.random());
}

function moveSpiderToward(tx, ty, speed, dt) {
  const dx = tx - spider.x, dy = ty - spider.y, d = Math.hypot(dx, dy);
  const step = Math.min(d, speed * monsterSpeed * dt);
  if (d > 0.01) { spider.x += (dx / d) * step; spider.y += (dy / d) * step; }
  spider.moving = step > 0.001;
  const bb = hospital.bb;
  spider.x = clamp(spider.x, bb.x0 + 1, bb.x1 - 1);
  spider.y = clamp(spider.y, bb.y0 + 1, bb.y1 - 1);
  return d;
}

// walking = are you walking right now (W/S or ▲▼)?
// Eddy's spider sound: now and then while you move around the cave. Louder when it's close,
// and it comes from the side the spider is on (left or right ear).
let spiderVoiceTimer = 8;
function spiderSounds(dt, walking) {
  if (!S.spider.voice || player.level !== 0 || !walking) return;
  spiderVoiceTimer -= dt;
  if (spiderVoiceTimer > 0) return;
  const [lo, hi] = S.spider.voiceEverySeconds;
  spiderVoiceTimer = lo + Math.random() * (hi - lo);
  const dx = spider.x - player.x, dy = spider.y - player.y, d = Math.hypot(dx, dy);
  const near = 1 - clamp(d / S.spider.voiceHearDistance, 0, 1);
  if (near <= 0) return;
  const a = player.angle * DEG, side = (-dx * Math.sin(a) + dy * Math.cos(a)) / Math.max(d, 0.001);   // -1 left … 1 right
  playVoice("spider", S.spider.voiceVolume * (0.15 + 0.85 * near * near), clamp(side, -1, 1) * 0.8);
}

function updateSpider(dt, walking) {
  if (!hospital) return;
  const SP = S.spider;
  const inCave = player.level === 0;
  spiderSounds(dt, walking);
  if (!inCave) { spider.mode = "wander"; }
  const noisy = inCave && (walking || landedNoise) && !crouching && !boots;   // crouching and silent boots are silent
  const dist = Math.hypot(player.x - spider.x, player.y - spider.y);
  const hard = mode === "hard";
  if (inCave && dist < SP.touchDistance) { startScare("spider"); return; }   // touch it = jump scare (every mode)

  if (spider.mode === "wander") {
    if (moveSpiderToward(spider.tx, spider.ty, SP.wanderSpeed, dt) < 0.5) pickSpiderTarget();
    if (noisy && dist < SP.hearDistance) {
      spider.mode = "charge";
      spider.timer = 0;
      showToast(S.text.spiderHeard, 2);
    }
  } else if (spider.mode === "charge") {
    moveSpiderToward(player.x, player.y, SP.chargeSpeed, dt);
    // its legs skitter as it runs (you can hear it coming)
    spider.skitter -= dt;
    if (spider.skitter <= 0) { spider.skitter = 0.07; playSkitter(); }
    if (hard) {
      if (dist < SP.hardStopDistance) {        // it stops right in front of you… and waits
        spider.mode = "waiting";
        spider.timer = SP.hardWaitSeconds;
      }
    } else {
      if (dist < SP.touchDistance) { startScare("spider"); return; }
      // stop moving (or crouch) and it loses you
      spider.timer = noisy ? 0 : spider.timer + dt;
      if (spider.timer > SP.loseTrackSeconds) { spider.mode = "wander"; pickSpiderTarget(); }
    }
    if (!inCave) { spider.mode = "wander"; pickSpiderTarget(); }
  } else if (spider.mode === "waiting") {
    spider.moving = false;
    spider.timer -= dt;
    if (walking) { startScare("spider"); return; }   // you moved…
    if (spider.timer <= 0) {
      spider.mode = "leaving";
      spider.timer = SP.leaveSeconds;
      const bb = hospital.bb;                         // walk away to the far side
      spider.tx = player.x < (bb.x0 + bb.x1) / 2 ? bb.x1 - 3 : bb.x0 + 3;
      spider.ty = player.y < (bb.y0 + bb.y1) / 2 ? bb.y1 - 3 : bb.y0 + 3;
      showToast(S.text.spiderLeaves, 2);
    }
  } else if (spider.mode === "leaving") {
    moveSpiderToward(spider.tx, spider.ty, SP.wanderSpeed * 1.5, dt);
    spider.timer -= dt;
    if (spider.timer <= 0) { spider.mode = "wander"; pickSpiderTarget(); }
  }
}

// Crouch (C key or 🧎): quieter and slower. Not allowed on Hard.
function toggleCrouch() {
  if (state !== "playing") return;
  if (!S.crouchByMode[mode]) { showToast(S.text.noCrouch, 2); return; }
  crouching = !crouching;
  if (crouching) showToast(S.text.crouchOn, 2);
}
function eyeH() { return (crouching ? S.crouch.eyeHeight : S.player.eyeHeight) + jumpZ; }

// Jump! (landing makes a thud the spider can hear)
function doJump() {
  if (state !== "playing" || jumpZ > 0 || onStairs) return;
  jumpV = S.jump.power;
  jumpZ = 0.001;
}

// ==========================================================
//  HELPERS
// ==========================================================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function lerp(a, b, t) { return a + (b - a) * t; }
// Difference between two angles in degrees (-180 to 180)
function angleDiff(a, b) { return (((a - b) % 360) + 540) % 360 - 180; }
// Random numbers that are the same every time (so the forest doesn't change)
function makeRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

// ==========================================================
//  THE FOREST — built in square patches ("chunks") as you walk,
//  so it never ends and never repeats. Each patch gets its own
//  random seed, so the same spot always has the same trees.
// ==========================================================
const chunks = new Map();
const stars = [];
(function makeStars() {
  const rand = makeRandom(S.forest.seed);
  for (let i = 0; i < 160; i++) stars.push({ a: rand() * 360, e: 0.1 + rand() * 0.9, b: 0.2 + rand() * 0.8 });
})();

// Mix a patch's position into one seed number
function chunkSeed(cx, cy) {
  const h = (cx * 73856093) ^ (cy * 19349663) ^ (S.forest.seed * 83492791);
  return (Math.abs(h) % 2147483646) + 1;
}

function getChunk(cx, cy) {
  const key = cx + "," + cy;
  if (chunks.has(key)) return chunks.get(key);
  if (chunks.size > 600) chunks.clear();   // forget far patches (they come back the same)

  const ch = { things: [], groundBits: [] };
  const rand = makeRandom(chunkSeed(cx, cy));
  for (let i = 0; i < 5; i++) rand();      // stir the random numbers
  const size = S.forest.chunkSize, x0 = cx * size, y0 = cy * size;
  const spot = () => [x0 + rand() * size, y0 + rand() * size];
  const nearStart = (x, y) => Math.hypot(x - S.player.startX, y - S.player.startY) < 3 ||
                              Math.hypot(x - S.player.startX - S.car.offsetX, y - S.player.startY - S.car.offsetY) < 3.5;

  for (let i = 0; i < S.forest.treesPerChunk; i++) {
    const [x, y] = spot();
    if (nearStart(x, y)) continue;
    const pine = rand() < S.forest.pineChance;
    const branches = [];
    const count = pine ? 0 : 2 + Math.floor(rand() * 4);
    for (let j = 0; j < count; j++) {
      branches.push({
        h: 0.35 + rand() * 0.5,
        side: rand() < 0.5 ? -1 : 1,
        len: 0.8 + rand() * 2.2,
        rise: 0.5 + rand() * 1.5,
        fork: rand() < 0.5
      });
    }
    const barkLines = [];
    for (let j = 0; j < 5; j++) barkLines.push({ off: rand() * 1.6 - 0.8, start: rand() * 0.7, len: 0.1 + rand() * 0.3 });
    const posterRoll = rand(), posterType = rand() < 0.5 ? "wanted" : "missing", posterTilt = rand() * 0.16 - 0.08;
    ch.things.push({
      kind: pine ? "pine" : "tree", x, y,
      poster: !pine && posterRoll < S.posters.chance ? { type: posterType, tilt: posterTilt } : null,
      r: pine ? 0.15 + rand() * 0.2 : 0.18 + rand() * 0.35,
      h: pine ? 9 + rand() * 9 : 10 + rand() * 8,
      shade: 0.75 + rand() * 0.5,
      layers: 6 + Math.floor(rand() * 4),
      spread: 1.4 + rand() * 1.4,
      branches, barkLines
    });
  }
  for (let i = 0; i < S.forest.bushesPerChunk; i++) {
    const [x, y] = spot();
    if (nearStart(x, y)) continue;
    ch.things.push({ kind: "bush", x, y, r: 0.5 + rand() * 0.8, h: 0.5 + rand() * 0.7, shade: 0.7 + rand() * 0.5 });
  }
  for (let i = 0; i < S.forest.rocksPerChunk; i++) {
    const [x, y] = spot();
    if (nearStart(x, y)) continue;
    ch.things.push({ kind: "rock", x, y, r: 0.25 + rand() * 0.6, h: 0.2 + rand() * 0.4, shade: 0.7 + rand() * 0.5 });
  }
  for (let i = 0; i < S.forest.groundBitsPerChunk; i++) {
    const [x, y] = spot();
    ch.groundBits.push({ x, y, kind: rand() < 0.6 ? "grass" : "leaf", tone: 0.6 + rand() * 0.6, tilt: rand() * 2 - 1 });
  }
  if (hospital) ch.things = ch.things.filter((t) => !insideHospital(t.x, t.y, 2));
  chunks.set(key, ch);
  return ch;
}

// Run fn on every patch within "radius" steps of you
function forEachNearbyChunk(radius, fn) {
  const size = S.forest.chunkSize;
  const pcx = Math.floor(player.x / size), pcy = Math.floor(player.y / size);
  const n = Math.ceil(radius / size);
  for (let dx = -n; dx <= n; dx++) {
    for (let dy = -n; dy <= n; dy++) fn(getChunk(pcx + dx, pcy + dy));
  }
}

// ==========================================================
//  SOUND (made with code — the ghost is silent until the scare)
// ==========================================================
let audio = null;

function startAudio() {
  if (audio) { audio.ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac = new AC();
  const master = ac.createGain();
  master.gain.value = S.sound.masterVolume;
  master.connect(ac.destination);
  const noiseBuffer = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  audio = { ac, master, noiseBuffer, voices: {} };
  loadVoices();

  // Soft wind that rises and falls
  const wind = ac.createBufferSource();
  wind.buffer = noiseBuffer;
  wind.loop = true;
  const windFilter = ac.createBiquadFilter();
  windFilter.type = "lowpass";
  windFilter.frequency.value = 450;
  const windGain = ac.createGain();
  windGain.gain.value = S.sound.windVolume;
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.08;
  const lfoGain = ac.createGain();
  lfoGain.gain.value = S.sound.windVolume * 0.6;
  lfo.connect(lfoGain);
  lfoGain.connect(windGain.gain);
  wind.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(master);
  wind.start();
  lfo.start();
}

// A locked door rattling: the chain and padlock clank
function playRattle() {
  if (!audio) return;
  const ac = audio.ac, start = ac.currentTime;
  for (let i = 0; i < 16; i++) {
    const t = start + i * 0.085 + Math.random() * 0.03;
    // metal clink
    const src = ac.createBufferSource();
    src.buffer = audio.noiseBuffer;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 2500 + Math.random() * 2500;
    bp.Q.value = 8;
    const g = ac.createGain();
    g.gain.setValueAtTime(S.cutscene.rattleVolume, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(bp); bp.connect(g); g.connect(audio.master);
    src.start(t, Math.random() * 1.5);
    src.stop(t + 0.07);
    // wooden door thump
    const o = ac.createOscillator();
    o.frequency.setValueAtTime(110 + Math.random() * 30, t);
    const og = ac.createGain();
    og.gain.setValueAtTime(S.cutscene.rattleVolume * 0.6, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(og); og.connect(audio.master);
    o.start(t);
    o.stop(t + 0.09);
  }
}

// One soft tap on a phone keyboard
function playKeyTap() {
  if (!audio) return;
  const ac = audio.ac, t = ac.currentTime, v = S.cutscene.typeVolume;
  const o = ac.createOscillator();
  o.type = "square";
  o.frequency.setValueAtTime(1700 + Math.random() * 500, t);
  const g = ac.createGain();
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  o.connect(g); g.connect(audio.master);
  o.start(t);
  o.stop(t + 0.035);
  const n = ac.createBufferSource();                // a little click
  n.buffer = audio.noiseBuffer;
  const hp = ac.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 3000;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(v * 0.7, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
  n.connect(hp); hp.connect(ng); ng.connect(audio.master);
  n.start(t, Math.random());
  n.stop(t + 0.025);
}

// A heavy fist banging on a wooden door
function playBang() {
  if (!audio) return;
  const ac = audio.ac, t = ac.currentTime, v = S.cutscene.bangVolume;
  const o = ac.createOscillator();                  // deep thud
  o.type = "sine";
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.18);
  const og = ac.createGain();
  og.gain.setValueAtTime(v, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(og); og.connect(audio.master);
  o.start(t);
  o.stop(t + 0.32);
  const n = ac.createBufferSource();                // wood knock
  n.buffer = audio.noiseBuffer;
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = 900;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(v * 0.8, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  n.connect(lp); lp.connect(ng); ng.connect(audio.master);
  n.start(t, Math.random());
  n.stop(t + 0.14);
}

// Rain: turn it on or off (it fades)
function setRain(on) {
  if (!audio) return;
  const ac = audio.ac, now = ac.currentTime;
  if (on && !audio.rain) {
    const src = ac.createBufferSource();
    src.buffer = audio.noiseBuffer;
    src.loop = true;
    const hp = ac.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 900;
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 7000;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(S.cutscene.rainVolume, now + 0.6);
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(audio.master);
    src.start();
    audio.rain = { src, g };
  } else if (!on && audio.rain) {
    const r = audio.rain;
    r.g.gain.setValueAtTime(r.g.gain.value, now);
    r.g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    r.src.stop(now + 0.55);
    audio.rain = null;
  }
}

// The spider's legs skittering on rock (quiet clicks)
function playSkitter() {

  n.buffer = audio.noiseBuffer;
  const hp = ac.createBiquadFilter();
  hp.type = "bandpass";
  hp.frequency.value = 3000 + Math.random() * 3000;
  hp.Q.value = 6;
  const g = ac.createGain();
  g.gain.setValueAtTime(S.spider.skitterVolume, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  n.connect(hp); hp.connect(g); g.connect(audio.master);
  n.start(t, Math.random());
  n.stop(t + 0.035);
}

// A loud hiss (spider jump scare)
function playHiss(seconds) {

function playShriek() {

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(S.sound.shriekVolume, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  g.connect(audio.master);
  const voices = [["sawtooth", 1400, 200], ["square", 1480, 160], ["sawtooth", 700, 90]];
  for (const [type, from, to] of voices) {

// ==========================================================
//  UPDATE — the game rules (runs about 60 times a second)
// ==========================================================
function update(dt) {
  if (state === "intro") return;     // waiting for "Tap to begin"
  if (state === "hatchCut") {
    hatchT += dt;
    while (hatchSoundsDone < hatchEvents.length && hatchT >= hatchEvents[hatchSoundsDone][0]) hatchEvents[hatchSoundsDone++][1]();
    if (hatchT >= S.hospital.hatchCutSeconds) endHatchCutscene();
    return;
  }
  if (state === "finale") {
    // the knife: press CATCH within 3 seconds!
    if (finT >= S.finale.catchAt && !finCatch.done) {
      if (!finCatch.active) {
        finCatch.active = true;
        finCatch.t = 0;
        $("btnCatch").classList.remove("hidden");
      }
      finCatch.t += dt;
      finT = S.finale.catchAt + finCatch.t * 0.3;        // the knife creeps toward your face…
      $("btnCatch").textContent = S.text.catchButton + " " + Math.max(1, Math.ceil(S.finale.catchSeconds - finCatch.t));
      if (finCatch.t >= S.finale.catchSeconds) {         // too slow: the knife gets you…
        finCatch.done = true;
        finCatch.failed = true;
        finCatch.failT = 0;
        $("btnCatch").classList.add("hidden");
        $("btnSkip").classList.add("hidden");
        sfxNoise("lowpass", 800, 100, 0.6, 0.5);
      }
      return;
    }
    if (finCatch.failed) {                                 // …the screen goes black, back to the menu
      finCatch.failT += dt;
      if (finCatch.failT >= S.finale.blackoutSeconds) {
        finCatch.failed = false;
        cutCv.classList.add("hidden");
        gameOver("knife");
      }
      return;
    }
    finT += dt;
    while (finEventsDone < finaleEvents.length && finT >= finaleEvents[finEventsDone][0]) finaleEvents[finEventsDone++][1]();
    if (finT >= S.finale.cutsceneSeconds) startChase();
    return;
  }
  if (state === "win") {
    winT += dt;
    heliTimer -= dt;
    if (heliTimer <= 0 && winT < S.finale.planeAt) { heliTimer = 0.11; sfxTone("sine", 70, 40, 0.09, 0.22); }      // chop-chop-chop
    if (winT >= S.finale.planeAt && !planeSound) { planeSound = true; sfxNoise("lowpass", 400, 900, 2.2, 0.35); }   // plane landing
    if (winT >= S.finale.planeAt + 4 && !planeSound2) { planeSound2 = true; sfxNoise("lowpass", 1200, 300, 3.5, 0.45); sfxTone("sawtooth", 90, 140, 3.5, 0.08); }  // take off!
    if (winT >= 2 && winT < 4.6) { gunTimer -= dt; if (gunTimer <= 0) { gunTimer = 0.06; sfxNoise("bandpass", 1600, 700, 0.05, 0.3); } }
    if (winT >= S.finale.winSeconds) endWin();
    return;
  }
  if (state === "cutscene") {
    cutT += dt;
    cutsceneSounds();
    if (cutT >= cutTotal()) endCutscene();
    return;
  }
  if (state === "playing") {
    updatePlaying(dt);
  } else if (state === "scare" && scare.kind === "grinner") {
    scare.t += dt;
    if (scare.t >= S.grinScare.seconds) gameOver("grinner");
  } else if (state === "scare" && scare.kind === "spider") {
    scare.t += dt;
    const SS = S.spiderScare;
    if (!scare.shrieked && scare.t >= SS.grabSeconds + SS.liftSeconds + SS.mouthSeconds * 0.5) {
      scare.shrieked = true;
      playChomp();
    }
    if (scare.t >= SS.grabSeconds + SS.liftSeconds + SS.mouthSeconds) gameOver("spider");
  } else if (state === "scare") {
    scare.t += dt;
    if (!scare.shrieked && scare.t >= S.scare.flickerSeconds) {
      scare.shrieked = true;
      playShriek();
    }
    if (scare.t >= S.scare.flickerSeconds + S.scare.faceSeconds) gameOver("ghost");
  }
  updateUI();
}

function updatePlaying(dt) {
  // 1. Walk and turn
  const turn = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  player.angle += turn * S.player.turnSpeed * dt;
  const walk = (held.fwd ? 1 : 0) - (held.back ? 1 : 0);
  // Sprinting (depends on the mode). With the bar, sprinting uses it up and it refills when you stop.
  const sprintRule = S.sprintByMode[mode];
  sprinting = held.sprint && walk !== 0 && sprintRule !== "none" && !crouching &&
              (sprintRule === "unlimited" || (!tired && stamina > 0));
  if (sprintRule !== "bar") {
    stamina = 100;
    tired = false;
  } else if (sprinting) {
    stamina -= S.player.staminaDrain * dt;
    if (stamina <= 0) { stamina = 0; tired = true; }
  } else {
    stamina = Math.min(100, stamina + S.player.staminaRefill * dt);
    if (tired && stamina >= S.player.tiredUntil) tired = false;
  }
  if (walk !== 0) {
    const a = player.angle * DEG;
    const speed = S.player.moveSpeed * (sprinting ? S.player.sprintMultiplier : 1) * (crouching ? S.crouch.speed : 1);
    movePlayer(Math.cos(a) * walk * speed * dt, Math.sin(a) * walk * speed * dt);
    updateStairs();
    const before = Math.floor(bobPhase / Math.PI);
    bobPhase += dt * S.player.stepsPerSecond * (sprinting ? S.player.sprintMultiplier : 1) * Math.PI;
    if (Math.floor(bobPhase / Math.PI) !== before) playStep();
    bob = Math.abs(Math.sin(bobPhase)) * S.player.bobAmount;
  } else {
    bob *= 0.85;
  }

  // 1b. Jumping
  landedNoise = false;
  if (jumpZ > 0) {
    jumpZ += jumpV * dt;
    jumpV -= S.jump.gravity * dt;
    if (jumpZ <= 0) { jumpZ = 0; jumpV = 0; landedNoise = true; playStep(); playStep(); }
  }

  // 2. Battery
  let drain = S.battery.drainIdle;
  if (phoneUp) drain += S.battery.drainPhoneUp;
  if (flashlightOn) drain += S.battery.drainFlashlight;
  if (recordingOn) drain += S.battery.drainRecording;
  if (!S.battery.neverDies) {
    battery -= drain * dt;
    if (battery <= 0) { battery = 0; gameOver("battery"); return; }
  }

  // 3. Danger meter
  if (phoneUp) danger += S.danger.phoneUpPerSecond * dt;
  if (flashlightOn) danger += S.danger.flashlightPerSecond * dt;
  if (recordingOn) danger += S.danger.recordingPerSecond * dt;
  if (!phoneUp && !flashlightOn) danger -= S.danger.cooldownPerSecond * dt;
  danger = clamp(danger, 0, 100);

  // Full danger = she starts chasing you. Calm down and she gives up.
  // Inside the hospital she stops chasing (and rushing) until you go back out.
  const playerInside = inHospitalNow();
  const safeFromGhost = playerInside && player.level !== 0;   // the ghost CAN get you in the basement
  ghost.fz = player.level === 0 ? -S.hospital.ceilingHeight : 0;   // she follows you down
  if (safeFromGhost) {
    if (ghost.hunting || ghost.rushLeft > 0) showToast(S.text.chaseStopped, 3);
    ghost.hunting = false;
    ghost.rushLeft = 0;
    ghost.rushTimer = 0;
  }
  if (danger >= 100 && !ghost.hunting && !safeFromGhost) { ghost.hunting = true; ghostSeesYou(); }
  if (ghost.hunting && danger < S.ghost.huntStopsAt && finale !== "chase") {
    ghost.hunting = false;
    showToast(S.text.huntOver, 2.5);
  }

  // 3b. The flashlight flickers sometimes (a lot when she's close)
  if (flashlightOn) {
    let chance = S.flashlight.flickerPerSecond;
    if (ghost.dist < S.signal.weakDistance) chance += S.flashlight.flickerNearGhost;
    if (flickerLeft <= 0 && Math.random() < chance * dt) {
      flickerLeft = lerp(S.flashlight.flickerMinSeconds, S.flashlight.flickerMaxSeconds, Math.random());
    }
    if (flickerLeft > 0) {
      flickerLeft -= dt;
      flashPower = Math.random() < 0.5 ? 0 : 0.3 + Math.random() * 0.7;
    } else {
      flashPower = 1;
    }
  } else {
    flashPower = 0;
    flickerLeft = 0;
  }

  // 3c. Shine your light right at her and she's stunned
  if (ghost.stunCooldown > 0) ghost.stunCooldown -= dt;
  if (ghost.stunLeft > 0) {
    ghost.stunLeft -= dt;
    if (ghost.stunLeft <= 0) ghost.stunCooldown = S.ghost.stunCooldownSeconds;
  }
  const aimingAtHer = flashPower > 0.5 && flashlightHitsGhost();
  const stunBlocked = danger >= S.ghost.stunBlockedAt;
  lightBlocked = aimingAtHer && stunBlocked && ghost.stunLeft <= 0;
  if (ghost.stunLeft <= 0 && ghost.stunCooldown <= 0 && aimingAtHer && !stunBlocked) {
    ghost.stunLeft = S.ghost.stunSeconds;
    ghost.rushLeft = 0;
    showToast(S.text.stunned, 2.5);
  }

  // 4. The ghost circles you and comes closer as danger rises.
  //    When she's hunting, she walks straight at you.
  //    Sometimes (half the time) she suddenly RUNS at you.
  if (ghost.stunLeft <= 0 && !(finale === "chase" && chaseT < S.finale.headStart)) {   // frozen while stunned (or at the start of the chase)
    if (!ghost.hunting && ghost.rushLeft <= 0 && !safeFromGhost) {
      ghost.rushTimer += dt;
      if (ghost.rushTimer >= S.ghost.rushEverySeconds) {
        ghost.rushTimer = 0;
        if (Math.random() < S.ghost.rushChance) { ghost.rushLeft = S.ghost.rushSeconds; ghostSeesYou(); }
      }
    }
    if (ghost.rushLeft > 0 && !ghost.hunting) {
      const rx = player.x - ghost.x, ry = player.y - ghost.y, rd = Math.hypot(rx, ry);
      if (rd > 0.001) {
        ghost.x += (rx / rd) * S.ghost.rushSpeed * monsterSpeed * dt;
        ghost.y += (ry / rd) * S.ghost.rushSpeed * monsterSpeed * dt;
      }
      ghost.rushLeft -= dt;
      if (ghost.rushLeft <= 0) placeGhostAway();   // she vanishes
    } else if (ghost.hunting) {
      const hx = player.x - ghost.x, hy = player.y - ghost.y, hd = Math.hypot(hx, hy);
      if (hd > 0.001) {
        const hs = finale === "chase" ? S.finale.ghostSpeed : S.ghost.huntSpeed;
        ghost.x += (hx / hd) * hs * monsterSpeed * dt;
        ghost.y += (hy / hd) * hs * monsterSpeed * dt;
      }
    } else {
      if (Math.random() < S.ghost.turnChancePerSecond * dt) ghost.orbitDir = -ghost.orbitDir;
      let ang = Math.atan2(ghost.y - player.y, ghost.x - player.x);
      ang += ghost.orbitDir * S.ghost.orbitSpeed * monsterSpeed * DEG * dt;
      const want = lerp(S.ghost.farDistance, S.ghost.nearDistance, danger / 100);
      const tx = player.x + Math.cos(ang) * want, ty = player.y + Math.sin(ang) * want;
      const gdx = tx - ghost.x, gdy = ty - ghost.y, gd = Math.hypot(gdx, gdy);
      const step = Math.min(gd, S.ghost.moveSpeed * monsterSpeed * dt);
      if (gd > 0.001) { ghost.x += (gdx / gd) * step; ghost.y += (gdy / gd) * step; }
    }
  }
  ghost.dist = Math.hypot(ghost.x - player.x, ghost.y - player.y);

  // She can't get into the hospital
  if (player.level !== 0) keepGhostOutsideHospital();
  ghost.dist = Math.hypot(ghost.x - player.x, ghost.y - player.y);

  // If she touches you: JUMP SCARE (but you're safe inside the hospital)
  const safeInside = inHospitalNow() && player.level !== 0;
  if (ghost.dist < S.ghost.touchDistance && !safeInside) { startScare(finale === "chase" ? "grinner" : "ghost"); return; }

  // 5. She kills your signal when she's close
  signal = S.signal.maxBars;
  if (ghost.dist < S.signal.deadDistance) signal = 0;
  else if (ghost.dist < S.signal.weakDistance) signal = Math.max(0, signal - 1);

  // 6. Filming her
  if (recordingOn) recordSeconds += dt;
  // (she only counts if she's stunned)
  const herOnCamera = recordingOn && ghostInCamera();
  if (herOnCamera && ghost.stunLeft > 0) {
    clipTimer += dt;
    if (clipTimer >= S.clip.secondsNeeded) saveClip();
  }

  // 7. Uploading clips (needs signal)
  if (pendingClips > 0 && signal >= S.upload.barsNeeded) {
    uploadTimer += dt;
    if (uploadTimer >= S.upload.secondsPerClip) {
      uploadTimer = 0;
      pendingClips--;
      subscribers += S.clip.subscribers;
      showToast(S.text.uploaded + S.clip.subscribers + S.text.subsLabel, 2.5);
      if (!hospital && subscribers >= S.hospital.spawnAtSubscribers[mode]) spawnHospital();
      playBeep(660, 0.1);
      setTimeout(() => playBeep(990, 0.15), 110);
    }
  }

  // 7b. The hospital door
  if (hospital) {
    const dd = Math.hypot(player.x - hospital.doorX, player.y - hospital.doorY);
    if (!hospital.doorOpen && dd < S.hospital.doorDistance) {
      hospital.doorOpen = true;
      showToast(S.text.doorOpens, 3);
      playCreak();
    }
  }

  // 7c. Pick up legs
  for (const leg of legs) {
    if (leg.got || player.level !== 1) continue;
    if (Math.hypot(player.x - leg.x, player.y - leg.y) < S.legs.pickupDistance) {
      leg.got = true;
      legsFound++;
      showToast(legsFound >= legs.length ? S.text.legsAll : S.text.legFound + " (" + legsFound + "/" + legs.length + ")", 3);
      playBeep(784, 0.1);
      setTimeout(() => playBeep(1046, 0.15), 110);
    }
  }

  // 7d. Talk to the scientist upstairs (and give him the legs)
  if (hospital) {
    const sci = hospital.props.find((pr) => pr.kind === "scientist");
    const near = Math.hypot(player.x - sci.x, player.y - sci.y) < S.hospital.talkDistance;
    const canTalk = near && player.level === 2 && !onStairs && playerInside;
    if (canTalk && !hospital.legsGiven && legs.length > 0 && legsFound >= legs.length) {
      hospital.legsGiven = true;      // the legs go into the tube
      hasKey = true;                  // he gives you the key
      sci.dark = true;                // and he starts looking sick and grey…
      showToast(S.text.legsGiven, 6);
      $("btnKey").classList.remove("hidden");
    }
    // Bring him both arms too… and the finale begins
    if (canTalk && hospital.legsGiven && hospital.saidThanks && armsFound >= hospital.arms.length) { startFinale(); return; }
    if (!canTalk && hospital.legsGiven) hospital.saidThanks = true;
    $("dialogText").textContent = !hospital.legsGiven ? S.text.scientistLine
      : hospital.saidThanks ? S.text.scientistAfter : S.text.scientistThanks;
    setTalking(canTalk);
  }

  // 7e. The basement hatch (ground floor) and the ladder back up (basement)
  if (hospital) {
    const hd = Math.hypot(player.x - hospital.hatch.x, player.y - hospital.hatch.y);
    const atNow = playerInside && !onStairs && player.level <= 1 && hd < S.hospital.hatchDistance;
    if (atNow && !atHatch) {
      if (player.level === 1 && !hasKey) {
        showToast(S.text.hatchLocked, 3);
      } else if (player.level === 1 && !keyHeld) {
        showToast(S.text.holdKeyFirst, 3);
      } else if (player.level === 1 && !hospital.keyDropped) {
        startHatchCutscene();          // the first time: the cutscene (and you drop the key…)
        return;
      } else if (player.level === 1) {
        enterBasement();
        showToast(S.text.goDown, 2.5);
        playCreak();
      } else if (!hasKey) {
        showToast(S.text.needKeyUp, 3);   // you need your key to get out
      } else {
        player.level = 1;
        player.floorZ = 0;
        showToast(S.text.goUp, 2.5);
      }
    }
    atHatch = atNow;               // you have to step off and back on to use it again
  }

  // 7f2. The spider in the cave (it hears you walking) and the arms
  // 7f2b. Find the key you dropped in the cave
  if (hospital && hospital.lostKey && player.level === 0 &&
      Math.hypot(player.x - hospital.lostKey.x, player.y - hospital.lostKey.y) < S.hospital.keyPickupDistance) {
    hospital.lostKey = null;
    hasKey = true;
    $("btnKey").classList.remove("hidden");
    showToast(S.text.keyFound, 3);
    playBeep(1046, 0.1); setTimeout(() => playBeep(1568, 0.15), 110);
  }

  // 7f3. A subscriber brings you silent boots in the basement
  if (hospital && player.level === 0 && !boots && fan.mode === "none" && subscribers >= S.boots.atSubscribers[mode]) {
    fan.mode = "coming";
    fan.x = hospital.hatch.x; fan.y = hospital.hatch.y; fan.fz = -S.hospital.ceilingHeight;
    showToast(S.text.fanComing, 3);
  }
  if (fan.mode === "coming" || fan.mode === "leaving") {
    const tx = fan.mode === "coming" ? player.x : hospital.hatch.x, ty = fan.mode === "coming" ? player.y : hospital.hatch.y;
    const fdx = tx - fan.x, fdy = ty - fan.y, fd = Math.hypot(fdx, fdy);
    if (fd > 0.01) { const st = Math.min(fd, S.boots.fanSpeed * dt); fan.x += (fdx / fd) * st; fan.y += (fdy / fd) * st; }
    if (fan.mode === "coming" && fd < 1.6) {
      boots = true;
      fan.mode = "leaving";
      const name = S.text.commentNames[Math.floor(Math.random() * S.text.commentNames.length)];
      showToast(S.text.fanGives.replace("{name}", name), 5);
      playBeep(880, 0.1); setTimeout(() => playBeep(1175, 0.15), 110);
    }
    if (fan.mode === "leaving" && fd < 0.3) fan.mode = "gone";
    if (player.level !== 0 && fan.mode === "coming") fan.mode = "none";
  }

  if (finale === "chase") updateChase(dt);
  else updateSpider(dt, walk !== 0);
  if (state !== "playing") return;
  if (hospital) {
    for (const arm of hospital.arms) {
      if (arm.got || player.level !== 0) continue;
      if (Math.hypot(player.x - arm.x, player.y - arm.y) < S.arms.pickupDistance) {
        arm.got = true;
        armsFound++;
        showToast(armsFound >= hospital.arms.length ? S.text.armsAll : S.text.armFound + " (" + armsFound + "/" + hospital.arms.length + ")", 3);
        playBeep(784, 0.1);
        setTimeout(() => playBeep(1046, 0.15), 110);
      }
    }
  }

  // 7f. (The ending isn't finished yet, so there's no car for now.
  //      drawCar() and driveAway() are kept for later.)

  // 7g. Live comments on your phone (once you have enough subscribers)
  if (phoneUp && subscribers >= S.comments.showAtSubscribers) {
    commentTimer += dt;
    if (commentTimer >= S.comments.everySeconds) {
      commentTimer = 0;
      addComment();
    }
  }

  // 8. Caption
  if (finale === "chase") {
    const left = Math.ceil(S.finale.headStart + S.finale.filmTimeLimit - chaseT);
    captionText = S.text.chaseCaption + "  ⏱ " + Math.min(S.finale.filmTimeLimit, left) + "s";
  }
  else if (player.level === 0 && spider.mode === "waiting") captionText = S.text.spiderWaiting + Math.ceil(spider.timer);
  else if (player.level === 0 && spider.mode === "charge") captionText = mode === "hard" ? S.text.spiderCaptionHard : S.text.spiderCaption;
  else if (ghost.stunLeft > 0) captionText = S.text.stunnedCaption + Math.ceil(ghost.stunLeft) + "s";
  else if (safeInside && player.level !== 0) captionText = S.text.safeInside;   // (not in the basement)
  else if (lightBlocked) captionText = S.text.cantStun;
  else if (ghost.hunting) captionText = S.text.hunting;
  else if (ghost.rushLeft > 0) captionText = S.text.rushing;
  else if (herOnCamera) captionText = S.text.needStun;
  else if (danger >= S.danger.warningAt) captionText = S.text.dangerWarning;
  else if (signal === 0) captionText = S.text.noSignalClose;
  else captionText = "";
}

// Walk, but don't walk through trees
function movePlayer(dx, dy) {
  player.x += dx;
  player.y += dy;
  const near = [];
  forEachNearbyChunk(2, (ch) => near.push(...ch.things));
  for (const t of near) {
    if (t.kind !== "tree" && t.kind !== "pine") continue;
    const ox = player.x - t.x, oy = player.y - t.y;
    const d = Math.hypot(ox, oy), min = t.r + S.player.radius;
    if (d < min && d > 0.0001) {
      player.x += (ox / d) * (min - d);
      player.y += (oy / d) * (min - d);
    }
  }
  // Don't walk through the hospital walls (only through the open door)
  if (hospital) {
    if (player.level === 0) {
      for (const ln of hospital.basementLines) pushOutOfLine(ln);     // the bigger basement walls
    } else {
      for (const ln of hospital.wallLines) pushOutOfLine(ln);
      if (!hospital.doorOpen || player.level !== 1) pushOutOfLine(hospital.doorLine);   // the door is only on the ground floor
    }
    const st = hospital.stairs;
    if (player.level >= 1) {
      pushOutOfLine(st.railLine);
      if (stairAt(st, player.x, player.y, 0) === null) {
        if (player.level === 2) pushOutOfLine(st.bottomLine);   // don't fall down the hole
        else pushOutOfLine(st.topLine);                         // can't walk under the top of the stairs
      }
    }
    const myFloor = player.level === 2 ? S.hospital.ceilingHeight : player.level === 0 ? -S.hospital.ceilingHeight : 0;
    for (const pr of hospital.props) {
      if (pr.fz !== myFloor || pr.r === 0) continue;
      const ox = player.x - pr.x, oy = player.y - pr.y;
      const d = Math.hypot(ox, oy), min = pr.r + S.player.radius;
      if (d < min && d > 0.0001) {
        player.x += (ox / d) * (min - d);
        player.y += (oy / d) * (min - d);
      }
    }
    for (const bed of hospital.beds) {
      if (bed.fz !== (player.level === 2 ? S.hospital.ceilingHeight : 0)) continue;
      const ox = player.x - bed.x, oy = player.y - bed.y;
      const d = Math.hypot(ox, oy), min = 0.7 + S.player.radius;
      if (d < min && d > 0.0001) {
        player.x += (ox / d) * (min - d);
        player.y += (oy / d) * (min - d);
      }
    }
  }
}

// If the ghost is in (or touching) the hospital, push her back outside
function keepGhostOutsideHospital() {
  const m = S.hospital.ghostKeepAway;
  if (!insideHospital(ghost.x, ghost.y, m)) return;
  const h = hospital;
  const left = ghost.x - (h.x0 - m), right = h.x1 + m - ghost.x;
  const up = ghost.y - (h.y0 - m), down = h.y1 + m - ghost.y;
  const least = Math.min(left, right, up, down);
  if (least === left) ghost.x = h.x0 - m;
  else if (least === right) ghost.x = h.x1 + m;
  else if (least === up) ghost.y = h.y0 - m;
  else ghost.y = h.y1 + m;
}

// Where are you on the stairs? 0 = bottom, 1 = top, null = not on them
function stairAt(st, x, y, margin) {
  const rx = x - st.x0, ry = y - st.y0;
  const along = rx * st.ux + ry * st.uy, across = rx * st.ix + ry * st.iy;
  if (along < -margin || along > st.len + margin || across < -margin || across > st.wid + margin) return null;
  return clamp(along / st.len, 0, 1);
}

// Walking up and down the stairs changes how high you are
function updateStairs() {
  if (!hospital) { player.floorZ = 0; player.level = 1; return; }
  const H = S.hospital.ceilingHeight;
  if (player.level === 0) { player.floorZ = -H; onStairs = false; return; }   // in the basement
  const t = stairAt(hospital.stairs, player.x, player.y, 0);
  if (t !== null) {
    onStairs = true;
    player.floorZ = t * H;
  } else {
    if (onStairs) player.level = player.floorZ > H / 2 ? 2 : 1;   // which end did you leave from?
    onStairs = false;
    player.floorZ = player.level === 2 ? H : 0;
  }
}

// Don't walk through your car
function pushOutOfCar() {
  if (player.level !== 1 || inHospitalNow()) return;
  const ox = player.x - car.x, oy = player.y - car.y, d = Math.hypot(ox, oy), min = 1.6 + S.player.radius;
  if (d < min && d > 0.0001) {
    player.x += (ox / d) * (min - d);
    player.y += (oy / d) * (min - d);
  }
}

// Push you out of a wall line [ax, ay, bx, by]
function pushOutOfLine([ax, ay, bx, by]) {
  const vx = bx - ax, vy = by - ay;
  const t = clamp(((player.x - ax) * vx + (player.y - ay) * vy) / (vx * vx + vy * vy), 0, 1);
  const ox = player.x - (ax + vx * t), oy = player.y - (ay + vy * t);
  const d = Math.hypot(ox, oy), r = S.player.radius;
  if (d < r && d > 0.0001) {
    player.x += (ox / d) * (r - d);
    player.y += (oy / d) * (r - d);
  }
}

// Is your flashlight pointing right at her?
function flashlightHitsGhost() {
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  const dx = ghost.x - player.x, dy = ghost.y - player.y;
  const z = dx * fx + dy * fy;
  if (z < 0.3 || z > S.ghost.stunRange) return false;
  const side = -dx * fy + dy * fx;
  return Math.abs(Math.atan2(side, z)) < S.ghost.stunAngle * DEG;
}

// Is the ghost inside the phone camera's picture?
function ghostInCamera() {
  if (!phoneUp) return false;
  const a = player.angle * DEG, fx = Math.cos(a), fy = Math.sin(a);
  const dx = ghost.x - player.x, dy = ghost.y - player.y;
  const z = dx * fx + dy * fy;
  if (z < 0.5 || z > S.clip.maxDistance) return false;
  const side = -dx * fy + dy * fx;
  return Math.abs(side / z) < Math.tan((S.look.cameraFov / 2) * DEG) * 0.8;
}

function saveClip() {
  clipsFilmed++;
  pendingClips++;
  clipTimer = 0;
  showToast(S.text.clipSaved, 3);
  playBeep(1046, 0.12);
  setTimeout(() => playBeep(1318, 0.18), 130);
  // She vanishes and drifts somewhere else
  const a = (player.angle + 180 + (Math.random() - 0.5) * 120) * DEG;
  ghost.x = player.x + Math.cos(a) * S.ghost.farDistance;
  ghost.y = player.y + Math.sin(a) * S.ghost.farDistance;
}

// ===== CHECKPOINTS =====
// Save a checkpoint (1 = hospital, 2 = cave, 3 = the monster) for the mode you're playing
function reachCheckpoint(n) {
  if (!progress.cp) progress.cp = { easy: 0, normal: 0, hard: 0 };
  if ((progress.cp[mode] || 0) >= n) return;
  progress.cp[mode] = n;
  saveProgress();
  setTimeout(() => showToast(S.text.checkpointSaved + S.text.checkpoints[n - 1], 2.5), 1500);
}

// Tap a mode: if you have checkpoints there, pick where to start
let pickedMode = "easy";
function chooseStart(m) {
  if ((m === "normal" && !progress.easy) || (m === "hard" && !progress.normal)) return;
  const reached = (progress.cp && progress.cp[m]) || 0;
  if (reached === 0) { startGame(m); return; }
  pickedMode = m;
  $("cpTitle").textContent = S.text.checkpointTitle + S.text[m + "Button"];
  const box = $("cpButtons");
  box.innerHTML = "";
  const options = [S.text.fromBeginning, ...S.text.checkpoints];
  options.forEach((label, n) => {
    const btn = document.createElement("button");
    const open = n <= reached;
    btn.textContent = (open ? "" : S.text.lockIcon) + label;
    btn.disabled = !open;
    btn.addEventListener("click", () => {
      $("checkpointScreen").classList.add("hidden");
      startFromCheckpoint(pickedMode, n);
    });
    box.appendChild(btn);
  });
  $("checkpointScreen").classList.remove("hidden");
}

// Start a game and jump ahead to a checkpoint
function startFromCheckpoint(m, n) {
  startGame(m);
  if (state !== "playing" || n === 0) return;
  // 1: the hospital is here
  subscribers = Math.max(subscribers, S.hospital.spawnAtSubscribers[mode]);
  spawnHospital();
  hospital.doorOpen = true;
  if (n >= 2) {
    // 2: you gave Dr. Voss the legs, have the key, and you're in the cave
    for (const leg of legs) leg.got = true;
    legsFound = legs.length;
    hospital.legsGiven = true;
    hospital.saidThanks = true;
    hospital.hatchOpen = true;
    hospital.props.find((pr) => pr.kind === "scientist").dark = true;
    hasKey = true;
    $("btnKey").classList.remove("hidden");
    player.level = 0;
    player.floorZ = -S.hospital.ceilingHeight;
    player.x = hospital.hatch.x;
    player.y = hospital.hatch.y;
    atHatch = true;                  // so you don't climb straight back up
    onStairs = false;
    flashlightOn = false;
    if (n === 2) dropKey();          // your key is somewhere in the dark…
  }
  if (n >= 3) {
    // 3: you brought him the arms… Dr. Voss turns into a monster
    for (const a of hospital.arms) a.got = true;
    armsFound = hospital.arms.length;
    player.level = 2;
    player.floorZ = S.hospital.ceilingHeight;
    startFinale();
    return;
  }
  showToast(S.text.startingAt + S.text.checkpoints[n - 1], 3);
}

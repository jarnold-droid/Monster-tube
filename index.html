<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MonsterTube</title>
<style>
  /* ===== PAGE ===== */
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas { display: block; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* ===== CUTSCENE ===== */
  #cut { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45; background: #000; }
  #btnSkip {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    padding: 10px 18px;
    border-radius: 20px;
    border: 2px solid #aaa;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    z-index: 46;
  }
  #btnCatch {
    position: fixed;
    left: 50%; top: 66%;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 5px 10px;           /* 3x smaller than before: harder to hit! */
    border-radius: 14px;
    border: 1px solid #fff;
    background: #c01010;
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 48;
    animation: catchPulse 0.4s ease-in-out infinite alternate;
  }
  @keyframes catchPulse { to { transform: translateX(-50%) scale(1.12); box-shadow: 0 0 30px #ff3030; } }
  @media (prefers-reduced-motion: reduce) { #btnCatch { animation: none; } }
  #tapStart {
    position: fixed;
    inset: 0;
    z-index: 47;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #000;
    color: #ccc;
    text-align: center;
    padding: 0 16px;
  }
  #tapStart button {
    padding: 16px 34px;
    border-radius: 30px;
    border: 2px solid #ff3b3b;
    background: #200;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  #creditsRoll { animation: creditsUp 2.5s ease-out; }
  @keyframes creditsUp { from { transform: translateY(60vh); opacity: 0; } to { transform: none; opacity: 1; } }
  #creditsList { display: grid; gap: 14px; margin: 18px 0; }
  #creditsList small { display: block; font-size: 13px; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; }
  #creditsList b { font-size: 28px; color: #ffd84a; }
  @media (prefers-reduced-motion: reduce) { #creditsRoll { animation: none; } }
  #checkpointScreen { background: #000; }
  #cpTitle { font-size: 24px; }
  #cpButtons { display: grid; gap: 10px; width: min(300px, 100%); }
  #cpButtons button { margin-top: 0; }
  #cpButtons button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
  .overlay button#btnCpBack { border-color: #777; background: transparent; font-size: 14px; padding: 8px 18px; }
  #btnKey.on { background: #e2c060; border-color: #fff0b0; box-shadow: 0 0 14px #e2c060; }

  /* ===== MODE BUTTONS + MENU ===== */
  #modeButtons, .buttonRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; }
  .modeWrap { display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; }
  .overlay button.hintBtn { margin: 0; padding: 4px 12px; font-size: 13px; border-radius: 14px; border: 1px solid #ffd84a; background: rgba(90, 70, 0, 0.35); color: #ffe68a; }
  #hintText { margin: 6px 0 0; padding: 8px 14px; border-radius: 12px; background: rgba(90, 70, 0, 0.35); border: 1px solid #ffd84a; color: #ffe68a; font-weight: 700; }
  .coinBtn { cursor: pointer; display: inline-block; animation: coinSpin 1.2s ease-in-out infinite alternate; }
  @keyframes coinSpin { to { transform: scale(1.25) rotate(12deg); filter: drop-shadow(0 0 6px #ffd84a); } }
  .overlay button.mode {
    margin-top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 110px;
    padding: 12px 14px;
    border-radius: 16px;
  }
  .overlay button.mode small { font-size: 11px; opacity: 0.8; white-space: pre-line; }
  .controlsBox {
    display: grid;
    gap: 5px;
    margin: 6px 0 4px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 13px;
    text-align: left;
    max-width: 360px;
  }
  .controlsBox b { text-align: center; margin-bottom: 2px; }
  .controlsBox div { display: flex; gap: 10px; justify-content: space-between; }
  .controlsBox .keys { font-weight: 700; color: #ffd27a; white-space: nowrap; }
  .overlay button#btnCredits { margin-top: 8px; padding: 8px 18px; font-size: 14px; border-color: #b9952e; background: rgba(120, 90, 0, 0.2); }
  .overlay button#btnStartOver { margin-top: 10px; padding: 8px 18px; font-size: 14px; border-color: #a33; background: rgba(120, 0, 0, 0.25); }
  .overlay button#btnStartOver.sure { border-color: #ff5050; background: #500; }
  .overlay button#btnInfo { margin-top: 8px; padding: 8px 18px; font-size: 14px; border-color: #4a8ad0; background: rgba(40, 90, 160, 0.2); }
  /* the menu scrolls up and down when the Info or Controls box makes it too tall for the screen */
  #startScreen { justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  #startScreen > * { flex-shrink: 0; touch-action: pan-y; }
  #startScreen > :first-child { margin-top: auto; }
  #startScreen > :last-child { margin-bottom: auto; }
  #startScreen .controlsBox * { touch-action: pan-y; }
  .infoBox div { flex-direction: column; gap: 1px !important; flex-shrink: 0; }
  .infoBox .keys { white-space: normal; }
  .overlay button#btnControls { margin-top: 14px; padding: 8px 18px; font-size: 14px; border-color: #888; background: rgba(255, 255, 255, 0.06); }
  .overlay button.mode:disabled { cursor: not-allowed; color: #8a8a8a; background: #141414; border-color: #3a3a3a; }
  .overlay button.mode:disabled span { opacity: 0.55; filter: grayscale(1); }
  .checkDone { display: inline-block; filter: drop-shadow(0 0 4px #4cff6a) drop-shadow(0 0 8px #2bd94a); animation: checkGlow 1.1s ease-in-out infinite alternate; }
  .checkTodo { opacity: 0.6; filter: grayscale(1); }
  @keyframes checkGlow { from { filter: drop-shadow(0 0 3px #4cff6a) drop-shadow(0 0 6px #2bd94a); } to { filter: drop-shadow(0 0 7px #6aff86) drop-shadow(0 0 14px #2bd94a) drop-shadow(0 0 20px #2bd94a); } }
  .overlay button.easy { border-color: #4caf50; background: #0d2410; }
  .overlay button.normal { border-color: #e0b030; background: #261d05; }
  .overlay button.hard { border-color: #ff3b3b; background: #2a0606; }
  /* 🩸 blood stains on the Hard button: splats, a smear and drips running off the bottom */
  .overlay button.hard { position: relative; overflow: visible; text-shadow: 0 1px 2px #000;
    background:
      radial-gradient(circle at 14% 22%, rgba(150,0,0,0.95) 0 7px, rgba(120,0,0,0.6) 8px, transparent 11px),
      radial-gradient(circle at 20% 34%, rgba(140,0,0,0.9) 0 2px, transparent 3px),
      radial-gradient(circle at 8% 12%, rgba(140,0,0,0.9) 0 2px, transparent 3px),
      radial-gradient(ellipse 22px 9px at 84% 74%, rgba(130,0,0,0.9), rgba(110,0,0,0.5) 70%, transparent),
      radial-gradient(circle at 76% 62%, rgba(150,0,0,0.9) 0 2px, transparent 3px),
      radial-gradient(circle at 92% 20%, rgba(120,0,0,0.85) 0 4px, transparent 6px),
      linear-gradient(115deg, transparent 55%, rgba(110,0,0,0.45) 58%, rgba(90,0,0,0.25) 66%, transparent 70%),
      #2a0606; }
  .overlay button.hard::before, .overlay button.hard::after {
    content: ""; position: absolute; top: calc(100% - 2px); width: 5px; border-radius: 0 0 3px 3px;
    background: linear-gradient(#a00000, #6a0000); pointer-events: none; }
  .overlay button.hard::before { left: 24%; height: 14px; }
  .overlay button.hard::after { left: 70%; height: 9px; width: 4px; }
  .buttonRow button { margin-top: 10px !important; }

  /* ===== TALKING (the scientist) ===== */
  #dialog {
    position: fixed;
    left: 50%;
    bottom: calc(195px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(340px, calc(100vw - 32px));
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(5, 20, 10, 0.92);
    border: 1px solid #5fdc8e;
    box-shadow: 0 0 18px rgba(80, 255, 140, 0.35);
    font-size: 15px;
    line-height: 1.4;
    z-index: 21;
  }
  #dialog b { display: block; color: #8ff0b0; font-size: 13px; margin-bottom: 4px; }
  body.scaring #dialog { visibility: hidden; }

  /* ===== HUD (on your screen, not the phone) ===== */
  #hudTop {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: 16px; right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 0 4px #000;
    z-index: 5;
  }
  #upload { font-size: 12px; opacity: 0.9; }

  /* Pause button (top right) */
  #btnPause {
    position: fixed;
    top: calc(6px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid #555;
    background: rgba(25, 25, 25, 0.8);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    z-index: 9;
  }
  #btnPause:focus-visible { outline: 2px solid #9cf; }

  /* Sprint bar (above the walk buttons) */
  #sprintBox {
    position: fixed;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(132px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    text-shadow: 0 0 4px #000;
    z-index: 8;
  }
  #sprintBar {
    width: 120px; height: 8px;
    border: 1px solid #666;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  #sprintFill { height: 100%; width: 100%; background: #ffb347; }
  #sprintBox.tired #sprintFill { background: #e04040; }
  body[data-sprint="unlimited"] #sprintBox,
  body[data-sprint="none"] #sprintBox,
  body[data-sprint="none"] #btnSprint { display: none; }
  body.scaring #btnPause, body.scaring #sprintBox { visibility: hidden; }
  #hint {
    position: fixed;
    top: calc(34px + env(safe-area-inset-top, 0px));
    left: 16px; right: 64px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 11px;
    opacity: 0.45;
    z-index: 5;
  }
  @media (pointer: coarse) { #hint { display: none; } }
  #hospitalMarker {
    position: fixed;
    top: calc(52px + env(safe-area-inset-top, 0px));
    left: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #9fe6b4;
    text-shadow: 0 0 4px #000;
    z-index: 5;
  }
  body.scaring #hospitalMarker { visibility: hidden; }
  #legsInfo {
    position: fixed;
    top: calc(70px + env(safe-area-inset-top, 0px));
    left: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #c9f0d2;
    text-shadow: 0 0 4px #000;
    z-index: 5;
  }
  body.scaring #legsInfo { visibility: hidden; }

  #dangerMeter {
    position: fixed;
    right: calc(14px + env(safe-area-inset-right, 0px));
    top: 90px; bottom: 260px;
    width: 14px;
    border: 1px solid #666;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.5);
    z-index: 5;
  }
  #dangerFill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 0%;
    border-radius: 7px;
    background: hsl(120, 85%, 50%);
  }
  #dangerLabel {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #f66;
  }
  #dangerMeter.warn { animation: pulse 0.5s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 14px 3px rgba(255, 0, 0, 0.8); border-color: #f33; } }

  #caption {
    position: fixed;
    bottom: calc(160px + env(safe-area-inset-bottom, 0px));
    left: 16px; right: 40px;
    text-align: center;
    font-size: 15px;
    font-style: italic;
    color: #cfe0ff;
    text-shadow: 0 0 6px #000, 0 0 2px #000;
    z-index: 6;
  }
  #toast {
    position: fixed;
    top: 70px; left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(300px, calc(100vw - 32px));
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 14px;
    text-align: center;
    white-space: pre-line;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
  }
  #toast.show { opacity: 1; }

  /* ===== THE PHONE (raise it to see through the camera) ===== */
  #phone {
    position: fixed;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    padding: 8px;
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 30px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    transition: transform 0.35s ease;
    z-index: 4;
  }
  #phone.down { transform: translate(-50%, 85vh) rotate(6deg); }
  #screen {
    position: relative;
    width: min(280px, calc(100vw - 110px), calc((100vh - 240px) * 0.5625));
    width: min(280px, calc(100vw - 110px), calc((100dvh - 240px) * 0.5625));
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 22px;
    background: #000;
  }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; }
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 12px;
    font-size: 11px;
    font-weight: 600;
    background: linear-gradient(rgba(0, 0, 0, 0.7), transparent);
  }
  #recDot { color: #ff2b2b; opacity: 0.25; }
  #recDot.on { opacity: 1; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  #rightIcons { display: flex; align-items: center; gap: 6px; }
  #signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  #signal i { width: 3px; background: #555; border-radius: 1px; }
  #signal i:nth-child(1) { height: 3px; }
  #signal i:nth-child(2) { height: 6px; }
  #signal i:nth-child(3) { height: 8px; }
  #signal i:nth-child(4) { height: 11px; }
  #signal i.on { background: #fff; }
  #battery.low { color: #ff4040; }
  #areaName {
    position: absolute;
    top: 26px; left: 12px;
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #clipBox {
    position: absolute;
    top: 44px; left: 50%;
    transform: translateX(-50%);
    width: 150px;
    text-align: center;
    font-size: 11px;
  }
  /* Live comments (left side of the phone screen) */
  #comments {
    position: absolute;
    left: 6px; top: 64px; bottom: 34px;
    width: 60%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    overflow: hidden;
    pointer-events: none;
  }
  .comment {
    font-size: 10.5px;
    line-height: 1.25;
    padding: 4px 7px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.6);
    border-left: 3px solid #888;
    animation: commentIn 0.25s ease-out;
  }
  .comment b { display: block; font-size: 9.5px; opacity: 0.75; }
  .comment.kind { border-left-color: #5fdc8e; }
  .comment.mean { border-left-color: #ff5050; }
  .comment.fake { border-left-color: #f0c040; }
  @keyframes commentIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .comment { animation: none; } }
  #clipBar { margin-top: 3px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
  #clipFill { height: 100%; width: 0%; background: #ff3b3b; }

  /* ===== BUTTONS ===== */
  #controls {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 8;
    pointer-events: none;
  }
  #movePad { display: flex; align-items: flex-end; gap: 10px; }
  /* 🕹 the round joystick: drag the knob up/down to walk, left/right to turn */
  #joystick {
    pointer-events: auto; touch-action: none; position: relative; flex-shrink: 0;
    width: 132px; height: 132px; border-radius: 50%;
    border: 2px solid #555;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.10) 0%, rgba(25, 25, 25, 0.75) 70%);
    user-select: none; -webkit-user-select: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%; border: 2px solid #aaa;
    background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.55), rgba(140, 140, 140, 0.35));
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); pointer-events: none;
  }
  #joystick.active { border-color: #9cf; }
  #joystick.active #joyKnob { border-color: #cfe6ff; box-shadow: 0 0 14px rgba(150, 200, 255, 0.7); }
  .joyArrow { position: absolute; color: rgba(255, 255, 255, 0.35); font-size: 12px; pointer-events: none; }
  .joyArrow.up { top: 6px; left: 50%; transform: translateX(-50%); }
  .joyArrow.down { bottom: 6px; left: 50%; transform: translateX(-50%); }
  .joyArrow.left { left: 7px; top: 50%; transform: translateY(-50%); }
  .joyArrow.right { right: 7px; top: 50%; transform: translateY(-50%); }
  .joyCol { display: flex; flex-direction: column; gap: 8px; }
  #btnCrouch.on { border-color: #9cf; box-shadow: 0 0 12px rgba(150, 200, 255, 0.6); }
  body[data-crouch="no"] #btnCrouch { display: none; }
  #btnSprint.on { border-color: #ffb347; box-shadow: 0 0 12px rgba(255, 180, 70, 0.6); }
  #actionPad { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 8px; max-width: 166px; }
  #controls button {
    pointer-events: auto;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid #555;
    background: rgba(25, 25, 25, 0.8);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    padding: 0;
  }
  #controls button:active { transform: scale(0.93); }
  #controls button { position: relative; }
  /* ⌨ a small key label on each button: only on computers (a mouse, not a touch screen) */
  .keyHint {
    display: none; position: absolute; bottom: -7px; right: -8px;
    padding: 1px 5px; border-radius: 6px; border: 1px solid #777;
    background: #111; color: #ddd; font: 600 10px system-ui, sans-serif; line-height: 14px;
    pointer-events: none; white-space: nowrap;
  }
  @media (hover: hover) and (pointer: fine) { .keyHint { display: block; } }
  #controls button:focus-visible { outline: 2px solid #9cf; }
  #btnPhone.on { border-color: #9cf; box-shadow: 0 0 12px rgba(150, 200, 255, 0.6); }
  #btnLight.on { background: #ffe9a8; border-color: #fff3c4; box-shadow: 0 0 18px #ffe9a8; }
  .recIcon { width: 20px; height: 20px; border-radius: 50%; background: #ff2b2b; transition: border-radius 0.2s; }
  #btnRec.on { border-color: #ff4a4a; }
  #btnRec.on .recIcon { border-radius: 4px; width: 16px; height: 16px; }
  @media (max-width: 380px) {
    #joystick { width: 116px; height: 116px; }
    #joyKnob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
    #controls button { width: 44px; height: 44px; font-size: 18px; }
    #actionPad { flex-direction: column; }
  }

  /* ===== JUMP SCARE (whole screen) ===== */
  #scare { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; }
  body.scaring #phone,
  body.scaring #controls,
  body.scaring #hudTop,
  body.scaring #hint,
  body.scaring #dangerMeter,
  body.scaring #caption,
  body.scaring #toast { visibility: hidden; }

  /* ===== START + CAUGHT SCREENS ===== */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
    text-align: center;
    background: rgba(0, 0, 0, 0.9);
    z-index: 40;
  }
  /* The big title on the start screen */
  .overlay h1#startTitle {
    font-size: clamp(36px, 12.5vw, 130px);

// The "Info" box: how to play, and how to get subscribers (plus the spider, once you've reached the basement)
function buildInfo() {
  const box = $("startInfoBox");
  box.textContent = "";
  const nums = { clipSubs: S.clip.subscribers, clipSeconds: S.clip.secondsNeeded,
                 easySubs: S.hospital.spawnAtSubscribers.easy.toLocaleString(), normalSubs: S.hospital.spawnAtSubscribers.normal.toLocaleString(),
                 hardSubs: S.hospital.spawnAtSubscribers.hard.toLocaleString(), hardWait: S.spider.hardWaitSeconds };
  const addSection = (titleText, list) => {
    const title = document.createElement("b");
    title.textContent = titleText;
    box.appendChild(title);
    for (const [head, text] of list) {
      const row = document.createElement("div"), h = document.createElement("span"), t = document.createElement("span");
      h.className = "keys"; h.textContent = head;
      if (head.startsWith("🎯") && modesOpen().normal && !progress.coins.hard) {      // 🪙 the second secret coin!
        const coin = document.createElement("span");
        coin.className = "coinBtn"; coin.textContent = "🪙";
        coin.addEventListener("click", (e) => {
          e.stopPropagation();
          progress.coins.hard = true;
          saveProgress();
          refreshModeButtons();
          showHint(S.text.coinFoundHard);
          playBeep(1046, 0.1); setTimeout(() => playBeep(1568, 0.15), 110);
        });
        h.textContent = head.replace("🎯", "");
        h.prepend(coin);
      }
      t.textContent = text.replace(/\{(\w+)\}/g, (m, k) => nums[k]);
      row.append(h, t);
      box.appendChild(row);
    }
  };
  addSection(S.text.infoTitle, S.text.infoList);
  // reached the cave in any mode (checkpoint 2 or more), or beaten a mode? → explain the spider too
  const cp = progress.cp || {};
  const reachedCave = Math.max(cp.easy || 0, cp.normal || 0, cp.hard || 0) >= 2 || progress.easy || progress.normal || progress.hard;
  if (reachedCave) addSection(S.text.infoCaveTitle, S.text.infoCaveList);
}

// Lock Normal until Easy is beaten, and Hard until Normal is beaten
function refreshModeButtons() {
  buildInfo();                     // the Info box changes once you've reached the basement
  const open = modesOpen();
  for (const [m, id, locked] of [["easy", "btnEasy", ""], ["normal", "btnNormal", "lockedNormal"], ["hard", "btnHard", "lockedHard"]]) {
    $(id).disabled = !open[m];
    $(id).querySelector("span").textContent = (open[m] ? "" : S.text.lockIcon) + S.text[m + "Button"];
    const beat = m === "normal" ? progress.easy : progress.normal;
    const small = $(id).querySelector("small");
    small.textContent = "";
    if (open[m]) small.textContent = S.text[m + "Info"];
    else {                                                // a checklist of what you still need (done = a glowing ✅)
      for (const [done, label] of [[beat, S.text[locked]], [progress.coins[m], S.text.lockedCoin]]) {
        const mark = document.createElement("span");
        mark.className = done ? "checkDone" : "checkTodo";
        mark.textContent = done ? "✅" : "⬜";
        small.append(mark, " " + label + "\n");
      }
    }
  }
  $("hintNormal").classList.toggle("hidden", !open.normal);                      // the Normal hint only once Normal is unlocked…
  $("hintEasy").classList.toggle("hidden", open.normal);                         // …and then the Easy hint goes away
  if ($("hintText").textContent === S.text.hintEasy && open.normal) $("hintText").classList.add("hidden");
}
// Normal needs: beat Easy + the coin from the Dave Room. Hard needs: beat Normal + the coin hidden in the Info box.
function modesOpen() {
  return { easy: true, normal: progress.easy && progress.coins.normal, hard: progress.normal && progress.coins.hard };
}
// You beat a mode by giving Dr. Voss both legs
function beatMode() {
  progress[mode] = true;
  saveProgress();
  refreshModeButtons();
  const next = { easy: "normal", normal: "hard" }[mode];
  const nextText = !next ? "" : modesOpen()[next] ? " " + S.text[next + "Button"] + S.text.unlocked : S.text.needCoin + S.text[next + "Button"] + "!";
  return "\n" + S.text.beatMode + S.text[mode + "Button"] + "!" + nextText;
}
const ghost = { x: 0, y: 0, orbitDir: 1, dist: 99, hunting: false, rushTimer: 0, rushLeft: 0, stunLeft: 0, stunCooldown: 0 };
let flashPower = 0;    // 0 = off, 1 = full (drops while flickering)
let flickerLeft = 0;
let lightBlocked = false;   // pointing the light at her when the stun can't work
let bobPhase = 0, bob = 0;
let hospital = null;     // the old hospital (null = not here yet)
const held = { fwd: false, back: false, left: false, right: false, sprint: false };

function resetGame() {
  battery = S.battery.start;
  danger = 0;
  signal = S.signal.maxBars;
  subscribers = 0;
  phoneUp = false;
  flashlightOn = false;
  recordingOn = false;
  recordSeconds = 0;
  clipTimer = 0;
  clipsFilmed = 0;
  pendingClips = 0;
  uploadTimer = 0;
  scare = null;
  captionText = "";
  ghost.hunting = false;
  ghost.rushTimer = 0;
  ghost.rushLeft = 0;
  ghost.stunLeft = 0;
  ghost.stunCooldown = 0;
  flashPower = 0;
  flickerLeft = 0;
  bobPhase = 0;
  bob = 0;
  hospital = null;
  chunks.clear();        // bring back trees the hospital cleared
  player.x = S.player.startX;
  player.y = S.player.startY;
  player.angle = S.player.startAngle;
  player.floorZ = 0;
  player.level = 1;
  stamina = 100;
  tired = false;

  placeGhostAway();

  jumpZ = 0;
  jumpV = 0;
  armsFound = 0;
  finale = null;
  commentTimer = 0;
  $("comments").innerHTML = "";
  atHatch = false;
  atCar = true;            // you start next to the car (walk away first)
}

// Hide the legs at random spots around the hospital
function placeLegs(cx, cy) {
  legs = [];
  legsFound = 0;
  for (let i = 0; i < S.legs.count; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = lerp(S.legs.minDistance, S.legs.maxDistance, Math.random());
    legs.push({
      kind: "leg",
      x: cx + Math.cos(a) * dist,
      y: cy + Math.sin(a) * dist,
      dir: Math.random() < 0.5 ? -1 : 1,
      got: false
    });
  }
}

// An arrow (↑ ↗ → …) pointing from you to a spot
function arrowTo(x, y) {
  const rel = angleDiff(Math.atan2(y - player.y, x - player.x) / DEG, player.angle);
  return ["↑", "↗", "→", "↘", "↓", "↙", "←", "↖"][Math.round(((rel + 360) % 360) / 45) % 8];
}

// Put the ghost far away, somewhere in front of you
function placeGhostAway() {
  const a = (player.angle + (Math.random() - 0.5) * 140) * DEG;
  ghost.x = player.x + Math.cos(a) * S.ghost.farDistance;
  ghost.y = player.y + Math.sin(a) * S.ghost.farDistance;
}

// ==========================================================
//  THE OLD HOSPITAL (appears at 1,000 subscribers)
// ==========================================================
function inHospitalNow() {
  return hospital !== null && (player.level === 0 || player.level === 3 || insideHospital(player.x, player.y, 0));
}

function insideHospital(x, y, margin) {
  return hospital !== null && x > hospital.x0 - margin && x < hospital.x1 + margin && y > hospital.y0 - margin && y < hospital.y1 + margin;
}

function spawnHospital() {
  const a = player.angle * DEG, d = S.hospital.spawnDistance;
  const cx = player.x + Math.cos(a) * d, cy = player.y + Math.sin(a) * d;
  const W = S.hospital.width, D = S.hospital.depth;
  const x0 = cx - W / 2, x1 = cx + W / 2, y0 = cy - D / 2, y1 = cy + D / 2;

  // The front (with the door) faces you
  const toX = player.x - cx, toY = player.y - cy;
  let front;
  if (Math.abs(toX) / W > Math.abs(toY) / D) front = toX > 0 ? "east" : "west";
  else front = toY > 0 ? "south" : "north";

  // The 4 walls. n = which way the wall faces (outwards).
  const faces = [
    { name: "north", ax: x1, ay: y0, bx: x0, by: y0, nx: 0, ny: -1, shade: 0.8 },
    { name: "west",  ax: x0, ay: y0, bx: x0, by: y1, nx: -1, ny: 0, shade: 0.9 },
    { name: "south", ax: x0, ay: y1, bx: x1, by: y1, nx: 0, ny: 1, shade: 0.7 },
    { name: "east",  ax: x1, ay: y1, bx: x1, by: y0, nx: 1, ny: 0, shade: 1.0 }
  ];
  // Cut each wall into pieces so trees in front/behind draw in the right order
  const segments = [];
  let doorX = cx, doorY = cy;
  for (const f of faces) {
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay);
    let n = Math.ceil(len / S.hospital.segmentLength);
    if (f.name === front && n % 2 === 0) n++;   // so the door is in the middle piece
    for (let i = 0; i < n; i++) {
      const seg = {
        kind: "wall",
        ax: lerp(f.ax, f.bx, i / n), ay: lerp(f.ay, f.by, i / n),
        bx: lerp(f.ax, f.bx, (i + 1) / n), by: lerp(f.ay, f.by, (i + 1) / n),
        nx: f.nx, ny: f.ny, shade: f.shade, len: len / n,
        hasDoor: f.name === front && i === (n - 1) / 2,
        glow: (i * 7 + f.name.length) % 5 === 0
      };
      seg.mx = (seg.ax + seg.bx) / 2;
      seg.my = (seg.ay + seg.by) / 2;
      if (seg.hasDoor) { doorX = seg.mx + seg.nx; doorY = seg.my + seg.ny; }
      segments.push(seg);
    }
  }
  // Smokestack in a back corner
  const sx = front === "east" ? x0 + 2.5 : x1 - 2.5;
  const sy = front === "south" ? y0 + 2.5 : y1 - 2.5;
  // Lines you bump into, with a gap for the door
  const wallLines = [];
  let doorLine = null;
  for (const f of faces) {
    if (f.name !== front) { wallLines.push([f.ax, f.ay, f.bx, f.by]); continue; }
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay), ux = (f.bx - f.ax) / len, uy = (f.by - f.ay) / len;
    const mx = (f.ax + f.bx) / 2, my = (f.ay + f.by) / 2, half = S.hospital.doorWidth / 2;
    wallLines.push([f.ax, f.ay, mx - ux * half, my - uy * half]);
    wallLines.push([mx + ux * half, my + uy * half, f.bx, f.by]);
    doorLine = [mx - ux * half, my - uy * half, mx + ux * half, my + uy * half];
  }
  // Stairs along the back wall (the wall opposite the door)
  const backName = { north: "south", south: "north", east: "west", west: "east" }[front];
  const bf = faces.find((f) => f.name === backName);
  const blen = Math.hypot(bf.bx - bf.ax, bf.by - bf.ay);
  const ux = (bf.bx - bf.ax) / blen, uy = (bf.by - bf.ay) / blen;
  const stairs = {
    x0: bf.ax + ux * 1.5, y0: bf.ay + uy * 1.5,   // bottom step, by the wall
    ux, uy, ix: -bf.nx, iy: -bf.ny,               // up the stairs / away from the wall
    len: S.hospital.stairLength, wid: S.hospital.stairWidth
  };
  const sx0 = stairs.x0 + stairs.ix * stairs.wid, sy0 = stairs.y0 + stairs.iy * stairs.wid;
  stairs.railLine = [sx0, sy0, sx0 + ux * stairs.len, sy0 + uy * stairs.len];   // railing side
  stairs.bottomLine = [stairs.x0, stairs.y0, sx0, sy0];
  stairs.topLine = [stairs.x0 + ux * stairs.len, stairs.y0 + uy * stairs.len, sx0 + ux * stairs.len, sy0 + uy * stairs.len];

  // A dead patient for a bed (each one looks a little different)
  const makePatient = () => ({ hair: ["#2a1d14", "#6a6a66", "#8a5a2a", "#151515"][Math.floor(Math.random() * 4)],
                               armOut: Math.random() < 0.6, mouth: Math.random() < 0.5, blood: 0.4 + Math.random() * 0.6 });
  // Beds along the long walls (not by the door or stairs), lights down the middle
  const beds = [], lights = [];
  const nb = Math.max(2, Math.ceil(S.hospital.bedCount / 2));
  for (let i = 0; i < nb; i++) {
    const bx = lerp(x0 + 3, x1 - 3, i / (nb - 1));
    for (const by of [y0 + 1.6, y1 - 1.6]) {
      const nearStairs = stairAt(stairs, bx, by, 1.5) !== null;
      if (!nearStairs)
        beds.push({ kind: "bed", x: bx, y: by, fz: S.hospital.ceilingHeight,
                    patient: S.hospital.deadPatients && Math.random() < S.hospital.upstairsPatientChance ? makePatient() : null });   // 2nd floor: some beds
    }
  }
  // Ground floor: LOTS of beds (each with a dead patient): along both long walls, and a row down the middle.
  // Gaps are left for the front door, the stairs, and the path from the door into the ward.
  const gap = S.hospital.groundBedSpacing;
  for (let bx = x0 + 2; bx <= x1 - 2 + 0.01; bx += gap) {
    for (const by of [y0 + 1.6, cy, y1 - 1.6]) {
      if (stairAt(stairs, bx, by, 1.5) !== null) continue;                 // not on the stairs
      if (Math.hypot(bx - doorX, by - doorY) < 4) continue;               // not in front of the door
      if (by === cy && Math.abs(bx - doorX) < 3) continue;                // keep the middle path clear
      beds.push({ kind: "bed", x: bx, y: by, fz: 0, patient: S.hospital.deadPatients ? makePatient() : null });
    }
  }
  for (let i = 0; i < S.hospital.ceilingLights; i++) {
    lights.push({ x: lerp(x0 + 3, x1 - 3, i / Math.max(1, S.hospital.ceilingLights - 1)), y: cy, working: i === Math.floor(S.hospital.ceilingLights / 2) });
  }
  // The big tube and the scientist, in the middle of the 2nd floor
  const H2 = S.hospital.ceilingHeight;
  const props = [
    { kind: "tube", x: cx, y: cy, fz: H2, r: S.hospital.tubeRadius },
    { kind: "scientist", x: cx + (W > D ? 1.8 : 0), y: cy + (W > D ? 0 : 1.8), fz: H2, r: 0.35 }
  ];
  // The locked hatch down to the basement (ground floor, near a front corner)
  const ff = faces.find((f) => f.name === front);
  const hatch = { x: lerp(ff.ax, ff.bx, 0.82) - ff.nx * 2.2, y: lerp(ff.ay, ff.by, 0.82) - ff.ny * 2.2 };
  for (let i = beds.length - 1; i >= 0; i--) {
    if (beds[i].fz === 0 && Math.hypot(beds[i].x - hatch.x, beds[i].y - hatch.y) < S.hospital.hatchSize + 2) beds.splice(i, 1);
  }
  // In the basement: the ladder back up, and some crates
  const HB = -S.hospital.ceilingHeight;
  props.push({ kind: "ladder", x: hatch.x, y: hatch.y, fz: HB, r: 0 });
  // The basement is bigger than the hospital (it goes under the forest)
  const E = S.hospital.basementExtra;
  const bb = { x0: x0 - E, x1: x1 + E, y0: y0 - E, y1: y1 + E };
  const basementSegs = [], basementLines = [];
  const bfaces = [
    { ax: bb.x1, ay: bb.y0, bx: bb.x0, by: bb.y0, nx: 0, ny: -1, shade: 0.8 },
    { ax: bb.x0, ay: bb.y0, bx: bb.x0, by: bb.y1, nx: -1, ny: 0, shade: 0.9 },
    { ax: bb.x0, ay: bb.y1, bx: bb.x1, by: bb.y1, nx: 0, ny: 1, shade: 0.7 },
    { ax: bb.x1, ay: bb.y1, bx: bb.x1, by: bb.y0, nx: 1, ny: 0, shade: 1.0 }
  ];
  for (const f of bfaces) {
    basementLines.push([f.ax, f.ay, f.bx, f.by]);
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay), n = Math.ceil(len / S.hospital.segmentLength);
    for (let i = 0; i < n; i++) {
      const seg = { kind: "wall", ax: lerp(f.ax, f.bx, i / n), ay: lerp(f.ay, f.by, i / n),
        bx: lerp(f.ax, f.bx, (i + 1) / n), by: lerp(f.ay, f.by, (i + 1) / n),
        nx: f.nx, ny: f.ny, shade: f.shade, len: len / n, hasDoor: false, glow: false };
      seg.mx = (seg.ax + seg.bx) / 2;
      seg.my = (seg.ay + seg.by) / 2;
      seg.cave = true;                       // rocky cave wall
      seg.tone = 0.75 + Math.random() * 0.5;
      seg.lumps = [];
      for (let k = 0; k < 4; k++) seg.lumps.push({ u: Math.random(), h: Math.random() * 3, r: 0.4 + Math.random() * 0.7, tone: 0.6 + Math.random() * 0.7 });
      seg.jag = [];                          // jagged top edge
      for (let k = 0; k <= 4; k++) seg.jag.push(Math.random() * 0.6);
      basementSegs.push(seg);
    }
  }
  // Flickery lights all over the basement ceiling
  const basementLights = [];
  const sp = S.hospital.basementLightSpacing;
  for (let lx = bb.x0 + sp / 2; lx < bb.x1; lx += sp) {
    for (let ly = bb.y0 + sp / 2; ly < bb.y1; ly += sp) basementLights.push({ x: lx, y: ly, flicker: 0.3 + Math.random() * 0.5 });
  }
  // Cave stuff: stalactites, stalagmites, boulders and cobwebs (not on the ladder)
  const caveSpot = (margin) => {
    for (let tries = 0; tries < 20; tries++) {
      const cx2 = lerp(bb.x0 + margin, bb.x1 - margin, Math.random()), cy2 = lerp(bb.y0 + margin, bb.y1 - margin, Math.random());
      if (Math.hypot(cx2 - hatch.x, cy2 - hatch.y) > 3) return [cx2, cy2];
    }
    return [bb.x0 + margin, bb.y0 + margin];
  };
  for (let i = 0; i < S.hospital.stalactiteCount; i++) {
    const [sx2, sy2] = caveSpot(1);
    props.push({ kind: "stalactite", x: sx2, y: sy2, fz: HB, r: 0, w: 0.15 + Math.random() * 0.25, len: 0.4 + Math.random() * 1.1 });
  }
  for (let i = 0; i < S.hospital.stalagmiteCount; i++) {
    const [sx2, sy2] = caveSpot(1.5);
    const wd = 0.25 + Math.random() * 0.35;
    props.push({ kind: "stalagmite", x: sx2, y: sy2, fz: HB, r: wd, w: wd, len: 0.6 + Math.random() * 1.4 });
  }
  for (let i = 0; i < S.hospital.caveRockCount; i++) {
    const [sx2, sy2] = caveSpot(2);
    const rr = 0.4 + Math.random() * 0.7;
    props.push({ kind: "rock", x: sx2, y: sy2, fz: HB, r: rr, h: 0.3 + Math.random() * 0.5, shade: 0.7 + Math.random() * 0.4 });
  }
  for (let i = 0; i < S.hospital.cobwebCount; i++) {
    // mostly near the walls and corners
    const t2 = Math.random(), side = Math.floor(Math.random() * 4), m = 0.6;
    const wx = side < 2 ? lerp(bb.x0 + 1, bb.x1 - 1, t2) : (side === 2 ? bb.x0 + m : bb.x1 - m);
    const wy = side < 2 ? (side === 0 ? bb.y0 + m : bb.y1 - m) : lerp(bb.y0 + 1, bb.y1 - 1, t2);
    props.push({ kind: "cobweb", x: wx, y: wy, fz: HB, r: 0, size: 0.5 + Math.random() * 0.6, drop: 0.5 + Math.random() * 0.6, spin: Math.random() * 6 });
  }
  // The arms (body pieces) hidden in the cave
  const arms = [];
  for (let i = 0; i < S.arms.count; i++) {
    const [ax2, ay2] = caveSpot(3);
    arms.push({ kind: "arm", x: ax2, y: ay2, fz: HB, dir: Math.random() < 0.5 ? -1 : 1, got: false });
  }
  // Easter egg: a little stuffed alligator toy somewhere in the cave
  if (S.hospital.stuffedGator) {
    const [gx, gy] = caveSpot(3);
    props.push({ kind: "gator", x: gx, y: gy, fz: HB, r: 0, dir: Math.random() < 0.5 ? -1 : 1 });
  }
  if (S.hospital.stuffedElephant) {
    const [ex, ey] = caveSpot(3);
    props.push({ kind: "elephant", x: ex, y: ey, fz: HB, r: 0 });
  }
  if (S.hospital.stuffedBear) {
    const [tx, ty] = caveSpot(3);
    props.push({ kind: "bear", x: tx, y: ty, fz: HB, r: 0 });
  }
  if (S.hospital.stuffedUnicorn) {
    const [ux, uy] = caveSpot(3);
    props.push({ kind: "unicorn", x: ux, y: uy, fz: HB, r: 0 });
  }
  // Blood splats on and around the hatch
  const blood = [];
  for (let i = 0; i < 9; i++) {
    const r = 0.15 + Math.random() * 0.45, a = Math.random() * Math.PI * 2, dd = Math.random() * S.hospital.hatchSize * 1.4;
    const pts = [];
    for (let k = 0; k < 9; k++) pts.push(r * (0.55 + Math.random() * 0.6));
    blood.push({ x: hatch.x + Math.cos(a) * dd, y: hatch.y + Math.sin(a) * dd, pts, dark: Math.random() < 0.5 });
  }
  // 🎮 The Dave Room: a real room far away from everything (you get there by touching the 2nd floor's back wall)
  const DR = S.daveRoom, rx = cx + 3000, ry = cy + 3000;
  const dr = { x0: rx - DR.width / 2, x1: rx + DR.width / 2, y0: ry - DR.depth / 2, y1: ry + DR.depth / 2, segs: [], lines: [] };
  const dfaces = [
    { name: "north", ax: dr.x1, ay: dr.y0, bx: dr.x0, by: dr.y0, nx: 0, ny: -1, shade: 0.85, decor: ["posterGhost", "neon", "posterSpider"] },
    { name: "west",  ax: dr.x0, ay: dr.y0, bx: dr.x0, by: dr.y1, nx: -1, ny: 0, shade: 0.95, decor: [null, "tv", null] },
    { name: "south", ax: dr.x0, ay: dr.y1, bx: dr.x1, by: dr.y1, nx: 0, ny: 1, shade: 0.75, decor: [null, "exit", null] },
    { name: "east",  ax: dr.x1, ay: dr.y1, bx: dr.x1, by: dr.y0, nx: 1, ny: 0, shade: 1.0, decor: [null, null, null] }
  ];
  for (const f of dfaces) {
    dr.lines.push([f.ax, f.ay, f.bx, f.by]);
    const len = Math.hypot(f.bx - f.ax, f.by - f.ay), n = 3;
    for (let i = 0; i < n; i++) {
      const seg = { kind: "wall", dave: true, decor: f.decor[i], ax: lerp(f.ax, f.bx, i / n), ay: lerp(f.ay, f.by, i / n),
        bx: lerp(f.ax, f.bx, (i + 1) / n), by: lerp(f.ay, f.by, (i + 1) / n), nx: f.nx, ny: f.ny, shade: f.shade, len: len / n, hasDoor: false, glow: false };
      seg.mx = (seg.ax + seg.bx) / 2; seg.my = (seg.ay + seg.by) / 2;
      dr.segs.push(seg);
    }
  }
  dr.exit = { x: rx, y: dr.y1 - 0.4 };                         // the glowing door back out (middle of the south wall)
  dr.entry = { x: rx, y: dr.y1 - 1.8, angle: -90 };             // where you appear, facing into the room
  dr.daveProp = { kind: "dave", x: rx + 1.5, y: ry - 1.8, fz: 0, r: 0.4 };
  dr.coin = { kind: "coin", x: rx, y: ry, fz: 0, r: 0 };            // 🪙 floating in the middle of the room
  props.push(dr.coin);
  props.push(dr.daveProp,
             { kind: "poolTable", x: rx - 2.5, y: ry + 0.8, fz: 0, r: 1.3 },
             { kind: "wineFridge", x: dr.x1 - 0.6, y: ry - 2.2, fz: 0, r: 0.5 },
             { kind: "couch", x: dr.x0 + 2.6, y: ry + 0.2, fz: 0, r: 1.1 });
  hospital = { x0, x1, y0, y1, segments, doorX, doorY, wallLines, doorLine, beds, lights, stairs, props, hatch, dave: dr,
          bb, basementSegs, basementLines, basementLights, blood, arms,
          doorOpen: false, legsGiven: false, saidThanks: false,
          stack: { kind: "stack", x: sx, y: sy, r: S.hospital.stackRadius, h: S.hospital.stackHeight } };

  placeLegs(cx, cy);
  resetSpider();
  // Clear the trees where the hospital stands
  for (const ch of chunks.values()) ch.things = ch.things.filter((t) => !insideHospital(t.x, t.y, 2));
  showToast("📍 " + S.hospital.spawnAtSubscribers[mode].toLocaleString() + S.text.hospitalAppeared, 4);
  reachCheckpoint(1);
  playBeep(523, 0.15);
  setTimeout(() => playBeep(392, 0.3), 160);
}

// ==========================================================
//  THE SPIDER (lives in the cave, hunts by sound)
// ==========================================================
const spider = { kind: "spider", x: 0, y: 0, fz: 0, tx: 0, ty: 0, mode: "wander", timer: 0, skitter: 0, moving: false };

function resetSpider() {
  if (!hospital) return;
  const bb = hospital.bb;
  spider.x = lerp(bb.x0 + 4, bb.x1 - 4, 0.8);
  spider.y = lerp(bb.y0 + 4, bb.y1 - 4, 0.8);
  spider.fz = -S.hospital.ceilingHeight;   // it lives on the cave floor
  spider.mode = "wander";
  spider.timer = 0;
  pickSpiderTarget();
}

function pickSpiderTarget() {
  const bb = hospital.bb;
  spider.tx = lerp(bb.x0 + 3, bb.x1 - 3, Math.random());
  spider.ty = lerp(bb.y0 + 3, bb.y1 - 3, Math.random());
}

function moveSpiderToward(tx, ty, speed, dt) {
  const dx = tx - spider.x, dy = ty - spider.y, d = Math.hypot(dx, dy);
  const step = Math.min(d, speed * monsterSpeed * dt);
  if (d > 0.01) { spider.x += (dx / d) * step; spider.y += (dy / d) * step; }
  spider.moving = step > 0.001;
  const bb = hospital.bb;
  spider.x = clamp(spider.x, bb.x0 + 1, bb.x1 - 1);
  spider.y = clamp(spider.y, bb.y0 + 1, bb.y1 - 1);
  return d;
}

// walking = are you walking right now (W/S or ▲▼)?
// Eddy's spider sound: now and then while you move around the cave. Louder when it's close,
// and it comes from the side the spider is on (left or right ear).
let spiderVoiceTimer = 8;
function spiderSounds(dt, walking) {
  if (!S.spider.voice || player.level !== 0 || !walking) return;
  spiderVoiceTimer -= dt;
  if (spiderVoiceTimer > 0) return;
  const [lo, hi] = S.spider.voiceEverySeconds;
  spiderVoiceTimer = lo + Math.random() * (hi - lo);
  const dx = spider.x - player.x, dy = spider.y - player.y, d = Math.hypot(dx, dy);
  const near = 1 - clamp(d / S.spider.voiceHearDistance, 0, 1);
  if (near <= 0) return;
  const a = player.angle * DEG, side = (-dx * Math.sin(a) + dy * Math.cos(a)) / Math.max(d, 0.001);   // -1 left … 1 right
  playVoice("spider", S.spider.voiceVolume * (0.15 + 0.85 * near * near), clamp(side, -1, 1) * 0.8);
}

function updateSpider(dt, walking) {
  if (!hospital) return;
  const SP = S.spider;
  const inCave = player.level === 0;
  spiderSounds(dt, walking);
  if (!inCave) { spider.mode = "wander"; }
  const noisy = inCave && (walking || landedNoise) && !crouching;   // crouching is silent
  const dist = Math.hypot(player.x - spider.x, player.y - spider.y);
  const hard = mode === "hard";
  if (inCave && dist < SP.touchDistance) { startScare("spider"); return; }   // touch it = jump scare (every mode)

  if (spider.mode === "wander") {
    if (moveSpiderToward(spider.tx, spider.ty, SP.wanderSpeed, dt) < 0.5) pickSpiderTarget();
    if (noisy && dist < SP.hearDistance) {
      spider.mode = "charge";
      spider.timer = 0;
      showToast(S.text.spiderHeard, 2);
    }
  } else if (spider.mode === "charge") {
    moveSpiderToward(player.x, player.y, SP.chargeSpeed, dt);
    // its legs skitter as it runs (you can hear it coming)
    spider.skitter -= dt;
    if (spider.skitter <= 0) { spider.skitter = 0.07; playSkitter(); }
    if (hard) {
      if (dist < SP.hardStopDistance) {        // it stops right in front of you… and waits
        spider.mode = "waiting";
        spider.timer = SP.hardWaitSeconds;
      }
    } else {
      if (dist < SP.touchDistance) { startScare("spider"); return; }
      // stop moving (or crouch) and it loses you
      spider.timer = noisy ? 0 : spider.timer + dt;
      if (spider.timer > SP.loseTrackSeconds) { spider.mode = "wander"; pickSpiderTarget(); }
    }
    if (!inCave) { spider.mode = "wander"; pickSpiderTarget(); }
  } else if (spider.mode === "waiting") {
    spider.moving = false;
    spider.timer -= dt;
    if (walking) { startScare("spider"); return; }   // you moved…
    if (spider.timer <= 0) {
      spider.mode = "leaving";
      spider.timer = SP.leaveSeconds;
      const bb = hospital.bb;                         // walk away to the far side
      spider.tx = player.x < (bb.x0 + bb.x1) / 2 ? bb.x1 - 3 : bb.x0 + 3;
      spider.ty = player.y < (bb.y0 + bb.y1) / 2 ? bb.y1 - 3 : bb.y0 + 3;
      showToast(S.text.spiderLeaves, 2);
    }
  } else if (spider.mode === "leaving") {
    moveSpiderToward(spider.tx, spider.ty, SP.wanderSpeed * 1.5, dt);
    spider.timer -= dt;
    if (spider.timer <= 0) { spider.mode = "wander"; pickSpiderTarget(); }
  }
}

// Crouch (C key or 🧎): quieter and slower. Not allowed on Hard.
function toggleCrouch() {
  if (state !== "playing") return;
  if (!S.crouchByMode[mode]) { showToast(S.text.noCrouch, 2); return; }
  crouching = !crouching;
  if (crouching) showToast(S.text.crouchOn, 2);
}
function eyeH() { return (crouching ? S.crouch.eyeHeight : S.player.eyeHeight) + jumpZ; }

// Jump! (landing makes a thud the spider can hear)
function doJump() {
  if (state !== "playing" || jumpZ > 0 || onStairs) return;
  jumpV = S.jump.power;
  jumpZ = 0.001;
}

// ==========================================================
//  HELPERS
// ==========================================================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function lerp(a, b, t) { return a + (b - a) * t; }
// Difference between two angles in degrees (-180 to 180)
function angleDiff(a, b) { return (((a - b) % 360) + 540) % 360 - 180; }
// Random numbers that are the same every time (so the forest doesn't change)
function makeRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

// ==========================================================
//  THE FOREST — built in square patches ("chunks") as you walk,
//  so it never ends and never repeats. Each patch gets its own
//  random seed, so the same spot always has the same trees.
// ==========================================================
const chunks = new Map();
const stars = [];
(function makeStars() {
  const rand = makeRandom(S.forest.seed);
  for (let i = 0; i < 160; i++) stars.push({ a: rand() * 360, e: 0.1 + rand() * 0.9, b: 0.2 + rand() * 0.8 });
})();

// Mix a patch's position into one seed number
function chunkSeed(cx, cy) {
  const h = (cx * 73856093) ^ (cy * 19349663) ^ (S.forest.seed * 83492791);
  return (Math.abs(h) % 2147483646) + 1;
}

function getChunk(cx, cy) {
  const key = cx + "," + cy;
  if (chunks.has(key)) return chunks.get(key);
  if (chunks.size > 600) chunks.clear();   // forget far patches (they come back the same)

  const ch = { things: [], groundBits: [] };
  const rand = makeRandom(chunkSeed(cx, cy));
  for (let i = 0; i < 5; i++) rand();      // stir the random numbers
  const size = S.forest.chunkSize, x0 = cx * size, y0 = cy * size;
  const spot = () => [x0 + rand() * size, y0 + rand() * size];
  const nearStart = (x, y) => Math.hypot(x - S.player.startX, y - S.player.startY) < 3 ||
                              Math.hypot(x - S.player.startX - S.car.offsetX, y - S.player.startY - S.car.offsetY) < 3.5;

  for (let i = 0; i < S.forest.treesPerChunk; i++) {
    const [x, y] = spot();
    if (nearStart(x, y)) continue;
    const pine = rand() < S.forest.pineChance;
    const branches = [];
    const count = pine ? 0 : 2 + Math.floor(rand() * 4);
    for (let j = 0; j < count; j++) {
      branches.push({
        h: 0.35 + rand() * 0.5,
        side: rand() < 0.5 ? -1 : 1,
        len: 0.8 + rand() * 2.2,
        rise: 0.5 + rand() * 1.5,
        fork: rand() < 0.5
      });
    }
    const barkLines = [];
    for (let j = 0; j < 5; j++) barkLines.push({ off: rand() * 1.6 - 0.8, start: rand() * 0.7, len: 0.1 + rand() * 0.3 });
    const posterRoll = rand(), posterType = Math.floor(rand() * S.posters.list.length), posterTilt = rand() * 0.16 - 0.08;
    ch.things.push({
      kind: pine ? "pine" : "tree", x, y,
      poster: !pine && posterRoll < S.posters.chance ? { type: posterType, tilt: posterTilt } : null,
      r: pine ? 0.15 + rand() * 0.2 : 0.18 + rand() * 0.35,
      h: pine ? 9 + rand() * 9 : 10 + rand() * 8,
      shade: 0.75 + rand() * 0.5,
      layers: 6 + Math.floor(rand() * 4),
      spread: 1.4 + rand() * 1.4,
      branches, barkLines
    });
  }
  for (let i = 0; i < S.forest.bushesPerChunk; i++) {
    const [x, y] = spot();
    if (nearStart(x, y)) continue;
    ch.things.push({ kind: "bush", x, y, r: 0.5 + rand() * 0.8, h: 0.5 + rand() * 0.7, shade: 0.7 + rand() * 0.5 });
  }
  for (let i = 0; i < S.forest.rocksPerChunk; i++) {
    const [x, y] = spot();
    if (nearStart(x, y)) continue;
    ch.things.push({ kind: "rock", x, y, r: 0.25 + rand() * 0.6, h: 0.2 + rand() * 0.4, shade: 0.7 + rand() * 0.5 });
  }
  for (let i = 0; i < S.forest.groundBitsPerChunk; i++) {
    const [x, y] = spot();
    ch.groundBits.push({ x, y, kind: rand() < 0.6 ? "grass" : "leaf", tone: 0.6 + rand() * 0.6, tilt: rand() * 2 - 1 });
  }
  if (hospital) ch.things = ch.things.filter((t) => !insideHospital(t.x, t.y, 2));
  chunks.set(key, ch);
  return ch;
}

// Run fn on every patch within "radius" steps of you
function forEachNearbyChunk(radius, fn) {
  const size = S.forest.chunkSize;
  const pcx = Math.floor(player.x / size), pcy = Math.floor(player.y / size);
  const n = Math.ceil(radius / size);
  for (let dx = -n; dx <= n; dx++) {
    for (let dy = -n; dy <= n; dy++) fn(getChunk(pcx + dx, pcy + dy));
  }
}

let audio = null;

function startAudio() {
  if (audio) { audio.ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac = new AC();
  const master = ac.createGain();
  master.gain.value = S.sound.masterVolume;
  master.connect(ac.destination);
  const noiseBuffer = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  audio = { ac, master, noiseBuffer, voices: {} };
  loadVoices();

  // Soft wind that rises and falls
  const wind = ac.createBufferSource();
  wind.buffer = noiseBuffer;
  wind.loop = true;
  const windFilter = ac.createBiquadFilter();
  windFilter.type = "lowpass";
  windFilter.frequency.value = 450;
  const windGain = ac.createGain();
  windGain.gain.value = S.sound.windVolume;
  const lfo = ac.createOscillator();
  lfo.frequency.value = 0.08;
  const lfoGain = ac.createGain();
  lfoGain.gain.value = S.sound.windVolume * 0.6;
  lfo.connect(lfoGain);
  lfoGain.connect(windGain.gain);
  wind.connect(windFilter);
  windFilter.connect(windGain);
  windGain.connect(master);
  wind.start();
  lfo.start();
}

// A locked door rattling: the chain and padlock clank
function playRattle() {
  if (!audio) return;
  const ac = audio.ac, start = ac.currentTime;
  for (let i = 0; i < 16; i++) {
    const t = start + i * 0.085 + Math.random() * 0.03;
    // metal clink
    const src = ac.createBufferSource();
    src.buffer = audio.noiseBuffer;
    const bp = ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 2500 + Math.random() * 2500;
    bp.Q.value = 8;
    const g = ac.createGain();
    g.gain.setValueAtTime(S.cutscene.rattleVolume, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    src.connect(bp); bp.connect(g); g.connect(audio.master);
    src.start(t, Math.random() * 1.5);
    src.stop(t + 0.07);
    // wooden door thump
    const o = ac.createOscillator();
    o.frequency.setValueAtTime(110 + Math.random() * 30, t);
    const og = ac.createGain();
    og.gain.setValueAtTime(S.cutscene.rattleVolume * 0.6, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(og); og.connect(audio.master);
    o.start(t);
    o.stop(t + 0.09);
  }
}

// Rain: turn it on or off (it fades)
function setRain(on) {
  if (!audio) return;
  const ac = audio.ac, now = ac.currentTime;
  if (on && !audio.rain) {
    const src = ac.createBufferSource();
    src.buffer = audio.noiseBuffer;
    src.loop = true;
    const hp = ac.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 900;
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 7000;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(S.cutscene.rainVolume, now + 0.6);
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(audio.master);
    src.start();
    audio.rain = { src, g };
  } else if (!on && audio.rain) {
    const r = audio.rain;
    r.g.gain.setValueAtTime(r.g.gain.value, now);
    r.g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
    r.src.stop(now + 0.55);
    audio.rain = null;
  }
}

      c.beginPath(); c.moveTo(x - 0.35 * sc, topY); c.lineTo(x + 0.35 * sc, topY); c.lineTo(x + 0.8 * sc, groundY); c.lineTo(x - 0.8 * sc, groundY); c.fill();
      c.strokeStyle = `rgba(255,230,90,${0.45 + 0.4 * pulse})`; c.lineWidth = Math.max(1.5, 0.04 * sc);
      c.shadowColor = "rgba(255,220,80,0.9)"; c.shadowBlur = 14;
      c.beginPath(); c.ellipse(x, groundY, 0.6 * sc, 0.15 * sc, 0, 0, Math.PI * 2); c.stroke();
      c.shadowBlur = 10 + pulse * 8;
    }
    c.fillStyle = glow ? `rgb(${210 + 30 * pulse},${190 + 25 * pulse},120)` : shade([80, 84, 88], light, fa, fog);
    c.fillRect(x - 0.27 * sc, topY, 0.05 * sc, groundY - topY);
    c.fillRect(x + 0.22 * sc, topY, 0.05 * sc, groundY - topY);
    for (let k = 0.3; k < S.hospital.ceilingHeight; k += 0.35) {
      c.fillRect(x - 0.25 * sc, groundY - k * sc, 0.5 * sc, Math.max(1, 0.04 * sc));
    }
    c.restore();
  }

  // Your car (park it, and drive away at the end!)
  function drawCar(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, L = 4 * sc;
    const body = shade([88, 26, 28], light + 0.05, fa, fog);
    c.fillStyle = body;
    c.beginPath();                                   // cabin
    c.moveTo(x - L * 0.3, groundY - 0.95 * sc);
    c.lineTo(x - L * 0.17, groundY - 1.45 * sc);
    c.lineTo(x + L * 0.14, groundY - 1.45 * sc);
    c.lineTo(x + L * 0.3, groundY - 0.95 * sc);
    c.fill();
    c.fillRect(x - L / 2, groundY - 0.98 * sc, L, 0.62 * sc);   // body
    c.fillStyle = shade([20, 28, 40], light, fa, fog);          // windows
    c.beginPath();
    c.moveTo(x - L * 0.26, groundY - 1.0 * sc);
    c.lineTo(x - L * 0.155, groundY - 1.38 * sc);
    c.lineTo(x - L * 0.01, groundY - 1.38 * sc);
    c.lineTo(x - L * 0.01, groundY - 1.0 * sc);
    c.moveTo(x + L * 0.02, groundY - 1.0 * sc);
    c.lineTo(x + L * 0.02, groundY - 1.38 * sc);
    c.lineTo(x + L * 0.13, groundY - 1.38 * sc);
    c.lineTo(x + L * 0.26, groundY - 1.0 * sc);
    c.fill();
    for (const k of [-0.3, 0.3]) {                              // wheels
      c.fillStyle = "#0a0a0a";
      c.beginPath();
      c.arc(x + k * L, groundY - 0.32 * sc, 0.32 * sc, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = shade([90, 90, 95], light, fa, fog);
      c.beginPath();
      c.arc(x + k * L, groundY - 0.32 * sc, 0.12 * sc, 0, Math.PI * 2);
      c.fill();
    }
    c.save();                                                   // headlight and taillight
    c.shadowBlur = 12;
    c.shadowColor = "#ffe9a0";
    c.fillStyle = "#ffe9a0";
    c.fillRect(x + L / 2 - 0.12 * sc, groundY - 0.85 * sc, 0.12 * sc, 0.12 * sc);
    c.shadowColor = "#ff2020";
    c.fillStyle = "#c01818";
    c.fillRect(x - L / 2, groundY - 0.85 * sc, 0.1 * sc, 0.14 * sc);
    c.restore();
  }

  // An old hospital bed
  function drawBed(it, groundY, light, fa) {
    const sc = it.sc, x = it.sx, len = 1.9 * sc;
    c.fillStyle = shade([90, 95, 100], light, fa, fog);
    for (const k of [-0.46, 0.46]) c.fillRect(x + k * len - 0.02 * sc, groundY - 0.5 * sc, 0.04 * sc, 0.5 * sc);
    c.fillRect(x - len * 0.5 - 0.03 * sc, groundY - 1.05 * sc, 0.05 * sc, 1.05 * sc);   // headboard post
    c.fillRect(x - len * 0.5 - 0.03 * sc, groundY - 1.05 * sc, 0.3 * sc, 0.05 * sc);
    c.fillStyle = shade([172, 168, 156], light, fa, fog);                               // mattress
    c.fillRect(x - len / 2, groundY - 0.72 * sc, len, 0.2 * sc);
    c.fillStyle = shade([146, 142, 130], light, fa, fog);                               // sheet hanging off
    c.beginPath();
    c.moveTo(x - len * 0.2, groundY - 0.52 * sc);
    c.lineTo(x + len * 0.5, groundY - 0.52 * sc);
    c.lineTo(x + len * 0.46, groundY - 0.28 * sc);
    c.quadraticCurveTo(x + len * 0.1, groundY - 0.2 * sc, x - len * 0.25, groundY - 0.34 * sc);
    c.fill();
    c.fillStyle = shade([190, 186, 176], light, fa, fog);                               // pillow
    c.beginPath();
    c.ellipse(x - len * 0.36, groundY - 0.78 * sc, 0.22 * sc, 0.07 * sc, 0, 0, Math.PI * 2);
    c.fill();
    if (it.obj.patient) drawDeadPatient(it.obj.patient, x, groundY, sc, len, light, fa);
  }
  // 💀 A dead patient lying in a bed: under a stained sheet, grey face on the pillow, an arm hanging off
  function drawDeadPatient(pt, x, groundY, sc, len, light, fa) {
    const skin = shade(S.hospital.patientSkin, light, fa, fog), skinDark = shade(S.hospital.patientSkin.map((v) => v * 0.7), light, fa, fog);
    const blood = shade([110, 8, 8], light + 0.15, fa, fog);
    // blood puddle on the floor under the bed
    c.fillStyle = blood;
    c.beginPath(); c.ellipse(x + len * 0.05, groundY - 0.01 * sc, len * 0.22 * pt.blood, 0.05 * sc * pt.blood, 0, 0, Math.PI * 2); c.fill();
    // the arm hanging down off the side of the bed, dripping
    if (pt.armOut) {
      c.strokeStyle = skinDark; c.lineCap = "round"; c.lineWidth = Math.max(1, 0.07 * sc);
      c.beginPath(); c.moveTo(x - len * 0.12, groundY - 0.74 * sc); c.quadraticCurveTo(x - len * 0.1, groundY - 0.5 * sc, x - len * 0.13, groundY - 0.3 * sc); c.stroke();
      c.fillStyle = skinDark;                                                    // limp hand
      c.beginPath(); c.ellipse(x - len * 0.13, groundY - 0.27 * sc, 0.045 * sc, 0.06 * sc, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = blood; c.lineWidth = Math.max(1, 0.015 * sc);
      c.beginPath(); c.moveTo(x - len * 0.13, groundY - 0.22 * sc); c.lineTo(x - len * 0.13, groundY - 0.22 * sc + 0.12 * sc * ((o.time * 0.7) % 1)); c.stroke();
    }
    // the body under the sheet: a long lump with feet sticking up at the end
    const sheet = shade([196, 192, 182], light, fa, fog);
    c.fillStyle = sheet;
    c.beginPath();
    c.moveTo(x - len * 0.28, groundY - 0.72 * sc);
    c.quadraticCurveTo(x - len * 0.15, groundY - 0.98 * sc, x + len * 0.05, groundY - 0.9 * sc);   // chest
    c.quadraticCurveTo(x + len * 0.25, groundY - 0.84 * sc, x + len * 0.36, groundY - 0.88 * sc);  // legs
    c.quadraticCurveTo(x + len * 0.42, groundY - 1.0 * sc, x + len * 0.47, groundY - 0.86 * sc);   // feet poking up
    c.lineTo(x + len * 0.48, groundY - 0.72 * sc);
    c.closePath(); c.fill();
    c.fillStyle = blood;                                                         // dark blood soaking through the sheet
    c.globalAlpha = 0.85;
    c.beginPath(); c.ellipse(x - len * 0.05, groundY - 0.86 * sc, len * 0.09 * pt.blood, 0.05 * sc, 0.2, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(x + len * 0.15, groundY - 0.8 * sc, len * 0.05 * pt.blood, 0.035 * sc, -0.3, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
    // the head on the pillow: grey skin, sunken closed eyes
    const hx = x - len * 0.36, hy = groundY - 0.86 * sc, r = 0.12 * sc;
    c.fillStyle = pt.hair;
    c.beginPath(); c.ellipse(hx - r * 0.3, hy - r * 0.1, r * 1.05, r * 0.95, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = skin;
    c.beginPath(); c.ellipse(hx + r * 0.1, hy, r * 0.85, r * 0.95, 0, 0, Math.PI * 2); c.fill();
    if (r > 3) {
      c.fillStyle = "rgba(40,30,50,0.55)";                                       // dark sunken eyes
      for (const k of [-1, 1]) { c.beginPath(); c.ellipse(hx + r * 0.25, hy + k * r * 0.32, r * 0.16, r * 0.12, 0, 0, Math.PI * 2); c.fill(); }
      c.strokeStyle = "rgba(20,10,10,0.8)"; c.lineWidth = Math.max(1, r * 0.06);  // closed eyelids
      for (const k of [-1, 1]) { c.beginPath(); c.moveTo(hx + r * 0.18, hy + k * r * 0.32 - r * 0.1); c.lineTo(hx + r * 0.32, hy + k * r * 0.32 + r * 0.08); c.stroke(); }
      if (pt.mouth) { c.fillStyle = "#1a0a0a"; c.beginPath(); c.ellipse(hx + r * 0.7, hy, r * 0.1, r * 0.18, 0, 0, Math.PI * 2); c.fill(); }   // mouth hanging open
    }
  }
  function drawStack(it, groundY, light, fa) {
    const st = it.obj, sc = it.sc, x = it.sx, half = st.r * sc;
    const topY = horizon - (st.h - eyeH()) * sc;
    const g = c.createLinearGradient(x - half, 0, x + half, 0);
    g.addColorStop(0, shade(S.hospital.wallColor, light * 0.35, fa, fog));
    g.addColorStop(0.4, shade(S.hospital.wallColor, light, fa, fog));
    g.addColorStop(1, shade(S.hospital.wallColor, light * 0.3, fa, fog));
    c.fillStyle = g;
    c.fillRect(x - half, topY, half * 2, groundY - topY);
    c.fillStyle = shade([30, 30, 30], light, fa, fog);
    for (let k = 3; k < st.h; k += 3) {
      const y = horizon - (k - eyeH()) * sc;
      c.fillRect(x - half, y, half * 2, Math.max(1, 0.2 * sc));
    }
    if (Math.sin(o.time * 2.5) > 0.3) {
      c.save();
      c.shadowColor = "#ff0000";
      c.shadowBlur = 10;
      c.fillStyle = "#ff3020";
      c.beginPath();
      c.arc(x, topY, Math.max(1.5, 0.25 * sc), 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
  }


  // Get the trees and grass from the patches around you
  const nearThings = [], nearBits = [];
  forEachNearbyChunk(o.fogDist, (ch) => nearThings.push(...ch.things));
  forEachNearbyChunk(12, (ch) => nearBits.push(...ch.groundBits));

  // Grass and leaves on the ground (only close up)
  for (const gb of nearBits) {
    if (inside || insideHospital(gb.x, gb.y, 0)) continue;   // no grass on the hospital floor
    const dx = gb.x - player.x, dy = gb.y - player.y;
    const z = dx * fx + dy * fy;
    if (z < 0.4 || z > 12) continue;
    const sx = w / 2 + ((-dx * fy + dy * fx) / z) * focal;
    if (sx < -20 || sx > w + 20) continue;
    const sc = focal / z, gy = horizon + eyeH() * sc;
    const light = lightAt(sx, z) * gb.tone, fa = fogAt(z);
    if (gb.kind === "grass") {
      c.strokeStyle = shade([46, 58, 36], light, fa, fog);
      c.lineWidth = Math.max(1, 0.015 * sc);
      c.beginPath();
      for (let k = -1; k <= 1; k++) {
        c.moveTo(sx + k * 0.03 * sc, gy);
        c.lineTo(sx + (k * 0.07 + gb.tilt * 0.04) * sc, gy - (0.14 + 0.05 * Math.abs(k - gb.tilt)) * sc);
      }
      c.stroke();
    } else {
      c.fillStyle = shade([70, 48, 30], light, fa, fog);
      c.beginPath();
      c.ellipse(sx, gy, 0.07 * sc, 0.022 * sc, gb.tilt * 0.4, 0, Math.PI * 2);
      c.fill();
    }
  }

  // The Dave Room: a big round rug and purple neon strip lights
  if (daveRoom) {
    const R = hospital.dave, rcx = (R.x0 + R.x1) / 2, rcy = (R.y0 + R.y1) / 2, pts = [], pts2 = [];
    for (let k = 0; k < 24; k++) { const a = (k / 24) * Math.PI * 2; pts.push(toCam(rcx + Math.cos(a) * 4, rcy + Math.sin(a) * 3, base + 0.01)); pts2.push(toCam(rcx + Math.cos(a) * 3.4, rcy + Math.sin(a) * 2.5, base + 0.02)); }
    quad(pts, shade([110, 40, 80], 1, 0, fog)); quad(pts2, shade([90, 30, 66], 1, 0, fog));
    const ch = base + S.hospital.ceilingHeight - 0.02;
    c.save(); c.shadowColor = "#c070ff"; c.shadowBlur = 18;
    for (const lx of [-3, 3]) quad([toCam(rcx + lx - 0.15, R.y0 + 1, ch), toCam(rcx + lx + 0.15, R.y0 + 1, ch), toCam(rcx + lx + 0.15, R.y1 - 1, ch), toCam(rcx + lx - 0.15, R.y1 - 1, ch)], "#d8a8ff");
    c.restore();
  }
  // Inside: floor tiles and flickering ceiling lights
  if (inside && !daveRoom) {
    const L = S.hospital;
    c.strokeStyle = shade([36, 38, 36], 1, 0, fog);
    c.lineWidth = 1;
    if (!basement) {                                 // tiles (the cave has a dirt floor)
      for (let x = hospital.x0; x <= hospital.x1 + 0.01; x += L.floorTileSize) line3(toCam(x, hospital.y0, base), toCam(x, hospital.y1, base));
      for (let y = hospital.y0; y <= hospital.y1 + 0.01; y += L.floorTileSize) line3(toCam(hospital.x0, y, base), toCam(hospital.x1, y, base));
    }
    const st = hospital.stairs, H = L.ceilingHeight;
    const hole = [stairPt(0, 0, H), stairPt(0, st.wid, H), stairPt(st.len, st.wid, H), stairPt(st.len, 0, H)];
    const hx = hospital.hatch.x, hy = hospital.hatch.y;
    const hs = L.hatchSize;
    const hatchSquare = (hgt) => [toCam(hx - hs, hy - hs, hgt), toCam(hx + hs, hy - hs, hgt), toCam(hx + hs, hy + hs, hgt), toCam(hx - hs, hy + hs, hgt)];
    if (basement) {
      quad(hatchSquare(0), "#0a0b0b");                       // the hatch hole in the ceiling
    } else if (!upstairs) {
      // the basement hatch in the floor
      quad(hatchSquare(0.01), hospital.hatchOpen ? "#030303" : shade([58, 60, 62], 1, 0, fog));
      if (!hospital.hatchOpen) {
        quad([toCam(hx - 0.3, hy - 0.06, 0.02), toCam(hx + 0.3, hy - 0.06, 0.02), toCam(hx + 0.3, hy + 0.06, 0.02), toCam(hx - 0.3, hy + 0.06, 0.02)], "#1a1a1a");
        for (const k of [-0.6, 0.6]) quad([toCam(hx - hs, hy + k * hs - 0.03, 0.02), toCam(hx + hs, hy + k * hs - 0.03, 0.02), toCam(hx + hs, hy + k * hs + 0.03, 0.02), toCam(hx - hs, hy + k * hs + 0.03, 0.02)], "#2c2e30");
      }
      // blood splats
      for (const b of hospital.blood) {
        const pts = b.pts.map((r, k) => {
          const a = (k / b.pts.length) * Math.PI * 2;
          return toCam(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r, 0.03);
        });
        quad(pts, b.dark ? "#3a0505" : "#5c0909");
      }
    }
    if (basement) {
      // (no stairs down here)
    } else if (upstairs) {
      // A hole in the floor with the stairs going down
      if (quad(hole, "#050606")) {
        c.save();
        c.clip();              // only draw the stairs inside the hole
        drawStairs(false);
        c.restore();
      }
    } else {
      quad(hole, "#070808");   // the stairwell in the ceiling
    }
    const ch = base + L.ceilingHeight - 0.02;
    for (const lt of (basement ? hospital.basementLights : hospital.lights)) {
      const on = basement ? false : lt.working;                 // the cave is pitch black; one light works on each floor
      if (on && !basement) {                                    // a pool of light on the floor under it
        const fl = toCam(lt.x, lt.y, base);
        if (fl.z > 0.3) {
          const fx2 = w / 2 + (fl.s / fl.z) * focal, fy2 = horizon + ((eye - fl.h) * focal) / fl.z, rr = (4 * focal) / fl.z;
          const pool = c.createRadialGradient(fx2, fy2, 1, fx2, fy2, rr);
          pool.addColorStop(0, "rgba(220,240,225,0.22)"); pool.addColorStop(1, "rgba(220,240,225,0)");
          c.fillStyle = pool;
          c.fillRect(fx2 - rr, fy2 - rr * 0.5, rr * 2, rr);
        }
      }
      c.save();
      if (basement) {
        // an old bulb dangling on a wire in the cave
        const top = toCam(lt.x, lt.y, ch), bulb = toCam(lt.x, lt.y, ch - 0.7);
        if (bulb.z > 0.3 && top.z > 0.3) {
          c.strokeStyle = "#111";
          c.lineWidth = 1;
          line3(top, bulb);
          const bx2 = w / 2 + (bulb.s / bulb.z) * focal, by2 = horizon + ((eye - bulb.h) * focal) / bulb.z;
          const br = Math.max(2, (0.09 * focal) / bulb.z);
          if (on) {
            const glow = c.createRadialGradient(bx2, by2, 0, bx2, by2, br * 10);
            glow.addColorStop(0, "rgba(255,200,120,0.35)");
            glow.addColorStop(1, "rgba(255,200,120,0)");
            c.fillStyle = glow;
            c.fillRect(bx2 - br * 10, by2 - br * 10, br * 20, br * 20);
          }
          c.fillStyle = on ? "#ffe2a0" : "#3a332a";
          c.beginPath();
          c.arc(bx2, by2, br, 0, Math.PI * 2);
          c.fill();
        }
      } else {
        if (on) { c.shadowColor = "#cfeedd"; c.shadowBlur = 20; }
        quad([toCam(lt.x - 0.8, lt.y - 0.25, ch), toCam(lt.x + 0.8, lt.y - 0.25, ch),
              toCam(lt.x + 0.8, lt.y + 0.25, ch), toCam(lt.x - 0.8, lt.y + 0.25, ch)], on ? "#cfe8d8" : "#2a2d2b");
      }
      c.restore();
    }
  }

  // Work out where every tree, bush, rock (and maybe the ghost) is on screen
  const list = [];
  function place(obj) {
    const dx = obj.x - player.x, dy = obj.y - player.y;
    const z = dx * fx + dy * fy;              // how far in front
    if (z < 0.3 || z > o.fogDist) return;
    const side = -dx * fy + dy * fx;          // how far to the side
    const sx = w / 2 + (side / z) * focal;
    const sc = focal / z;                     // pixels per step at that distance
    const reach = obj.kind === "pine" ? obj.spread + 0.5 : obj.kind === "spider" ? 7 : obj.kind === "grinner" ? 2 : 4;
    if (sx + reach * sc < 0 || sx - reach * sc > w) return;
    list.push({ obj, z, sx, sc });
  }
  if (!inside) for (const t of nearThings) place(t);   // inside, the walls hide the forest
  if (!inside) for (const leg of legs) if (!leg.got) place(leg);
  if (o.showGhost && finale !== "chase" && !(inside && player.level === 0)) place(ghost);   // (no ghost in the final chase or the basement)
  if (hospital) {
    for (const seg of (daveRoom ? hospital.dave.segs : basement ? hospital.basementSegs : hospital.segments)) {
      // only the side of the wall facing you (outside or inside)
      const facing = (player.x - seg.mx) * seg.nx + (player.y - seg.my) * seg.ny;
      if (inside ? facing >= 0 : facing <= 0) continue;
      const z = (seg.mx - player.x) * fx + (seg.my - player.y) * fy;
      if (z < -seg.len || z > o.fogDist + 10) continue;
      list.push({ obj: seg, z: Math.max(z, 0.3), sx: w / 2, sc: 0 });
    }
    if (S.hospital.stackHeight > 0 && !inside) place(hospital.stack);
    if (inside) for (const bed of hospital.beds) if (bed.fz === base) place(bed);
    if (inside) for (const pr of hospital.props) if (pr.fz === base) place(pr);
    if (finale === "chase") {                        // the final chase: the monster, spikes, flying chairs, and your phone
      place(grinner);
      for (const sp of chaseSpikes) place(sp);
      for (const ch of chaseChairs) { place(ch); if (!ch.landed) place({ kind: "chairMark", x: ch.tx, y: ch.ty, fz: 0 }); }
      if (chasePhone && !inside) place(chasePhone);
    }
    if (basement && hospital.lostKey) place(hospital.lostKey);
    if (basement) {
      place(spider);
      for (const a of hospital.arms) if (!a.got) place(a);
    }
    if (inside && !basement && !daveRoom) {
      const st = hospital.stairs, mid = stairPt(st.len / 2, st.wid / 2, 0);
      if (!upstairs) {
        list.push({ obj: { kind: "stairs" }, z: Math.max(0.3, mid.z), sx: w / 2, sc: 0 });
      } else {
        // railings around the hole: the open side and the bottom end
        for (const r of [{ a0: 0, c0: st.wid, a1: st.len, c1: st.wid }, { a0: 0, c0: 0, a1: 0, c1: st.wid }]) {
          const m = stairPt((r.a0 + r.a1) / 2, (r.c0 + r.c1) / 2, 0);
          list.push({ obj: { kind: "rail", r }, z: Math.max(0.3, m.z), sx: w / 2, sc: 0 });
        }
      }
    }
  }
  list.sort((p, q) => q.z - p.z);            // far things first

  for (const it of list) {
    const groundY = horizon + (eye - ((it.obj.fz || 0) - base)) * it.sc;
    const light = lightAt(it.sx, it.z), fa = fogAt(it.z);
    const kind = it.obj.kind;
    if (it.obj === ghost) {
      let alpha = clamp(1 - it.z / S.ghost.visibleDistance, 0, 1) * (0.7 + Math.random() * 0.3);
      if (finale === "chase") alpha = Math.max(alpha, 0.85);                 // bright in the final chase
      const jitter = ghost.stunLeft > 0 ? (Math.random() - 0.5) * it.sc * 0.2 : 0;
      if (Math.random() > 0.04) drawGhostWoman(c, it.sx + jitter, groundY, S.ghost.height * it.sc * (finale === "chase" ? S.finale.ghostScale : 1), alpha, o.time);
    } else if (kind === "wall") {
      drawWall(it.obj);
    } else if (kind === "stack") {
      drawStack(it, groundY, light, fa);
    } else if (kind === "bed") {
      drawBed(it, groundY, light, fa);
    } else if (kind === "leg") {
      drawLeg(it, groundY, light, fa);
    } else if (kind === "car") {
      drawCar(it, groundY, light, fa);
    } else if (kind === "crate") {
      drawCrate(it, groundY, light, fa);
    } else if (kind === "lostKey") {
      // your key on the cave floor: it glints in the dark (and glows on Easy)
      const glint = 0.5 + 0.5 * Math.sin(o.time * 3);
      if (S.legHintsByMode[mode] === "highlight") {
        c.save(); c.strokeStyle = `rgba(255,230,90,${0.4 + 0.4 * glint})`; c.lineWidth = Math.max(1.5, 0.04 * it.sc);
        c.shadowColor = "rgba(255,220,80,0.9)"; c.shadowBlur = 12;
        c.beginPath(); c.ellipse(it.sx, groundY, 0.45 * it.sc, 0.1 * it.sc, 0, 0, Math.PI * 2); c.stroke(); c.restore();
      }
      c.save(); c.shadowColor = "rgba(255,220,120,0.9)"; c.shadowBlur = 6 + glint * 10;
      finKeyIcon(c, it.sx, groundY - 0.04 * it.sc, 0.3 * it.sc, 0.1);
      c.restore();
    } else if (kind === "grinner") {
      drawGrinnerBody(c, it.sx, groundY, S.finale.grinnerHeight * it.sc, shade([168, 162, 150], Math.max(light, 0.85), fa, fog), o.time, grinner.run);
    } else if (kind === "spider") {
      drawSpider(it, groundY, light, fa);
    } else if (kind === "arm") {
      drawArm(it, groundY, light, fa);
    } else if (kind === "gator") {
      drawGator(it, groundY, light, fa);
    } else if (kind === "dave") {
      drawDaveProp(it, groundY, light, fa);
    } else if (kind === "coin") {
      if (!progress.coins.normal) drawCoin(it, groundY);
    } else if (kind === "poolTable") {
      drawPoolTable(it, groundY, light, fa);
    } else if (kind === "wineFridge") {
      drawWineFridge(it, groundY, light, fa);
    } else if (kind === "couch") {
      drawCouch(it, groundY, light, fa);
    } else if (kind === "spike") {
      drawSpikes(it, groundY, light, fa);
    } else if (kind === "chair") {
      drawChair(it, groundY, light, fa);
    } else if (kind === "chairMark") {
      const pulse = 0.5 + 0.5 * Math.sin(o.time * 12);       // where the chair will land
      c.fillStyle = `rgba(255,40,30,${0.25 + 0.3 * pulse})`;
      c.beginPath(); c.ellipse(it.sx, groundY, 1.1 * it.sc, 0.25 * it.sc, 0, 0, Math.PI * 2); c.fill();
    } else if (kind === "phoneDrop") {
      drawPhoneDrop(it, groundY, light, fa);
    } else if (kind === "elephant") {
      drawElephant(it, groundY, light, fa);
    } else if (kind === "bear") {
      drawBear(it, groundY, light, fa);
    } else if (kind === "unicorn") {
      drawUnicorn(it, groundY, light, fa);
    } else if (kind === "stalactite") {
      drawStalactite(it, groundY, light, fa);
    } else if (kind === "stalagmite") {
      drawStalagmite(it, groundY, light, fa);
    } else if (kind === "cobweb") {
      drawCobweb(it, groundY, light, fa);
    } else if (kind === "ladder") {
      drawLadder(it, groundY, light, fa);
    } else if (kind === "tube") {
      drawTube(it, groundY, light, fa);
    } else if (kind === "scientist") {
      drawScientist(it, groundY, light, fa);
    } else if (kind === "stairs") {
      const st = hospital.stairs;
      const rx = player.x - st.x0, ry = player.y - st.y0;
      drawStairs(rx * st.ix + ry * st.iy > st.wid);   // show the side if you're beside them
    } else if (kind === "rail") {
      drawRail(it.obj.r);
    } else if (kind === "tree") {
      drawTree(c, it, horizon, groundY, light, fa, fog);
      if (it.obj.poster) drawPoster(c, it, groundY, light, fa, fog);
    } else if (kind === "pine") {
      drawPine(c, it, horizon, groundY, light, fa, fog);
    } else if (kind === "bush") {
      const b = it.obj, sc = it.sc;
      for (let k = -1; k <= 1; k++) {
        c.fillStyle = shade([26, 36, 24], light * b.shade * (1 - Math.abs(k) * 0.2), fa, fog);
        c.beginPath();
        c.ellipse(it.sx + k * b.r * 0.55 * sc, groundY - b.h * sc * (0.45 - Math.abs(k) * 0.1),
                  b.r * 0.65 * sc, b.h * sc * 0.55, 0, 0, Math.PI * 2);
        c.fill();
      }
    } else if (kind === "rock") {
      const r = it.obj, sc = it.sc;
      const rg = c.createLinearGradient(0, groundY - r.h * sc, 0, groundY);
      rg.addColorStop(0, shade([78, 80, 84], light * r.shade, fa, fog));
      rg.addColorStop(1, shade([30, 31, 33], light * r.shade, fa, fog));
      c.fillStyle = rg;
      c.beginPath();
      c.ellipse(it.sx, groundY - r.h * sc * 0.35, r.r * sc, r.h * sc * 0.7, 0, Math.PI, 0);
      c.lineTo(it.sx + r.r * sc, groundY);
      c.lineTo(it.sx - r.r * sc, groundY);
      c.fill();
    }
  }

  // Flashlight beam glowing in the mist, with floating dust
  if (flashPower > 0) {
    c.save();
    c.globalAlpha = flashPower;
    c.globalCompositeOperation = "lighter";
    const beam = c.createRadialGradient(w / 2, h * 0.52, 0, w / 2, h * 0.52, w * 0.5);
    beam.addColorStop(0, "rgba(255,230,190,0.10)");
    beam.addColorStop(1, "rgba(255,230,190,0)");
    c.fillStyle = beam;
    c.fillRect(0, 0, w, h);
    for (let i = 0; i < 24; i++) {
      const px = w / 2 + Math.sin(i * 12.9 + o.time * 0.3) * w * 0.3;
      const py = h * 0.52 + Math.cos(i * 7.3 + o.time * 0.2) * h * 0.2;
      c.fillStyle = `rgba(255,240,210,${0.12 + 0.1 * Math.sin(o.time + i)})`;
      c.fillRect(px, py, 1.5, 1.5);
    }
    c.restore();
  }

  // Dark edges
  const vig = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.8)");
  c.fillStyle = vig;
  c.fillRect(0, 0, w, h);
}

// A bare, dead tree with a round trunk and bark
function drawTree(c, it, horizon, groundY, light, fa, fog) {
  const t = it.obj, sc = it.sc, x = it.sx;
  const base = [64, 60, 58], L = light * t.shade;
  const half = Math.max(0.5, t.r * sc);
  const topY = horizon - (t.h - eyeH()) * sc;

  // Trunk, lit from one side so it looks round
  if (half > 2) {
    const g = c.createLinearGradient(x - half, 0, x + half, 0);
    g.addColorStop(0, shade(base, L * 0.35, fa, fog));
    g.addColorStop(0.4, shade(base, L, fa, fog));
    g.addColorStop(0.75, shade(base, L * 0.6, fa, fog));
    g.addColorStop(1, shade(base, L * 0.25, fa, fog));
    c.fillStyle = g;
  } else {
    c.fillStyle = shade(base, L * 0.7, fa, fog);
  }
  c.beginPath();
  c.moveTo(x - half * 0.55, topY);
  c.lineTo(x + half * 0.55, topY);
  c.lineTo(x + half, groundY - half * 1.5);
  c.quadraticCurveTo(x + half * 1.05, groundY, x + half * 1.6, groundY);   // roots
  c.lineTo(x - half * 1.6, groundY);
  c.quadraticCurveTo(x - half * 1.05, groundY, x - half, groundY - half * 1.5);
  c.closePath();
  c.fill();

  // Bark cracks on close trees
  if (half > 6) {
    c.strokeStyle = "rgba(0,0,0,0.3)";
    c.lineWidth = Math.max(1, half * 0.06);
    for (const bl of t.barkLines) {
      const y1 = groundY - (groundY - topY) * bl.start;
      const y2 = y1 - (groundY - topY) * bl.len;
      c.beginPath();
      c.moveTo(x + bl.off * half * 0.6, y1);
      c.quadraticCurveTo(x + bl.off * half * 0.6 + half * 0.1, (y1 + y2) / 2, x + bl.off * half * 0.6, y2);
      c.stroke();
    }
  }

  // Branches (some split in two)
  c.strokeStyle = shade(base, L * 0.5, fa, fog);
  c.lineCap = "round";
  for (const b of t.branches) {
    const y = groundY - (groundY - topY) * b.h;
    const x0 = x + b.side * half * 0.5;
    const x1 = x + b.side * (half * 0.5 + b.len * sc), y1 = y - b.rise * sc;
    c.lineWidth = Math.max(1, half * 0.4);
    c.beginPath();
    c.moveTo(x0, y);
    c.quadraticCurveTo((x0 + x1) / 2, y - b.rise * sc * 0.2, x1, y1);
    c.stroke();
    if (b.fork) {
      c.lineWidth = Math.max(1, half * 0.2);
      c.beginPath();
      c.moveTo((x0 + x1) / 2, y - b.rise * sc * 0.35);
      c.lineTo((x0 + x1) / 2 + b.side * b.len * sc * 0.3, y1 - b.rise * sc * 0.8);
      c.stroke();
    }
  }
}

// A paper poster nailed to a tree: WANTED (Dr. Voss) or MISSING (Zev)
function drawPoster(c, it, groundY, light, fa, fog) {
  const P = S.posters, info = P.list[it.obj.poster.type] || P.list[0], sc = it.sc;
  const pw = P.width * sc, ph = P.tall * sc;
  if (pw < 3) return;                                   // too far away to see
  const cx = it.sx, cy = groundY - P.height * sc;
  const L = clamp(light * 1.3, 0, 1);
  c.save();
  c.translate(cx, cy); c.rotate(it.obj.poster.tilt);
  // old yellowed paper with a dark edge
  c.fillStyle = shade(info.paper || [214, 200, 160], L, fa, fog);      // (a poster can pick its own paper colour)
  c.fillRect(-pw / 2, -ph / 2, pw, ph);
  c.strokeStyle = shade(info.edge || [120, 100, 70], L, fa, fog); c.lineWidth = Math.max(1, pw * 0.02);
  c.strokeRect(-pw / 2, -ph / 2, pw, ph);
  // torn corner
  c.fillStyle = shade([64, 60, 58], light, fa, fog);
  c.beginPath(); c.moveTo(pw / 2, ph / 2); c.lineTo(pw / 2 - pw * 0.15, ph / 2); c.lineTo(pw / 2, ph / 2 - ph * 0.1); c.fill();
  // nail at the top
  c.fillStyle = shade([60, 60, 60], L, fa, fog);
  c.beginPath(); c.arc(0, -ph * 0.45, Math.max(1, pw * 0.025), 0, Math.PI * 2); c.fill();
  // the photo box
  const bx = -pw * 0.32, by = -ph * 0.3, bw = pw * 0.64, bh = ph * 0.42;
  c.fillStyle = shade(info.photo || [90, 88, 84], L, fa, fog);
  c.fillRect(bx, by, bw, bh);
  c.save();
  c.beginPath(); c.rect(bx, by, bw, bh); c.clip();
  const r = bw * 0.28, hx = 0, hy = by + bh * 0.48;
  if (info.face === "person") {
    drawPosterPerson(c, info, hx, hy, r, by, bw, bh);
  } else if (info.face === "voss") {
    c.fillStyle = "#eeeeea";                            // white lab coat shoulders
    c.beginPath(); c.ellipse(hx, by + bh, bw * 0.45, bh * 0.28, 0, Math.PI, 0); c.fill();
    finVossHead(c, hx, hy, r, false);
  } else {
    c.fillStyle = "#3a5a7a";                            // Zev's blue hoodie
    c.beginPath(); c.ellipse(hx, by + bh, bw * 0.45, bh * 0.28, 0, Math.PI, 0); c.fill();
    c.fillStyle = P.zevSkin;
    c.beginPath(); c.ellipse(hx, hy, r * 0.85, r * 1.05, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(255,255,255,0.35)";             // shiny bald head
    c.beginPath(); c.ellipse(hx - r * 0.3, hy - r * 0.65, r * 0.25, r * 0.12, -0.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = P.zevBeard;                           // short, neat white beard along his jaw (a young guy)
    c.beginPath();
    c.moveTo(hx - r * 0.82, hy + r * 0.2);
    c.quadraticCurveTo(hx - r * 0.75, hy + r * 1.05, hx, hy + r * 1.12);
    c.quadraticCurveTo(hx + r * 0.75, hy + r * 1.05, hx + r * 0.82, hy + r * 0.2);
    c.quadraticCurveTo(hx + r * 0.6, hy + r * 0.6, hx + r * 0.28, hy + r * 0.52);
    c.quadraticCurveTo(hx, hy + r * 0.44, hx - r * 0.28, hy + r * 0.52);
    c.quadraticCurveTo(hx - r * 0.6, hy + r * 0.6, hx - r * 0.82, hy + r * 0.2);
    c.fill();
    c.fillStyle = "rgba(255,120,110,0.25)";             // rosy young cheeks
    for (const k of [-1, 1]) { c.beginPath(); c.ellipse(hx + k * r * 0.48, hy + r * 0.22, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.fill(); }
    c.strokeStyle = "#3a2618"; c.lineWidth = Math.max(0.5, r * 0.07);   // dark eyebrows
    for (const k of [-1, 1]) { c.beginPath(); c.moveTo(hx + k * r * 0.18, hy - r * 0.26); c.quadraticCurveTo(hx + k * r * 0.32, hy - r * 0.32, hx + k * r * 0.46, hy - r * 0.25); c.stroke(); }
    for (const k of [-1, 1]) {                          // big bright eyes
      c.fillStyle = "#fff";
      c.beginPath(); c.ellipse(hx + k * r * 0.32, hy - r * 0.07, r * 0.13, r * 0.1, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#4a3020";
      c.beginPath(); c.arc(hx + k * r * 0.32, hy - r * 0.06, Math.max(0.5, r * 0.075), 0, Math.PI * 2); c.fill();
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(hx + k * r * 0.3, hy - r * 0.09, Math.max(0.3, r * 0.025), 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = "#8a4a40"; c.lineWidth = Math.max(0.5, r * 0.06);   // small smile
    c.beginPath(); c.arc(hx, hy + r * 0.56, r * 0.15, Math.PI * 0.2, Math.PI * 0.8); c.stroke();
  }
  c.restore();
  // make the photo grey like an old printout, and dark in the shadows
  c.fillStyle = `rgba(0,0,0,${(1 - L) * 0.85})`;
  c.fillRect(bx, by, bw, bh);
  // the words (only when close enough to read)
  if (pw > 18) {
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillStyle = shade(info.ink || (info.title === "WANTED" ? [120, 20, 16] : [20, 20, 20]), L, fa, fog);
    c.font = `bold ${Math.round(ph * 0.12)}px Georgia, serif`;
    c.fillText(info.title, 0, -ph * 0.39);
    c.fillStyle = shade(info.ink || [30, 26, 20], L, fa, fog);
    c.font = `bold ${Math.round(ph * 0.08)}px Georgia, serif`;
    c.fillText(info.name, 0, ph * 0.2);
    c.font = `${Math.round(ph * 0.05)}px Georgia, serif`;
    c.fillText(info.line, 0, ph * 0.31);
    c.fillText(info.line2, 0, ph * 0.39);
  }
  c.restore();
}

// A person's photo on a poster (Mia, Dan, Lisa…): hair, face, eyes, smile, and a shirt
function drawPosterPerson(c, p, hx, hy, r, by, bw, bh) {
  const long = p.hairStyle === "long";
  c.fillStyle = p.hair;
  if (long) {                                           // long hair falling behind the shoulders
    c.beginPath();
    c.moveTo(hx - r * 0.95, hy - r * 0.3);
    c.quadraticCurveTo(hx - r * 1.15, hy + r * 1.2, hx - r * 0.9, hy + r * 1.7);
    c.lineTo(hx + r * 0.9, hy + r * 1.7);
    c.quadraticCurveTo(hx + r * 1.15, hy + r * 1.2, hx + r * 0.95, hy - r * 0.3);
    c.closePath(); c.fill();
  }
  c.fillStyle = p.shirt;                                // shoulders
  c.beginPath(); c.ellipse(hx, by + bh, bw * 0.45, bh * 0.28, 0, Math.PI, 0); c.fill();
  c.fillStyle = p.skin;                                 // neck and face
  c.fillRect(hx - r * 0.25, hy + r * 0.7, r * 0.5, r * 0.6);
  c.beginPath(); c.ellipse(hx, hy, r * 0.8, r * 1.0, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = p.hair;                                 // hair on top
  c.beginPath();
  c.ellipse(hx, hy - r * 0.5, r * 0.88, r * 0.62, 0, Math.PI, 0);
  if (long) {                                           // a side part with a swoop of bangs
    c.quadraticCurveTo(hx + r * 0.5, hy - r * 0.55, hx - r * 0.1, hy - r * 0.45);
    c.quadraticCurveTo(hx - r * 0.6, hy - r * 0.3, hx - r * 0.88, hy - r * 0.1);
  } else {                                              // short, neat hair
    c.quadraticCurveTo(hx + r * 0.4, hy - r * 0.62, hx, hy - r * 0.6);
    c.quadraticCurveTo(hx - r * 0.5, hy - r * 0.62, hx - r * 0.88, hy - r * 0.5);
  }
  c.fill();
  c.fillStyle = "rgba(255,120,110,0.25)";               // rosy cheeks
  for (const k of [-1, 1]) { c.beginPath(); c.ellipse(hx + k * r * 0.45, hy + r * 0.25, r * 0.14, r * 0.09, 0, 0, Math.PI * 2); c.fill(); }
  c.strokeStyle = "#4a3020"; c.lineWidth = Math.max(0.5, r * 0.06);   // eyebrows
  for (const k of [-1, 1]) { c.beginPath(); c.moveTo(hx + k * r * 0.18, hy - r * 0.24); c.quadraticCurveTo(hx + k * r * 0.32, hy - r * 0.3, hx + k * r * 0.46, hy - r * 0.23); c.stroke(); }
  for (const k of [-1, 1]) {                            // eyes
    c.fillStyle = "#fff";
    c.beginPath(); c.ellipse(hx + k * r * 0.32, hy - r * 0.05, r * 0.13, r * 0.1, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#3a5a80";
    c.beginPath(); c.arc(hx + k * r * 0.32, hy - r * 0.04, Math.max(0.5, r * 0.07), 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(hx + k * r * 0.3, hy - r * 0.07, Math.max(0.3, r * 0.022), 0, Math.PI * 2); c.fill();
    if (p.lashes) {                                     // long eyelashes
      c.strokeStyle = "#1a1010"; c.lineWidth = Math.max(0.5, r * 0.035);
      for (const j of [-1, 0, 1]) {
        const lx = hx + k * r * 0.32 + j * r * 0.07;
        c.beginPath(); c.moveTo(lx, hy - r * 0.13); c.lineTo(lx + j * r * 0.04 + k * r * 0.03, hy - r * 0.2); c.stroke();
      }
    }
  }
  c.strokeStyle = "rgba(120,70,50,0.5)"; c.lineWidth = Math.max(0.5, r * 0.04);   // nose
  c.beginPath(); c.moveTo(hx, hy + r * 0.05); c.lineTo(hx - r * 0.05, hy + r * 0.28); c.lineTo(hx + r * 0.04, hy + r * 0.3); c.stroke();
  if (p.lipstick) {                                     // red lips and a big smile
    c.fillStyle = p.lipstick;
    c.beginPath();
    c.moveTo(hx - r * 0.24, hy + r * 0.5);
    c.quadraticCurveTo(hx, hy + r * 0.4, hx + r * 0.24, hy + r * 0.5);
    c.quadraticCurveTo(hx, hy + r * 0.72, hx - r * 0.24, hy + r * 0.5);
    c.fill();
  } else {
    c.strokeStyle = "#8a4a40"; c.lineWidth = Math.max(0.5, r * 0.06);   // small smile
    c.beginPath(); c.arc(hx, hy + r * 0.48, r * 0.16, Math.PI * 0.2, Math.PI * 0.8); c.stroke();
  }
}

// A dark pine tree with layers of needles
function drawPine(c, it, horizon, groundY, light, fa, fog) {
  const t = it.obj, sc = it.sc, x = it.sx;
  const L = light * t.shade;
  const topY = horizon - (t.h - eyeH()) * sc;
  const height = groundY - topY;
  const half = Math.max(0.5, t.r * sc);
  c.fillStyle = shade([50, 42, 36], L * 0.6, fa, fog);
  c.fillRect(x - half, topY + height * 0.1, half * 2, height * 0.9);

  const lowest = groundY - height * 0.22;
  for (let k = 0; k < t.layers; k++) {
    const f = k / (t.layers - 1);
    const yBase = lerp(lowest, topY + height * 0.12, f);
    const width = t.spread * sc * (1 - f * 0.8);
    const layerH = height * 0.24;
    c.fillStyle = shade([20, 32, 24], L * (0.75 + 0.35 * f), fa, fog);
    c.beginPath();
    c.moveTo(x - width, yBase);
    for (let j = 1; j <= 5; j++) {   // ragged left edge
      const p = j / 6;
      c.lineTo(x - width * (1 - p) - (j % 2) * width * 0.12, yBase - layerH * p + (j % 2) * layerH * 0.06);
    }
    c.lineTo(x, yBase - layerH);
    for (let j = 5; j >= 1; j--) {   // ragged right edge
      const p = j / 6;
      c.lineTo(x + width * (1 - p) + (j % 2) * width * 0.12, yBase - layerH * p + (j % 2) * layerH * 0.06);
    }
    c.lineTo(x + width, yBase);
    c.quadraticCurveTo(x, yBase + layerH * 0.12, x - width, yBase);
    c.fill();
  }
}

// ==========================================================
//  THE GHOST: a pale woman, long black hair, one red eye
// ==========================================================
function drawGhostWoman(c, x, footY, hp, alpha, time) {
  if (hp < 4) return;
  const headR = hp * 0.085;
  const headY = footY - hp + headR * 1.1;
  const shoulderY = headY + headR * 1.9;
  const sw = hp * 0.12;
  const sway = Math.sin(time * 1.3) * hp * 0.008;
  c.save();
  c.globalAlpha = alpha;

  // Hair behind her
  c.fillStyle = "#030405";
  c.beginPath();
  c.moveTo(x - headR * 1.05, headY);
  c.quadraticCurveTo(x - headR * 1.2, headY - headR * 1.5, x, headY - headR * 1.25);
  c.quadraticCurveTo(x + headR * 1.2, headY - headR * 1.5, x + headR * 1.05, headY);
  c.lineTo(x + sw * 1.2 + sway, footY - hp * 0.4);
  c.lineTo(x - sw * 1.2 + sway, footY - hp * 0.4);
  c.closePath();
  c.fill();

  // Ragged white dress (glows faintly)
  c.shadowColor = "rgba(120,140,150,0.35)";
  c.shadowBlur = hp * 0.06;
  const dg = c.createLinearGradient(0, shoulderY, 0, footY);
  dg.addColorStop(0, "#9c968c");
  dg.addColorStop(0.6, "#6a645c");
  dg.addColorStop(1, "rgba(50,46,42,0.5)");
  c.fillStyle = dg;
  c.beginPath();
  c.moveTo(x - sw, shoulderY);
  c.quadraticCurveTo(x - sw * 1.35, footY - hp * 0.4, x - sw * 1.55 + sway, footY);
  for (let i = 1; i <= 10; i++) {
    const px = x - sw * 1.55 + sway + (sw * 3.1 * i) / 10;
    const py = footY - (i % 2 ? hp * 0.03 + Math.abs(Math.sin(i * 7.1)) * hp * 0.025 : 0);
    c.lineTo(px, py);
  }
  c.quadraticCurveTo(x + sw * 1.35, footY - hp * 0.4, x + sw, shoulderY);
  c.closePath();
  c.fill();
  c.shadowBlur = 0;

  // Stains and blood on the dress
  c.fillStyle = "rgba(40,30,22,0.45)";
  for (const [ux, uy, rr] of [[-0.6, 0.35, 0.3], [0.5, 0.55, 0.35], [-0.2, 0.75, 0.4], [0.3, 0.2, 0.2]]) {
    c.beginPath(); c.ellipse(x + ux * sw, shoulderY + uy * (footY - shoulderY), rr * sw, rr * sw * 0.7, 0.5, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = "rgba(110,8,8,0.75)";
  c.lineWidth = Math.max(1, hp * 0.008);
  for (const ux of [-0.35, 0.1, 0.45]) {
    c.beginPath(); c.moveTo(x + ux * sw, shoulderY + hp * 0.04);
    c.lineTo(x + ux * sw + hp * 0.005, shoulderY + hp * (0.12 + Math.abs(ux) * 0.2)); c.stroke();
  }
  // Folds in the dress
  c.strokeStyle = "rgba(20,18,16,0.45)";
  c.lineWidth = Math.max(1, hp * 0.004);
  for (const k of [-0.7, -0.25, 0.2, 0.65]) {
    c.beginPath();
    c.moveTo(x + k * sw, shoulderY + hp * 0.12);
    c.quadraticCurveTo(x + k * sw * 1.3 + sway, footY - hp * 0.3, x + k * sw * 1.5 + sway, footY - hp * 0.03);
    c.stroke();
  }

  // Pale hands hanging down
  for (const side of [-1, 1]) {
    const hx = x + side * sw * 1.3, hy = footY - hp * 0.44;
    c.fillStyle = "#6d747a";
    c.beginPath();
    c.ellipse(hx, hy, hp * 0.018, hp * 0.04, side * 0.15, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "#5a6066";
    c.lineWidth = Math.max(1, hp * 0.005);
    for (let f = -1; f <= 1; f++) {
      c.beginPath();
      c.moveTo(hx + f * hp * 0.008, hy + hp * 0.03);
      c.lineTo(hx + f * hp * 0.01, hy + hp * 0.07);
      c.stroke();
    }
  }

  // Neck and grey-blue face
  c.fillStyle = "#6f777e";
  c.fillRect(x - headR * 0.3, headY + headR * 0.6, headR * 0.6, headR * 1.0);
  c.beginPath();
  c.ellipse(x, headY + headR * 0.1, headR * 0.78, headR * 1.02, 0, 0, Math.PI * 2);
  c.fill();

  // Bluish lips
  c.fillStyle = "#2a2f3a";
  c.beginPath();
  c.ellipse(x - headR * 0.12, headY + headR * 0.62, headR * 0.2, headR * 0.07, 0, 0, Math.PI * 2);
  c.fill();

  // One glowing red eye
  c.save();
  c.shadowColor = "#ff2200";
  c.shadowBlur = Math.max(6, headR * 1.5);
  c.fillStyle = "#ff3418";
  c.beginPath();
  c.ellipse(x - headR * 0.3, headY - headR * 0.02, Math.max(1.5, headR * 0.18), Math.max(1, headR * 0.11), 0, 0, Math.PI * 2);
  c.fill();
  c.restore();

  // Long black hair hanging over her face (with a gap for the eye)
  c.strokeStyle = "rgba(3,4,6,0.95)";
  c.lineCap = "round";
  const N = 22;
  for (let i = 0; i < N; i++) {
    const u = i / (N - 1);
    if (u > 0.2 && u < 0.42) continue;
    const x0 = x + (u - 0.5) * headR * 2.0, y0 = headY - headR * 0.95;
    const len = hp * (0.32 + 0.12 * Math.abs(Math.sin(i * 3.7)));
    const s2 = Math.sin(time * 1.5 + i) * headR * 0.15;
    const x1 = x0 + (u - 0.5) * headR * 1.6 + sway + s2;
    c.lineWidth = Math.max(1, headR * (0.12 + 0.1 * Math.abs(Math.sin(i * 5.3))));
    c.beginPath();
    c.moveTo(x0, y0);
    c.bezierCurveTo(x0 + (u - 0.5) * headR * 0.8, y0 + len * 0.3, x1 - s2, y0 + len * 0.6, x1, y0 + len);
    c.stroke();
  }
  c.fillStyle = "#030405";
  c.beginPath();
  c.ellipse(x, headY - headR * 0.6, headR * 0.92, headR * 0.55, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

// Her face up close (for the jump scare)
function drawScareFace(c, w, h, s, time) {
  const cx = w / 2, cy = h * 0.46;
  c.fillStyle = "#0b0e14";
  c.fillRect(0, 0, w, h);

  // Long hair behind her face, falling past the bottom of the screen
  c.fillStyle = "#020203";
  c.beginPath();
  c.moveTo(cx - s * 0.42, cy - s * 0.2);
  c.bezierCurveTo(cx - s * 0.5, cy - s * 0.8, cx + s * 0.5, cy - s * 0.8, cx + s * 0.42, cy - s * 0.2);
  c.lineTo(cx + s * 0.62, h + 10);
  c.lineTo(cx - s * 0.62, h + 10);
  c.closePath();
  c.fill();

  // Face
  const g = c.createRadialGradient(cx - s * 0.08, cy - s * 0.05, s * 0.05, cx, cy, s * 0.55);
  g.addColorStop(0, "#9aa2a8");
  g.addColorStop(0.55, "#5e666e");
  g.addColorStop(1, "#2a323b");
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(cx, cy, s * 0.36, s * 0.5, 0, 0, Math.PI * 2);
  c.fill();

  // Dark shadows around the eyes
  for (const side of [-1, 1]) {
    const ex = cx + side * s * 0.14, ey = cy - s * 0.08;
    const sh = c.createRadialGradient(ex, ey, 0, ex, ey, s * 0.14);
    sh.addColorStop(0, "rgba(10,10,20,0.85)");
    sh.addColorStop(1, "rgba(10,10,20,0)");
    c.fillStyle = sh;
    c.fillRect(ex - s * 0.15, ey - s * 0.15, s * 0.3, s * 0.3);
  }

  // Veins
  c.strokeStyle = "rgba(40,50,75,0.55)";
  c.lineWidth = Math.max(1, s * 0.003);
  for (let v = 0; v < 6; v++) {
    let vx = cx - s * (0.1 + v * 0.03), vy = cy + s * (0.02 + v * 0.03);
    c.beginPath();
    c.moveTo(vx, vy);
    for (let k = 0; k < 5; k++) {
      vx -= s * 0.02;
      vy += Math.sin(v * 3 + k * 2.1) * s * 0.015;
      c.lineTo(vx, vy);
    }
    c.stroke();
  }

  // Her visible eye: red, glowing, staring
  const ex = cx - s * 0.14, ey = cy - s * 0.08;
  c.fillStyle = "#d8c9c0";
  c.beginPath();
  c.ellipse(ex, ey, s * 0.075, s * 0.042, 0, 0, Math.PI * 2);
  c.fill();
  c.save();
  c.shadowColor = "#ff2200";
  c.shadowBlur = s * 0.08;
  c.fillStyle = "#e0200a";
  c.beginPath();
  c.arc(ex + s * 0.005, ey, s * 0.033, 0, Math.PI * 2);
  c.fill();
  c.restore();
  c.fillStyle = "#110000";
  c.beginPath();
  c.arc(ex + s * 0.005, ey, s * 0.013, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = "rgba(255,255,255,0.8)";
  c.beginPath();
  c.arc(ex - s * 0.008, ey - s * 0.012, s * 0.005, 0, Math.PI * 2);
  c.fill();
  // A red glint from the other eye, behind the hair
  c.save();
  c.shadowColor = "#ff2200";
  c.shadowBlur = s * 0.05;
  c.fillStyle = "#a0180a";
  c.beginPath();
  c.arc(cx + s * 0.15, cy - s * 0.08, s * 0.018, 0, Math.PI * 2);
  c.fill();
  c.restore();

  // Nose shadow
  c.strokeStyle = "rgba(30,35,45,0.5)";
  c.lineWidth = s * 0.006;
  c.beginPath();
  c.moveTo(cx - s * 0.01, cy - s * 0.02);
  c.quadraticCurveTo(cx - s * 0.04, cy + s * 0.1, cx - s * 0.01, cy + s * 0.13);
  c.stroke();

  // Blue lips, slightly open
  c.fillStyle = "#3e5878";
  c.beginPath();
  c.ellipse(cx - s * 0.01, cy + s * 0.25, s * 0.09, s * 0.032, 0, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = "#06080d";
  c.beginPath();
  c.ellipse(cx - s * 0.01, cy + s * 0.25, s * 0.06, s * 0.009, 0, 0, Math.PI * 2);
  c.fill();

  // Long black hair falling over her face (with a gap for one eye)
  c.lineCap = "round";
  for (let i = 0; i < 46; i++) {
    const u = i / 45;
    if (u > 0.26 && u < 0.46) continue;
    const x0 = cx + (u - 0.5) * s * 0.8, y0 = cy - s * 0.6;
    const wave = Math.sin(time * 1.6 + i * 0.9) * s * 0.015;
    const x1 = x0 + (u - 0.5) * s * 0.4 + wave;
    const y1 = h + 20;
    const c1x = x0 + (u - 0.5) * s * 0.12 + wave, c1y = cy - s * 0.1;
    const c2x = x1 - wave * 2, c2y = cy + s * 0.35;
    // a thick clump of hair
    c.strokeStyle = "rgba(2,2,3,0.97)";
    c.lineWidth = s * (0.012 + (((i * 13) % 7) / 7) * 0.02);
    c.beginPath();
    c.moveTo(x0, y0);
    c.bezierCurveTo(c1x, c1y, c2x, c2y, x1, y1);
    c.stroke();
    // a faint shine so you can see the strands
    c.strokeStyle = "rgba(70,78,92,0.35)";
    c.lineWidth = Math.max(1, s * 0.002);
    c.beginPath();
    c.moveTo(x0 + s * 0.004, y0);
    c.bezierCurveTo(c1x + s * 0.004, c1y, c2x + s * 0.004, c2y, x1 + s * 0.004, y1);
    c.stroke();
  }
}

// The spider jump scare: it SLAMS into view, grabs you with its legs, lifts you to its fangs… CHOMP
function drawSpiderScare(time) {
  const c = scareCtx, w = innerWidth, h = innerHeight, t = scare.t, SS = S.spiderScare;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g1 = SS.grabSeconds, g2 = g1 + SS.liftSeconds, end = g2 + SS.mouthSeconds;
  const s = Math.min(w, h);
  const shake = (Math.random() - 0.5) * (t < 0.15 ? 40 : t < g1 ? 12 : 26);
  c.fillStyle = "#060403";
  c.fillRect(0, 0, w, h);
  c.save();
  c.translate(shake, shake * 0.6);
  // the cave floor drops away as you're lifted
  const lift = clamp((t - g1 * 0.6) / SS.liftSeconds, 0, 1);
  c.fillStyle = "#1e1610";
  c.fillRect(-40, h * (0.6 + lift * 0.6), w + 80, h);
  // its face: it slams in big at the start, then rises up close
  const slam = t < 0.15 ? 1.4 : 1;
  const faceY = t < 0.15 ? h * 0.45 : lerp(h * 1.1, h * 0.42, clamp((t - 0.15) / (g2 - 0.15), 0, 1));
  const zoom = slam * (1 + clamp((t - g2) / SS.mouthSeconds, 0, 1) * 2.4);
  const fs = s * 0.95 * zoom, fx = w / 2;
  // hairy head
  const hg = c.createRadialGradient(fx, faceY - fs * 0.1, fs * 0.05, fx, faceY, fs * 0.6);
  hg.addColorStop(0, "#2a1c16"); hg.addColorStop(1, "#0a0605");
  c.fillStyle = hg;
  c.beginPath(); c.ellipse(fx, faceY, fs * 0.58, fs * 0.48, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#3a2820";
  c.lineWidth = Math.max(1, fs * 0.004);
  for (let i = 0; i < S.spider.hairs * 3; i++) {                          // thick shaggy bristles
    const n = S.spider.hairs * 3, a = (i / n) * Math.PI * 2, rr = 0.25 + ((i * 37) % 17) / 17 * 0.38;
    const bx = fx + Math.cos(a) * fs * rr * 1.1, by = faceY + Math.sin(a) * fs * rr * 0.85;
    const len = fs * (0.04 + ((i * 13) % 7) * 0.012);
    c.strokeStyle = i % 3 ? "#3a2820" : "#4e3a2c";
    c.beginPath(); c.moveTo(bx, by);
    c.quadraticCurveTo(bx + Math.cos(a) * len * 0.6, by + Math.sin(a) * len * 0.6 - len * 0.3, bx + Math.cos(a + 0.25) * len, by + Math.sin(a + 0.25) * len);
    c.stroke();
  }
  // lots of big glossy black eyes, reflecting red
  const eyes = [[-0.15, -0.22, 0.085], [0.15, -0.22, 0.085], [-0.055, -0.3, 0.05], [0.055, -0.3, 0.05],
                [-0.28, -0.14, 0.045], [0.28, -0.14, 0.045], [-0.24, -0.3, 0.032], [0.24, -0.3, 0.032],
                [0, -0.37, 0.04], [-0.12, -0.38, 0.03], [0.12, -0.38, 0.03], [-0.35, -0.24, 0.028], [0.35, -0.24, 0.028],
                [-0.38, -0.08, 0.025], [0.38, -0.08, 0.025], [-0.2, -0.42, 0.022], [0.2, -0.42, 0.022], [0, -0.14, 0.03]];
  for (const [ex, ey, er] of eyes) {
    const x = fx + ex * fs, y = faceY + ey * fs, r = er * fs;
    const eg = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    eg.addColorStop(0, "#3a0606"); eg.addColorStop(0.6, "#0a0000"); eg.addColorStop(1, "#000");
    c.fillStyle = eg;
    c.shadowColor = "#ff1000"; c.shadowBlur = r * 0.6;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    c.shadowBlur = 0;
    c.fillStyle = "rgba(255,60,40,0.85)";                                 // red reflection
    c.beginPath(); c.ellipse(x - r * 0.35, y - r * 0.35, r * 0.22, r * 0.14, -0.6, 0, Math.PI * 2); c.fill();
    c.fillStyle = "rgba(255,255,255,0.7)";
    c.beginPath(); c.arc(x + r * 0.3, y - r * 0.4, r * 0.08, 0, Math.PI * 2); c.fill();
  }
  // the mouth opens: rows of teeth inside
  const open = clamp((t - g1 * 0.5) / (SS.liftSeconds + SS.mouthSeconds * 0.6), 0, 1);
  const closing = clamp((t - (end - 0.25)) / 0.25, 0, 1);               // …SNAP shut at the end
  const mo = open * (1 - closing);
  const mx = fx, my = faceY + fs * 0.14, mw = fs * (0.1 + mo * 0.22), mh = fs * (0.03 + mo * 0.24);
  c.fillStyle = "#1a0202";
  c.beginPath(); c.ellipse(mx, my, mw, mh, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#5a0a08";
  c.beginPath(); c.ellipse(mx, my + mh * 0.2, mw * 0.6, mh * 0.6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#cfc6a8";
  for (let row = 0; row < 2; row++) for (let i = 0; i < 12; i++) {
    const a = Math.PI * (0.1 + (i / 11) * 0.8), rx = mw * (0.9 - row * 0.25), ry = mh * (0.9 - row * 0.25);
    for (const k of [-1, 1]) {
      const tx = mx + Math.cos(a) * rx * (k), ty = my + Math.sin(a) * ry * k * -1 * -1 * (k);
      const ty2 = my - k * Math.sin(a) * ry;
      c.beginPath();
      c.moveTo(tx - fs * 0.008, ty2); c.lineTo(tx + fs * 0.008, ty2); c.lineTo(tx, ty2 + k * fs * 0.035);
      c.fill();
    }
  }
  // huge fangs (chelicerae) spreading apart… then snapping shut
  for (const k of [-1, 1]) {
    const spread = mo * fs * 0.18;
    const bx = fx + k * (fs * 0.08 + spread), by = faceY + fs * 0.02;
    c.fillStyle = "#140c0a";
    c.beginPath(); c.ellipse(bx, by, fs * 0.08, fs * 0.12, k * 0.3, 0, Math.PI * 2); c.fill();
    const tipX = bx - k * fs * (0.06 + mo * 0.02), tipY = by + fs * (0.28 + mo * 0.06);
    const fg = c.createLinearGradient(bx, by, tipX, tipY);
    fg.addColorStop(0, "#2a1e18"); fg.addColorStop(1, "#d8ccb0");
    c.fillStyle = fg;
    c.beginPath();
    c.moveTo(bx - fs * 0.04, by + fs * 0.05);
    c.quadraticCurveTo(bx + k * fs * 0.05, by + fs * 0.2, tipX, tipY);
    c.quadraticCurveTo(bx + k * fs * 0.0, by + fs * 0.16, bx + fs * 0.04, by + fs * 0.05);
    c.fill();
    // venom dripping from the tips
    c.fillStyle = "rgba(160,190,60,0.85)";
    const drip = ((time * 1.5 + (k > 0 ? 0.4 : 0)) % 1);
    c.beginPath(); c.ellipse(tipX, tipY + drip * fs * 0.12, fs * 0.01, fs * 0.018, 0, 0, Math.PI * 2); c.fill();
  }
  // sticky venom strings stretched between the fangs
  if (mo > 0.2) {
    c.strokeStyle = "rgba(170,200,90,0.55)";
    c.lineWidth = Math.max(1, fs * 0.004);
    for (let i = 0; i < 4; i++) {
      const sx = fx - fs * (0.12 + mo * 0.15), ex2 = fx + fs * (0.12 + mo * 0.15), yy = faceY + fs * (0.1 + i * 0.05);
      c.beginPath(); c.moveTo(sx, yy); c.quadraticCurveTo(fx, yy + fs * (0.06 + i * 0.02), ex2, yy); c.stroke();
    }
  }
  // 8 hairy legs stab in from the sides and grab you
  const grab = clamp(t / g1, 0, 1);
  c.lineCap = "round";
  for (const side of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      const sx = side < 0 ? -60 : w + 60, sy = h * (0.05 + i * 0.22);
      const kx = w / 2 + side * w * lerp(0.85, 0.42 - i * 0.03, grab), ky = h * (0.02 + i * 0.18);
      const tx = w / 2 + side * w * lerp(0.7, 0.1 + i * 0.04, grab), ty = h * (0.62 + i * 0.1);
      c.strokeStyle = "#0e0806";
      c.lineWidth = s * (0.075 - i * 0.008);
      c.beginPath(); c.moveTo(sx, sy); c.lineTo(kx, ky); c.lineTo(tx, ty); c.stroke();
      c.strokeStyle = "#2a1c16";                                           // bristles
      c.lineWidth = Math.max(1, s * 0.008);
      for (let k = 1; k < 9; k++) {
        const hx = lerp(kx, tx, k / 9), hy = lerp(ky, ty, k / 9);
        c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx + side * s * 0.035, hy - s * 0.03); c.stroke();
      }
      c.fillStyle = "#c8b890";                                             // sharp claw at the tip
      c.beginPath(); c.moveTo(tx - s * 0.012, ty); c.lineTo(tx + s * 0.012, ty); c.lineTo(tx - side * s * 0.02, ty + s * 0.05); c.fill();
    }
  }
  c.restore();
  // flashes: when it slams in, and when it bites
  if (t < 0.08) { c.fillStyle = "rgba(255,255,255,0.7)"; c.fillRect(0, 0, w, h); }
  if (closing > 0) { c.fillStyle = `rgba(150,0,0,${0.5 * closing})`; c.fillRect(0, 0, w, h); }
  // swallowed: black
  const dark = clamp((t - end + 0.1) / 0.15, 0, 1);
  if (dark > 0) { c.fillStyle = `rgba(0,0,0,${dark})`; c.fillRect(0, 0, w, h); }
  drawStatic(c, w, h, 0.07);
}

// The jump scare, on your whole screen
function drawScare(time) {
  if (scare.kind === "spider") { drawSpiderScare(time); return; }
  if (scare.kind === "grinner") { drawGrinnerScare(time); return; }
  const c = scareCtx, w = innerWidth, h = innerHeight;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = scare.t, F = S.scare.flickerSeconds;
  if (t < F) {
    const p = t / F;   // 0 to 1 during the flicker
    // She is right in front of you, getting closer
    const a = player.angle * DEG;
    const d = lerp(6, 1.6, p);
    ghost.x = player.x + Math.cos(a) * d;
    ghost.y = player.y + Math.sin(a) * d;
    if (Math.random() < 0.4) {
      c.fillStyle = "#000";
      c.fillRect(0, 0, w, h);
      drawStatic(c, w, h, 0.9);
    } else {
      renderScene(c, w, h, { fov: S.look.eyeFov, showGhost: true, ambient: S.look.eyeLight,
                             fogDist: S.look.fogDistance, fog: S.look.eyeFogColor, time });
      drawStatic(c, w, h, 0.2);
    }
    // Pieces of her face flash in, more and more often
    if (Math.random() < p) {
      const y = Math.random() * h, bh = 30 + Math.random() * h * 0.2;
      c.save();
      c.beginPath();
      c.rect(0, y, w, bh);
      c.clip();
      drawScareFace(c, w, h, Math.min(w * 1.25, h * 0.9), time);
      c.restore();
    }
  } else {
    const k = S.scare.shakeAmount;
    c.fillStyle = "#000";
    c.fillRect(0, 0, w, h);
    c.save();
    c.translate((Math.random() - 0.5) * k * 2, (Math.random() - 0.5) * k * 2);
    drawScareFace(c, w, h, Math.min(w * 1.25, h * 0.9) * (1 + (t - F) * 0.5), time);
    c.restore();
    drawStatic(c, w, h, 0.15);
    if (t - F < 0.08) {
      c.fillStyle = "rgba(255,255,255,0.6)";
      c.fillRect(0, 0, w, h);
    }
  }
}

// TV static
const noiseCanvas = document.createElement("canvas");
noiseCanvas.width = 120;
noiseCanvas.height = 200;
const noiseCtx = noiseCanvas.getContext("2d");
const noiseImage = noiseCtx.createImageData(120, 200);
function drawStatic(c, w, h, alpha) {
  const d = noiseImage.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255;
    d[i] = d[i + 1] = d[i + 2] = v;
    d[i + 3] = 255;
  }
  noiseCtx.putImageData(noiseImage, 0, 0);
  c.save();
  c.globalAlpha = alpha;
  c.imageSmoothingEnabled = false;
  c.drawImage(noiseCanvas, 0, 0, w, h);
  c.restore();
}

// Camera grain and viewfinder while recording
function drawGrain(c, w, h) {
  for (let i = 0; i < 160; i++) {
    c.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`;
    c.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random(), 1 + Math.random());
  }
}
function drawViewfinder(c, w, h) {
  const m = 14, L = 20, top = 62, bottom = h - 24;
  c.strokeStyle = "rgba(255,255,255,0.7)";
  c.lineWidth = 2;
  c.beginPath();
  c.moveTo(m, top + L); c.lineTo(m, top); c.lineTo(m + L, top);
  c.moveTo(w - m - L, top); c.lineTo(w - m, top); c.lineTo(w - m, top + L);
  c.moveTo(m, bottom - L); c.lineTo(m, bottom); c.lineTo(m + L, bottom);
  c.moveTo(w - m - L, bottom); c.lineTo(w - m, bottom); c.lineTo(w - m, bottom - L);
  c.stroke();
  const secs = Math.floor(recordSeconds);
  const stamp = String(Math.floor(secs / 60)).padStart(2, "0") + ":" + String(secs % 60).padStart(2, "0");
  c.fillStyle = "#ff3b3b";
  c.beginPath();
  c.arc(m + 8, bottom - 14, 4, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = "rgba(255,255,255,0.85)";
  c.font = "bold 11px monospace";
  c.fillText(stamp, m + 17, bottom - 10);
}

function draw(time) {
  if (state === "intro") return;      // black "Tap to begin" screen
  if (state === "cutscene") { drawCutscene(time); return; }
  if (state === "finale") { drawFinale(time); return; }
  if (state === "hatchCut") { drawHatchCutscene(time); return; }
  if (state === "win") { drawWin(time); return; }
  if (state === "filmCut") { drawFilmCut(time); return; }
  if (state === "scare") { drawScare(time); return; }

  // What your eyes see (no ghost!)
  worldCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderScene(worldCtx, innerWidth, innerHeight, {
    fov: S.look.eyeFov, showGhost: false, ambient: S.look.eyeLight, fogDist: S.look.fogDistance,
    fog: S.look.eyeFogColor, bob, time
  });
  if (keyHeld && state === "playing") drawHeldKey(worldCtx, innerWidth, innerHeight, time);

  // What the phone camera sees (the ghost shows up here)
  if (phoneUp && camCv.width > 0) {
    const cw = camCv.width / dpr, ch = camCv.height / dpr;
    camCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderScene(camCtx, cw, ch, {
      fov: S.look.cameraFov, showGhost: true, fogDist: S.look.fogDistance, time,
      fog: S.look.cameraFogColor, bob: bob * 0.8,
      ambient: recordingOn ? S.look.cameraRecordingLight : S.look.cameraLight
    });
    if (recordingOn) { drawGrain(camCtx, cw, ch); drawViewfinder(camCtx, cw, ch); }
    // Glitches when she's close
    if (state === "playing" && ghost.dist < S.signal.weakDistance && Math.random() < 0.25) {
      for (let i = 0; i < 3; i++) {
        const y = Math.random() * ch, bh = 4 + Math.random() * 24, shift = (Math.random() - 0.5) * 24;
        camCtx.drawImage(camCv, 0, y * dpr, cw * dpr, bh * dpr, shift, y, cw, bh);
      }
    }
  }
}

// The key in your hand (when you hold it): big oval ring, wide blade, square teeth, "Da key" on it
function drawHeldKey(c, w, h, time) {
  const s = Math.min(w, h) * 0.32;
  const x = w * 0.66, y = h * 0.8 + bob * 2 + Math.sin(time * 1.5) * 3;
  c.save();
  c.translate(x, y);
  c.rotate(-0.45);
  c.scale(s, s);                                     // draw in "key units" (1 = s pixels)
  const gold = c.createLinearGradient(0, -0.3, 0, 0.35);
  gold.addColorStop(0, "#f0d27a");
  gold.addColorStop(0.5, "#c9a040");
  gold.addColorStop(1, "#7a5a1a");
  c.fillStyle = gold;
  c.strokeStyle = "#3a2a08";
  c.lineWidth = 0.02;
  // the big oval ring (with a hole in the middle)
  c.beginPath();
  c.ellipse(-0.74, 0, 0.26, 0.32, 0, 0, Math.PI * 2);
  c.ellipse(-0.74, 0, 0.13, 0.2, 0, 0, Math.PI * 2, true);
  c.fill("evenodd");
  c.stroke();
  // the wide blade with square teeth hanging down
  c.beginPath();
  c.moveTo(-0.52, -0.13);
  c.lineTo(0.86, -0.11);
  c.lineTo(0.86, 0.07);
  c.lineTo(0.63, 0.07);
  c.lineTo(0.63, 0.3);     // second tooth
  c.lineTo(0.46, 0.31);
  c.lineTo(0.46, 0.1);
  c.lineTo(0.21, 0.1);
  c.lineTo(0.21, 0.33);    // first tooth
  c.lineTo(0.05, 0.33);
  c.lineTo(0.05, 0.12);
  c.lineTo(-0.52, 0.12);
  c.closePath();
  c.fill();
  c.stroke();
  c.restore();
  // "Da key" written on the blade (drawn at full size: some phones won't draw tiny scaled-up letters)
  c.save();
  c.translate(x, y);
  c.rotate(-0.45);
  c.fillStyle = "rgba(50,35,8,0.9)";
  c.font = `italic bold ${Math.round(s * 0.15)}px sans-serif`;
  c.textBaseline = "alphabetic";
  c.fillText(S.text.keyWriting, -0.4 * s, 0.05 * s);
  c.restore();
  // your hand holding it by the ring (so you can read "Da key")
  const rx = x - s * 0.66, ry = y + s * 0.32;      // where the ring is on screen
  c.fillStyle = S.player.skinColor;
  c.beginPath();
  c.ellipse(rx + s * 0.05, ry + s * 0.3, s * 0.2, s * 0.14, -0.3, 0, Math.PI * 2);
  c.fill();
  c.fillRect(rx - s * 0.13, ry + s * 0.32, s * 0.34, h);
}

// ==========================================================
//  THE OPENING CUTSCENE (plays before the menu)
// ==========================================================
const cutCv = $("cut"), cutCtx = cutCv.getContext("2d");
function sizeCut() {
  cutCv.width = Math.round(innerWidth * dpr);
  cutCv.height = Math.round(innerHeight * dpr);
}
window.addEventListener("resize", sizeCut);
sizeCut();
let cutT = 0;
const cutTotal = () => S.cutscene.sceneSeconds.reduce((a, b) => a + b, 0);

// Things that should stay in the same place every frame (papers, windows, trees…)
const cutRand = makeRandom(42);
const cutPapers = [];
for (let i = 0; i < 16; i++) {
  cutPapers.push({ x: cutRand(), y: cutRand(), rot: (cutRand() - 0.5) * 1.6, stamp: Math.floor(cutRand() * 4) });
}
const cutBuildings = [];
for (let i = 0; i < 14; i++) {
  const wins = [];
  for (let k = 0; k < 30; k++) wins.push({ x: cutRand(), y: cutRand(), on: cutRand() < 0.35 });
  cutBuildings.push({ w: 0.08 + cutRand() * 0.1, h: 0.25 + cutRand() * 0.45, wins });
}
const cutTrees = [];
for (let i = 0; i < 26; i++) cutTrees.push({ x: cutRand(), w: 0.01 + cutRand() * 0.04, dark: 8 + cutRand() * 14 });

// Which scene is playing, and how far into it?
function cutSceneAt() {
  let t = cutT, scene = 0;
  const lens = S.cutscene.sceneSeconds;
  while (scene < lens.length - 1 && t >= lens[scene]) { t -= lens[scene]; scene++; }
  return [scene, t];
}

// Sounds for the cutscene: the door rattling, and rain on the street
let rattled = false;
let bangsDone = 0;
let tapsDone = 0;
let voiced = false, figureVoiced = false;
// How many letters of the search you've typed, t seconds into the search scene
function lettersTyped(t) {
  return Math.min(S.text.cutSearch.length, Math.floor(Math.max(0, t - 0.5) * S.cutscene.lettersPerSecond));
}
function cutsceneSounds() {
  const [scene, t] = cutSceneAt();
  if (scene === 1 && t >= S.cutscene.rattleAt && !rattled) { rattled = true; if (S.cutscene.rattleSound) playRattle(); }
  // tap-tap-tap: typing the search on your phone
  if (scene === 4) {
    const n = lettersTyped(t);
    while (tapsDone < n) { tapsDone++; playKeyTap(); }
  }
  // BANG BANG BANG on the locked door
  if (scene === 1 && bangsDone < S.cutscene.bangTimes.length && t >= S.cutscene.bangTimes[bangsDone]) {
    bangsDone++;
    playBang();
  }
  // the ghost's real recorded voice: "Is he perfect?"
  if (scene === 5 && t >= S.cutscene.ghostAsksAt && !voiced) {
    voiced = true;
    if (S.cutscene.ghostVoice) playVoice("perfect", S.cutscene.ghostVoiceVolume);
  }
  if (scene === 5 && t >= S.cutscene.figureAnswersAt && !figureVoiced) {
    figureVoiced = true;
    if (S.cutscene.figureVoice) playVoice("figureYes", S.cutscene.ghostVoiceVolume);
  }
  setRain(scene === 2);
}

function startCutscene() {
  startAudio();                 // the tap lets the browser play sound
  $("tapStart").classList.add("hidden");
  $("btnSkip").classList.remove("hidden");
  cutT = 0;
  rattled = false;
  bangsDone = 0;
  tapsDone = 0;
  voiced = false;
  figureVoiced = false;
  state = "cutscene";
}

function endCutscene() {
  if (state !== "cutscene") return;
  setRain(false);
  state = "start";
  cutCv.classList.add("hidden");
  $("btnSkip").classList.add("hidden");
}

function drawCutscene(time) {
  const c = cutCtx, w = innerWidth, h = innerHeight;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Which scene are we in, and how far into it?
  const [scene, t] = cutSceneAt();
  const len = S.cutscene.sceneSeconds[scene];

  if (scene === 0) cutHouse(c, w, h, t, time);
  else if (scene === 1) cutLockedDoor(c, w, h, t, time);
  else if (scene === 2) cutStreet(c, w, h, t, time);
  else if (scene === 3) cutPhone(c, w, h, t, time, false);
  else if (scene === 4) cutPhone(c, w, h, t, time, true);
  else cutReveal(c, w, h, t, time);

  // Caption at the bottom
  const text = S.text.cutscene[scene];
  c.font = `600 ${Math.max(14, Math.min(20, w / 26))}px system-ui, sans-serif`;
  c.textAlign = "center";
  const lines = text.split("\n");
  const lh = Math.max(20, Math.min(28, w / 18));
  const boxH = lines.length * lh + 18, boxY = h - boxH - 80;
  c.fillStyle = "rgba(0,0,0,0.65)";
  c.fillRect(16, boxY, w - 32, boxH);
  c.fillStyle = "#f2f2f2";
  lines.forEach((ln, i) => c.fillText(ln, w / 2, boxY + 9 + lh * (i + 0.75)));
  c.textAlign = "start";

  // Fade in and out of each scene
  const fade = Math.max(0, 1 - t / 0.5, 1 - (len - t) / 0.5);
  if (fade > 0) {
    c.fillStyle = `rgba(0,0,0,${Math.min(1, fade)})`;
    c.fillRect(0, 0, w, h);
  }
}

// A first-person hand (your hand!), with a jacket sleeve going off the bottom of the screen.
// x, y = middle of the palm, s = size, rot = turn, mirror = true for the right hand
function drawCutHand(c, x, y, s, rot, mirror) {
  const skin = S.player.skinColor, edge = "rgba(0,0,0,0.35)";
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  c.scale(mirror ? -1 : 1, 1);
  c.fillStyle = "#1c2230";                          // sleeve
  c.fillRect(-0.38 * s, 0.25 * s, 0.76 * s, 3 * s);
  c.fillStyle = skin;
  c.strokeStyle = edge;
  c.lineWidth = Math.max(1, s * 0.03);
  const finger = (fx, len) => {
    c.beginPath();
    c.roundRect(fx * s, -0.3 * s - len * s, 0.13 * s, len * s + 0.1 * s, 0.065 * s);
    c.fill();
    c.stroke();
  };
  finger(-0.29, 0.42);
  finger(-0.14, 0.52);
  finger(0.01, 0.48);
  finger(0.16, 0.36);
  c.beginPath();                                    // palm
  c.roundRect(-0.31 * s, -0.33 * s, 0.62 * s, 0.66 * s, 0.14 * s);
  c.fill();
  c.stroke();
  c.save();                                         // thumb
  c.translate(-0.3 * s, 0.05 * s);
  c.rotate(-0.9);
  c.beginPath();
  c.roundRect(-0.07 * s, -0.42 * s, 0.15 * s, 0.45 * s, 0.075 * s);
  c.fill();
  c.stroke();
  c.restore();
  c.restore();
}

// A hand wrapped around a ladder rail (x, y = where it grips, s = size)
function drawRailGrip(c, x, y, s, mirror) {
  const k = mirror ? 1 : -1, skin = S.player.skinColor, edge = "rgba(0,0,0,0.35)";
  c.lineCap = "round";
  // arm/sleeve coming up from the bottom corner
  c.strokeStyle = "#1c2230";
  c.lineWidth = s * 0.55;
  c.beginPath(); c.moveTo(x + k * s * 0.15, y + s * 0.25); c.lineTo(x + k * s * 1.1, y + s * 3); c.stroke();
  // back of the hand behind the rail (outside part)
  c.fillStyle = skin;
  c.strokeStyle = edge;
  c.lineWidth = Math.max(1, s * 0.03);
  c.beginPath(); c.roundRect(x + (k > 0 ? 0 : -s * 0.42), y - s * 0.3, s * 0.42, s * 0.6, s * 0.15); c.fill(); c.stroke();
  // four fingers curled around the front of the rail
  for (let i = 0; i < 4; i++) {
    const fy = y - s * 0.28 + i * s * 0.15;
    c.beginPath(); c.roundRect(x - s * 0.17, fy, s * 0.34, s * 0.13, s * 0.06); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(x - k * s * 0.08, fy + s * 0.02); c.lineTo(x - k * s * 0.08, fy + s * 0.11); c.stroke();   // knuckle line
  }
  // thumb wrapping the inside
  c.beginPath(); c.roundRect(x - k * s * 0.3 - s * 0.08, y - s * 0.05, s * 0.16, s * 0.3, s * 0.08); c.fill(); c.stroke();
}

// Hands gripping a piece of paper by its edges: fingers behind (pass 1), thumbs in front (pass 2)
function drawPaperGripBehind(c, x, y, s, mirror) {
  const k = mirror ? 1 : -1, skin = S.player.skinColor;
  c.strokeStyle = "#1c2230";
  c.lineCap = "round";
  c.lineWidth = s * 0.6;
  c.beginPath(); c.moveTo(x + k * s * 0.2, y + s * 0.2); c.lineTo(x + k * s * 1.2, y + s * 3); c.stroke();   // sleeve
  c.fillStyle = skin;
  c.strokeStyle = "rgba(0,0,0,0.35)";
  c.lineWidth = Math.max(1, s * 0.03);
  c.beginPath(); c.roundRect(x - s * 0.25 + k * s * 0.05, y - s * 0.35, s * 0.5, s * 0.7, s * 0.18); c.fill(); c.stroke();   // palm behind the paper
  for (let i = 0; i < 3; i++) {                                                         // fingertips peeking past the paper
    c.beginPath(); c.roundRect(x - k * s * 0.32 - s * 0.06, y - s * 0.3 + i * s * 0.18, s * 0.14, s * 0.14, s * 0.07); c.fill(); c.stroke();
  }
}
function drawPaperGripFront(c, x, y, s, mirror) {
  const k = mirror ? 1 : -1;
  c.fillStyle = S.player.skinColor;
  c.strokeStyle = "rgba(0,0,0,0.35)";
  c.lineWidth = Math.max(1, s * 0.03);
  c.save();                                                                           // thumb pressing on the front
  c.translate(x - k * s * 0.12, y - s * 0.12);
  c.rotate(k * 0.5);
  c.beginPath(); c.roundRect(-s * 0.08, -s * 0.22, s * 0.16, s * 0.4, s * 0.08); c.fill(); c.stroke();
  c.fillStyle = S.player.nailColor;
  c.beginPath(); c.ellipse(0, -s * 0.14, s * 0.05, s * 0.06, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}

// A relaxed fist with a sleeve (seen from above, for walking)
function drawCutFist(c, x, y, s, mirror) {
  c.save();
  c.translate(x, y);
  c.scale(mirror ? -1 : 1, 1);
  c.fillStyle = "#1c2230";                          // sleeve
  c.fillRect(-0.4 * s, 0.25 * s, 0.8 * s, 3 * s);
  c.fillStyle = S.player.skinColor;                          // fist
  c.strokeStyle = "rgba(0,0,0,0.35)";
  c.lineWidth = Math.max(1, s * 0.03);
  c.beginPath();
  c.roundRect(-0.32 * s, -0.3 * s, 0.64 * s, 0.6 * s, 0.2 * s);
  c.fill();
  c.stroke();
  c.beginPath();                                    // knuckle lines
  for (const k of [-0.16, 0, 0.16]) {
    c.moveTo(k * s, -0.28 * s);
    c.lineTo(k * s, -0.12 * s);
  }
  c.stroke();
  c.beginPath();                                    // thumb tucked over the side
  c.roundRect(0.18 * s, -0.08 * s, 0.2 * s, 0.34 * s, 0.1 * s);
  c.fill();
  c.stroke();
  c.restore();
}

// The monster's long grey arm and bony hand reaching into the cutscene (closed = gripping something)
function drawMonsterArm(c, sx, sy, hx, hy, s0, closed) {
  const skin = S.finale.grinnerSkin;
  c.save();
  c.lineCap = "round";
  c.strokeStyle = "#5a554c"; c.lineWidth = s0 * 0.075;               // outline
  c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo((sx + hx) / 2 + s0 * 0.12, (sy + hy) / 2, hx, hy); c.stroke();
  c.strokeStyle = skin; c.lineWidth = s0 * 0.06;                     // the long thin arm
  c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo((sx + hx) / 2 + s0 * 0.12, (sy + hy) / 2, hx, hy); c.stroke();
  c.fillStyle = skin;                                                 // the palm
  c.beginPath(); c.ellipse(hx, hy, s0 * 0.06, s0 * 0.05, 0, 0, Math.PI * 2); c.fill();
  for (let k = -1.5; k <= 1.5; k++) {                                 // 4 long bony fingers with black claws
    const ang = Math.PI / 2 + k * 0.32;
    const len = s0 * (closed ? 0.07 : 0.13);
    const mx = hx + Math.cos(ang) * len * 0.6, my = hy + Math.sin(ang) * len * 0.6;
    const ex = closed ? hx + Math.cos(ang) * len * 0.4 - k * s0 * 0.012 : hx + Math.cos(ang) * len;
    const ey = closed ? hy + Math.sin(ang) * len * 1.1 : hy + Math.sin(ang) * len;
    c.strokeStyle = skin; c.lineWidth = s0 * 0.018;
    c.beginPath(); c.moveTo(hx, hy); c.quadraticCurveTo(mx, my, ex, ey); c.stroke();
    c.strokeStyle = "#111"; c.lineWidth = s0 * 0.01;
    c.beginPath(); c.moveTo(ex, ey); c.lineTo(ex + Math.cos(ang + (closed ? 1.4 : 0)) * s0 * 0.03, ey + Math.sin(ang + (closed ? 1.4 : 0)) * s0 * 0.03); c.stroke();
  }
  c.restore();
}

// A phone (for cutscenes): black case, glowing screen
function drawCutPhone(c, x, y, s, rot) {
  c.save();
  c.translate(x, y); c.rotate(rot);
  c.fillStyle = "#0c0c10";
  c.fillRect(-s * 0.5, -s, s, s * 2);
  const g = c.createLinearGradient(0, -s, 0, s);
  g.addColorStop(0, "#9fd0ff"); g.addColorStop(1, "#3a6aa8");
  c.fillStyle = g;
  c.fillRect(-s * 0.42, -s * 0.88, s * 0.84, s * 1.76);
  c.restore();
}

// A thumb reaching from the bottom of the screen to a spot (tx, ty) on the phone
function drawThumb(c, fromX, fromY, tx, ty, size, pressing) {
  c.save();
  c.lineCap = "round";
  c.strokeStyle = "#1c2230";                       // sleeve / back of the hand
  c.lineWidth = size * 1.6;
  c.beginPath();
  c.moveTo(fromX, fromY + size * 2);
  c.lineTo(fromX, fromY + size * 6);
  c.stroke();
  // the hand holds the side of the phone, a little below the key it's pressing…
  const baseY = Math.min(fromY, ty + size * S.cutscene.thumbLength);
  c.strokeStyle = S.player.skinColor;
  c.lineWidth = size * 1.5;                                  // side of the hand / palm
  c.beginPath();
  c.moveTo(fromX, fromY + size);
  c.lineTo(fromX, baseY + size * 0.4);
  c.stroke();
  const bx = fromX + (tx > fromX ? size * 0.3 : -size * 0.3);
  c.lineWidth = size;                                        // …and a SHORT thumb reaches over to the key
  c.beginPath();
  c.moveTo(bx, baseY);
  c.quadraticCurveTo((bx + tx) / 2, (baseY + ty) / 2 + size * 0.6, tx, ty + size * 0.3);
  c.stroke();
  c.fillStyle = pressing ? "#fff0e8" : S.player.nailColor;  // thumbnail
  c.beginPath();
  c.ellipse(tx, ty + size * 0.1, size * 0.28, size * 0.36, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

// The phone's on-screen keyboard. Returns where each key is, so a thumb can press it.
function drawPhoneKeyboard(c, px, py, pw, ph, pressedChar) {
  const top = py + ph * 0.6, kh = ph * 0.075, gap = pw * 0.012;
  c.fillStyle = "#cfd3da";
  c.fillRect(px, top - gap * 2, pw, py + ph - top + gap * 2);
  const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];
  const keys = {};
  const kw = (pw - gap * 11) / 10;
  rows.forEach((row, r) => {
    const startX = px + gap + (pw - gap * 2 - row.length * (kw + gap) + gap) / 2;
    [...row].forEach((ch, i) => {
      const kx = startX + i * (kw + gap), ky = top + r * (kh + gap);
      keys[ch] = [kx + kw / 2, ky + kh / 2];
      c.fillStyle = ch === pressedChar ? "#8f97a6" : "#fff";
      c.fillRect(kx, ky, kw, kh);
      c.fillStyle = "#222";
      c.font = `${kh * 0.5}px sans-serif`;
      c.textAlign = "center";
      c.fillText(ch, kx + kw / 2, ky + kh * 0.68);
    });
  });
  // space bar
  const sy = top + 3 * (kh + gap), sx = px + pw * 0.25, sw = pw * 0.5;
  keys[" "] = [sx + sw / 2, sy + kh / 2];
  c.fillStyle = pressedChar === " " ? "#8f97a6" : "#fff";
  c.fillRect(sx, sy, sw, kh);
  c.textAlign = "start";
  return keys;
}

// Scene 1: an old house, tax bills all over the floor (first person)
function cutHouse(c, w, h, t, time) {
  const floorY = h * 0.6;
  c.fillStyle = "#1c1712";
  c.fillRect(0, 0, w, floorY);
  c.fillStyle = "rgba(255,240,200,0.04)";                 // faded wallpaper stripes
  for (let x = 0; x < w; x += 36) c.fillRect(x, 0, 14, floorY);
  // a window with moonlight
  const wx = w * 0.12, wy = h * 0.12, ww = w * 0.22, wh = h * 0.28;
  c.fillStyle = "#4b5d7c";
  c.fillRect(wx, wy, ww, wh);
  c.fillStyle = "#1c1712";
  c.fillRect(wx + ww / 2 - 3, wy, 6, wh);
  c.fillRect(wx, wy + wh / 2 - 3, ww, 6);
  // the floor
  c.fillStyle = "#2b2018";
  c.fillRect(0, floorY, w, h - floorY);
  c.strokeStyle = "rgba(0,0,0,0.4)";
  c.lineWidth = 2;
  for (let i = -8; i <= 8; i++) {
    c.beginPath();
    c.moveTo(w / 2 + i * w * 0.04, floorY);
    c.lineTo(w / 2 + i * w * 0.25, h);
    c.stroke();
  }
  // moonlight on the floor
  c.fillStyle = "rgba(120,150,200,0.12)";
  c.beginPath();
  c.moveTo(wx, floorY); c.lineTo(wx + ww, floorY); c.lineTo(wx + ww * 2.2, h); c.lineTo(wx + ww * 0.6, h);
  c.fill();
  // bills and tax papers
  const stamps = S.text.cutStamps;
  for (const p of cutPapers) {
    const px = p.x * w, py = floorY + 20 + p.y * (h - floorY - 120);
    const pw = Math.max(40, w * 0.09), ph = pw * 1.3 * 0.45;
    c.save();
    c.translate(px, py);
    c.rotate(p.rot);
    c.fillStyle = "#d8d1bd";
    c.fillRect(-pw / 2, -ph / 2, pw, ph);
    c.fillStyle = "rgba(0,0,0,0.3)";
    for (let k = 0; k < 4; k++) c.fillRect(-pw / 2 + 5, -ph / 2 + 5 + k * ph * 0.2, pw * 0.6, 2);
    c.fillStyle = "rgba(200,20,20,0.85)";
    c.font = `bold ${Math.max(8, pw * 0.16)}px sans-serif`;
    c.fillText(stamps[p.stamp], -pw * 0.1, ph * 0.38);
    c.restore();
  }
  // your hands holding one of the tax bills
  const bs = Math.min(w, h) * 0.5, bx = w / 2, by = h * 0.62 + Math.sin(time * 2) * 3;
  const hs = bs * 0.32, gy = by - bs * 0.1;
  drawPaperGripBehind(c, bx - bs * 0.5, gy, hs, false);       // fingers behind the paper
  drawPaperGripBehind(c, bx + bs * 0.5, gy, hs, true);
  c.save();
  c.translate(bx, by);
  c.rotate(-0.04);
  c.fillStyle = "#e3dcc8";
  c.fillRect(-bs * 0.5, -bs * 0.42, bs, bs * 0.62);
  c.fillStyle = "#b01010";
  c.font = `bold ${bs * 0.09}px sans-serif`;
  c.textAlign = "center";
  c.fillText(S.text.cutBill[0], 0, -bs * 0.26);
  c.fillStyle = "#222";
  c.font = `${bs * 0.06}px sans-serif`;
  c.fillText(S.text.cutBill[1], 0, -bs * 0.14);
  c.fillText(S.text.cutBill[2], 0, -bs * 0.05);
  c.textAlign = "start";
  c.restore();
  drawPaperGripFront(c, bx - bs * 0.5, gy, hs, false);        // thumbs pressing on the front
  drawPaperGripFront(c, bx + bs * 0.5, gy, hs, true);
  // a flickering light bulb
  c.fillStyle = `rgba(0,0,0,${0.25 + (Math.random() < 0.1 ? 0.35 : 0)})`;
  c.fillRect(0, 0, w, h);
}

// Scene 2: locked out of your house (you try the door: chained and padlocked)
function cutLockedDoor(c, w, h, t, time) {
  // rattle the door when you try the handle
  let shake = t > S.cutscene.rattleAt && t < 2.6 ? Math.sin(time * 60) * 3 : 0;
  for (const bt of S.cutscene.bangTimes) if (t >= bt && t < bt + 0.15) shake = (Math.random() - 0.5) * 18;   // BANG!
  // house wall (wooden siding)
  c.fillStyle = "#2a2622";
  c.fillRect(0, 0, w, h);
  c.strokeStyle = "rgba(0,0,0,0.35)";
  c.lineWidth = 2;
  for (let y = 0; y < h; y += 22) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  // porch light (flickering)
  const lightOn = Math.random() > 0.08;
  const lx = w / 2 + Math.min(w, h) * 0.32, ly = h * 0.18;
  if (lightOn) {
    const g = c.createRadialGradient(lx, ly, 4, lx, ly, Math.max(w, h) * 0.6);
    g.addColorStop(0, "rgba(255,210,140,0.35)");
    g.addColorStop(1, "rgba(255,210,140,0)");
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
  }
  c.fillStyle = lightOn ? "#ffd98a" : "#554a33";
  c.beginPath();
  c.arc(lx, ly, 9, 0, Math.PI * 2);
  c.fill();
  // the door
  const dw = Math.min(w * 0.62, h * 0.38), dh = dw * 2.1;
  const dx = w / 2 - dw / 2 + shake, dy = h * 0.1;
  c.fillStyle = "#1a1410";
  c.fillRect(dx - 12, dy - 12, dw + 24, dh + 12);              // frame
  c.fillStyle = "#4a3222";
  c.fillRect(dx, dy, dw, dh);
  c.strokeStyle = "rgba(0,0,0,0.4)";
  c.lineWidth = 3;
  c.strokeRect(dx + dw * 0.1, dy + dh * 0.06, dw * 0.8, dh * 0.38);   // panels
  c.strokeRect(dx + dw * 0.1, dy + dh * 0.52, dw * 0.8, dh * 0.4);
  // eviction notice
  c.save();
  c.translate(dx + dw * 0.5, dy + dh * 0.24);
  c.rotate(-0.06);
  c.fillStyle = "#e6e0cc";
  c.fillRect(-dw * 0.3, -dh * 0.11, dw * 0.6, dh * 0.22);
  c.fillStyle = "#b01010";
  c.font = `bold ${Math.max(10, dw * 0.08)}px sans-serif`;
  c.textAlign = "center";
  c.fillText(S.text.cutNotice[0], 0, -dh * 0.05);
  c.fillStyle = "#222";
  c.font = `${Math.max(8, dw * 0.05)}px sans-serif`;
  c.fillText(S.text.cutNotice[1], 0, dh * 0.01);
  c.fillText(S.text.cutNotice[2], 0, dh * 0.05);
  c.restore();
  // heavy chain across the door
  const cy = dy + dh * 0.56;
  c.strokeStyle = "#8a8a8a";
  c.lineWidth = Math.max(3, dw * 0.025);
  for (let i = 0; i < 14; i++) {
    const x0 = dx - 10 + i * (dw + 20) / 14;
    c.beginPath();
    c.ellipse(x0 + dw / 28, cy + Math.sin(i) * 3, dw / 26, dw / 50, 0, 0, Math.PI * 2);
    c.stroke();
  }
  // big padlock
  const px = dx + dw * 0.5, py = cy + dw * 0.06, ps = dw * 0.16;
  c.strokeStyle = "#9a9a9a";
  c.lineWidth = ps * 0.18;
  c.beginPath();
